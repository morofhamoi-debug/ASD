let lampOn = true;

function tryInteract() {
  if (!currentTarget) return;
  if (!IS_MOBILE && !locked) return;

  const t = currentTarget.userData.interact;

  if (t === 'lamp') {
    lampOn = !lampOn;
    Audio.lampClick();
    if (!lampOn) {
      window.__lampLight.intensity = 0;
      MAT.bulb.emissiveIntensity = 0.0;
      Audio.setLampBuzz(false);
    } else {
      window.__lampLight.intensity = window.__lampBaseIntensity;
      MAT.bulb.emissiveIntensity = 1.0;
      Audio.setLampBuzz(true);
    }
    showCaption(lampOn ? 'The bulb still works.' : 'Darkness, again.');
  } else if (t === 'wardrobe') {
    const rp = window.__wardrobeRightPivot;
    const opening = rp.rotation.y < 0.35;
    rp.rotation.y = opening ? 0.95 : 0.20;
    Audio.woodCreak(0.35, -0.2, 0.16);
    showCaption(opening ? 'The door swings wide. It smells of old cloth.' : 'You close it. Almost.');
  } else if (t === 'door') {
    Audio.doorRattle();
    window.__doorHandleGroup.rotation.z = 0.22;
    setTimeout(() => { window.__doorHandleGroup.rotation.z = 0; }, 380);
    showCaption('Locked. From the other side.');
  } else if (t === 'mirror') {
    Audio.whisper();
    showCaption('The glass is cold. Your reflection is a moment slow.');
    Events.triggerCooldown('mirror', 60);
  } else if (t === 'book') {
    Audio.pageTurn();
    showCaption('Every page has been torn out. Only the spine remains.');
  } else if (t === 'relic') {
    Audio.whisper();
    window.__relic.rotation.y += 0.6;
    showCaption('A small carved thing. Warm. It should not be warm.');
  } else if (t === 'deskDrawer') {
    Audio.woodCreak(0.2, 0.1, 0.2);
    showCaption('Empty. Except for dust and a single hair.');
  }
}

/* ============================================================================
   15. AUDIO (Web Audio API — fully procedural)
   ========================================================================= */

const Audio = (function () {
  let ctx = null;
  let master = null;
  let ambBus = null;
  let lampBuzzGain = null;
  let lampBuzzOsc = null;
  let lampBuzzOsc2 = null;
  let windGain = null;
  let droneGain = null;
  let windSource = null;
  let noiseBuffer = null;
  let started = false;

  function makeNoise(seconds) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      d[i] = w * 0.6 + last * 3.2;
    }
    return buf;
  }

  function init() {
    if (started) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ctx = new AC();
    } catch (e) {
      return;
    }
    started = true;

    master = ctx.createGain();
    master.gain.value = 0.0001;
    master.connect(ctx.destination);
    master.gain.exponentialRampToValueAtTime(0.85, ctx.currentTime + 3.0);

    ambBus = ctx.createGain();
    ambBus.gain.value = 1.0;
    ambBus.connect(master);

    noiseBuffer = makeNoise(6);

    droneGain = ctx.createGain();
    droneGain.gain.value = 0.055;
    const dFilt = ctx.createBiquadFilter();
    dFilt.type = 'lowpass';
    dFilt.frequency.value = 160;
    dFilt.Q.value = 0.7;
    droneGain.connect(dFilt);
    dFilt.connect(ambBus);

    const o1 = ctx.createOscillator();
    o1.type = 'sine';
    o1.frequency.value = 41.5;
    const o2 = ctx.createOscillator();
    o2.type = 'sine';
    o2.frequency.value = 62.3;
    const o3 = ctx.createOscillator();
    o3.type = 'triangle';
    o3.frequency.value = 88.1;

    const og2 = ctx.createGain(); og2.gain.value = 0.42;
    const og3 = ctx.createGain(); og3.gain.value = 0.10;

    o1.connect(droneGain);
    o2.connect(og2); og2.connect(droneGain);
    o3.connect(og3); og3.connect(droneGain);

    o1.start(); o2.start(); o3.start();

    const lfo = ctx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.037;
    const lfoG = ctx.createGain();
    lfoG.gain.value = 0.020;
    lfo.connect(lfoG);
    lfoG.connect(droneGain.gain);
    lfo.start();

    windGain = ctx.createGain();
    windGain.gain.value = 0.0;
    windGain.connect(ambBus);

    const wFilt = ctx.createBiquadFilter();
    wFilt.type = 'bandpass';
    wFilt.frequency.value = 420;
    wFilt.Q.value = 0.65;
    wFilt.connect(windGain);

    windSource = ctx.createBufferSource();
    windSource.buffer = noiseBuffer;
    windSource.loop = true;
    windSource.connect(wFilt);
    windSource.start();

    const wLfo = ctx.createOscillator();
    wLfo.type = 'sine';
    wLfo.frequency.value = 0.058;
    const wLfoG = ctx.createGain();
    wLfoG.gain.value = 0.030;
    wLfo.connect(wLfoG);
    wLfoG.connect(windGain.gain);
    wLfo.start();

    windGain.gain.value = 0.038;

    lampBuzzGain = ctx.createGain();
    lampBuzzGain.gain.value = 0.0;
    const bFilt = ctx.createBiquadFilter();
    bFilt.type = 'bandpass';
    bFilt.frequency.value = 820;
    bFilt.Q.value = 3.2;
    bFilt.connect(lampBuzzGain);
    lampBuzzGain.connect(master);

    lampBuzzOsc = ctx.createOscillator();
    lampBuzzOsc.type = 'sawtooth';
    lampBuzzOsc.frequency.value = 120;
    lampBuzzOsc.connect(bFilt);
    lampBuzzOsc.start();

    lampBuzzOsc2 = ctx.createOscillator();
    lampBuzzOsc2.type = 'square';
    lampBuzzOsc2.frequency.value = 60;
    const g2 = ctx.createGain();
    g2.gain.value = 0.35;
    lampBuzzOsc2.connect(g2);
    g2.connect(bFilt);
    lampBuzzOsc2.start();

    setLampBuzz(true);
  }

  function setLampBuzz(on) {
    if (!ctx || !lampBuzzGain) return;
    const t = ctx.currentTime;
    lampBuzzGain.gain.cancelScheduledValues(t);
    lampBuzzGain.gain.linearRampToValueAtTime(on ? 0.011 : 0.0, t + 0.25);
  }

  function pannerNode(x, y, z) {
    const p = ctx.createPanner();
    p.panningModel = 'HRTF';
    p.distanceModel = 'inverse';
    p.refDistance = 1.0;
    p.maxDistance = 40;
    p.rolloffFactor = 1.5;
    if (p.positionX) {
      p.positionX.value = x;
      p.positionY.value = y;
      p.positionZ.value = z;
    } else {
      p.setPosition(x, y, z);
    }
    return p;
  }

  function listenerFromCamera() {
    if (!ctx) return;
    const l = ctx.listener;
    const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
    const t = ctx.currentTime;
    if (l.positionX) {
      l.positionX.setTargetAtTime(camera.position.x, t, 0.02);
      l.positionY.setTargetAtTime(camera.position.y, t, 0.02);
      l.positionZ.setTargetAtTime(camera.position.z, t, 0.02);
      l.forwardX.setTargetAtTime(fwd.x, t, 0.02);
      l.forwardY.setTargetAtTime(fwd.y, t, 0.02);
      l.forwardZ.setTargetAtTime(fwd.z, t, 0.02);
      l.upX.setTargetAtTime(up.x, t, 0.02);
      l.upY.setTargetAtTime(up.y, t, 0.02);
      l.upZ.setTargetAtTime(up.z, t, 0.02);
    } else {
      l.setPosition(camera.position.x, camera.position.y, camera.position.z);
      l.setOrientation(fwd.x, fwd.y, fwd.z, up.x, up.y, up.z);
    }
  }

  function envGain(attack, hold, release, peak) {
    const g = ctx.createGain();
    const t = ctx.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + hold + release);
    return g;
  }

  function woodCreak(vol, panX, len) {
    if (!ctx) return;
    len = len || 0.5;
    const t = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer;
    src.loop = true;

    const filt = ctx.createBiquadFilter();
    filt.type = 'bandpass';
    filt.Q.value = 14;
    filt.frequency.setValueAtTime(220 + Math.random() * 260, t);
    filt.frequency.linearRampToValueAtTime(120 + Math.random() * 180, t + len);

    const g = envGain(0.02, len * 0.5, len * 0.6, vol);

    const p = pannerNode(
      camera.position.x + (panX || 0) * 2.0,
      0.6,
      camera.position.z + (Math.random() - 0.5) * 3.0
    );

    src.connect(filt);
    filt.connect(g);
    g.connect(p);
    p.connect(master);
    src.start(t);
    src.stop(t + len + 1.2);
  }

  function knock(vol, x, y, z) {
    if (!ctx) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(96, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.18);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);

    const n = ctx.createBufferSource();
    n.buffer = noiseBuffer;
    const nf = ctx.createBiquadFilter();
    nf.type = 'bandpass';
    nf.frequency.value = 1800;
    nf.Q.value = 1.2;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(vol * 0.5, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    n.connect(nf); nf.connect(ng);

    const p = pannerNode(x || 0, y || 1.0, z || 0);
    o.connect(g); g.connect(p);
    ng.connect(p);
    p.connect(master);

    o.start(t); o.stop(t + 0.5);
    n.start(t); n.stop(t + 0.2);
  }

  function distantRumble(vol) {
    if (!ctx) return;
    const t = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer;
    src.loop = true;
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(90, t);
    filt.frequency.linearRampToValueAtTime(52, t + 2.4);
    filt.Q.value = 1.4;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.8);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 3.6);
    src.connect(filt); filt.connect(g); g.connect(master);
    src.start(t); src.stop(t + 4.2);
  }

  function whisper() {
    if (!ctx) return;
    const t = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer;
    src.loop = true;
    src.playbackRate.value = 0.7 + Math.random() * 0.5;

    const filt = ctx.createBiquadFilter();
    filt.type = 'bandpass';
    filt.Q.value = 6;
    filt.frequency.setValueAtTime(900, t);
    filt.frequency.linearRampToValueAtTime(1700, t + 1.4);
    filt.frequency.linearRampToValueAtTime(640, t + 2.6);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.028, t + 0.5);
    g.gain.linearRampToValueAtTime(0.0001, t + 2.8);

    const p = pannerNode(
      camera.position.x + (Math.random() - 0.5) * 3.5,
      1.2,
      camera.position.z + (Math.random() - 0.5) * 3.5
    );

    src.connect(filt); filt.connect(g); g.connect(p); p.connect(master);
    src.start(t); src.stop(t + 3.2);
  }

  function doorRattle() {
    if (!ctx) return;
    const t = ctx.currentTime;
    for (let i = 0; i < 3; i++) {
      const o = ctx.createOscillator();
      o.type = 'square';
      o.frequency.value = 240 + Math.random() * 120;
      const g = ctx.createGain();
      const tt = t + i * 0.075;
      g.gain.setValueAtTime(0.0001, tt);
      g.gain.exponentialRampToValueAtTime(0.030, tt + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.05);
      const filt = ctx.createBiquadFilter();
      filt.type = 'bandpass';
      filt.frequency.value = 1400;
      filt.Q.value = 2.0;
      const p = pannerNode(DOOR.x, 1.0, HZ - 0.2);
      o.connect(filt); filt.connect(g); g.connect(p); p.connect(master);
      o.start(tt); o.stop(tt + 0.1);
    }
    knock(0.05, DOOR.x, 0.9, HZ - 0.3);
  }

  function pageTurn() {
    if (!ctx) return;
    const t = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer;
    src.loop = true;
    const filt = ctx.createBiquadFilter();
    filt.type = 'highpass';
    filt.frequency.value = 2200;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.020, t + 0.05);
    g.gain.linearRampToValueAtTime(0.0001, t + 0.30);
    const p = pannerNode(camera.position.x, 1.0, camera.position.z);
    src.connect(filt); filt.connect(g); g.connect(p); p.connect(master);
    src.start(t); src.stop(t + 0.5);
  }

  function lampClick() {
    if (!ctx) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = 'square';
    o.frequency.value = 1600;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.028, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    const p = pannerNode(camera.position.x, 1.0, camera.position.z);
    o.connect(g); g.connect(p); p.connect(master);
    o.start(t); o.stop(t + 0.08);
  }

  function windGust(amount, dur) {
    if (!ctx || !windGain) return;
    const t = ctx.currentTime;
    windGain.gain.cancelScheduledValues(t);
    windGain.gain.setValueAtTime(windGain.gain.value, t);
    windGain.gain.linearRampToValueAtTime(0.038 + amount, t + dur * 0.4);
    windGain.gain.linearRampToValueAtTime(0.038, t + dur);
  }

  function setSilence(on, dur) {
    if (!ctx || !ambBus) return;
    const t = ctx.currentTime;
    ambBus.gain.cancelScheduledValues(t);
    ambBus.gain.setValueAtTime(ambBus.gain.value, t);
    if (on) {
      ambBus.gain.linearRampToValueAtTime(0.0001, t + 1.6);
    } else {
      ambBus.gain.linearRampToValueAtTime(1.0, t + (dur || 3.0));
    }
  }

  function resume() {
    try {
      if (ctx && ctx.state === 'suspended') {
        const p = ctx.resume();
        if (p && p.catch) p.catch(() => {});
      }
    } catch (e) {}
  }

  return {
    init: init,
    resume: resume,
    setLampBuzz: setLampBuzz,
    woodCreak: woodCreak,
    knock: knock,
    distantRumble: distantRumble,
    whisper: whisper,
    doorRattle: doorRattle,
    pageTurn: pageTurn,
    lampClick: lampClick,
    windGust: windGust,
    setSilence: setSilence,
    listenerFromCamera: listenerFromCamera,
    get ready() { return started; }
  };
})();

/* ============================================================================
   16. HORROR EVENT SYSTEM
   ========================================================================= */

const Events = (function () {
  let nextEvent = 26 + Math.random() * 46;
  let timer = 0;
  const cooldowns = Object.create(null);
  let silenceActive = false;

  let flickerT = 0;
  let flickerAmp = 0;
  let flickerFreq = 24;

  let shadowT = -1;
  let shadowDur = 2.0;

  const deskSnapshot = [];
  deskObjects.forEach((o) => {
    deskSnapshot.push({
      obj: o,
      pos: o.position.clone(),
      rot: o.rotation.clone()
    });
  });

  function available(name, cd) {
    const now = performance.now() / 1000;
    if (cooldowns[name] && now < cooldowns[name]) return false;
    cooldowns[name] = now + cd;
    return true;
  }

  function triggerCooldown(name, cd) {
    cooldowns[name] = performance.now() / 1000 + cd;
  }

  function pick() {
    const roll = Math.random();
    if (roll < 0.15) return 'creak';
    if (roll < 0.26) return 'distantRumble';
    if (roll < 0.37) return 'wind';
    if (roll < 0.46) return 'lampFlicker';
    if (roll < 0.54) return 'wardrobeMove';
    if (roll < 0.62) return 'objectShift';
    if (roll < 0.69) return 'behindSound';
    if (roll < 0.75) return 'silence';
    if (roll < 0.81) return 'moonShift';
    if (roll < 0.87) return 'windowShadow';
    if (roll < 0.93) return 'doorHandle';
    return 'knock';
  }

  function run(name) {
    switch (name) {
      case 'creak': {
        if (!available('creak', 24)) return;
        Audio.woodCreak(0.055 + Math.random() * 0.05, (Math.random() - 0.5) * 1.6, 0.6 + Math.random() * 0.9);
        break;
      }
      case 'distantRumble': {
        if (!available('rumble', 48)) return;
        Audio.distantRumble(0.030 + Math.random() * 0.030);
        break;
      }
      case 'wind': {
        if (!available('wind', 38)) return;
        Audio.windGust(0.045 + Math.random() * 0.05, 5 + Math.random() * 7);
        break;
      }
      case 'lampFlicker': {
        if (!available('flicker', 30)) return;
        flickerT = 0.35 + Math.random() * 1.5;
        flickerAmp = 0.35 + Math.random() * 0.6;
        flickerFreq = 14 + Math.random() * 40;
        break;
      }
      case 'wardrobeMove': {
        if (!available('wardrobe', 52)) return;
        const rp = window.__wardrobeRightPivot;
        if (!rp) return;
        const delta = (Math.random() < 0.6 ? 1 : -1) * (0.012 + Math.random() * 0.026);
        const from = rp.rotation.y;
        const to = clamp(from + delta, 0.05, 1.05);
        const t0 = performance.now();
        const dur = 900 + Math.random() * 1400;
        const tick = () => {
          const k = clamp((performance.now() - t0) / dur, 0, 1);
          const e = k * k * (3 - 2 * k);
          rp.rotation.y = lerp(from, to, e);
          if (k < 1) requestAnimationFrame(tick);
          else if (Math.random() < 0.4) Audio.woodCreak(0.04, 0.4, 1.1);
        };
        tick();
        if (Math.random() < 0.5) Audio.woodCreak(0.035, 0.3, 0.8);
        break;
      }
      case 'objectShift': {
        if (!available('object', 40)) return;
        const idx = Math.floor(Math.random() * deskSnapshot.length);
        const s = deskSnapshot[idx];
        const o = s.obj;
        const t0 = performance.now();
        const dur = 1200;
        const ox = o.position.x, oz = o.position.z;
        const oy = o.rotation.y;
        const dx = (Math.random() - 0.5) * 0.020;
        const dz = (Math.random() - 0.5) * 0.020;
        const dy = (Math.random() - 0.5) * 0.09;
        const tick = () => {
          const k = clamp((performance.now() - t0) / dur, 0, 1);
          const e = k * k * (3 - 2 * k);
          o.position.x = ox + dx * e;
          o.position.z = oz + dz * e;
          o.rotation.y = oy + dy * e;
          if (k < 1) requestAnimationFrame(tick);
        };
        tick();
        break;
      }
      case 'behindSound': {
        if (!available('behind', 44)) return;
        const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        const bx = camera.position.x - fwd.x * 2.6 + (Math.random() - 0.5) * 1.2;
        const bz = camera.position.z - fwd.z * 2.6 + (Math.random() - 0.5) * 1.2;
        Audio.knock(0.022 + Math.random() * 0.02, bx, 0.7 + Math.random() * 0.9, bz);
        break;
      }
      case 'silence': {
        if (!available('silence', 70)) return;
        if (silenceActive) return;
        silenceActive = true;
        Audio.setSilence(true);
        const dur = 6000 + Math.random() * 9000;
        setTimeout(() => {
          Audio.setSilence(false, 4.5);
          silenceActive = false;
        }, dur);
        break;
      }
      case 'moonShift': {
        if (!available('moon', 42)) return;
        const m = window.__moon;
        const base = window.__moonBase;
        const t0 = performance.now();
        const dur = 2600;
        const target = base * (0.55 + Math.random() * 0.9);
        const tick = () => {
          const k = clamp((performance.now() - t0) / dur, 0, 1);
          const e = k * k * (3 - 2 * k);
          m.intensity = lerp(base, target, e);
          if (k < 1) requestAnimationFrame(tick);
          else {
            setTimeout(() => { m.intensity = base; }, 800 + Math.random() * 2600);
          }
        };
        tick();
        break;
      }
      case 'windowShadow': {
        if (!available('windowShadow', 62)) return;
        shadowT = 0;
        shadowDur = 1.4 + Math.random() * 1.2;
        break;
      }
      case 'doorHandle': {
        if (!available('doorHandle', 56)) return;
        const hg = window.__doorHandleGroup;
        if (!hg) return;
        const t0 = performance.now();
        const dur = 1400;
        const tick = () => {
          const k = clamp((performance.now() - t0) / dur, 0, 1);
          hg.rotation.z = Math.sin(k * Math.PI) * 0.055;
          if (k < 1) requestAnimationFrame(tick);
          else hg.rotation.z = 0;
        };
        tick();
        Audio.woodCreak(0.020, 0.0, 0.7);
        break;
      }
      case 'knock': {
        if (!available('knock', 58)) return;
        const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        Audio.knock(0.028, camera.position.x + fwd.x * 4, 1.0, camera.position.z + fwd.z * 4);
        break;
      }
    }
  }

  function update(dt, time) {
    if (window.__lampLight && lampOn) {
      if (flickerT > 0) {
        flickerT -= dt;
        const n = Math.sin(time * flickerFreq) * 0.5 + Math.sin(time * flickerFreq * 2.37) * 0.5;
        const f = 1.0 - flickerAmp * (0.5 + 0.5 * n);
        window.__lampLight.intensity = window.__lampBaseIntensity * clamp(f, 0.05, 1.0);
        MAT.bulb.emissiveIntensity = clamp(f, 0.05, 1.0);
        Audio.setLampBuzz(f > 0.45);
      } else {
        const base = window.__lampBaseIntensity;
        const cur = window.__lampLight.intensity;
        window.__lampLight.intensity = lerp(cur, base, 1 - Math.exp(-dt * 2.2));
        MAT.bulb.emissiveIntensity = lerp(MAT.bulb.emissiveIntensity, 1.0, 1 - Math.exp(-dt * 2.2));
      }
    }

    if (shadowT >= 0) {
      shadowT += dt;
      const k = shadowT / shadowDur;
      if (k >= 1) {
        shadowT = -1;
        window.__passer.material.opacity = 0;
      } else {
        const x = lerp(2.2, -2.4, k);
        window.__passer.position.x = x;
        window.__passer.position.z = -5.4 - Math.sin(k * Math.PI) * 0.5;
        window.__passer.material.opacity = Math.sin(k * Math.PI) * 0.34;
      }
    }

    const gl = window.__doorGlow;
    if (gl) {
      const target = (Math.sin(time * 0.13) > 0.995) ? 0.16 : 0.0;
      gl.opacity = lerp(gl.opacity, target, 1 - Math.exp(-dt * 1.5));
    }

    timer += dt;
    if (timer >= nextEvent) {
      timer = 0;
      nextEvent = 30 + Math.random() * 70;
      run(pick());
    }
  }

  return { update: update, triggerCooldown: triggerCooldown };
})();

/* ============================================================================
   17. MOVEMENT / CAMERA
   ========================================================================= */

const tmpFwd = new THREE.Vector3();
const tmpRight = new THREE.Vector3();
const wish = new THREE.Vector3();
const prevPos = new THREE.Vector3();

function updatePlayer(dt) {
  const speed = keys['ShiftLeft'] || keys['ShiftRight'] ? 2.45 : 1.32;

  tmpFwd.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  tmpRight.set(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

  let ix = 0, iz = 0;
  if (keys['KeyW'] || keys['ArrowUp']) iz += 1;
  if (keys['KeyS'] || keys['ArrowDown']) iz -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) ix += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) ix -= 1;

  wish.set(0, 0, 0);
  if (ix !== 0 || iz !== 0) {
    wish.addScaledVector(tmpFwd, iz);
    wish.addScaledVector(tmpRight, ix);
    wish.normalize().multiplyScalar(speed);
  }

  const accel = wish.lengthSq() > 0 ? 9.0 : 11.0;
  const t = 1 - Math.exp(-accel * dt);
  player.vel.x = lerp(player.vel.x, wish.x, t);
  player.vel.z = lerp(player.vel.z, wish.z, t);

  prevPos.copy(player.pos);
  player.pos.x += player.vel.x * dt;
  player.pos.z += player.vel.z * dt;
  resolveCollisions(player.pos);

  const dx = player.pos.x - prevPos.x;
  const dz = player.pos.z - prevPos.z;
  const moved = Math.sqrt(dx * dx + dz * dz);
  const speedFrac = clamp(moved / (speed * dt + 1e-5), 0, 1);

  player.bobT += moved * 12.5;
  const bobTarget = Math.sin(player.bobT * 2.0) * 0.016 * speedFrac;
  const bobXTarget = Math.cos(player.bobT) * 0.011 * speedFrac;
  player.bobY = lerp(player.bobY, bobTarget, 1 - Math.exp(-dt * 14));
  player.bobX = lerp(player.bobX, bobXTarget, 1 - Math.exp(-dt * 14));
  player.roll = lerp(player.roll, Math.cos(player.bobT) * 0.006 * speedFrac, 1 - Math.exp(-dt * 8));

  player.breathe = Math.sin(performance.now() * 0.00105) * 0.0072;

  camera.position.set(
    player.pos.x + player.bobX * 0.4,
    player.eyeHeight + player.bobY + player.breathe,
    player.pos.z
  );
  camera.rotation.set(player.pitch, player.yaw, player.roll, 'YXZ');
}

/* ============================================================================
   18b. MOBILE UI HOOKS
   ========================================================================= */

const joystickBase = document.getElementById('joystick-base');
const joystickKnob = document.getElementById('joystick-knob');
const interactBtn = document.getElementById('interact-btn');
const sprintBtn = document.getElementById('sprint-btn');
const fsBtn = document.getElementById('fs-btn');

function toggleFullscreen() {
  try {
    const el = document.documentElement;
    const isFs = document.fullscreenElement || document.webkitFullscreenElement ||
                 document.mozFullScreenElement || document.msFullscreenElement;
    if (isFs) {
      const ex = document.exitFullscreen || document.webkitExitFullscreen ||
                 document.mozCancelFullScreen || document.msExitFullscreen;
      if (ex) {
        const p = ex.call(document);
        if (p && p.catch) p.catch(() => {});
      }
    } else {
      const req = el.requestFullscreen || el.webkitRequestFullscreen ||
                  el.mozRequestFullScreen || el.msRequestFullscreen;
      if (req) {
        const p = req.call(el);
        if (p && p.catch) p.catch(() => {});
      }
    }
  } catch (e) { /* ignored */ }
}

if (fsBtn) {
  fsBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFullscreen(); });
  fsBtn.addEventListener('touchend', (e) => {
    e.preventDefault(); e.stopPropagation(); toggleFullscreen();
  }, { passive: false });
}

/* ---------- Virtual Joystick ---------- */
let joystickTouchId = null;
let joystickOriginX = 0;
let joystickOriginY = 0;
const JOYSTICK_MAX_R = 46;

function joystickApply(clientX, clientY) {
  let dx = clientX - joystickOriginX;
  let dy = clientY - joystickOriginY;
  const dist = Math.hypot(dx, dy);
  if (dist > JOYSTICK_MAX_R) {
    const k = JOYSTICK_MAX_R / dist;
    dx *= k; dy *= k;
  }
  if (joystickKnob) {
    joystickKnob.style.transform = 'translate(' + dx.toFixed(1) + 'px, ' + dy.toFixed(1) + 'px)';
  }
  const nx = dx / JOYSTICK_MAX_R;
  const ny = dy / JOYSTICK_MAX_R;
  keys['KeyW'] = ny < -0.26;
  keys['KeyS'] = ny >  0.26;
  keys['KeyA'] = nx < -0.26;
  keys['KeyD'] = nx >  0.26;
}

function joystickReset() {
  if (joystickKnob) joystickKnob.style.transform = 'translate(0px, 0px)';
  keys['KeyW'] = false;
  keys['KeyS'] = false;
  keys['KeyA'] = false;
  keys['KeyD'] = false;
}

if (IS_MOBILE && joystickBase) {
  joystickBase.addEventListener('touchstart', (e) => {
    if (!gameStarted) return;
    if (joystickTouchId !== null) return;
    const t = e.changedTouches[0];
    joystickTouchId = t.identifier;
    const rect = joystickBase.getBoundingClientRect();
    joystickOriginX = rect.left + rect.width / 2;
    joystickOriginY = rect.top + rect.height / 2;
    joystickApply(t.clientX, t.clientY);
    e.preventDefault();
    e.stopPropagation();
  }, { passive: false });

  joystickBase.addEventListener('touchmove', (e) => {
    if (joystickTouchId === null) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === joystickTouchId) {
        joystickApply(t.clientX, t.clientY);
      }
    }
    e.preventDefault();
    e.stopPropagation();
  }, { passive: false });

  const endJoystick = (e) => {
    if (joystickTouchId === null) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joystickTouchId) {
        joystickTouchId = null;
        joystickReset();
      }
    }
  };
  joystickBase.addEventListener('touchend', endJoystick, { passive: false });
  joystickBase.addEventListener('touchcancel', endJoystick, { passive: false });
}

/* ---------- Camera Look (canvas — drag anywhere that isn't a control) ---------- */
const lookTouches = new Map();
const LOOK_SENS = IS_MOBILE ? 0.0055 : 0.0021;

canvas.addEventListener('touchstart', (e) => {
  if (!gameStarted || !IS_MOBILE) return;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    lookTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
  }
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  if (!gameStarted || !IS_MOBILE) return;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const p = lookTouches.get(t.identifier);
    if (!p) continue;
    const dx = t.clientX - p.x;
    const dy = t.clientY - p.y;
    player.yaw -= dx * LOOK_SENS;
    player.pitch -= dy * LOOK_SENS;
    player.pitch = clamp(player.pitch, -1.30, 1.30);
    p.x = t.clientX;
    p.y = t.clientY;
  }
  e.preventDefault();
}, { passive: false });

const endLook = (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    lookTouches.delete(e.changedTouches[i].identifier);
  }
};
canvas.addEventListener('touchend', endLook);
canvas.addEventListener('touchcancel', endLook);

/* ---------- Interaction Button ---------- */
if (interactBtn) {
  const onInteract = (e) => {
    e.preventDefault();
    e.stopPropagation();
    tryInteract();
  };
  interactBtn.addEventListener('touchstart', onInteract, { passive: false });
  interactBtn.addEventListener('click', (e) => { e.stopPropagation(); tryInteract(); });
}

/* ---------- Sprint Button (hold) ---------- */
if (sprintBtn) {
  const sprintOn = (e) => {
    e.preventDefault();
    e.stopPropagation();
    keys['ShiftLeft'] = true;
    sprintBtn.classList.add('on');
  };
  const sprintOff = (e) => {
    if (e) e.stopPropagation();
    keys['ShiftLeft'] = false;
    sprintBtn.classList.remove('on');
  };
  sprintBtn.addEventListener('touchstart', sprintOn, { passive: false });
  sprintBtn.addEventListener('touchend', sprintOff);
  sprintBtn.addEventListener('touchcancel', sprintOff);
  sprintBtn.addEventListener('mousedown', sprintOn);
  sprintBtn.addEventListener('mouseup', sprintOff);
  sprintBtn.addEventListener('mouseleave', sprintOff);
}

function checkOrientation() {
  if (!IS_MOBILE) return;
  const isPortrait = window.innerHeight > window.innerWidth;
  document.body.classList.toggle('portrait', isPortrait);
}

/* ============================================================================
   18c. FULL GAME START HANDLER
   This runs the moment the button is tapped (from beginGame()).
   Every risky step is isolated in try/catch so nothing can prevent the game
   from running.
   ========================================================================= */

onGameStart = function () {
  // 1) Audio (must be inside the user gesture for iOS Safari)
  try {
    Audio.init();
    Audio.resume();
  } catch (e) { console.warn('audio init failed (non-fatal):', e); }

  // 2) Fullscreen on mobile (best-effort — iOS Safari often refuses)
  if (IS_MOBILE) {
    try { toggleFullscreen(); } catch (e) { /* ignored */ }
  } else {
    // 3) Pointer Lock on desktop (best-effort — never required to play)
    try {
      if (canvas.requestPointerLock) {
        const p = canvas.requestPointerLock();
        if (p && p.catch) p.catch(() => {});
      }
    } catch (e) { /* ignored */ }
  }

  // 4) Opening atmospheric beat (distant creak a moment after entry)
  setTimeout(() => {
    try { Audio.woodCreak(0.045, -0.5, 1.1); } catch (e) {}
  }, 1400);
};

/* ============================================================================
   18d. Desktop canvas re-lock (user clicked away from pointer lock)
   ========================================================================= */

canvas.addEventListener('click', () => {
  if (gameStarted && !locked && !IS_MOBILE) {
    try {
      if (canvas.requestPointerLock) {
        const p = canvas.requestPointerLock();
        if (p && p.catch) p.catch(() => {});
      }
    } catch (e) {}
  }
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Escape' && locked) document.exitPointerLock();
});

/* ============================================================================
   19. RESIZE
   ========================================================================= */

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  const maxRatio = IS_MOBILE ? 1.0 : 1.5;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, maxRatio));
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  POST.resize(w, h);
  checkOrientation();
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => {
  setTimeout(onResize, 120);
});
onResize();

/* Prevent iOS double-tap zoom / bounces on empty areas of the body */
if (IS_MOBILE) {
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('touchmove', (e) => {
    if (e.target === document.body || e.target === canvas) {
      e.preventDefault();
    }
  }, { passive: false });
}

/* Keep the audio context alive when the tab / app comes back */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && gameStarted) {
    try { Audio.resume(); } catch (e) {}
  }
});

/* ============================================================================
   20. MAIN LOOP
   ========================================================================= */

const clock = new THREE.Clock();
let elapsed = 0;
let interactTick = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  if (gameStarted) {
    updatePlayer(dt);
    Audio.listenerFromCamera();
    Events.update(dt, elapsed);

    interactTick += dt;
    if (interactTick > 0.08) {
      interactTick = 0;
      updateInteraction();
    }
  } else {
    // slow, aimless drift of the camera behind the title screen
    camera.position.set(0.35, 1.63, 1.75);
    camera.rotation.set(-0.06, -0.62 + Math.sin(elapsed * 0.08) * 0.02, 0, 'YXZ');
  }

  if (mirrorMesh) mirrorMesh.material.uniforms.uTime.value = elapsed;

  POST.render(scene, camera, elapsed);
}

animate();
</script>
