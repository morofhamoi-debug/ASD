<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="SHERLOCK OSINT — поиск информации из открытых источников">
<title>SHERLOCK OSINT — Open Source Intelligence</title>
<style>
/* =========================================================
   SHERLOCK OSINT — single-file build
   ========================================================= */
:root{
  --bg:#08090D; --panel:#101218; --panel-2:#151821; --panel-3:#1B1F2B;
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.16);
  --text:#E8EAF2; --text-dim:#8B90A6; --text-mute:#5C6178;
  --accent:#6C7BFF; --accent-2:#9A6CFF; --accent-soft:rgba(108,123,255,.14);
  --green:#33D69F; --yellow:#F5C451; --red:#FF5C6C;
  --radius:16px; --radius-sm:10px; --radius-xs:8px;
  --shadow:0 20px 50px rgba(0,0,0,.55); --shadow-soft:0 8px 26px rgba(0,0,0,.35);
  --sidebar-w:250px; --topbar-h:64px;
  --font:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme="light"]{
  --bg:#F2F3F8; --panel:#FFFFFF; --panel-2:#F7F8FC; --panel-3:#EFF1F8;
  --border:rgba(12,14,28,.10); --border-strong:rgba(12,14,28,.20);
  --text:#0E1020; --text-dim:#5A5F76; --text-mute:#878CA3;
  --accent:#4E5DF0; --accent-2:#7C4DF0; --accent-soft:rgba(78,93,240,.10);
  --shadow:0 18px 42px rgba(20,25,60,.12); --shadow-soft:0 8px 20px rgba(20,25,60,.08);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--text); font-family:var(--font); font-size:15px; line-height:1.55;
  background:
    radial-gradient(1100px 620px at 12% -10%, rgba(108,123,255,.10), transparent 60%),
    radial-gradient(900px 520px at 92% 0%, rgba(154,108,255,.08), transparent 60%),
    var(--bg);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  transition:background .35s ease, color .35s ease;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
img,svg{display:block;max-width:100%}
::selection{background:var(--accent-soft)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(140,145,175,.25);border-radius:20px;border:3px solid transparent;background-clip:content-box}

/* layout */
.app{display:flex;min-height:100vh;width:100%}
.sidebar{
  width:var(--sidebar-w); flex:0 0 var(--sidebar-w);
  background:linear-gradient(180deg,rgba(21,24,33,.86),rgba(16,18,24,.92));
  border-right:1px solid var(--border); backdrop-filter:blur(18px);
  display:flex;flex-direction:column;padding:20px 14px;
  position:sticky;top:0;height:100vh;z-index:40;
}
[data-theme="light"] .sidebar{background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(247,248,252,.96))}
.main{
  flex:1 1 auto; min-width:0; padding:0 28px 60px;
  display:flex;flex-direction:column;gap:22px;
  max-width:1280px; margin:0 auto; width:100%;
}
.sidebar__brand{display:flex;align-items:center;gap:10px;padding:6px 8px 20px;border-bottom:1px solid var(--border);margin-bottom:16px}
.sidebar__brand .logo__mark{width:34px;height:34px;font-size:16px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav__item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;
  border-radius:var(--radius-sm); color:var(--text-dim); font-size:14px; font-weight:500;
  border:1px solid transparent; transition:.18s; position:relative; cursor:pointer;
}
.nav__item svg{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav__item:hover{background:var(--panel-2);color:var(--text)}
.nav__item.is-active{background:var(--accent-soft);color:var(--text);border-color:rgba(108,123,255,.25)}
.nav__item.is-active::before{content:"";position:absolute;left:-14px;top:12px;bottom:12px;width:3px;background:linear-gradient(180deg,var(--accent),var(--accent-2));border-radius:0 3px 3px 0}
.sidebar__bottom{margin-top:auto;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--text-mute)}
.sidebar__system{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:10px}
.sidebar__system b{color:var(--text);font-weight:600;font-size:12px}

/* topbar */
.topbar{
  height:var(--topbar-h); display:flex; align-items:center; justify-content:space-between; gap:16px;
  border-bottom:1px solid var(--border); position:sticky; top:0; z-index:30;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(14px); margin:0 -28px; padding:0 28px;
}
.topbar__left,.topbar__right{display:flex;align-items:center;gap:14px}
.topbar__nav{display:flex;gap:6px}
.topbar__link{font-size:13px;font-weight:500;color:var(--text-dim);padding:7px 12px;border-radius:999px;transition:.18s;cursor:pointer}
.topbar__link:hover{background:var(--panel-2);color:var(--text)}
.topbar__link.is-active{background:var(--accent-soft);color:var(--text)}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text-dim);padding:6px 11px;border:1px solid var(--border);border-radius:999px;background:var(--panel-2)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot--green{background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2.2s infinite}
.dot--accent{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.dot--yellow{background:var(--yellow);box-shadow:0 0 10px var(--yellow)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.82)}}

/* icon button */
.icon-btn{
  width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;
  background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-xs);
  color:var(--text-dim);cursor:pointer;transition:.18s;position:relative;padding:0;
}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{color:var(--text);border-color:var(--border-strong);background:var(--panel-3)}
.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[data-tooltip]::after{
  content:attr(data-tooltip); position:absolute; bottom:calc(100% + 8px); left:50%;
  transform:translateX(-50%) translateY(4px); background:var(--panel-3); color:var(--text);
  font-size:11px; padding:5px 9px; border-radius:6px; border:1px solid var(--border);
  white-space:nowrap; opacity:0; pointer-events:none; transition:.18s; z-index:80;
}
[data-tooltip]:hover::after{opacity:1;transform:translateX(-50%) translateY(0)}

/* logo */
.logo{display:flex;align-items:center;gap:12px}
.logo__mark{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  font-weight:800;font-size:18px;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 8px 22px rgba(108,123,255,.32);
}
.logo__text{display:flex;flex-direction:column;line-height:1.15}
.logo__text strong{font-size:14px;letter-spacing:.16em}
.logo__text small{font-size:8.5px;letter-spacing:.22em;color:var(--text-mute)}

/* hero */
.hero{padding:56px 0 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;animation:fadeUp .55s ease both}
.hero__brand{margin-bottom:6px}
.hero__title{
  margin:0;font-size:clamp(28px,5vw,46px);letter-spacing:.12em;font-weight:800;
  background:linear-gradient(120deg,#fff 10%,var(--accent) 55%,var(--accent-2) 95%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
[data-theme="light"] .hero__title{background:linear-gradient(120deg,#141830 10%,var(--accent) 55%,var(--accent-2) 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero__subtitle{margin:0;color:var(--text-dim);font-size:15px}
.hero__note{display:inline-flex;align-items:center;gap:8px;margin:6px 0 0;font-size:12.5px;color:var(--text-mute)}
.hero__note-icon{width:14px;height:14px;border-radius:50%;background:var(--accent-soft);border:1px solid rgba(108,123,255,.4);display:inline-block}

/* searchbar */
.searchbar{
  display:flex;align-items:center;gap:10px;width:100%;max-width:820px;
  padding:8px 8px 8px 18px;
  background:linear-gradient(180deg,rgba(21,24,33,.92),rgba(16,18,24,.92));
  border:1px solid var(--border-strong);border-radius:var(--radius);
  box-shadow:var(--shadow);backdrop-filter:blur(18px);transition:.22s;
}
[data-theme="light"] .searchbar{background:linear-gradient(180deg,#fff,#F7F8FC)}
.searchbar:focus-within{border-color:rgba(108,123,255,.55);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow)}
.searchbar--compact{max-width:100%}
.searchbar__icon{
  width:18px;height:18px;flex:0 0 18px;background:currentColor;color:var(--text-mute);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>") center/contain no-repeat;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>") center/contain no-repeat;
}
.searchbar__input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--text);font-size:15.5px;padding:12px 4px}
.searchbar__input::placeholder{color:var(--text-mute)}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--panel-2);color:var(--text);font-size:13.5px;font-weight:600;
  cursor:pointer;transition:.18s;white-space:nowrap;
}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{border-color:var(--border-strong);background:var(--panel-3)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn--primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff;box-shadow:0 10px 26px rgba(108,123,255,.30)}
.btn--primary:hover{filter:brightness(1.08);background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.btn--ghost{background:transparent}
.btn--sm{padding:6px 12px;font-size:12.5px}
.searchbar__btn{padding:12px 26px;letter-spacing:.06em}

/* chips */
.typechips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{
  padding:8px 16px;border-radius:999px;border:1px solid var(--border);
  background:var(--panel-2);color:var(--text-dim);
  font-size:12px;font-weight:600;letter-spacing:.06em;cursor:pointer;transition:.18s;
}
.chip:hover{color:var(--text);border-color:var(--border-strong)}
.chip.is-active{color:var(--text);border-color:rgba(108,123,255,.5);background:var(--accent-soft);box-shadow:0 0 0 3px rgba(108,123,255,.08)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* sections & panels */
.section{display:flex;flex-direction:column;gap:14px;animation:fadeUp .5s ease both}
.section__head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.section__title{margin:0;font-size:13px;font-weight:700;letter-spacing:.2em;color:var(--text-dim);text-transform:uppercase}
.panel{
  background:linear-gradient(180deg,rgba(21,24,33,.72),rgba(16,18,24,.85));
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-soft);backdrop-filter:blur(14px);
  overflow:hidden;animation:fadeUp .5s ease both;
}
[data-theme="light"] .panel{background:linear-gradient(180deg,#fff,#FBFBFE)}
.panel--search{padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.panel__head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.panel__title{margin:0;font-size:14px;font-weight:600}
.panel__body{padding:18px 20px}
.panel__body--flush{padding:0}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.04em;border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim)}
.badge--muted{color:var(--text-mute)}
.badge--high{color:var(--green);border-color:rgba(51,214,159,.35);background:rgba(51,214,159,.10)}
.badge--med{color:var(--yellow);border-color:rgba(245,196,81,.35);background:rgba(245,196,81,.10)}
.badge--low{color:var(--red);border-color:rgba(255,92,108,.35);background:rgba(255,92,108,.10)}
.badge--accent{color:var(--accent);border-color:rgba(108,123,255,.35);background:var(--accent-soft)}
.notice{padding:14px 16px;border-radius:var(--radius-sm);font-size:13.5px;line-height:1.6;border:1px solid var(--border)}
.notice--info{background:var(--accent-soft);border-color:rgba(108,123,255,.28);color:var(--text)}
.notice--warn{background:rgba(245,196,81,.08);border-color:rgba(245,196,81,.3);color:var(--text)}
.notice--error{background:rgba(255,92,108,.08);border-color:rgba(255,92,108,.32);color:var(--text)}

/* tabs */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:2px}
.tab{padding:10px 16px;background:transparent;border:none;color:var(--text-dim);font-size:13.5px;font-weight:600;cursor:pointer;border-radius:var(--radius-xs) var(--radius-xs) 0 0;border-bottom:2px solid transparent;transition:.18s}
.tab:hover{color:var(--text);background:var(--panel-2)}
.tab.is-active{color:var(--text);border-bottom-color:var(--accent)}
.tabpanel{display:none;animation:fadeUp .32s ease both}
.tabpanel.is-active{display:block}

/* cards */
.card{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:14px;transition:.2s}
.card:hover{border-color:var(--border-strong);transform:translateY(-2px);box-shadow:var(--shadow-soft)}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card__top{display:flex;align-items:center;gap:12px}
.card__name{font-size:15px;font-weight:600}
.card__sub{font-size:12.5px;color:var(--text-mute);font-family:var(--mono)}
.card__meta{display:flex;flex-wrap:wrap;gap:8px}
.kv{display:flex;flex-direction:column;gap:3px}
.kv__k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-mute)}
.kv__v{font-size:13.5px}
.avatar{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));flex:0 0 auto}
.avatar--lg{width:88px;height:88px;border-radius:22px;font-size:30px}

/* tables */
.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
.table th{text-align:left;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-mute);font-weight:700;padding:14px 18px;border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:14px 18px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tbody tr{transition:.16s}
.table tbody tr:hover{background:var(--panel-2)}
.table .mono{font-family:var(--mono);font-size:12.5px;color:var(--text-dim)}

/* select/switch/segmented */
.select{background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-xs);padding:8px 12px;font-size:13px;outline:none;cursor:pointer}
.select:focus{border-color:var(--accent)}
.sorter{display:flex;align-items:center;gap:8px}
.sorter__label{font-size:12px;color:var(--text-mute)}
.switch{position:relative;display:inline-block;cursor:pointer}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch__track{display:block;width:46px;height:26px;border-radius:999px;background:var(--panel-3);border:1px solid var(--border);transition:.2s;position:relative}
.switch__thumb{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--text-mute);transition:.2s}
.switch input:checked + .switch__track{background:var(--accent-soft);border-color:rgba(108,123,255,.5)}
.switch input:checked + .switch__track .switch__thumb{left:22px;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.switch input:focus-visible + .switch__track{outline:2px solid var(--accent);outline-offset:2px}
.segmented{display:inline-flex;padding:3px;gap:3px;background:var(--panel-3);border:1px solid var(--border);border-radius:var(--radius-xs)}
.segmented__btn{padding:7px 14px;border:none;background:transparent;cursor:pointer;color:var(--text-dim);font-size:12.5px;font-weight:600;border-radius:6px;transition:.18s}
.segmented__btn:hover{color:var(--text)}
.segmented__btn.is-active{background:var(--panel);color:var(--text);box-shadow:var(--shadow-soft)}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border-bottom:none}
.setting-row__title{font-size:14px;font-weight:600;margin-bottom:3px}
.setting-row__desc{font-size:12.5px;color:var(--text-mute);max-width:520px}

/* empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:56px 20px;text-align:center;color:var(--text-dim)}
.empty__ico{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--border);color:var(--text-mute)}
.empty__ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty__title{font-size:16px;font-weight:600;color:var(--text)}
.empty__text{font-size:13px;color:var(--text-mute);max-width:340px}

/* toast */
.toast-container{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:200;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;min-width:230px;max-width:340px;padding:12px 16px;background:var(--panel-3);border:1px solid var(--border-strong);border-left:3px solid var(--accent);border-radius:var(--radius-sm);box-shadow:var(--shadow);font-size:13px;color:var(--text);animation:slideIn .28s ease both}
.toast.is-hiding{animation:slideOut .22s ease both}
.toast--success{border-left-color:var(--green)}
.toast--warn{border-left-color:var(--yellow)}
.toast--error{border-left-color:var(--red)}
.toast svg{width:16px;height:16px;flex:0 0 16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* scan overlay */
.scan{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:rgba(4,5,8,.82);backdrop-filter:blur(10px);padding:20px}
.scan.is-open{display:flex;animation:fadeIn .25s ease both}
.scan__box{width:100%;max-width:520px;background:linear-gradient(180deg,rgba(21,24,33,.96),rgba(16,18,24,.98));border:1px solid var(--border-strong);border-radius:20px;padding:30px 28px;box-shadow:var(--shadow);animation:scaleIn .3s ease both}
[data-theme="light"] .scan__box{background:linear-gradient(180deg,#fff,#F7F8FC)}
.scan__title{font-size:13px;letter-spacing:.22em;font-weight:700;color:var(--text-dim);margin-bottom:18px}
.scan__bar{height:6px;border-radius:999px;background:var(--panel-3);overflow:hidden;border:1px solid var(--border)}
.scan__bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 0 16px rgba(108,123,255,.7);transition:width .3s ease}
.scan__pct{margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--text-mute);text-align:right}
.scan__steps{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.scan__steps li{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--text-mute);opacity:.35;transition:.3s}
.scan__steps li.is-active{opacity:1;color:var(--text)}
.scan__steps li.is-done{opacity:1;color:var(--text-dim)}
.scan__steps li .tick{width:18px;height:18px;border-radius:50%;flex:0 0 18px;border:1px solid var(--border-strong);display:grid;place-items:center;font-size:11px;color:transparent}
.scan__steps li.is-done .tick{background:rgba(51,214,159,.14);border-color:rgba(51,214,159,.5);color:var(--green)}

/* dashboard */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.stat{background:linear-gradient(180deg,rgba(21,24,33,.72),rgba(16,18,24,.85));border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;transition:.22s;animation:fadeUp .45s ease both}
[data-theme="light"] .stat{background:linear-gradient(180deg,#fff,#FBFBFE)}
.stat::after{content:"";position:absolute;inset:0;background:radial-gradient(220px 90px at 90% -20%, rgba(108,123,255,.16), transparent 70%);pointer-events:none}
.stat:hover{transform:translateY(-3px);border-color:var(--border-strong);box-shadow:var(--shadow-soft)}
.stat__ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);border:1px solid rgba(108,123,255,.28);color:var(--accent);margin-bottom:4px}
.stat__ico svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stat__label{font-size:10.5px;letter-spacing:.14em;color:var(--text-mute);font-weight:700}
.stat__value{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.list{display:flex;flex-direction:column}
.list__item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);transition:.16s}
.list__item:last-child{border-bottom:none}
.list__main{flex:1;min-width:0}
.list__title{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list__sub{font-size:11.5px;color:var(--text-mute)}
.list__actions{display:flex;gap:6px}
.chart{width:100%;height:180px;position:relative}
.chart svg{width:100%;height:100%;overflow:visible}
.chart__grid{stroke:var(--border);stroke-width:1}
.chart__area{fill:url(#chartGrad)}
.chart__line{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chart__dot{fill:var(--panel);stroke:var(--accent);stroke-width:2}
.chart__label{fill:var(--text-mute);font-size:10px;font-family:var(--mono)}
.footprint{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fp{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;display:flex;flex-direction:column;gap:4px}
.fp__k{font-size:10.5px;letter-spacing:.12em;color:var(--text-mute);font-weight:700}
.fp__v{font-size:20px;font-weight:700}
.fp__bar{height:4px;border-radius:999px;background:var(--panel-3);overflow:hidden;margin-top:6px}
.fp__bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.confidence-legend{display:grid;gap:12px}
.conf{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--panel-2);font-size:13px;color:var(--text-dim)}
.conf b{flex:0 0 72px;font-size:11px;letter-spacing:.12em}
.conf--high b{color:var(--green)} .conf--med b{color:var(--yellow)} .conf--low b{color:var(--red)}

/* platform rows */
.platform-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--panel-2);transition:.18s}
.platform-row + .platform-row{margin-top:10px}
.platform-row:hover{border-color:var(--border-strong);background:var(--panel-3)}
.platform-row__ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel-3);border:1px solid var(--border);font-size:12px;font-weight:700;color:var(--text-dim);flex:0 0 34px}
.platform-row__main{flex:1;min-width:0}
.platform-row__name{font-size:13.5px;font-weight:600}
.platform-row__user{font-size:12px;font-family:var(--mono);color:var(--text-mute)}
.platform-row__side{display:flex;align-items:center;gap:12px}
.confbar{width:88px}
.confbar__track{height:5px;border-radius:999px;background:var(--panel-3);overflow:hidden}
.confbar__fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.confbar__num{font-size:11px;font-family:var(--mono);color:var(--text-mute);margin-top:3px;text-align:right}

/* connection chain */
.chain{display:flex;flex-direction:column;padding:16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--panel-2)}
.chain + .chain{margin-top:12px}
.chain__node{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-xs);background:var(--panel-3);border:1px solid var(--border);font-size:13px}
.chain__arrow{display:flex;align-items:center;gap:10px;padding:6px 0 6px 16px;font-size:12px;color:var(--text-mute)}
.chain__arrow span{font-style:italic}

/* report */
.report{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);padding:28px;font-size:13.5px}
.report h2{margin:0 0 6px;font-size:18px;letter-spacing:.14em}
.report h3{margin:24px 0 10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-mute)}
.report__meta{font-family:var(--mono);font-size:12px;color:var(--text-mute);margin-bottom:20px}
.report ul{margin:0;padding-left:18px;color:var(--text-dim)}
.report li{margin-bottom:6px}
.report__disclaimer{margin-top:26px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--text-mute);font-style:italic}
.report__actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}

/* profile head */
.profile-head{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:26px;background:linear-gradient(180deg,rgba(21,24,33,.8),rgba(16,18,24,.9));border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-soft);position:relative;overflow:hidden;animation:fadeUp .45s ease both}
[data-theme="light"] .profile-head{background:linear-gradient(180deg,#fff,#FBFBFE)}
.profile-head::after{content:"";position:absolute;inset:0;background:radial-gradient(420px 200px at 0% -30%, rgba(108,123,255,.16), transparent 70%);pointer-events:none}
.profile-head__info{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px}
.profile-head__name{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.profile-head__user{font-family:var(--mono);font-size:13px;color:var(--text-dim)}
.profile-head__links{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.profile-head__actions{display:flex;gap:8px;flex-wrap:wrap}
.linkchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--panel-2);font-size:12px;color:var(--text-dim);transition:.18s}
.linkchip:hover{color:var(--text);border-color:var(--border-strong);background:var(--panel-3)}
.overview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.overview-card{padding:16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--panel-2);display:flex;flex-direction:column;gap:6px}
.overview-card__k{font-size:10.5px;letter-spacing:.14em;color:var(--text-mute);font-weight:700}
.overview-card__v{font-size:15px;font-weight:600}
.mention{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--panel-2);transition:.18s}
.mention + .mention{margin-top:10px}
.mention:hover{border-color:var(--border-strong)}
.mention__ico{width:32px;height:32px;flex:0 0 32px;border-radius:9px;display:grid;place-items:center;background:var(--panel-3);border:1px solid var(--border);color:var(--text-dim)}
.mention__ico svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mention__main{flex:1;min-width:0}
.mention__text{font-size:13.5px;margin-bottom:5px}
.mention__meta{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--text-mute);font-family:var(--mono)}
.bookmark-btn.is-saved{color:var(--yellow);border-color:rgba(245,196,81,.4);background:rgba(245,196,81,.08)}

/* graph */
.graph{position:relative;width:100%;height:520px;background:radial-gradient(700px 400px at 50% 50%, rgba(108,123,255,.06), transparent 70%);overflow:hidden;border-radius:0 0 var(--radius) var(--radius);touch-action:none;cursor:grab}
.graph:active{cursor:grabbing}
.graph__svg{width:100%;height:100%;display:block}
.graph__legend{position:absolute;left:16px;bottom:16px;display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text-dim);background:color-mix(in srgb,var(--panel) 80%,transparent);border:1px solid var(--border);border-radius:999px;padding:8px 14px;backdrop-filter:blur(10px)}
.graph__legend span{display:inline-flex;align-items:center;gap:6px}
.graph-tools{display:flex;gap:6px}
.graph-node circle{transition:.2s}
.graph-node text{font-family:var(--mono);font-size:11px;fill:var(--text);pointer-events:none;user-select:none}
.graph-node--target circle{filter:drop-shadow(0 0 12px rgba(108,123,255,.6))}
.graph-edge{stroke:rgba(140,145,175,.28);stroke-width:1.4;fill:none;transition:.2s}
.graph-edge:hover{stroke:var(--accent)}

/* footer */
.footer{margin-top:auto;padding:28px 0 0;border-top:1px solid var(--border);color:var(--text-mute);font-size:11.5px;letter-spacing:.06em;text-align:center}

/* animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateX(30px)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* responsive */
@media (max-width:1080px){
  :root{--sidebar-w:80px}
  .sidebar{padding:16px 10px;align-items:center}
  .sidebar__brand{justify-content:center;padding:6px 0 16px}
  .sidebar__brand .logo__text{display:none}
  .nav{width:100%;align-items:center}
  .nav__item{justify-content:center;padding:12px;width:100%}
  .nav__item span{display:none}
  .nav__item.is-active::before{left:-10px}
  .sidebar__bottom{width:100%}
  .sidebar__system{justify-content:center;padding:10px 6px}
  .sidebar__system b{display:none}
  .sidebar__bottom p{display:none}
  .grid-2{grid-template-columns:1fr}
}
@media (max-width:720px){
  :root{--topbar-h:56px}
  body{font-size:14.5px}
  .app{flex-direction:column}
  .sidebar{
    position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:64px;flex:0 0 64px;
    flex-direction:row;align-items:center;justify-content:space-around;padding:6px 8px;
    border-right:none;border-top:1px solid var(--border);
    background:color-mix(in srgb,var(--panel) 92%,transparent);
    backdrop-filter:blur(18px);z-index:90;
    padding-bottom:calc(6px + env(safe-area-inset-bottom));
  }
  .sidebar__brand,.sidebar__bottom{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around;gap:2px}
  .nav__item{flex-direction:column;gap:3px;padding:6px 4px;font-size:9.5px;width:auto;flex:1}
  .nav__item span{display:block;letter-spacing:.02em}
  .nav__item svg{width:20px;height:20px}
  .nav__item.is-active::before{display:none}
  .main{padding:0 16px calc(88px + env(safe-area-inset-bottom));gap:18px}
  .topbar{margin:0 -16px;padding:0 16px}
  .topbar__nav{gap:2px}
  .topbar__link{font-size:12px;padding:6px 9px}
  .hero{padding:32px 0 4px}
  .searchbar{flex-direction:column;align-items:stretch;padding:14px;gap:12px}
  .searchbar__icon{display:none}
  .searchbar__input{padding:4px 0;text-align:center}
  .searchbar__btn{width:100%;padding:14px}
  .typechips{width:100%}
  .chip{flex:1 1 calc(50% - 4px);text-align:center}
  .statgrid{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat__value{font-size:22px}
  .cardgrid{grid-template-columns:1fr}
  .panel__head{padding:14px 16px;flex-wrap:wrap}
  .panel__body{padding:16px}
  .tabs{overflow-x:auto;flex-wrap:nowrap}
  .tab{white-space:nowrap;padding:10px 13px;font-size:12.5px}
  .profile-head{padding:18px;gap:16px}
  .avatar--lg{width:64px;height:64px;border-radius:18px;font-size:22px}
  .profile-head__name{font-size:19px}
  .toast-container{left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom))}
  .toast{max-width:none;width:100%}
  .setting-row{flex-direction:column;align-items:flex-start;gap:12px}
  .platform-row{flex-wrap:wrap}
  .platform-row__side{width:100%;justify-content:space-between}
  .scan__box{padding:22px 18px}
  .table{min-width:640px}
  .table th,.table td{padding:12px 14px}
  .graph{height:400px}
}
@media (max-width:420px){
  .statgrid{grid-template-columns:1fr}
  .hero__title{letter-spacing:.08em}
  .typechips .chip{flex:1 1 100%}
}
.only-mobile{display:none}
@media (max-width:720px){.only-mobile{display:inline-flex}}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Навигация"></aside>
  <main class="main" id="main">
    <header class="topbar">
      <div class="topbar__left">
        <nav class="topbar__nav" id="topbarNav"></nav>
      </div>
      <div class="topbar__right">
        <button class="icon-btn" id="themeToggle" aria-label="Переключить тему" data-tooltip="LIGHT / DARK"></button>
        <span class="status"><i class="dot dot--green"></i>Online</span>
      </div>
    </header>
    <div id="view"></div>
  </main>
</div>

<div class="scan" id="scanOverlay" aria-hidden="true">
  <div class="scan__box">
    <div class="scan__title">SCANNING PUBLIC SOURCES…</div>
    <div class="scan__bar"><i id="scanBar"></i></div>
    <div class="scan__pct" id="scanPct">0%</div>
    <ul class="scan__steps" id="scanSteps"></ul>
  </div>
</div>

<div class="toast-container" id="toastContainer" aria-live="polite"></div>

<script>
/* =========================================================
   SHERLOCK OSINT — single-file build
   PUBLIC DATA ONLY. NO LEAKED DATABASES. NO PRIVATE DATA.
   ========================================================= */
(function(){
'use strict';

/* ---------------- ICONS ---------------- */
const S = (p) => '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
const ICONS = {
  dashboard: S('<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>'),
  search:    S('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>'),
  user:      S('<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/>'),
  share:     S('<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/>'),
  database:  S('<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>'),
  file:      S('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>'),
  settings:  S('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 15a1.6 1.6 0 0 0-1.5-1H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 7 4.6h.1A1.6 1.6 0 0 0 8.6 3V3a2 2 0 1 1 4 0v.1A1.6 1.6 0 0 0 15 4.6a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.6 1.6 0 0 0 19.4 9v.1a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>'),
  sun:       S('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  moon:      S('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'),
  bookmark:  S('<path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/>'),
  trash:     S('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>'),
  external:  S('<path d="M14 4h6v6"/><path d="M20 4l-8 8"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/>'),
  plus:      S('<path d="M12 5v14M5 12h14"/>'),
  minus:     S('<path d="M5 12h14"/>'),
  reset:     S('<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>'),
  target:    S('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/>'),
  alert:     S('<path d="M12 3l9.5 17H2.5z"/><path d="M12 9v5M12 17.5v.01"/>'),
  check:     S('<path d="M4 12.5l5 5L20 6.5"/>'),
  close:     S('<path d="M6 6l12 12M18 6L6 18"/>'),
  mention:   S('<path d="M21 11.5a8.5 8.5 0 1 1-3.3-6.7"/><circle cx="12" cy="12" r="4"/><path d="M16 8v5a2 2 0 0 0 4 0v-1.5"/>'),
  globe:     S('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/>'),
  code:      S('<path d="M8 8l-4 4 4 4M16 8l4 4-4 4"/>'),
  news:      S('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h6M7 12h10M7 16h10"/>')
};

/* ---------------- STORAGE ---------------- */
const PREFIX='sherlock_';
const LS={
  get(k,d){try{const v=localStorage.getItem(PREFIX+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(PREFIX+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(PREFIX+k)}catch(e){}}
};

/* ---------------- SETTINGS ---------------- */
const DEFAULTS={theme:'dark',lang:'ru',publicOnly:true,noHistory:false};
function getSettings(){return Object.assign({},DEFAULTS,LS.get('settings',{}))}
function setSettings(patch){const s=Object.assign(getSettings(),patch);LS.set('settings',s);applySettings(s);return s}
function applySettings(s){
  s=s||getSettings();
  document.documentElement.setAttribute('data-theme',s.theme);
  document.documentElement.setAttribute('lang',s.lang);
  paintThemeIcon(s.theme);
}

/* ---------------- I18N ---------------- */
const I18N={
  ru:{
    'nav.dashboard':'Dashboard','nav.search':'Search','nav.profiles':'Profiles',
    'nav.connections':'Connections','nav.sources':'Sources','nav.reports':'Reports','nav.settings':'Settings',
    'hero.subtitle':'Поиск информации из открытых источников','hero.search':'ИСКАТЬ',
    'hero.note':'Поиск выполняется только по публичным источникам.',
    'dash.title':'DASHBOARD','dash.sources':'TOTAL SOURCES','dash.profiles':'PUBLIC PROFILES',
    'dash.mentions':'MENTIONS','dash.connections':'POSSIBLE CONNECTIONS','dash.searches':'SEARCHES',
    'dash.recentSearches':'Recent searches','dash.clear':'Очистить',
    'dash.mentionsChart':'Public mentions over time','dash.recentSources':'Recent sources',
    'dash.footprint':'DIGITAL FOOTPRINT','dash.footprintNote':'Только количество публичных материалов',
    'empty.title':'No public results found','empty.text':'Try another search query.'
  },
  en:{
    'nav.dashboard':'Dashboard','nav.search':'Search','nav.profiles':'Profiles',
    'nav.connections':'Connections','nav.sources':'Sources','nav.reports':'Reports','nav.settings':'Settings',
    'hero.subtitle':'Search information from open sources','hero.search':'SEARCH',
    'hero.note':'Search is performed on public sources only.',
    'dash.title':'DASHBOARD','dash.sources':'TOTAL SOURCES','dash.profiles':'PUBLIC PROFILES',
    'dash.mentions':'MENTIONS','dash.connections':'POSSIBLE CONNECTIONS','dash.searches':'SEARCHES',
    'dash.recentSearches':'Recent searches','dash.clear':'Clear',
    'dash.mentionsChart':'Public mentions over time','dash.recentSources':'Recent sources',
    'dash.footprint':'DIGITAL FOOTPRINT','dash.footprintNote':'Count of public materials only',
    'empty.title':'No public results found','empty.text':'Try another search query.'
  }
};
function t(key){
  const lang=getSettings().lang||'ru';
  return (I18N[lang]&&I18N[lang][key])||I18N.ru[key]||key;
}

/* ---------------- HISTORY / BOOKMARKS ---------------- */
function getHistory(){return LS.get('history',[])}
function addHistory(entry){
  if(getSettings().noHistory) return;
  const list=getHistory();
  list.unshift(Object.assign({id:'h'+Date.now()+Math.random().toString(36).slice(2,6)},entry));
  LS.set('history',list.slice(0,30));
}
function clearHistory(){LS.set('history',[])}
function getBookmarks(){return LS.get('bookmarks',[])}
function isBookmarked(id){return getBookmarks().some(b=>b.id===id)}
function toggleBookmark(profile){
  let list=getBookmarks();
  if(list.some(b=>b.id===profile.id)){
    list=list.filter(b=>b.id!==profile.id);LS.set('bookmarks',list);return false;
  }
  list.unshift({id:profile.id,name:profile.name,username:profile.username,platforms:profile.platforms});
  LS.set('bookmarks',list);return true;
}

/* ---------------- FORBIDDEN ---------------- */
const FORBIDDEN_PATTERNS=[
  /паспорт/i,/passport/i,/снилс/i,/snils/i,
  /банковск/i,/bank\s*card/i,/cvv/i,/iban/i,/swift/i,
  /пароль/i,/password/i,/прописк/i,/домашний\s+адрес/i,
  /утечк/i,/leak/i,/\bdump\b/i,/база\s*данных/i,
  /закрыт[а-я]*\s+аккаунт/i,/деанон/i
];
function detectForbiddenQuery(q){return FORBIDDEN_PATTERNS.some(re=>re.test(String(q||'')))}

/* ---------------- HELPERS ---------------- */
function slugify(s){return String(s||'').toLowerCase().replace(/[^a-z0-9а-яё]+/gi,'_').replace(/^_+|_+$/g,'').slice(0,24)||'target'}
function hashCode(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}

function platformUrl(platform,uname){
  const map={Telegram:'https://t.me/',Instagram:'https://instagram.com/',VK:'https://vk.com/',
    GitHub:'https://github.com/',YouTube:'https://youtube.com/@',TikTok:'https://tiktok.com/@',
    X:'https://x.com/',Reddit:'https://reddit.com/u/',Discord:'https://discord.com/users/'};
  return (map[platform]||'https://example.com/')+uname;
}

/* =========================================================
   searchPublicSources — Future backend/API integration point.
   Замените тело на:
     return fetch(`/api/search?q=${encodeURIComponent(query)}&type=${type}`).then(r=>r.json());
   Формат ответа должен остаться тем же.
   ========================================================= */
function searchPublicSources(query,type){
  const q=String(query||'').trim();
  const ty=type||'name';

  if(detectForbiddenQuery(q)){
    return {blocked:true,query:q,type:ty,
      message:'Этот тип данных недоступен. SHERLOCK OSINT работает только с публичной информацией.'};
  }

  const emptyTriggers=/^(notfound|none|null|empty|nothing|нет|пусто)$/i;
  if(!q||q.length<2||emptyTriggers.test(q)){
    return {query:q,type:ty,timestamp:new Date().toISOString(),
      summary:{sources:0,profiles:0,mentions:0,connections:0},
      profiles:[],mentions:[],connections:[],sources:[],usernameResults:[],
      footprint:{social:0,web:0,posts:0,organizations:0,repositories:0,news:0,level:'LOW'}};
  }

  const seed=hashCode(q+ty)+q.length*7;
  const uname=ty==='username'?q.replace(/^@/,''):slugify(q);

  const count=3+(seed%3);
  const profiles=mockProfiles.slice(0,count).map((p,i)=>{
    const u=i===0?uname:(uname+'_'+slugify(p.username).slice(0,6));
    return Object.assign({},p,{
      username:u,
      name:i===0?(ty==='name'?q:p.name):p.name,
      platforms:p.platforms.map(pl=>Object.assign({},pl,{
        url:pl.url.replace(/example|sample|a_demo|alex_ex|democollective|examplenews|examplestudio/g,u),
        confidence:Math.max(20,Math.min(98,pl.confidence+((seed+i*13)%9)-4))
      }))
    });
  });

  const mentionCount=6+(seed%7);
  const mentions=mockMentions.slice(0,mentionCount).map(m=>Object.assign({},m,{text:m.text+' · «'+q+'»'}));

  const sourceCount=14+(seed%11);
  const sources=mockSources.slice(0,sourceCount).map((s,i)=>Object.assign({},s,{
    relevance:Math.max(15,Math.min(99,s.relevance+((seed+i*5)%11)-5)),
    url:s.url.replace(/example|sample|a_demo|alex_ex|democollective|examplenews|examplestudio/g,uname)
  }));

  const connCount=3+(seed%4);
  const connections=mockConnections.slice(0,connCount).map(c=>Object.assign({},c,{
    a:c.a==='Alex Example'?(ty==='name'?q:c.a):c.a
  }));

  const baseConf=[94,88,83,77,71,65,58,49,41];
  const usernameResults=MOCK_PLATFORMS.map((plat,i)=>{
    const conf=Math.max(12,Math.min(97,baseConf[i]+((seed+i*17)%9)-4));
    const found=conf>=45;
    return {platform:plat,username:'@'+uname,status:found?'FOUND':'NOT FOUND',
      url:found?platformUrl(plat,uname):'',confidence:conf};
  });

  const social=profiles.reduce((n,p)=>n+p.platforms.filter(x=>x.found).length,0);
  const footprint={
    social,
    web:sources.filter(s=>s.type==='Website'||s.type==='Blog').length,
    posts:mentions.filter(m=>/post|comment/i.test(m.type)).length,
    organizations:sources.filter(s=>s.type==='Organization').length,
    repositories:sources.filter(s=>s.type==='Repository').length,
    news:sources.filter(s=>s.type==='News').length
  };
  const total=Object.values(footprint).reduce((a,b)=>typeof b==='number'?a+b:a,0);
  footprint.level=total>18?'HIGH':total>9?'MEDIUM':'LOW';

  return {query:q,type:ty,timestamp:new Date().toISOString(),
    summary:{sources:sources.length,profiles:profiles.length,mentions:mentions.length,connections:connections.length},
    profiles,mentions,connections,sources,usernameResults,footprint};
}

function toast(message,type){
  const box=document.getElementById('toastContainer');
  if(!box)return;
  const el=document.createElement('div');
  el.className='toast toast--'+(type||'info');
  const icon=type==='success'?ICONS.check:type==='error'?ICONS.close:type==='warn'?ICONS.alert:ICONS.search;
  el.innerHTML=icon+'<span>'+message+'</span>';
  box.appendChild(el);
  setTimeout(()=>{el.classList.add('is-hiding');setTimeout(()=>el.remove(),240)},2800);
}

/* =========================================================
   SCAN OVERLAY
   ========================================================= */
function runScan(onDone){
  const overlay=document.getElementById('scanOverlay');
  const bar=document.getElementById('scanBar');
  const pct=document.getElementById('scanPct');
  const steps=document.getElementById('scanSteps');
  const stepNames=[
    'Проверка публичных профилей',
    'Поиск упоминаний',
    'Поиск username',
    'Проверка публичных сайтов',
    'Анализ открытых связей',
    'Формирование отчёта'
  ];
  const pcts=[0,20,40,60,80,100];
  steps.innerHTML=stepNames.map(n=>'<li><span class="tick">✓</span>'+n+'</li>').join('');
  bar.style.width='0%';pct.textContent='0%';
  overlay.classList.add('is-open');

  let i=0;
  function tick(){
    if(i>=stepNames.length){
      setTimeout(()=>{overlay.classList.remove('is-open');onDone&&onDone()},260);
      return;
    }
    steps.children[i].classList.add('is-active');
    setTimeout(()=>{
      steps.children[i].classList.remove('is-active');
      steps.children[i].classList.add('is-done');
      bar.style.width=pcts[i+1]+'%';
      pct.textContent=pcts[i+1]+'%';
      i++;
      setTimeout(tick,220);
    },340);
  }
  tick();
}

/* =========================================================

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initial(name){return (String(name||'?').trim()[0]||'?').toUpperCase()}
function badgeFor(conf){
  const map={high:'badge--high',medium:'badge--med',low:'badge--low'};
  return '<span class="badge '+(map[conf]||'badge--muted')+'">'+esc(conf.toUpperCase())+'</span>';
}
function confBadge(n){
  if(n>=80)return '<span class="badge badge--high">HIGH</span>';
  if(n>=55)return '<span class="badge badge--med">MEDIUM</span>';
  return '<span class="badge badge--low">LOW</span>';
}
function fmtDate(iso){
  try{const d=new Date(iso);return d.toLocaleDateString('ru-RU',{year:'numeric',month:'short',day:'2-digit'})}catch(e){return iso}
}

function chartSVG(){
  const data=[2,4,3,6,5,8,7,10,9,12,11,12];
  const w=560,h=180,pad=24;
  const max=Math.max.apply(null,data)*1.1;
  const step=(w-pad*2)/(data.length-1);
  const pts=data.map((v,i)=>[pad+i*step,h-pad-(v/max)*(h-pad*2)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+' L'+pts[pts.length-1][0].toFixed(1)+' '+(h-pad)+' L'+pts[0][0].toFixed(1)+' '+(h-pad)+' Z';
  const gridY=[0.25,0.5,0.75].map(r=>'<line class="chart__grid" x1="'+pad+'" x2="'+(w-pad)+'" y1="'+(pad+r*(h-pad*2))+'" y2="'+(pad+r*(h-pad*2))+'"/>').join('');
  const dots=pts.map(p=>'<circle class="chart__dot" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3"/>').join('');
  const months=['J','F','M','A','M','J','J','A','S','O','N','D'];
  const labels=pts.map((p,i)=>i%2===0?'<text class="chart__label" x="'+p[0].toFixed(1)+'" y="'+(h-6)+'" text-anchor="middle">'+months[i]+'</text>':'').join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
    '<defs><linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="rgba(108,123,255,.35)"/><stop offset="100%" stop-color="rgba(108,123,255,0)"/>'+
    '</linearGradient></defs>'+gridY+'<path class="chart__area" d="'+area+'"/>'+
    '<path class="chart__line" d="'+line+'"/>'+dots+labels+'</svg>';
}

function viewSearch(params){
  const q=params.q||'';
  const ty=params.type||'name';

  if(!q){
    return '<section class="panel panel--search">'+searchBarCompact(q,ty)+
      '<div style="padding:40px 10px;text-align:center;color:var(--text-mute)">Введите запрос, чтобы начать.</div></section>';
  }

  const res=searchPublicSources(q,ty);
  state.lastResult=res;

  if(res.blocked){
    return '<section class="panel panel--search">'+searchBarCompact(q,ty)+'</section>'+
      '<section class="panel"><div class="panel__body"><div class="notice notice--error">'+esc(res.message)+'</div></div></section>';
  }

  if(!res.summary.sources && !res.summary.profiles){
    return '<section class="panel panel--search">'+searchBarCompact(q,ty)+'</section>'+
      emptyBlock(t('empty.title'),t('empty.text'));
  }

  return '<section class="panel panel--search">'+searchBarCompact(q,ty)+'</section>'+
    '<section class="section"><div class="section__head"><h2 class="section__title">SEARCH RESULTS</h2>'+
    '<span class="badge badge--muted">Demo result — public-source simulation</span></div>'+
    '<div class="panel"><div class="panel__body">'+
      '<div class="kv" style="margin-bottom:8px"><span class="kv__k">Запрос</span><span class="kv__v" style="font-family:var(--mono)">'+esc(res.query)+'</span></div>'+
      '<div class="statgrid" style="margin-top:10px">'+
        statMini('Found',res.summary.sources+' public sources')+
        statMini('Profiles',res.summary.profiles+' profiles')+
        statMini('Mentions',res.summary.mentions+' mentions')+
        statMini('Connections',res.summary.connections+' possible connections')+
      '</div>'+
    '</div></div></section>'+
    '<div class="tabs" id="resultTabs">'+
      tabBtn('profiles','Profiles',true)+
      tabBtn('username','Username search')+
      tabBtn('mentions','Mentions')+
      tabBtn('connections','Connections')+
      tabBtn('sources','Sources')+
      tabBtn('report','Report')+
    '</div>'+
    '<section class="tabpanels">'+
      panelProfiles(res,true)+
      panelUsername(res,false)+
      panelMentions(res,false)+
      panelConnections(res,false)+
      panelSources(res,false)+
      panelReport(res,false)+
    '</section>';
}

let graphState={scale:1,tx:0,ty:0};
function initGraph(){
  const svg=document.getElementById('graphSvg');
  if(!svg)return;
  const wrap=document.getElementById('graphWrap');
  const nodes=[
    {id:'target',label:'TARGET',type:'target'},
    {id:'instagram',label:'Instagram',type:'platform'},
    {id:'github',label:'GitHub',type:'platform'},
    {id:'website',label:'Website',type:'platform'},
    {id:'mention',label:'Public mention',type:'mention'},
    {id:'org',label:'Organization',type:'mention'},
    {id:'username',label:'Username',type:'platform'}
  ];
  const edges=[
    {a:'target',b:'instagram'},{a:'target',b:'github'},{a:'target',b:'website'},
    {a:'target',b:'mention'},{a:'target',b:'org'},{a:'target',b:'username'}
  ];

  const W=wrap.clientWidth||800, H=wrap.clientHeight||520;
  const cx=W/2, cy=H/2;
  const R=Math.min(W,H)*0.32;

  nodes[0].x=cx; nodes[0].y=cy;
  for(let i=1;i<nodes.length;i++){
    const a=(i-1)/(nodes.length-1)*Math.PI*2 - Math.PI/2;
    nodes[i].x=cx+Math.cos(a)*R;
    nodes[i].y=cy+Math.sin(a)*R;
  }
  const nMap={};nodes.forEach(n=>nMap[n.id]=n);

  function draw(){
    const g=graphState;
    const colorFor=t=>t==='target'?'var(--accent)':t==='platform'?'var(--green)':'var(--yellow)';

    let s='<g transform="translate('+g.tx+','+g.ty+') scale('+g.scale+')">';
    edges.forEach(e=>{
      const a=nMap[e.a],b=nMap[e.b];
      s+='<line class="graph-edge" x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'"/>';
    });
    nodes.forEach(n=>{
      const r=n.type==='target'?26:18;
      const col=colorFor(n.type);
      s+='<g class="graph-node '+(n.type==='target'?'graph-node--target':'')+'">'+
         '<circle cx="'+n.x+'" cy="'+n.y+'" r="'+r+'" fill="'+col+'" opacity="'+(n.type==='target'?'.9':'.85')+'"/>'+
         '<text x="'+n.x+'" y="'+(n.y+r+16)+'" text-anchor="middle">'+esc(n.label)+'</text>'+
         '</g>';
    });
    s+='</g>';
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.innerHTML=s;
  }
  function reset(){graphState={scale:1,tx:0,ty:0};draw()}
  function center(){reset()}

  draw();

  // controls
  document.getElementById('zoomIn').onclick=()=>{graphState.scale=Math.min(3,graphState.scale*1.2);draw()};
  document.getElementById('zoomOut').onclick=()=>{graphState.scale=Math.max(0.4,graphState.scale/1.2);draw()};
  document.getElementById('zoomReset').onclick=reset;
  document.getElementById('zoomCenter').onclick=center;

  // pan
  let dragging=false,lastX=0,lastY=0;
  wrap.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;wrap.setPointerCapture(e.pointerId)});
  wrap.addEventListener('pointermove',e=>{
    if(!dragging)return;
    graphState.tx+=e.clientX-lastX;
    graphState.ty+=e.clientY-lastY;
    lastX=e.clientX;lastY=e.clientY;draw();
  });
  wrap.addEventListener('pointerup',()=>dragging=false);
  wrap.addEventListener('pointercancel',()=>dragging=false);

  // zoom wheel
  wrap.addEventListener('wheel',e=>{
    e.preventDefault();
    const d=e.deltaY<0?1.1:0.9;
    graphState.scale=Math.max(0.4,Math.min(3,graphState.scale*d));
    draw();
  },{passive:false});

  // touch pinch
  let pinchDist=0;
  wrap.addEventListener('touchstart',e=>{
    if(e.touches.length===2){
      pinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    }
  });
  wrap.addEventListener('touchmove',e=>{
    if(e.touches.length===2&&pinchDist){
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      graphState.scale=Math.max(0.4,Math.min(3,graphState.scale*(d/pinchDist)));
      pinchDist=d;draw();
    }
  },{passive:true});
  wrap.addEventListener('touchend',()=>pinchDist=0);
}

/* =========================================================
   ROUTER
   ========================================================= */
function parseHash(){
  const raw=location.hash.replace(/^#\/?/,'');
  const [path,qs]=raw.split('?');
  const parts=path.split('/').filter(Boolean);
  const params={};
  if(qs)qs.split('&').forEach(p=>{
    const [k,v]=p.split('=');
    params[decodeURIComponent(k)]=decodeURIComponent(v||'');
  });
  return {view:parts[0]||'dashboard',args:parts.slice(1),params};
}

function render(){
  const {view,args,params}=parseHash();
  const el=document.getElementById('view');
  if(!el)return;

  let html='';
  let activeNav='dashboard';

  switch(view){
    case 'search':   html=viewSearch(params); activeNav='search'; break;
    case 'profile':  html=viewProfile(args[0]||'p1'); activeNav='profile'; break;
    case 'graph':    html=viewGraph(); activeNav='graph'; break;
    case 'sources':  html=viewSources(); activeNav='sources'; break;
    case 'settings': html=viewSettings(); activeNav='settings'; break;
    default:         html=viewDashboard(); activeNav='dashboard';
  }

  el.innerHTML=html;
  renderSidebar(activeNav);
  renderTopbar();

  // topbar active
  document.querySelectorAll('.topbar__link').forEach(a=>{
    const h=a.getAttribute('href')||'';
    a.classList.toggle('is-active', h.includes(view));
  });

  // view-specific init
  if(view==='graph') initGraph();
  if(view==='sources') renderSourcesList('newest');

  bindCommon();
}

function bindCommon(){
  // tabs
  document.querySelectorAll('.tabs').forEach(tabs=>{
    tabs.querySelectorAll('.tab').forEach(tab=>{
      tab.onclick=()=>{
        tabs.querySelectorAll('.tab').forEach(x=>x.classList.remove('is-active'));
        tab.classList.add('is-active');
        const panels=tabs.parentElement.querySelector('.tabpanels');
        if(panels){
          panels.querySelectorAll('.tabpanel').forEach(p=>p.classList.remove('is-active'));
          const target=panels.querySelector('[data-panel="'+tab.dataset.tab+'"]');
          if(target)target.classList.add('is-active');
        }
      };
    });
  });

  // chips (type switch)
  const chips=document.getElementById('typeChips');
  if(chips){
    chips.querySelectorAll('.chip').forEach(c=>{
      c.onclick=()=>{
        chips.querySelectorAll('.chip').forEach(x=>x.classList.remove('is-active'));
        c.classList.add('is-active');
        const inp=document.getElementById('searchInput');
        if(!inp)return;
        const ph={name:'Введите имя и фамилию',username:'Введите username без @',
          phone:'Введите номер телефона',email:'Введите e-mail'}[c.dataset.type];
        inp.placeholder=ph;
        inp.focus();
      };
    });
  }

  // search form
  const form=document.getElementById('searchForm');
  if(form){
    form.onsubmit=e=>{
      e.preventDefault();
      const inp=document.getElementById('searchInput');
      const q=(inp&&inp.value||'').trim();
      if(!q)return;
      const activeChip=document.querySelector('#typeChips .chip.is-active');
      const ty=activeChip?activeChip.dataset.type:'name';

      if(detectForbiddenQuery(q)){
        toast('Этот тип данных недоступен', 'error');
        location.hash='#/search?q='+encodeURIComponent(q)+'&type='+ty;
        return;
      }
      runScan(()=>{
        addHistory({query:q,type:ty,date:new Date().toISOString(),results:'—'});
        location.hash='#/search?q='+encodeURIComponent(q)+'&type='+ty;
        toast('Search complete', 'success');
      });
      toast('Search started', 'info');
    };
  }

  // history buttons on dashboard
  document.querySelectorAll('[data-open-history]').forEach(b=>{
    b.onclick=()=>{
      const q=b.dataset.openHistory;
      location.hash='#/search?q='+encodeURIComponent(q)+'&type=name';
    };
  });
  document.querySelectorAll('[data-del-history]').forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.delHistory;
      const list=getHistory().filter(h=>h.id!==id);
      LS.set('history',list);
      toast('Запись удалена','success');
      render();
    };
  });

  // clear history
  document.querySelectorAll('#clearHistoryBtn').forEach(b=>{
    b.onclick=()=>{
      clearHistory();
      toast('История очищена','success');
      render();
    };
  });

  // bookmarks
  document.querySelectorAll('[data-bookmark]').forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.bookmark;
      const p=mockProfiles.find(x=>x.id===id);
      if(!p)return;
      const saved=toggleBookmark(p);
      b.classList.toggle('is-saved',saved);
      b.innerHTML=ICONS.bookmark+' '+(saved?'Saved':'Save');
      toast(saved?'Profile saved':'Removed from saved','success');
    };
  });

  // report export
  const genBtn=document.getElementById('genReportBtn');
  if(genBtn)genBtn.onclick=()=>{
    toast('Report generated','success');
    window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  };
  const txtBtn=document.getElementById('exportTxtBtn');
  if(txtBtn)txtBtn.onclick=()=>exportReport('txt');
  const jsonBtn=document.getElementById('exportJsonBtn');
  if(jsonBtn)jsonBtn.onclick=()=>exportReport('json');

  // settings handlers
  const themeSeg=document.getElementById('themeSeg');
  if(themeSeg)themeSeg.onclick=e=>{
    const b=e.target.closest('[data-theme-value]');if(!b)return;
    setSettings({theme:b.dataset.themeValue});
    render();
    toast('Theme updated','success');
  };
  const langSeg=document.getElementById('langSeg');
  if(langSeg)langSeg.onclick=e=>{
    const b=e.target.closest('[data-lang]');if(!b)return;
    setSettings({lang:b.dataset.lang});
    render();
    toast('Language updated','success');
  };
  const po=document.getElementById('optPublicOnly');
  if(po)po.onchange=e=>{
    setSettings({publicOnly:e.target.checked});
    toast(e.target.checked?'Public sources only: ON':'Public sources only: OFF','info');
  };
  const nh=document.getElementById('optNoHistory');
  if(nh)nh.onchange=e=>{
    setSettings({noHistory:e.target.checked});
    if(e.target.checked)clearHistory();
    toast(e.target.checked?'История не сохраняется':'История сохраняется','info');
  };
  const cb=document.getElementById('clearBookmarks');
  if(cb)cb.onclick=()=>{LS.set('bookmarks',[]);toast('Закладки очищены','success')};

  // sort sources
  const sortSel=document.getElementById('sortSelect');
  if(sortSel)sortSel.onchange=e=>renderSourcesList(e.target.value);
}

/* ---------------- REPORT EXPORT ---------------- */
function exportReport(fmt){
  const res=state.lastResult||searchPublicSources('demo','name');
  let blob,ext;
  if(fmt==='json'){
    blob=new Blob([JSON.stringify(res,null,2)],{type:'application/json'});
    ext='json';
  }else{
    const lines=[];
    lines.push('SHERLOCK OSINT REPORT');
    lines.push('=====================');
    lines.push('Search query: '+res.query);
    lines.push('Generated: '+new Date().toLocaleString('ru-RU'));
    lines.push('');
    lines.push('SUMMARY');
    lines.push('  Public sources: '+res.summary.sources);
    lines.push('  Public profiles: '+res.summary.profiles);
    lines.push('  Public mentions: '+res.summary.mentions);
    lines.push('  Possible connections: '+res.summary.connections);
    lines.push('  Public footprint: '+(res.footprint&&res.footprint.level||'—'));
    lines.push('');
    lines.push('PUBLIC PROFILES');
    res.profiles.forEach(p=>lines.push('  - '+p.name+' (@'+p.username+')'));
    lines.push('');
    lines.push('SOURCES');
    res.sources.forEach(s=>lines.push('  - '+s.source+' — '+s.url));
    lines.push('');
    lines.push('This report contains information collected from publicly available sources. Results may be incomplete or inaccurate.');
    blob=new Blob([lines.join('\n')],{type:'text/plain'});
    ext='txt';
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='sherlock-report-'+Date.now()+'.'+ext;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),500);
  toast('Report exported ('+ext.toUpperCase()+')','success');
}
