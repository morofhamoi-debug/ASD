<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>THE ROOM</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: "Georgia", "Times New Roman", serif;
    color: #8d857a;
    cursor: default;
  }
  #c { display: block; width: 100%; height: 100%; }

  #overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #000;
    transition: opacity 1.6s ease;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    box-sizing: border-box;
    pointer-events: auto;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }

  #overlay h1 {
    margin: 0 0 10px 0;
    font-size: 15px; font-weight: 400;
    letter-spacing: 0.62em; text-transform: uppercase;
    color: #6b6459;
    text-indent: 0.62em;
  }
  #overlay .sub {
    margin: 0; font-size: 10px; letter-spacing: 0.36em;
    color: #3d3933; text-transform: uppercase;
  }
  #enter {
    margin-top: 52px;
    font-size: 10px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #8b8278;
    border: 1px solid #262220;
    padding: 15px 34px;
    background: transparent;
    font-family: inherit;
    cursor: pointer;
    transition: color .8s ease, border-color .8s ease, background .8s ease, transform .12s ease, opacity .12s ease;
    text-indent: 0.42em;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    pointer-events: auto;
    position: relative;
    z-index: 21;
  }
  #enter:hover { color: #cbc2b6; border-color: #494137; background: rgba(255,255,255,0.015); }
  #enter:active { transform: scale(0.97); color: #cbc2b6; border-color: #494137; }

  /* Bigger, finger-friendly button on phones */
  body.mobile #enter {
    font-size: 12px;
    letter-spacing: 0.40em;
    padding: 18px 44px;
    min-width: 208px;
    color: #a89e92;
    border-color: #3a332c;
    margin-top: 46px;
  }
  body.mobile #enter:active {
    transform: scale(0.96);
    opacity: 0.82;
    color: #d4cab8;
    border-color: #6b5e4c;
  }

  #enter-hint {
    margin: 22px 0 0 0;
    font-size: 9px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: #37332d;
    text-align: center;
    line-height: 2.1;
    text-indent: 0.26em;
    max-width: 82vw;
  }

  #prompt {
    position: fixed; left: 50%; bottom: 13%;
    transform: translateX(-50%);
    font-size: 10px; letter-spacing: 0.36em; text-transform: uppercase;
    color: #b3aa9e; opacity: 0; transition: opacity .35s ease;
    text-shadow: 0 0 16px #000, 0 0 3px #000;
    pointer-events: none; z-index: 6;
    white-space: nowrap;
  }
  #prompt.on { opacity: 0.85; }

  #caption {
    position: fixed; left: 50%; bottom: 21%;
    transform: translateX(-50%);
    font-size: 12.5px; font-style: italic; letter-spacing: 0.09em;
    color: #9a9186; opacity: 0; transition: opacity 1.4s ease;
    text-shadow: 0 0 18px #000, 0 0 4px #000;
    pointer-events: none; z-index: 6;
    text-align: center; max-width: 60vw; line-height: 1.6;
  }
  #caption.on { opacity: 0.9; }

  /* ============================================================
     MOBILE UI
     ============================================================ */

  #mobile-ui { display: none; }
  body.mobile.started #mobile-ui { display: block; }

  body.mobile {
    touch-action: none;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
    -webkit-user-select: none;
  }
  body.mobile #c { touch-action: none; }
  body.mobile * {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  body.mobile #prompt { display: none !important; }
  body.mobile #caption {
    bottom: 30%;
    max-width: 78vw;
    font-size: 13px;
  }

  #mobile-ui {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 8;
  }

  #joystick-base {
    position: fixed;
    left: calc(20px + env(safe-area-inset-left, 0px));
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    width: 132px; height: 132px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%,
        rgba(24,20,16,0.35) 0%,
        rgba(12,10,8,0.22) 60%,
        rgba(8,7,6,0.10) 100%);
    border: 1px solid rgba(180,168,144,0.14);
    box-shadow:
      inset 0 0 28px rgba(0,0,0,0.55),
      0 4px 22px rgba(0,0,0,0.55);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    touch-action: none;
    pointer-events: auto;
    z-index: 9;
  }
  #joystick-base::after {
    content: '';
    position: absolute;
    inset: 22%;
    border-radius: 50%;
    border: 1px solid rgba(180,168,144,0.06);
    pointer-events: none;
  }

  #joystick-knob {
    position: absolute;
    left: 50%; top: 50%;
    width: 58px; height: 58px;
    margin: -29px 0 0 -29px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 38% 32%,
        rgba(150,138,118,0.42),
        rgba(56,50,40,0.55) 55%,
        rgba(28,24,20,0.70) 100%);
    border: 1px solid rgba(200,186,160,0.20);
    box-shadow:
      0 4px 14px rgba(0,0,0,0.60),
      inset 0 1px 1px rgba(255,255,255,0.06);
    pointer-events: none;
    will-change: transform;
  }

  .mbtn {
    position: fixed;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 40% 30%,
        rgba(46,40,32,0.55),
        rgba(14,12,10,0.72));
    border: 1px solid rgba(180,168,144,0.16);
    color: rgba(184,172,150,0.72);
    border-radius: 50%;
    box-shadow:
      0 4px 16px rgba(0,0,0,0.55),
      inset 0 1px 1px rgba(255,255,255,0.05);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    touch-action: none;
    pointer-events: auto;
    user-select: none;
    -webkit-user-select: none;
    font-family: "Georgia", "Times New Roman", serif;
    cursor: pointer;
    z-index: 9;
    padding: 0;
    transition: opacity .25s ease, transform .08s ease, background .12s ease, border-color .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .mbtn:active, .mbtn.on { transform: scale(0.94); }

  #interact-btn {
    right: calc(24px + env(safe-area-inset-right, 0px));
    top: 50%;
    transform: translateY(-50%);
    width: 82px; height: 82px;
    font-size: 26px;
    letter-spacing: 0.02em;
    color: rgba(200,186,160,0.85);
    border-color: rgba(200,186,160,0.22);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease, transform .08s ease, background .12s ease;
  }
  #interact-btn.on {
    opacity: 0.92;
    pointer-events: auto;
  }
  #interact-btn:active { transform: translateY(-50%) scale(0.94); }

  #sprint-btn {
    right: calc(30px + env(safe-area-inset-right, 0px));
    bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    width: 62px; height: 62px;
    opacity: 0.6;
  }
  #sprint-btn.on {
    opacity: 0.95;
    background:
      radial-gradient(circle at 40% 30%,
        rgba(96,82,58,0.70),
        rgba(30,25,18,0.85));
    border-color: rgba(220,198,168,0.32);
  }

  #fs-btn {
    top: calc(14px + env(safe-area-inset-top, 0px));
    right: calc(14px + env(safe-area-inset-right, 0px));
    width: 42px; height: 42px;
    opacity: 0.42;
    color: rgba(180,168,144,0.85);
  }
  #fs-btn:active { opacity: 0.85; }

  #rotate-overlay { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="prompt">[E] interact</div>
<div id="caption"></div>

<div id="overlay">
  <h1>The Room</h1>
  <p class="sub">somewhere in the house</p>
  <button id="enter" type="button">Click to Enter</button>
  <p id="enter-hint"></p>
</div>

<!-- ============================================================
     MOBILE UI (hidden on desktop)
     ============================================================ -->
<div id="mobile-ui">
  <div id="joystick-base">
    <div id="joystick-knob"></div>
  </div>

  <div id="interact-btn" class="mbtn" aria-label="Interact">
    <span>E</span>
  </div>

  <div id="sprint-btn" class="mbtn" aria-label="Sprint">
    <svg viewBox="0 0 24 24" width="24" height="24"
         fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 3 L5 13 h5 l-1 8 L18 10 h-5 l1 -7 z"/>
    </svg>
  </div>

  <button id="fs-btn" class="mbtn" aria-label="Fullscreen">
    <svg viewBox="0 0 24 24" width="16" height="16"
         fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
    </svg>
  </button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }

<script type="module">
import * as THREE from 'three';

/* ============================================================================
   MOBILE DETECTION (defined first so it can influence setup below)
   ========================================================================= */

const IS_TOUCH = (navigator.maxTouchPoints > 0) || ('ontouchstart' in window);
const COARSE = window.matchMedia ? window.matchMedia("(pointer: coarse)").matches : false;
const IS_MOBILE = IS_TOUCH && (
  /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
  || COARSE
);

if (IS_MOBILE) {
  document.body.classList.add('mobile');
  document.documentElement.style.webkitTextSizeAdjust = '100%';
  document.documentElement.style.webkitTapHighlightColor = 'transparent';
}

/* ============================================================================
   EARLY STARTUP WIRING — RUNS FIRST, BEFORE ANY HEAVY SETUP.

   This is critical for iOS Safari: if any later code throws (e.g. the mirror
   builder), we still need the button to start the game. So the button is wired
   here, using pointerdown + touchend + click with a single-fire guard.
   ========================================================================= */

const overlayEl = document.getElementById('overlay');
const enterBtnEl = document.getElementById('enter');
const enterHintEl = document.getElementById('enter-hint');

let gameStarted = false;          // single-fire guard — the ONLY source of truth
let onGameStart = null;           // set later once all systems are ready

function beginGame() {
  if (gameStarted) return;
  gameStarted = true;

  // Enable mobile UI immediately (so joystick etc. become visible)
  document.body.classList.add('started');

  // Fade out the overlay
  if (overlayEl) {
    overlayEl.classList.add('hidden');
    setTimeout(() => {
      try { overlayEl.style.display = 'none'; } catch (e) {}
    }, 1800);
  }

  // Fire the heavy setup (defined later in the script). If it throws,
  // the game is still considered "started" and the loop keeps running.
  if (typeof onGameStart === 'function') {
    try { onGameStart(); } catch (e) { console.error('start setup error:', e); }
  }
}

// Wording: phone → "Start", desktop → "Click to Enter"
if (IS_MOBILE) {
  if (enterBtnEl) enterBtnEl.textContent = 'Start';
  if (enterHintEl) enterHintEl.textContent = 'tap to enter · stick to move · drag to look';
} else {
  if (enterBtnEl) enterBtnEl.textContent = 'Click to Enter';
  if (enterHintEl) enterHintEl.textContent = '';
}

// Robust tap/click handling. pointerdown fires first and immediately on
// modern Safari/Chrome; touchend covers any browser without Pointer Events;
// click is a final fallback. The guard inside beginGame prevents double-fire.
if (enterBtnEl) {
  let lastFire = 0;
  const fire = (e) => {
    if (e && typeof e.preventDefault === 'function') {
      try { e.preventDefault(); } catch (_) {}
    }
    if (e && typeof e.stopPropagation === 'function') {
      try { e.stopPropagation(); } catch (_) {}
    }
    const now = Date.now();
    if (now - lastFire < 350) return;
    lastFire = now;
    beginGame();
  };

  enterBtnEl.addEventListener('pointerdown', fire, { passive: false });
  enterBtnEl.addEventListener('touchend', fire, { passive: false });
  enterBtnEl.addEventListener('click', fire, false);
}

/* ============================================================================
   0. MATH / RANDOM / NOISE UTILITIES
   ========================================================================= */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;

function makeValueNoise(seed) {
  const rnd = mulberry32(seed);
  const S = 128;
  const g = new Float32Array(S * S);
  for (let i = 0; i < S * S; i++) g[i] = rnd();
  const at = (x, y) => {
    x = ((x % S) + S) % S; y = ((y % S) + S) % S;
    return g[y * S + x];
  };
  const sm = t => t * t * (3 - 2 * t);
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const fx = sm(x - xi), fy = sm(y - yi);
    const a = at(xi, yi), b = at(xi + 1, yi), c = at(xi, yi + 1), d = at(xi + 1, yi + 1);
    return (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy;
  };
}

function makeFbm(seed, oct) {
  oct = oct || 4;
  const n = makeValueNoise(seed);
  return function (x, y) {
    let a = 0.5, f = 1, s = 0, tot = 0;
    for (let i = 0; i < oct; i++) {
      s += a * n(x * f, y * f);
      tot += a; a *= 0.5; f *= 2;
    }
    return s / tot;
  };
}

function newCanvas(w, h) {
  const cv = document.createElement('canvas');
  cv.width = Math.max(2, Math.round(w));
  cv.height = Math.max(2, Math.round(h));
  return cv;
}

/* --- generate a tangent-space normal map from a canvas' luminance --- */
function normalFromCanvas(src, strength) {
  const w = src.width, h = src.height;
  const sctx = src.getContext('2d', { willReadFrequently: true });
  const img = sctx.getImageData(0, 0, w, h).data;
  const lum = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    lum[i] = (img[i * 4] * 0.299 + img[i * 4 + 1] * 0.587 + img[i * 4 + 2] * 0.114) / 255;
  }
  const out = newCanvas(w, h);
  const octx = out.getContext('2d');
  const oimg = octx.createImageData(w, h);
  const d = oimg.data;
  for (let y = 0; y < h; y++) {
    const yp = ((y - 1 + h) % h) * w, yn = ((y + 1) % h) * w, yc = y * w;
    for (let x = 0; x < w; x++) {
      const xp = (x - 1 + w) % w, xn = (x + 1) % w;
      const l = lum[yc + xp], r = lum[yc + xn];
      const u = lum[yp + x], dn = lum[yn + x];
      let nx = (l - r) * strength, ny = (u - dn) * strength, nz = 1.0;
      const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
      nx /= len; ny /= len; nz /= len;
      const i4 = (yc + x) * 4;
      d[i4] = (nx * 0.5 + 0.5) * 255;
      d[i4 + 1] = (ny * 0.5 + 0.5) * 255;
      d[i4 + 2] = (nz * 0.5 + 0.5) * 255;
      d[i4 + 3] = 255;
    }
  }
  octx.putImageData(oimg, 0, 0);
  return out;
}

function texFromCanvas(cv, repeatX, repeatY, srgb) {
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX || 1, repeatY || 1);
  t.anisotropy = IS_MOBILE ? 2 : 8;
  if (srgb !== false) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ============================================================================
   1. PROCEDURAL TEXTURE FACTORY
   ========================================================================= */

function overlayNoise(ctx, W, H, seed, res, scale, alpha, mode) {
  const cv = newCanvas(res, res);
  const c2 = cv.getContext('2d');
  const img = c2.createImageData(res, res);
  const f = makeFbm(seed, 5);
  for (let y = 0; y < res; y++) {
    for (let x = 0; x < res; x++) {
      const v = f(x / scale, y / scale);
      const i = (y * res + x) * 4;
      const t = Math.floor(clamp(v, 0, 1) * 255);
      img.data[i] = t; img.data[i + 1] = t; img.data[i + 2] = t; img.data[i + 3] = 255;
    }
  }
  c2.putImageData(img, 0, 0);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.globalCompositeOperation = mode || 'overlay';
  ctx.drawImage(cv, 0, 0, W, H);
  ctx.restore();
}

function fineGrain(ctx, W, H, seed, alpha) {
  const res = 256;
  const cv = newCanvas(res, res);
  const c2 = cv.getContext('2d');
  const img = c2.createImageData(res, res);
  const rnd = mulberry32(seed);
  for (let i = 0; i < res * res; i++) {
    const v = Math.floor(rnd() * 255);
    img.data[i * 4] = v; img.data[i * 4 + 1] = v; img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255;
  }
  c2.putImageData(img, 0, 0);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(cv, 0, 0, W, H);
  ctx.restore();
}

function blobPath(ctx, cx, cy, r, pts, rnd, wob) {
  wob = wob || 0.42;
  ctx.beginPath();
  for (let i = 0; i <= pts; i++) {
    const a = (i / pts) * Math.PI * 2;
    const rr = r * (1 - wob * 0.5 + rnd() * wob);
    const x = cx + Math.cos(a) * rr;
    const y = cy + Math.sin(a) * rr * 0.82;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function drawCrack(ctx, x, y, len, rnd, W, H) {
  let ang = rnd() * Math.PI * 2;
  let cx = x, cy = y;
  const steps = 10 + Math.floor(rnd() * 18);
  const seg = len / steps;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(18,15,12,0.55)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  const path = [[cx, cy]];
  for (let i = 0; i < steps; i++) {
    ang += (rnd() - 0.5) * 0.85;
    cx += Math.cos(ang) * seg;
    cy += Math.sin(ang) * seg;
    path.push([cx, cy]);
    ctx.lineTo(cx, cy);
  }
  ctx.stroke();

  ctx.strokeStyle = 'rgba(190,182,166,0.12)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < path.length; i++) {
    const p = path[i];
    if (i === 0) ctx.moveTo(p[0] + 1.2, p[1] + 1.2);
    else ctx.lineTo(p[0] + 1.2, p[1] + 1.2);
  }
  ctx.stroke();

  const branches = Math.floor(rnd() * 3);
  for (let b = 0; b < branches; b++) {
    const idx = 2 + Math.floor(rnd() * (path.length - 3));
    const p = path[idx];
    let a2 = ang + (rnd() - 0.5) * 2.0;
    let bx = p[0], by = p[1];
    ctx.strokeStyle = 'rgba(18,15,12,0.36)';
    ctx.lineWidth = 1.0;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    const bs = 3 + Math.floor(rnd() * 8);
    for (let i = 0; i < bs; i++) {
      a2 += (rnd() - 0.5) * 0.9;
      bx += Math.cos(a2) * seg * 0.8;
      by += Math.sin(a2) * seg * 0.8;
      ctx.lineTo(bx, by);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function makeWallTexture(W, H, seed) {
  const cv = newCanvas(W, H);
  const ctx = cv.getContext('2d');
  const rnd = mulberry32(seed);

  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.00, '#7d7768');
  g.addColorStop(0.30, '#847d6d');
  g.addColorStop(0.62, '#797264');
  g.addColorStop(0.86, '#6b6455');
  g.addColorStop(1.00, '#514c42');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  overlayNoise(ctx, W, H, seed + 3, 128, 20, 0.34, 'overlay');
  overlayNoise(ctx, W, H, seed + 9, 128, 52, 0.22, 'soft-light');

  ctx.save();
  for (let i = 0; i < 58; i++) {
    const x = rnd() * W;
    const w = 3 + rnd() * 48;
    const y0 = rnd() * H * 0.55;
    const h = H * 0.25 + rnd() * H * 0.75;
    const a = 0.012 + rnd() * 0.05;
    const grd = ctx.createLinearGradient(x, y0, x, y0 + h);
    grd.addColorStop(0, 'rgba(38,34,28,0)');
    grd.addColorStop(0.28, 'rgba(38,34,28,' + a.toFixed(4) + ')');
    grd.addColorStop(0.72, 'rgba(30,27,22,' + (a * 0.8).toFixed(4) + ')');
    grd.addColorStop(1, 'rgba(26,23,19,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(x, y0, w, h);
  }
  ctx.restore();

  for (let i = 0; i < 16; i++) {
    const cx = rnd() * W;
    const cy = H * 0.40 + rnd() * H * 0.62;
    const r = 45 + rnd() * 190;
    const dark = rnd() < 0.55;
    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    if (dark) {
      grd.addColorStop(0, 'rgba(52,42,30,0.20)');
      grd.addColorStop(0.5, 'rgba(52,42,30,0.085)');
      grd.addColorStop(1, 'rgba(52,42,30,0)');
    } else {
      grd.addColorStop(0, 'rgba(104,96,74,0.16)');
      grd.addColorStop(0.5, 'rgba(104,96,74,0.06)');
      grd.addColorStop(1, 'rgba(104,96,74,0)');
    }
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  }

  for (let i = 0; i < 13; i++) {
    const cx = rnd() * W;
    const cy = rnd() * H;
    const r = 12 + rnd() * 62;
    ctx.save();
    blobPath(ctx, cx, cy, r, 14, rnd, 0.55);
    ctx.shadowColor = 'rgba(20,17,14,0.55)';
    ctx.shadowBlur = 6;
    ctx.fillStyle = 'rgba(146,139,122,0.20)';
    ctx.fill();
    ctx.restore();

    ctx.save();
    blobPath(ctx, cx + 1, cy + 1.4, r * 0.82, 14, mulberry32(seed + i * 7), 0.55);
    ctx.fillStyle = 'rgba(96,90,76,0.30)';
    ctx.fill();
    ctx.restore();

    ctx.save();
    blobPath(ctx, cx, cy, r, 14, mulberry32(seed + i * 13), 0.55);
    ctx.strokeStyle = 'rgba(22,19,15,0.42)';
    ctx.lineWidth = 1.1;
    ctx.stroke();
    ctx.restore();
  }

  for (let i = 0; i < 9; i++) {
    drawCrack(ctx, rnd() * W, rnd() * H, 70 + rnd() * 230, rnd, W, H);
  }

  ctx.save();
  ctx.lineCap = 'round';
  for (let i = 0; i < 46; i++) {
    const x = rnd() * W, y = rnd() * H;
    const a = rnd() * Math.PI * 2;
    const l = 6 + rnd() * 52;
    ctx.strokeStyle = rnd() < 0.5
      ? 'rgba(178,170,152,0.055)'
      : 'rgba(28,24,20,0.075)';
    ctx.lineWidth = 0.6 + rnd() * 1.1;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l);
    ctx.stroke();
  }
  ctx.restore();

  const gb = ctx.createLinearGradient(0, H * 0.66, 0, H);
  gb.addColorStop(0, 'rgba(26,22,17,0)');
  gb.addColorStop(0.7, 'rgba(26,22,17,0.22)');
  gb.addColorStop(1, 'rgba(18,15,11,0.44)');
  ctx.fillStyle = gb;
  ctx.fillRect(0, H * 0.66, W, H * 0.34);

  const corners = [[0, 0], [W, 0], [0, H], [W, H]];
  for (let i = 0; i < 4; i++) {
    const cx = corners[i][0], cy = corners[i][1];
    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, W * 0.38);
    grd.addColorStop(0, 'rgba(10,9,8,0.30)');
    grd.addColorStop(0.6, 'rgba(10,9,8,0.09)');
    grd.addColorStop(1, 'rgba(10,9,8,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);
  }

  const gt = ctx.createLinearGradient(0, 0, 0, H * 0.16);
  gt.addColorStop(0, 'rgba(10,9,8,0.36)');
  gt.addColorStop(1, 'rgba(10,9,8,0)');
  ctx.fillStyle = gt;
  ctx.fillRect(0, 0, W, H * 0.16);

  fineGrain(ctx, W, H, seed + 77, 0.10);
  return cv;
}

function makeCeilingTexture(W, H, seed) {
  const cv = newCanvas(W, H);
  const ctx = cv.getContext('2d');
  const rnd = mulberry32(seed);

  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#6d6759');
  g.addColorStop(0.5, '#726b5c');
  g.addColorStop(1, '#5a5549');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  overlayNoise(ctx, W, H, seed + 21, 128, 24, 0.32, 'overlay');
  overlayNoise(ctx, W, H, seed + 31, 96, 60, 0.24, 'soft-light');

  for (let i = 0; i < 7; i++) {
    const cx = rnd() * W, cy = rnd() * H;
    const R = 60 + rnd() * 200;
    for (let k = 0; k < 5; k++) {
      const rr = R * (0.35 + k * 0.17);
      const grd = ctx.createRadialGradient(cx, cy, rr * 0.72, cx, cy, rr);
      grd.addColorStop(0, 'rgba(94,72,42,0)');
      grd.addColorStop(0.65, 'rgba(94,72,42,' + (0.055 - k * 0.008) + ')');
      grd.addColorStop(1, 'rgba(72,54,32,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 7); ctx.fill();
    }
    const grd2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.5);
    grd2.addColorStop(0, 'rgba(108,84,50,0.11)');
    grd2.addColorStop(1, 'rgba(108,84,50,0)');
    ctx.fillStyle = grd2;
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.5, 0, 7); ctx.fill();
  }

  for (let i = 0; i < 12; i++) {
    drawCrack(ctx, rnd() * W, rnd() * H, 60 + rnd() * 200, rnd, W, H);
  }

  const corners = [[0, 0], [W, 0], [0, H], [W, H]];
  for (let i = 0; i < 4; i++) {
    const cx = corners[i][0], cy = corners[i][1];
    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, W * 0.4);
    grd.addColorStop(0, 'rgba(8,8,8,0.34)');
    grd.addColorStop(0.65, 'rgba(8,8,8,0.10)');
    grd.addColorStop(1, 'rgba(8,8,8,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);
  }

  fineGrain(ctx, W, H, seed + 91, 0.09);
  return cv;
}

function makePlankTexture(W, H, seed) {
  const cv = newCanvas(W, H);
  const ctx = cv.getContext('2d');
  const rnd = mulberry32(seed);

  const baseHue = 24 + rnd() * 12;
  const baseLight = 16 + rnd() * 9;
  ctx.fillStyle = 'hsl(' + baseHue + ', 22%, ' + baseLight + '%)';
  ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < 90; i++) {
    const x = rnd() * W;
    const w = 0.6 + rnd() * 3.4;
    const drift = (rnd() - 0.5) * 26;
    const a = 0.03 + rnd() * 0.14;
    const dark = rnd() < 0.72;
    ctx.strokeStyle = dark
      ? 'rgba(24,15,8,' + a.toFixed(3) + ')'
      : 'rgba(150,118,80,' + (a * 0.65).toFixed(3) + ')';
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(x, -10);
    ctx.bezierCurveTo(x + drift, H * 0.33, x - drift * 0.8, H * 0.66, x + drift * 0.4, H + 10);
    ctx.stroke();
  }

  const knots = 1 + Math.floor(rnd() * 3);
  for (let k = 0; k < knots; k++) {
    const cx = W * (0.2 + rnd() * 0.6);
    const cy = H * (0.12 + rnd() * 0.76);
    const r = 4 + rnd() * 10;
    for (let i = 6; i >= 0; i--) {
      const rr = r * (1 + i * 0.55);
      ctx.strokeStyle = 'rgba(30,18,9,' + (0.16 - i * 0.02) + ')';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rr * 0.65, rr, 0, 0, 7);
      ctx.stroke();
    }
    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grd.addColorStop(0, 'rgba(18,10,5,0.85)');
    grd.addColorStop(1, 'rgba(18,10,5,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  }

  for (let i = 0; i < 2; i++) {
    const nx = W * (0.25 + rnd() * 0.5);
    const ny = i === 0 ? H * 0.07 : H * 0.93;
    const grd = ctx.createRadialGradient(nx, ny, 0, nx, ny, 5);
    grd.addColorStop(0, 'rgba(8,6,4,0.9)');
    grd.addColorStop(0.55, 'rgba(30,22,14,0.5)');
    grd.addColorStop(1, 'rgba(30,22,14,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(nx, ny, 5, 0, 7); ctx.fill();
  }

  const ge1 = ctx.createLinearGradient(0, 0, 0, H * 0.06);
  ge1.addColorStop(0, 'rgba(14,9,5,0.6)');
  ge1.addColorStop(1, 'rgba(14,9,5,0)');
  ctx.fillStyle = ge1; ctx.fillRect(0, 0, W, H * 0.06);
  const ge2 = ctx.createLinearGradient(0, H, 0, H * 0.94);
  ge2.addColorStop(0, 'rgba(14,9,5,0.6)');
  ge2.addColorStop(1, 'rgba(14,9,5,0)');
  ctx.fillStyle = ge2; ctx.fillRect(0, H * 0.94, W, H * 0.06);

  const gs1 = ctx.createLinearGradient(0, 0, W * 0.10, 0);
  gs1.addColorStop(0, 'rgba(10,7,4,0.75)');
  gs1.addColorStop(1, 'rgba(10,7,4,0)');
  ctx.fillStyle = gs1; ctx.fillRect(0, 0, W * 0.10, H);
  const gs2 = ctx.createLinearGradient(W, 0, W * 0.90, 0);
  gs2.addColorStop(0, 'rgba(10,7,4,0.75)');
  gs2.addColorStop(1, 'rgba(10,7,4,0)');
  ctx.fillStyle = gs2; ctx.fillRect(W * 0.90, 0, W * 0.10, H);

  for (let i = 0; i < 34; i++) {
    const x = rnd() * W, y = rnd() * H;
    const a = (rnd() - 0.5) * 0.7 + Math.PI * 0.5;
    const l = 8 + rnd() * 70;
    ctx.strokeStyle = rnd() < 0.45
      ? 'rgba(168,138,98,0.11)'
      : 'rgba(16,10,5,0.20)';
    ctx.lineWidth = 0.6 + rnd() * 1.0;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l);
    ctx.stroke();
  }

  for (let i = 0; i < 5; i++) {
    const cx = rnd() * W, cy = rnd() * H, r = 10 + rnd() * 46;
    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grd.addColorStop(0, 'rgba(20,13,8,0.24)');
    grd.addColorStop(1, 'rgba(20,13,8,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  }

  fineGrain(ctx, W, H, seed + 41, 0.13);
  return cv;
}

function makeWoodTexture(W, H, seed, hue, light) {
  const cv = newCanvas(W, H);
  const ctx = cv.getContext('2d');
  const rnd = mulberry32(seed);

  ctx.fillStyle = 'hsl(' + hue + ', 24%, ' + light + '%)';
  ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < 130; i++) {
    const y = rnd() * H;
    const h = 0.5 + rnd() * 3.2;
    const drift = (rnd() - 0.5) * 30;
    const a = 0.03 + rnd() * 0.15;
    ctx.strokeStyle = rnd() < 0.7
      ? 'rgba(22,13,7,' + a.toFixed(3) + ')'
      : 'rgba(156,124,86,' + (a * 0.6).toFixed(3) + ')';
    ctx.lineWidth = h;
    ctx.beginPath();
    ctx.moveTo(-10, y);
    ctx.bezierCurveTo(W * 0.3, y + drift, W * 0.7, y - drift, W + 10, y + drift * 0.4);
    ctx.stroke();
  }

  for (let k = 0; k < 3; k++) {
    const cx = rnd() * W, cy = rnd() * H, r = 5 + rnd() * 14;
    for (let i = 5; i >= 0; i--) {
      ctx.strokeStyle = 'rgba(24,14,7,' + (0.18 - i * 0.025) + ')';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(cx, cy, r * (1 + i * 0.6), r * (1 + i * 0.6) * 0.4, rnd() * 3, 0, 7);
      ctx.stroke();
    }
  }

  overlayNoise(ctx, W, H, seed + 5, 128, 26, 0.30, 'overlay');
  fineGrain(ctx, W, H, seed + 13, 0.12);

  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, 'rgba(12,8,5,0.24)');
  grd.addColorStop(0.25, 'rgba(12,8,5,0)');
  grd.addColorStop(0.75, 'rgba(12,8,5,0)');
  grd.addColorStop(1, 'rgba(12,8,5,0.30)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  return cv;
}

function makeFabricTexture(W, H, seed, hue, sat, light) {
  const cv = newCanvas(W, H);
  const ctx = cv.getContext('2d');
  const rnd = mulberry32(seed);

  ctx.fillStyle = 'hsl(' + hue + ', ' + sat + '%, ' + light + '%)';
  ctx.fillRect(0, 0, W, H);

  const step = 3;
  for (let y = 0; y < H; y += step) {
    ctx.fillStyle = 'rgba(0,0,0,' + (0.03 + rnd() * 0.03) + ')';
    ctx.fillRect(0, y, W, 1);
  }
  for (let x = 0; x < W; x += step) {
    ctx.fillStyle = 'rgba(255,255,255,' + (0.012 + rnd() * 0.018) + ')';
    ctx.fillRect(x, 0, 1, H);
  }

  overlayNoise(ctx, W, H, seed + 3, 96, 22, 0.28, 'overlay');
  fineGrain(ctx, W, H, seed + 8, 0.16);

  for (let i = 0; i < 14; i++) {
    const cx = rnd() * W, cy = rnd() * H, r = 12 + rnd() * 60;
    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grd.addColorStop(0, 'rgba(40,34,24,0.18)');
    grd.addColorStop(1, 'rgba(40,34,24,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  }

  return cv;
}

function makePaperTexture(seed) {
  const W = 256, H = 256;
  const cv = newCanvas(W, H);
  const ctx = cv.getContext('2d');
  const rnd = mulberry32(seed);
  ctx.fillStyle = '#b6ad99';
  ctx.fillRect(0, 0, W, H);
  overlayNoise(ctx, W, H, seed + 2, 96, 18, 0.30, 'overlay');
  for (let i = 0; i < 26; i++) {
    const x = rnd() * W, y = rnd() * H;
    const r = 4 + rnd() * 26;
    const grd = ctx.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, 'rgba(126,102,66,0.22)');
    grd.addColorStop(1, 'rgba(126,102,66,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  fineGrain(ctx, W, H, seed + 6, 0.14);
  return cv;
}

function makeFloorGrunge(W, H, seed) {
  const cv = newCanvas(W, H);
  const ctx = cv.getContext('2d');
  const rnd = mulberry32(seed);

  ctx.clearRect(0, 0, W, H);

  const edges = [
    [0, 0, W, H * 0.16, 'top'],
    [0, H * 0.84, W, H * 0.16, 'bottom'],
    [0, 0, W * 0.16, H, 'left'],
    [W * 0.84, 0, W * 0.16, H, 'right']
  ];
  for (const e of edges) {
    const grd = e[4] === 'top'
      ? ctx.createLinearGradient(0, e[1], 0, e[1] + e[3])
      : e[4] === 'bottom'
        ? ctx.createLinearGradient(0, e[1] + e[3], 0, e[1])
        : e[4] === 'left'
          ? ctx.createLinearGradient(e[0], 0, e[0] + e[2], 0)
          : ctx.createLinearGradient(e[0] + e[2], 0, e[0], 0);
    grd.addColorStop(0, 'rgba(58,50,38,0.55)');
    grd.addColorStop(0.55, 'rgba(58,50,38,0.20)');
    grd.addColorStop(1, 'rgba(58,50,38,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(e[0], e[1], e[2], e[3]);
  }

  for (let i = 0; i < 26; i++) {
    const cx = rnd() * W, cy = rnd() * H;
    const rx = 30 + rnd() * 170, ry = 30 + rnd() * 170;
    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
    grd.addColorStop(0, 'rgba(30,24,16,' + (0.10 + rnd() * 0.24).toFixed(3) + ')');
    grd.addColorStop(0.6, 'rgba(30,24,16,' + (0.04 + rnd() * 0.08).toFixed(3) + ')');
    grd.addColorStop(1, 'rgba(30,24,16,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, rnd() * 3, 0, 7);
    ctx.fill();
  }

  for (let i = 0; i < 2600; i++) {
    const x = rnd() * W, y = rnd() * H;
    const a = rnd() * 0.20;
    ctx.fillStyle = 'rgba(120,108,86,' + a.toFixed(3) + ')';
    ctx.fillRect(x, y, 1 + rnd() * 1.6, 1 + rnd() * 1.6);
  }

  return cv;
}

function makeDustMap(size, seed) {
  const cv = newCanvas(size, size);
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(size, size);
  const rnd = mulberry32(seed);
  const f1 = makeFbm(seed + 1, 5);
  const f2 = makeFbm(seed + 2, 6);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const i = (y * size + x) * 4;
      const warp = f1(x / 26, y / 26);
      const dust = f2(x / 14, y / 14);
      img.data[i] = Math.floor(warp * 255);
      img.data[i + 1] = Math.floor((1 - warp) * 255);
      img.data[i + 2] = Math.floor(clamp(dust * 1.35 - 0.18, 0, 1) * 255);
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  for (let i = 0; i < 20; i++) {
    const cx = rnd() * size, cy = rnd() * size, r = 6 + rnd() * 40;
    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grd.addColorStop(0, 'rgba(0,0,0,0.55)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  }
  return cv;
}

function makeClockFace(size, seed) {
  const cv = newCanvas(size, size);
  const ctx = cv.getContext('2d');
  const rnd = mulberry32(seed);
  const c = size / 2;

  ctx.fillStyle = '#0a0b08';
  ctx.beginPath(); ctx.arc(c, c, c - 2, 0, 7); ctx.fill();

  ctx.strokeStyle = 'rgba(150,150,130,0.30)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(c, c, c - 5, 0, 7); ctx.stroke();

  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    const r1 = c - 12, r2 = c - 20;
    ctx.strokeStyle = 'rgba(170,170,148,0.45)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(c + Math.cos(a) * r1, c + Math.sin(a) * r1);
    ctx.lineTo(c + Math.cos(a) * r2, c + Math.sin(a) * r2);
    ctx.stroke();
  }

  ctx.strokeStyle = 'rgba(190,190,165,0.70)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(c, c);
  const ha = (-70 + rnd() * 140) * Math.PI / 180;
  ctx.lineTo(c + Math.cos(ha) * c * 0.42, c + Math.sin(ha) * c * 0.42);
  ctx.stroke();
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(c, c);
  const ma = (rnd() * 360) * Math.PI / 180;
  ctx.lineTo(c + Math.cos(ma) * c * 0.66, c + Math.sin(ma) * c * 0.66);
  ctx.stroke();

  fineGrain(ctx, size, size, seed + 3, 0.20);
  return cv;
}

const boxGeoCache = {};
function boxGeo(w, h, d) {
  const k = w.toFixed(4) + '_' + h.toFixed(4) + '_' + d.toFixed(4);
  if (!boxGeoCache[k]) boxGeoCache[k] = new THREE.BoxGeometry(w, h, d);
  return boxGeoCache[k];
}

function addBox(parent, w, h, d, mat, x, y, z, rx, ry, rz, cast, receive) {
  const m = new THREE.Mesh(boxGeo(w, h, d), mat);
  m.position.set(x, y, z);
  if (rx || ry || rz) m.rotation.set(rx || 0, ry || 0, rz || 0);
  m.castShadow = cast !== false;
  m.receiveShadow = receive !== false;
  parent.add(m);
  return m;
}

function roughen(geo, amp, freq, seed, axisMask) {
  const pos = geo.attributes.position;
  const f = makeFbm(seed, 4);
  const ax = axisMask || [1, 1, 1];
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const n1 = f(x * freq, y * freq);
    const n2 = f(z * freq + 31.7, x * freq + 11.3);
    const n3 = f(y * freq + 71.1, z * freq + 53.9);
    pos.setXYZ(i,
      x + (n1 - 0.5) * amp * ax[0],
      y + (n2 - 0.5) * amp * ax[1],
      z + (n3 - 0.5) * amp * ax[2]
    );
  }
  geo.computeVertexNormals();
  return geo;
}

function clothify(geo, ridgeAmp, ridgeFreq, noiseAmp, noiseFreq, seed, dirAxis) {
  const pos = geo.attributes.position;
  const f = makeFbm(seed, 4);
  const f2 = makeFbm(seed + 77, 3);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const u = dirAxis === 'x' ? x : z;
    const ridge = Math.sin(u * ridgeFreq + f(x * 0.6, z * 0.6) * 5.0) * ridgeAmp;
    const n = (f2(x * noiseFreq, z * noiseFreq) - 0.5) * noiseAmp;
    pos.setY(i, y + ridge + n);
  }
  geo.computeVertexNormals();
  return geo;
}

(function buildFloor() {
  const rnd = mulberry32(90210);
  const plankH = 0.028;
  const yTop = 0.0;
  const xStart = -HX - 0.35, xEnd = HX + 0.35;
  const zStart = -HZ - 0.35, zEnd = HZ + 0.35;

  const buckets = [[], [], []];

  let x = xStart;
  let col = 0;
  while (x < xEnd) {
    const w = 0.105 + rnd() * 0.115;
    const cx = x + w / 2;
    let z = zStart;
    while (z < zEnd) {
      const len = 0.85 + rnd() * 0.75;
      const cz = Math.min(z + len / 2, zEnd + 0.2);
      const l = Math.min(len, zEnd + 0.4 - z);
      if (l < 0.12) break;

      const yOff = (rnd() - 0.5) * 0.008;
      const rotY = (rnd() - 0.5) * 0.014;
      const rotZ = (rnd() - 0.5) * 0.006;
      const tilt = (rnd() - 0.5) * 0.010;

      const b = (col + (rnd() < 0.5 ? 0 : 1)) % 3;
      buckets[b].push({
        x: cx, y: yTop - plankH / 2 + yOff, z: cz,
        sx: w - 0.006, sy: plankH, sz: l - 0.008,
        ry: rotY, rz: rotZ, rx: tilt,
        tint: 0.62 + rnd() * 0.55
      });

      z += len + 0.006 + rnd() * 0.02;
    }
    x += w + 0.005;
    col++;
  }

  const unit = new THREE.BoxGeometry(1, 1, 1);
  const mtx = new THREE.Matrix4();
  const quat = new THREE.Quaternion();
  const eul = new THREE.Euler();
  const pos = new THREE.Vector3();
  const scl = new THREE.Vector3();
  const colr = new THREE.Color();

  for (let bi = 0; bi < 3; bi++) {
    const list = buckets[bi];
    if (!list.length) continue;
    const inst = new THREE.InstancedMesh(unit, MAT.plank[bi], list.length);
    inst.castShadow = false;
    inst.receiveShadow = true;
    for (let i = 0; i < list.length; i++) {
      const d = list[i];
      pos.set(d.x, d.y, d.z);
      eul.set(d.rx, d.ry, d.rz);
      quat.setFromEuler(eul);
      scl.set(d.sx, d.sy, d.sz);
      mtx.compose(pos, quat, scl);
      inst.setMatrixAt(i, mtx);
      colr.setRGB(d.tint, d.tint * (0.94 + 0.10 * Math.random()), d.tint * 0.92);
      inst.setColorAt(i, colr);
    }
    inst.instanceMatrix.needsUpdate = true;
    if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
    roomGroup.add(inst);
  }

  const under = new THREE.Mesh(
    new THREE.PlaneGeometry(ROOM.w + 0.8, ROOM.l + 0.8),
    MAT.dark
  );
  under.rotation.x = -Math.PI / 2;
  under.position.y = -0.06;
  under.receiveShadow = true;
  roomGroup.add(under);

  const ov = new THREE.Mesh(
    new THREE.PlaneGeometry(ROOM.w, ROOM.l),
    MAT.grunge
  );
  ov.rotation.x = -Math.PI / 2;
  ov.position.y = 0.0045;
  ov.receiveShadow = false;
  ov.renderOrder = 1;
  roomGroup.add(ov);
})();

(function buildCeiling() {
  const geo = new THREE.PlaneGeometry(ROOM.w + 0.6, ROOM.l + 0.6, 26, 22);

  const f = makeFbm(4242, 4);

    const sag = -0.028 * Math.sin((x / (ROOM.w * 0.5)) * Math.PI * 0.5) * Math.cos((y / (ROOM.l * 0.5)) * Math.PI * 0.5);
    const n = (f(x * 0.5, y * 0.5) - 0.5) * 0.022;
    pos.setZ(i, sag + n);

  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, MAT.ceiling);
  m.rotation.x = Math.PI / 2;
  m.position.y = ROOM.h;
  m.receiveShadow = true;

class Mirror extends THREE.Mesh {
  constructor(geometry, options) {
    options = options || {};
    const rtSize = options.rtSize || 512;

    const renderTarget = new THREE.WebGLRenderTarget(rtSize, rtSize, {
      type: THREE.HalfFloatType
    });
    renderTarget.texture.minFilter = THREE.LinearFilter;
    renderTarget.texture.magFilter = THREE.LinearFilter;

    const textureMatrix = new THREE.Matrix4();

    const material = new THREE.ShaderMaterial({
      uniforms: {
        tDiffuse: { value: renderTarget.texture },
        tDust: { value: options.dustMap || null },
        textureMatrix: { value: textureMatrix },
        uTime: { value: 0 }
      },
      vertexShader: `
        uniform mat4 textureMatrix;
        varying vec4 vUv;
        varying vec2 vLocal;
        void main() {
          vUv = textureMatrix * vec4( position, 1.0 );
          vLocal = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform sampler2D tDust;
        uniform float uTime;
        varying vec4 vUv;
        varying vec2 vLocal;

        void main() {
          vec2 uv = vUv.xy / vUv.w;

          vec2 d = texture2D( tDust, vLocal * 1.7 ).rg - 0.5;
          vec2 uvd = uv + d * 0.011;

          vec3 col;
          col.r = texture2D( tDiffuse, uvd ).r;
          col.g = texture2D( tDiffuse, uv ).g;
          col.b = texture2D( tDiffuse, uv - d * 0.007 ).b;

          col *= vec3( 0.46, 0.53, 0.58 );
          col += vec3( 0.009, 0.011, 0.014 );

          float dust = texture2D( tDust, vLocal * 0.85 ).b;
          float dust2 = texture2D( tDust, vLocal * 2.6 + 0.3 ).b;
          float dirt = smoothstep( 0.30, 0.95, dust * 0.75 + dust2 * 0.45 );
          col = mix( col, col * 0.18 + vec3( 0.030, 0.029, 0.026 ), dirt * 0.85 );

          vec2 e = abs( vLocal - 0.5 ) * 2.0;
          float edge = max( e.x, e.y );
          float rot = smoothstep( 0.70, 1.03, edge + ( dust - 0.5 ) * 0.30 );
          col = mix( col, vec3( 0.020, 0.021, 0.024 ), rot * 0.92 );

          float r = length( vLocal - 0.5 ) * 1.42;
          col *= 1.0 - 0.55 * r * r;

          gl_FragColor = vec4( col, 1.0 );
        }
      `
    });

    super(geometry, material);

    this.renderTarget = renderTarget;
    this.virtualCamera = new THREE.PerspectiveCamera();
    this.textureMatrix = textureMatrix;

    const scope = this;
    let frameCount = 0;

    const reflectorPlane = new THREE.Plane();
    const normal = new THREE.Vector3();
    const reflectorWorldPosition = new THREE.Vector3();
    const cameraWorldPosition = new THREE.Vector3();
    const rotationMatrix = new THREE.Matrix4();
    const lookAtPosition = new THREE.Vector3(0, 0, -1);
    const clipPlane = new THREE.Vector4();
    const view = new THREE.Vector3();
    const target = new THREE.Vector3();
    const q = new THREE.Vector4();
    const textureMatrixLocal = textureMatrix;
    const virtualCamera = this.virtualCamera;

    this.onBeforeRender = function (rndr, sceneRef, camRef) {
      reflectorWorldPosition.setFromMatrixPosition(scope.matrixWorld);
      cameraWorldPosition.setFromMatrixPosition(camRef.matrixWorld);

      rotationMatrix.extractRotation(scope.matrixWorld);
      normal.set(0, 0, 1);
      normal.applyMatrix4(rotationMatrix);

      view.subVectors(reflectorWorldPosition, cameraWorldPosition);
      if (view.dot(normal) > 0) return;
      view.reflect(normal).negate();
      view.add(reflectorWorldPosition);

      rotationMatrix.extractRotation(camRef.matrixWorld);
      lookAtPosition.set(0, 0, -1);
      lookAtPosition.applyMatrix4(rotationMatrix);
      lookAtPosition.add(cameraWorldPosition);

      target.subVectors(reflectorWorldPosition, lookAtPosition);
      target.reflect(normal).negate();
      target.add(reflectorWorldPosition);

      virtualCamera.position.copy(view);
      virtualCamera.up.set(0, 1, 0);
      virtualCamera.up.applyMatrix4(rotationMatrix);
      virtualCamera.up.reflect(normal);
      virtualCamera.lookAt(target);
      virtualCamera.far = camRef.far;
      virtualCamera.near = camRef.near;
      virtualCamera.aspect = 1.0;
      virtualCamera.updateMatrixWorld();
      virtualCamera.projectionMatrix.copy(camRef.projectionMatrix);

      textureMatrixLocal.set(
        0.5, 0.0, 0.0, 0.5,
        0.0, 0.5, 0.0, 0.5,
        0.0, 0.0, 0.5, 0.5,
        0.0, 0.0, 0.0, 1.0
      );
      textureMatrixLocal.multiply(virtualCamera.projectionMatrix);
      textureMatrixLocal.multiply(virtualCamera.matrixWorldInverse);
      textureMatrixLocal.multiply(scope.matrixWorld);

      frameCount++;
      const every = IS_MOBILE ? 4 : 2;
      if (frameCount % every !== 0) return;

      scope.visible = false;

      const currentRenderTarget = rndr.getRenderTarget();
      const currentXrEnabled = rndr.xr.enabled;
      const currentShadowAutoUpdate = rndr.shadowMap.autoUpdate;

      rndr.xr.enabled = false;
      rndr.shadowMap.autoUpdate = false;

      rndr.setRenderTarget(renderTarget);
      rndr.state.buffers.depth.setMask(true);
      if (rndr.autoClear === false) rndr.clear();
      rndr.render(sceneRef, virtualCamera);

      rndr.xr.enabled = currentXrEnabled;
      rndr.shadowMap.autoUpdate = currentShadowAutoUpdate;
      rndr.setRenderTarget(currentRenderTarget);

      scope.visible = true;
    };
  }
}

const POST = (function () {
  const rtScene = new THREE.WebGLRenderTarget(1, 1, {
    type: THREE.HalfFloatType,
    samples: IS_MOBILE ? 0 : 4
  });
  rtScene.texture.minFilter = THREE.LinearFilter;
  rtScene.texture.magFilter = THREE.LinearFilter;
  rtScene.texture.generateMipmaps = false;

  const rtBright = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
  rtBright.texture.minFilter = THREE.LinearFilter;
  rtBright.texture.magFilter = THREE.LinearFilter;
  rtBright.texture.generateMipmaps = false;

  const rtBlurA = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
  const rtBlurB = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
  rtBlurA.texture.minFilter = rtBlurA.texture.magFilter = THREE.LinearFilter;
  rtBlurB.texture.minFilter = rtBlurB.texture.magFilter = THREE.LinearFilter;
  rtBlurA.texture.generateMipmaps = false;
  rtBlurB.texture.generateMipmaps = false;

  const fsScene = new THREE.Scene();
  const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const fsQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null);
  fsQuad.frustumCulled = false;
  fsScene.add(fsQuad);

  const VERT = `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4( position.xy, 0.0, 1.0 );
    }
  `;

  const brightMat = new THREE.ShaderMaterial({
    uniforms: {
      tDiffuse: { value: null },
      uThreshold: { value: 0.42 }
    },
    vertexShader: VERT,
    fragmentShader: `
      uniform sampler2D tDiffuse;
      uniform float uThreshold;
      varying vec2 vUv;
      void main() {
        vec3 c = texture2D( tDiffuse, vUv ).rgb;
        float l = dot( c, vec3( 0.2126, 0.7152, 0.0722 ) );
        float k = smoothstep( uThreshold, uThreshold + 0.85, l );
        gl_FragColor = vec4( c * k, 1.0 );
      }
    `,
    depthTest: false,
    depthWrite: false
  });

  const blurMat = new THREE.ShaderMaterial({
    uniforms: {
      tDiffuse: { value: null },
      uDir: { value: new THREE.Vector2() }
    },
    vertexShader: VERT,
    fragmentShader: `
      uniform sampler2D tDiffuse;
      uniform vec2 uDir;
      varying vec2 vUv;
      void main() {
        vec3 s = texture2D( tDiffuse, vUv ).rgb * 0.227027;
        s += texture2D( tDiffuse, vUv + uDir * 1.3846 ).rgb * 0.316216;
        s += texture2D( tDiffuse, vUv - uDir * 1.3846 ).rgb * 0.316216;
        s += texture2D( tDiffuse, vUv + uDir * 3.2308 ).rgb * 0.070270;
        s += texture2D( tDiffuse, vUv - uDir * 3.2308 ).rgb * 0.070270;
        gl_FragColor = vec4( s, 1.0 );
      }
    `,
    depthTest: false,
    depthWrite: false
  });

  const compositeMat = new THREE.ShaderMaterial({
    uniforms: {
      tScene: { value: rtScene.texture },
      tBloom: { value: rtBlurB.texture },
      uTime: { value: 0 },
      uRes: { value: new THREE.Vector2(1, 1) },
      uExposure: { value: 1.18 },
      uVignette: { value: 1.0 },
      uFade: { value: 1.0 }
    },
    vertexShader: VERT,
    fragmentShader: `
      uniform sampler2D tScene;
      uniform sampler2D tBloom;
      uniform float uTime;
      uniform vec2 uRes;
      uniform float uExposure;
      uniform float uVignette;
      uniform float uFade;
      varying vec2 vUv;

      vec3 aces( vec3 x ) {
        return clamp( ( x * ( 2.51 * x + 0.03 ) ) / ( x * ( 2.43 * x + 0.59 ) + 0.14 ), 0.0, 1.0 );
      }

      float hash( vec2 p ) {
        return fract( sin( dot( p, vec2( 127.1, 311.7 ) ) ) * 43758.5453123 );
      }

      void main() {
        vec2 uv = vUv;
        vec2 c = uv - 0.5;
        float r2 = dot( c, c );

        float ca = 0.0013 * r2 + 0.00035;
        vec3 col;
        col.r = texture2D( tScene, uv + c * ca ).r;
        col.g = texture2D( tScene, uv ).g;
        col.b = texture2D( tScene, uv - c * ca ).b;

        vec3 bloom = texture2D( tBloom, uv ).rgb;
        col += bloom * 0.62;

        col *= uExposure;

        float lum = dot( col, vec3( 0.2126, 0.7152, 0.0722 ) );
        vec3 cool = col * vec3( 0.84, 0.91, 1.10 );
        vec3 warm = col * vec3( 1.07, 0.98, 0.86 );
        col = mix( cool, warm, clamp( lum * 1.6, 0.0, 1.0 ) );

        float l2 = dot( col, vec3( 0.2126, 0.7152, 0.0722 ) );
        col = mix( vec3( l2 ), col, 0.86 );

        col = aces( col );

        float vig = smoothstep( 1.05, 0.18, r2 * 2.05 );
        col *= mix( mix( 0.38, 1.0, vig ), 1.0, 1.0 - uVignette );

        float g = hash( uv * uRes + vec2( uTime * 37.13, uTime * 21.71 ) ) - 0.5;
        float g2 = hash( uv * uRes * 2.13 + vec2( uTime * 71.3, uTime * 43.7 ) ) - 0.5;
        col += ( g * 0.030 + g2 * 0.014 ) * ( 1.0 - l2 * 0.7 );

        col += vec3( 0.004, 0.005, 0.007 );

        col *= uFade;

        col = pow( clamp( col, 0.0, 1.0 ), vec3( 1.0 / 2.2 ) );

        gl_FragColor = vec4( col, 1.0 );
      }
    `,
    depthTest: false,
    depthWrite: false
  });

  function blit(mat, target) {
    fsQuad.material = mat;
    renderer.setRenderTarget(target);
    renderer.render(fsScene, fsCam);
  }

  function resize(w, h) {
    const dpr = Math.min(window.devicePixelRatio || 1, IS_MOBILE ? 1.0 : 1.5);
    const W = Math.max(2, Math.floor(w * dpr));
    const H = Math.max(2, Math.floor(h * dpr));

    rtScene.setSize(W, H);

    const div = IS_MOBILE ? 5 : 4;
    const bw = Math.max(2, Math.floor(W / div));
    const bh = Math.max(2, Math.floor(H / div));
    rtBright.setSize(bw, bh);
    rtBlurA.setSize(bw, bh);
    rtBlurB.setSize(bw, bh);

    compositeMat.uniforms.uRes.value.set(W, H);
  }

  function render(sceneRef, camRef, time) {
    renderer.setRenderTarget(rtScene);
    renderer.clear();
    renderer.render(sceneRef, camRef);

    const bw = rtBright.width, bh = rtBright.height;

    blit(brightMat, rtBright);

    blurMat.uniforms.tDiffuse.value = rtBright.texture;
    blurMat.uniforms.uDir.value.set(1.0 / bw, 0);
    blit(blurMat, rtBlurA);

    blurMat.uniforms.tDiffuse.value = rtBlurA.texture;
    blurMat.uniforms.uDir.value.set(0, 1.0 / bh);
    blit(blurMat, rtBlurB);

    blurMat.uniforms.tDiffuse.value = rtBlurB.texture;
    blurMat.uniforms.uDir.value.set(2.4 / bw, 0);
    blit(blurMat, rtBlurA);

    blurMat.uniforms.tDiffuse.value = rtBlurA.texture;
    blurMat.uniforms.uDir.value.set(0, 2.4 / bh);
    blit(blurMat, rtBlurB);

    compositeMat.uniforms.uTime.value = time;
    compositeMat.uniforms.tScene.value = rtScene.texture;
    compositeMat.uniforms.tBloom.value = rtBlurB.texture;

    blit(compositeMat, null);
  }

  return { resize: resize, render: render, compositeMat: compositeMat, rtScene: rtScene };
})();

const COLLIDERS = [
  { minX: -3.0, maxX: -1.45, minZ: -2.30, maxZ: -0.15 },
  { minX: 2.30, maxX: 3.0, minZ: 0.78, maxZ: 2.22 },
  { minX: 2.36, maxX: 3.0, minZ: -1.90, maxZ: -0.50 },
  { minX: -2.82, maxX: -2.36, minZ: 0.48, maxZ: 0.96 },
  { minX: 1.36, maxX: 1.90, minZ: -0.90, maxZ: -0.34 }
];
const PLAYER_R = 0.30;

function resolveCollisions(p) {
  p.x = clamp(p.x, -HX + PLAYER_R + 0.02, HX - PLAYER_R - 0.02);
  p.z = clamp(p.z, -HZ + PLAYER_R + 0.02, HZ - PLAYER_R - 0.02);

  for (let i = 0; i < COLLIDERS.length; i++) {
    const c = COLLIDERS[i];
    const cx = clamp(p.x, c.minX, c.maxX);
    const cz = clamp(p.z, c.minZ, c.maxZ);
    const dx = p.x - cx;
    const dz = p.z - cz;
    const d2 = dx * dx + dz * dz;
    if (d2 < PLAYER_R * PLAYER_R) {
      if (d2 > 1e-8) {
        const d = Math.sqrt(d2);
        const push = (PLAYER_R - d) / d;
        p.x += dx * push;
        p.z += dz * push;
      } else {
        const left = Math.abs(p.x - c.minX);
        const right = Math.abs(c.maxX - p.x);
        const front = Math.abs(p.z - c.minZ);
        const back = Math.abs(c.maxZ - p.z);
        const m = Math.min(left, right, front, back);
        if (m === left) p.x = c.minX - PLAYER_R;
        else if (m === right) p.x = c.maxX + PLAYER_R;
        else if (m === front) p.z = c.minZ - PLAYER_R;
        else p.z = c.maxZ + PLAYER_R;
      }
    }
  }
}

function updateInteraction() {
  raycaster.setFromCamera(centerNDC, camera);
  const hits = raycaster.intersectObjects(interactables, true);
  let found = null;
  for (let i = 0; i < hits.length; i++) {
    let o = hits[i].object;
    while (o && !o.userData.interact) o = o.parent;
    if (o && o.userData.interact) { found = o; break; }
  }
  currentTarget = found;
  if (found) {
    const t = found.userData.interact;
    let label = '[E] interact';
    if (t === 'lamp') label = '[E] switch lamp';
    else if (t === 'wardrobe') label = '[E] open wardrobe';
    else if (t === 'door') label = '[E] try the door';
    else if (t === 'mirror') label = '[E] look closer';
    else if (t === 'book') label = '[E] read';
    else if (t === 'relic') label = '[E] take';
    else if (t === 'deskDrawer') label = '[E] open drawer';
    promptEl.textContent = label;
    promptEl.classList.add('on');
    if (interactBtn) interactBtn.classList.add('on');
  } else {
    promptEl.classList.remove('on');
