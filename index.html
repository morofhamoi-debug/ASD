<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>THE ROOM</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: "Georgia", "Times New Roman", serif;
    color: #8d857a;
    cursor: default;
    -webkit-font-smoothing: antialiased;
  }
  #c { display: block; width: 100%; height: 100%; }

  #overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #000;
    transition: opacity 1.6s ease;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    box-sizing: border-box;
    pointer-events: auto;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }

  #overlay h1 {
    margin: 0 0 10px 0;
    font-size: 15px; font-weight: 400;
    letter-spacing: 0.62em; text-transform: uppercase;
    color: #6b6459;
    text-indent: 0.62em;
  }
  #overlay .sub {
    margin: 0; font-size: 10px; letter-spacing: 0.36em;
    color: #3d3933; text-transform: uppercase;
  }
  #enter {
    margin-top: 52px;
    font-size: 10px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #8b8278;
    border: 1px solid #262220;
    padding: 15px 34px;
    background: transparent;
    font-family: inherit;
    cursor: pointer;
    transition: color .8s ease, border-color .8s ease, background .8s ease, transform .12s ease, opacity .12s ease;
    text-indent: 0.42em;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    pointer-events: auto;
    position: relative;
    z-index: 21;
  }
  #enter:hover { color: #cbc2b6; border-color: #494137; background: rgba(255,255,255,0.015); }
  #enter:active { transform: scale(0.97); color: #cbc2b6; border-color: #494137; }

  body.mobile #enter {
    font-size: 12px;
    letter-spacing: 0.40em;
    padding: 18px 44px;
    min-width: 208px;
    color: #a89e92;
    border-color: #3a332c;
    margin-top: 46px;
  }
  body.mobile #enter:active {
    transform: scale(0.96);
    opacity: 0.82;
    color: #d4cab8;
    border-color: #6b5e4c;
  }

  #enter-hint {
    margin: 22px 0 0 0;
    font-size: 9px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: #37332d;
    text-align: center;
    line-height: 2.1;
    text-indent: 0.26em;
    max-width: 82vw;
  }

  #save-hint-row {
    margin-top: 40px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .save-btn {
    font-size: 9px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #4a453d;
    background: transparent;
    border: 1px solid #201d1a;
    padding: 10px 18px;
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: color .5s ease, border-color .5s ease;
  }
  .save-btn:hover { color: #8b8278; border-color: #3a342e; }
  .save-btn.hidden { display: none; }

  #prompt {
    position: fixed; left: 50%; bottom: 13%;
    transform: translateX(-50%);
    font-size: 10px; letter-spacing: 0.36em; text-transform: uppercase;
    color: #b3aa9e; opacity: 0; transition: opacity .35s ease;
    text-shadow: 0 0 16px #000, 0 0 3px #000;
    pointer-events: none; z-index: 6;
    white-space: nowrap;
  }
  #prompt.on { opacity: 0.85; }

  #caption {
    position: fixed; left: 50%; bottom: 21%;
    transform: translateX(-50%);
    font-size: 12.5px; font-style: italic; letter-spacing: 0.09em;
    color: #9a9186; opacity: 0; transition: opacity 1.4s ease;
    text-shadow: 0 0 18px #000, 0 0 4px #000;
    pointer-events: none; z-index: 6;
    text-align: center; max-width: 60vw; line-height: 1.6;
  }
  #caption.on { opacity: 0.9; }

  #objective-hud {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: calc(14px + env(safe-area-inset-left, 0px));
    z-index: 7;
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #6b6357;
    background: rgba(0,0,0,0.35);
    padding: 8px 12px;
    border-left: 1px solid #2c2825;
    max-width: 44vw;
    line-height: 1.7;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s ease;
    text-shadow: 0 0 10px #000;
  }
  #objective-hud.on { opacity: 1; }
  #objective-hud .label {
    display: block;
    font-size: 8px;
    letter-spacing: 0.4em;
    color: #4a453d;
    margin-bottom: 4px;
  }
  #objective-hud .text {
    color: #a89e92;
    font-size: 11px;
    letter-spacing: 0.14em;
  }

  #chapter-card {
    position: fixed; inset: 0;
    z-index: 30;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: #000;
    pointer-events: none;
  }
  #chapter-card.on { display: flex; }
  #chapter-card .num {
    font-size: 10px; letter-spacing: 0.62em;
    color: #4a453d;
    text-transform: uppercase;
    margin-bottom: 18px;
    text-indent: 0.62em;
    opacity: 0;
    animation: ccFade 6s ease forwards;
  }
  #chapter-card .name {
    font-size: 22px;
    letter-spacing: 0.28em;
    color: #b3aa9e;
    text-transform: uppercase;
    text-indent: 0.28em;
    opacity: 0;
    animation: ccFade 6s ease .4s forwards;
  }
  @keyframes ccFade {
    0% { opacity: 0; }
    18% { opacity: 1; }
    78% { opacity: 1; }
    100% { opacity: 0; }
  }

  #toast {
    position: fixed;
    left: 50%; bottom: 32%;
    transform: translateX(-50%);
    z-index: 25;
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #b3aa9e;
    background: rgba(0,0,0,0.55);
    padding: 10px 18px;
    border: 1px solid #2c2825;
    pointer-events: none;
    opacity: 0;
    transition: opacity .4s ease;
    text-shadow: 0 0 12px #000;
    max-width: 78vw;
    text-align: center;
    line-height: 1.6;
  }
  #toast.on { opacity: 1; }

  #inventory-panel {
    position: fixed;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 22;
    width: min(520px, 88vw);
    max-height: 76vh;
    background: rgba(4,4,4,0.94);
    border: 1px solid #2c2825;
    padding: 22px;
    box-sizing: border-box;
    display: none;
    flex-direction: column;
    color: #b3aa9e;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  #inventory-panel.on { display: flex; }
  #inventory-panel h2 {
    margin: 0 0 4px 0;
    font-size: 11px;
    letter-spacing: 0.44em;
    text-transform: uppercase;
    color: #6b6357;
    font-weight: 400;
  }
  #inventory-panel .inv-sub {
    margin: 0 0 18px 0;
    font-size: 9px;
    letter-spacing: 0.28em;
    color: #3d3933;
    text-transform: uppercase;
  }
  #inventory-list {
    list-style: none;
    padding: 0;
    margin: 0;
    overflow-y: auto;
    flex: 1;
    max-height: 50vh;
  }
  #inventory-list li {
    padding: 10px 12px;
    border-bottom: 1px solid #1a1714;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: #a89e92;
    cursor: pointer;
    transition: background .2s ease, color .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #inventory-list li:hover { background: rgba(255,255,255,0.02); color: #cbc2b6; }
  #inventory-list li .icon {
    display: inline-block;
    width: 20px;
    color: #6b6357;
  }
  #inventory-list li .name { color: #cbc2b6; }
  #inventory-list li.empty {
    color: #3d3933;
    font-style: italic;
    text-align: center;
    cursor: default;
    border: none;
    padding: 24px 0;
  }
  #inventory-list li.selected {
    background: rgba(255,255,255,0.03);
    color: #e0d6c6;
  }
  #inventory-desc {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #1a1714;
    font-size: 11px;
    font-style: italic;
    letter-spacing: 0.06em;
    color: #7b7368;
    line-height: 1.7;
    min-height: 40px;
  }
  #inventory-close {
    position: absolute;
    top: 8px; right: 12px;
    background: transparent;
    border: none;
    color: #6b6357;
    font-size: 18px;
    cursor: pointer;
    font-family: inherit;
    padding: 6px 8px;
    -webkit-tap-highlight-color: transparent;
  }
  #inventory-close:hover { color: #cbc2b6; }

  #note-reader {
    position: fixed;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 23;
    width: min(560px, 88vw);
    max-height: 82vh;
    background:
      linear-gradient(180deg, rgba(30,26,20,0.98), rgba(20,17,13,0.98));
    border: 1px solid #3a332c;
    padding: 30px 34px;
    box-sizing: border-box;
    display: none;
    flex-direction: column;
    color: #c2b8a4;
    box-shadow: 0 20px 80px rgba(0,0,0,0.85);
  }
  #note-reader.on { display: flex; }
  #note-reader .note-title {
    font-size: 12px;
    letter-spacing: 0.44em;
    text-transform: uppercase;
    color: #7b7061;
    margin: 0 0 6px 0;
  }
  #note-reader .note-meta {
    font-size: 9px;
    letter-spacing: 0.28em;
    color: #4a4239;
    text-transform: uppercase;
    margin: 0 0 22px 0;
    font-style: italic;
  }
  #note-reader .note-body {
    font-size: 14px;
    font-style: italic;
    line-height: 1.9;
    color: #c8beaa;
    overflow-y: auto;
    flex: 1;
    padding-right: 8px;
    white-space: pre-wrap;
    font-family: "Georgia", "Times New Roman", serif;
  }
  #note-reader .note-body::-webkit-scrollbar { width: 4px; }
  #note-reader .note-body::-webkit-scrollbar-thumb { background: #3a332c; }
  #note-reader .note-close {
    margin-top: 22px;
    align-self: flex-end;
    font-size: 10px;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: #8b8278;
    border: 1px solid #2c2825;
    padding: 10px 22px;
    background: transparent;
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: color .4s ease, border-color .4s ease;
  }
  #note-reader .note-close:hover { color: #e0d6c6; border-color: #5a5045; }

  #ending-card {
    position: fixed; inset: 0;
    z-index: 40;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: #000;
    pointer-events: auto;
    padding: 40px 20px;
    box-sizing: border-box;
    text-align: center;
  }
  #ending-card.on { display: flex; }
  #ending-card .end-label {
    font-size: 9px;
    letter-spacing: 0.6em;
    color: #3d3933;
    text-transform: uppercase;
    margin-bottom: 16px;
    text-indent: 0.6em;
  }
  #ending-card .end-title {
    font-size: 26px;
    letter-spacing: 0.30em;
    color: #b3aa9e;
    text-transform: uppercase;
    text-indent: 0.30em;
    margin-bottom: 30px;
  }
  #ending-card .end-body {
    font-size: 13px;
    font-style: italic;
    letter-spacing: 0.06em;
    color: #7b7368;
    line-height: 2;
    max-width: 520px;
    margin-bottom: 40px;
    white-space: pre-wrap;
  }
  #ending-card .end-restart {
    font-size: 10px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: #8b8278;
    border: 1px solid #262220;
    padding: 14px 32px;
    background: transparent;
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    text-indent: 0.42em;
  }
  #ending-card .end-restart:hover { color: #cbc2b6; border-color: #494137; }

  #mobile-ui { display: none; }
  body.mobile.started #mobile-ui { display: block; }

  body.mobile {
    touch-action: none;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
    -webkit-user-select: none;
  }
  body.mobile #c { touch-action: none; }
  body.mobile * {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  body.mobile #prompt { display: none !important; }
  body.mobile #caption {
    bottom: 30%;
    max-width: 78vw;
    font-size: 13px;
  }
  body.mobile #objective-hud {
    font-size: 9px;
    max-width: 60vw;
    padding: 6px 10px;
  }
  body.mobile #objective-hud .text { font-size: 10px; }

  #mobile-ui {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 8;
  }

  #joystick-base {
    position: fixed;
    left: calc(20px + env(safe-area-inset-left, 0px));
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    width: 132px; height: 132px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%,
        rgba(24,20,16,0.35) 0%,
        rgba(12,10,8,0.22) 60%,
        rgba(8,7,6,0.10) 100%);
    border: 1px solid rgba(180,168,144,0.14);
    box-shadow:
      inset 0 0 28px rgba(0,0,0,0.55),
      0 4px 22px rgba(0,0,0,0.55);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    touch-action: none;
    pointer-events: auto;
    z-index: 9;
  }
  #joystick-base::after {
    content: '';
    position: absolute;
    inset: 22%;
    border-radius: 50%;
    border: 1px solid rgba(180,168,144,0.06);
    pointer-events: none;
  }
  #joystick-knob {
    position: absolute;
    left: 50%; top: 50%;
    width: 58px; height: 58px;
    margin: -29px 0 0 -29px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 38% 32%,
        rgba(150,138,118,0.42),
        rgba(56,50,40,0.55) 55%,
        rgba(28,24,20,0.70) 100%);
    border: 1px solid rgba(200,186,160,0.20);
    box-shadow:
      0 4px 14px rgba(0,0,0,0.60),
      inset 0 1px 1px rgba(255,255,255,0.06);
    pointer-events: none;
    will-change: transform;
  }

  .mbtn {
    position: fixed;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 40% 30%,
        rgba(46,40,32,0.55),
        rgba(14,12,10,0.72));
    border: 1px solid rgba(180,168,144,0.16);
    color: rgba(184,172,150,0.72);
    border-radius: 50%;
    box-shadow:
      0 4px 16px rgba(0,0,0,0.55),
      inset 0 1px 1px rgba(255,255,255,0.05);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    touch-action: none;
    pointer-events: auto;
    user-select: none;
    -webkit-user-select: none;
    font-family: "Georgia", "Times New Roman", serif;
    cursor: pointer;
    z-index: 9;
    padding: 0;
    transition: opacity .25s ease, transform .08s ease, background .12s ease, border-color .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .mbtn:active, .mbtn.on { transform: scale(0.94); }

  #interact-btn {
    right: calc(24px + env(safe-area-inset-right, 0px));
    top: 50%;
    transform: translateY(-50%);
    width: 82px; height: 82px;
    font-size: 26px;
    letter-spacing: 0.02em;
    color: rgba(200,186,160,0.85);
    border-color: rgba(200,186,160,0.22);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease, transform .08s ease, background .12s ease;
  }
  #interact-btn.on {
    opacity: 0.92;
    pointer-events: auto;
  }
  #interact-btn:active { transform: translateY(-50%) scale(0.94); }

  #sprint-btn {
    right: calc(30px + env(safe-area-inset-right, 0px));
    bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    width: 62px; height: 62px;
    opacity: 0.6;
  }
  #sprint-btn.on {
    opacity: 0.95;
    background:
      radial-gradient(circle at 40% 30%,
        rgba(96,82,58,0.70),
        rgba(30,25,18,0.85));
    border-color: rgba(220,198,168,0.32);
  }

  #flashlight-btn {
    right: calc(30px + env(safe-area-inset-right, 0px));
    bottom: calc(100px + env(safe-area-inset-bottom, 0px));
    width: 58px; height: 58px;
    opacity: 0;
    pointer-events: none;
    color: rgba(200,186,160,0.72);
  }
  #flashlight-btn.visible {
    opacity: 0.72;
    pointer-events: auto;
  }
  #flashlight-btn.on {
    opacity: 1;
    color: #f0d9a0;
    border-color: rgba(240,217,160,0.32);
    background:
      radial-gradient(circle at 40% 30%,
        rgba(120,100,60,0.70),
        rgba(40,30,15,0.85));
  }

  #inventory-btn {
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: calc(14px + env(safe-area-inset-left, 0px));
    width: 44px; height: 44px;
    opacity: 0.55;
    color: rgba(180,168,144,0.85);
    border-radius: 8px;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  #fs-btn {
    top: calc(14px + env(safe-area-inset-top, 0px));
    right: calc(14px + env(safe-area-inset-right, 0px));
    width: 42px; height: 42px;
    opacity: 0.42;
    color: rgba(180,168,144,0.85);
  }
  #fs-btn:active { opacity: 0.85; }

  #rotate-overlay { display: none !important; }

  #fade {
    position: fixed; inset: 0;
    background: #000;
    pointer-events: none;
    opacity: 0;
    transition: opacity .35s ease;
    z-index: 15;
  }
  #fade.on { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="fade"></div>
<div id="prompt">[ E ] взаимодействовать</div>
<div id="caption"></div>
<div id="objective-hud"><span class="label">Задача</span><span class="text"></span></div>
<div id="chapter-card"><div class="num"></div><div class="name"></div></div>
<div id="toast"></div>

<div id="overlay">
  <h1>THE ROOM</h1>
  <p class="sub">где-то в доме</p>
  <button id="enter" type="button">Войти</button>
  <p id="enter-hint"></p>
  <div id="save-hint-row">
    <button id="continue-btn" class="save-btn hidden" type="button">Продолжить</button>
    <button id="newgame-btn" class="save-btn hidden" type="button">Новая игра</button>
  </div>
</div>

<div id="mobile-ui">
  <div id="joystick-base">
    <div id="joystick-knob"></div>
  </div>

  <div id="interact-btn" class="mbtn" aria-label="Взаимодействовать">
    <span>E</span>
  </div>

  <button id="inventory-btn" class="mbtn" aria-label="Инвентарь">ИНВ</button>

  <div id="sprint-btn" class="mbtn" aria-label="Бег">
    <svg viewBox="0 0 24 24" width="24" height="24"
         fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 3 L5 13 h5 l-1 8 L18 10 h-5 l1 -7 z"/>
    </svg>
  </div>

  <div id="flashlight-btn" class="mbtn" aria-label="Фонарик">
    <svg viewBox="0 0 24 24" width="22" height="22"
         fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 2h6v4l-2 2v13a1 1 0 0 1-2 0V8L9 6V2z"/>
      <path d="M8 4h8"/>
    </svg>
  </div>

  <button id="fs-btn" class="mbtn" aria-label="Полный экран">
    <svg viewBox="0 0 24 24" width="16" height="16"
         fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
    </svg>
  </button>
</div>

<div id="inventory-panel">
  <button id="inventory-close" aria-label="Закрыть">×</button>
  <h2>Инвентарь</h2>
  <p class="inv-sub">то, что вы несёте с собой</p>
  <ul id="inventory-list"></ul>
  <div id="inventory-desc"></div>
</div>

<div id="note-reader">
  <p class="note-title" id="note-title"></p>
  <p class="note-meta" id="note-meta"></p>
  <div class="note-body" id="note-body"></div>
  <button class="note-close" id="note-close" type="button">Закрыть</button>
</div>

<div id="ending-card">

/* ============================================================

function mulberry32(a) {

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;

function makeValueNoise(seed) {

  for (let i = 0; i < S * S; i++) g[i] = rnd();
  const at = (x, y) => {
    x = ((x % S) + S) % S; y = ((y % S) + S) % S;
    return g[y * S + x];
  };
  const sm = t => t * t * (3 - 2 * t);
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);

    const a = at(xi, yi), b = at(xi + 1, yi), c = at(xi, yi + 1), d = at(xi + 1, yi + 1);
    return (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy;
  };
}
function makeFbm(seed, oct) {
  oct = oct || 4;

    let a = 0.5, f = 1, s = 0, tot = 0;
    for (let i = 0; i < oct; i++) { s += a * n(x * f, y * f); tot += a; a *= 0.5; f *= 2; }
    return s / tot;
  };
}
function newCanvas(w, h) {

  cv.height = Math.max(2, Math.round(h));

}
function normalFromCanvas(src, strength) {
  const w = src.width, h = src.height;
  const sctx = src.getContext('2d', { willReadFrequently: true });

  const lum = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    lum[i] = (img[i * 4] * 0.299 + img[i * 4 + 1] * 0.587 + img[i * 4 + 2] * 0.114) / 255;
  }
  const out = newCanvas(w, h);
  const octx = out.getContext('2d');
  const oimg = octx.createImageData(w, h);
  const d = oimg.data;
  for (let y = 0; y < h; y++) {
    const yp = ((y - 1 + h) % h) * w, yn = ((y + 1) % h) * w, yc = y * w;
    for (let x = 0; x < w; x++) {
      const xp = (x - 1 + w) % w, xn = (x + 1) % w;
      const l = lum[yc + xp], r = lum[yc + xn];
      const u = lum[yp + x], dn = lum[yn + x];
      let nx = (l - r) * strength, ny = (u - dn) * strength, nz = 1.0;
      const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
      nx /= len; ny /= len; nz /= len;
      const i4 = (yc + x) * 4;
      d[i4] = (nx * 0.5 + 0.5) * 255;
      d[i4 + 1] = (ny * 0.5 + 0.5) * 255;
      d[i4 + 2] = (nz * 0.5 + 0.5) * 255;
      d[i4 + 3] = 255;

}
function texFromCanvas(cv, repeatX, repeatY, srgb) {

}

/* ============================================================

   ============================================================ */
function overlayNoise(ctx, W, H, seed, res, scale, alpha, mode) {
  const cv = newCanvas(res, res);
  const c2 = cv.getContext('2d');
  const img = c2.createImageData(res, res);
  const f = makeFbm(seed, 5);
  for (let y = 0; y < res; y++) for (let x = 0; x < res; x++) {

    const i = (y * res + x) * 4;

    img.data[i] = t; img.data[i + 1] = t; img.data[i + 2] = t; img.data[i + 3] = 255;

function fineGrain(ctx, W, H, seed, alpha) {

  const rnd = mulberry32(seed);

    const v = Math.floor(rnd() * 255);
    img.data[i * 4] = v; img.data[i * 4 + 1] = v; img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255;

  ctx.restore();

function blobPath(ctx, cx, cy, r, pts, rnd, wob) {

function drawCrack(ctx, x, y, len, rnd, W, H) {

    ctx.strokeStyle = 'rgba(18,15,12,0.36)';
    ctx.lineWidth = 1.0;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    const bs = 3 + Math.floor(rnd() * 8);
    for (let i = 0; i < bs; i++) {
      a2 += (rnd() - 0.5) * 0.9;
      bx += Math.cos(a2) * seg * 0.8;
      by += Math.sin(a2) * seg * 0.8;

    }

}
function makeWallTexture(W, H, seed, base) {

  g.addColorStop(1.00, base[4]);

      grd.addColorStop(0.5, 'rgba(52,42,30,0.085)');
      grd.addColorStop(1, 'rgba(52,42,30,0)');

      grd.addColorStop(0.5, 'rgba(104,96,74,0.06)');

  }
  for (let i = 0; i < 13; i++) {

}
function makeCeilingTexture(W, H, seed) {
  const cv = newCanvas(W, H);
  const ctx = cv.getContext('2d');

  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#6d6759'); g.addColorStop(0.5, '#726b5c'); g.addColorStop(1, '#5a5549');

  for (let i = 0; i < 12; i++) drawCrack(ctx, rnd() * W, rnd() * H, 60 + rnd() * 200, rnd, W, H);

}
function makePlankTexture(W, H, seed, hueBase) {
  const cv = newCanvas(W, H);
  const ctx = cv.getContext('2d');
  const rnd = mulberry32(seed);
  const baseHue = (hueBase || 24) + rnd() * 12;
  const baseLight = 16 + rnd() * 9;
  ctx.fillStyle = 'hsl(' + baseHue + ', 22%, ' + baseLight + '%)';
  ctx.fillRect(0, 0, W, H);

    const x = rnd() * W, w = 0.6 + rnd() * 3.4, drift = (rnd() - 0.5) * 26, a = 0.03 + rnd() * 0.14;

const boxGeoCache = {};
function boxGeo(w, h, d) {
  const k = w.toFixed(4) + '_' + h.toFixed(4) + '_' + d.toFixed(4);
  if (!boxGeoCache[k]) boxGeoCache[k] = new THREE.BoxGeometry(w, h, d);
  return boxGeoCache[k];
}
function addBox(parent, w, h, d, mat, x, y, z, rx, ry, rz, cast, receive) {
  const m = new THREE.Mesh(boxGeo(w, h, d), mat);
  m.position.set(x, y, z);
  if (rx || ry || rz) m.rotation.set(rx || 0, ry || 0, rz || 0);
  m.castShadow = cast !== false;
  m.receiveShadow = receive !== false;
  parent.add(m);
  return m;
}
function roughen(geo, amp, freq, seed, axisMask) {
  const pos = geo.attributes.position;
  const f = makeFbm(seed, 4);
  const ax = axisMask || [1, 1, 1];
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const n1 = f(x * freq, y * freq);
    const n2 = f(z * freq + 31.7, x * freq + 11.3);
    const n3 = f(y * freq + 71.1, z * freq + 53.9);
    pos.setXYZ(i,
      x + (n1 - 0.5) * amp * ax[0],
      y + (n2 - 0.5) * amp * ax[1],
      z + (n3 - 0.5) * amp * ax[2]
    );
  }
  geo.computeVertexNormals();
  return geo;
}
function clothify(geo, ridgeAmp, ridgeFreq, noiseAmp, noiseFreq, seed, dirAxis) {
  const pos = geo.attributes.position;
  const f = makeFbm(seed, 4);
  const f2 = makeFbm(seed + 77, 3);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const u = dirAxis === 'x' ? x : z;
    const ridge = Math.sin(u * ridgeFreq + f(x * 0.6, z * 0.6) * 5.0) * ridgeAmp;
    const n = (f2(x * noiseFreq, z * noiseFreq) - 0.5) * noiseAmp;
    pos.setY(i, y + ridge + n);
  }
  geo.computeVertexNormals();
  return geo;
}
function buildRoomShell(opts) {
  const w = opts.w, l = opts.l, h = opts.h;
  const wallMat = opts.wallMat;
  const floorMat = opts.floorMat || MAT.plank[0];
  const ceilMat = opts.ceilMat || MAT.ceiling;
  const doors = opts.doors || [];
  const g = new THREE.Group();
  const HXr = w / 2, HZr = l / 2;
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(w, l), floorMat);
  fl.rotation.x = -Math.PI / 2;
  fl.receiveShadow = true;
  g.add(fl);
  const gr = new THREE.Mesh(new THREE.PlaneGeometry(w, l), MAT.grunge);
  gr.rotation.x = -Math.PI / 2;
  gr.position.y = 0.003;
  gr.renderOrder = 1;
  g.add(gr);
  const ce = new THREE.Mesh(new THREE.PlaneGeometry(w, l), ceilMat);
  ce.rotation.x = Math.PI / 2;
  ce.position.y = h;
  ce.receiveShadow = true;
  g.add(ce);
  const wallT = 0.16;
  function addWallSeg(axis, side, wallCoord, centerAlong, segLen) {
    let mesh;
    if (axis === 'x') {
      mesh = new THREE.Mesh(boxGeo(segLen, h, wallT), wallMat);
      mesh.position.set(centerAlong, h / 2, wallCoord);
    } else {
      mesh = new THREE.Mesh(boxGeo(wallT, h, segLen), wallMat);
      mesh.position.set(wallCoord, h / 2, centerAlong);
    }
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    g.add(mesh);
  }
  function addLintel(axis, side, wallCoord, doorAt, doorW, lintelH, doorH) {
    let mesh;
    if (axis === 'x') {
      mesh = new THREE.Mesh(boxGeo(doorW, lintelH, wallT), wallMat);
      mesh.position.set(doorAt, doorH + lintelH / 2, wallCoord);
    } else {
      mesh = new THREE.Mesh(boxGeo(wallT, lintelH, doorW), wallMat);
      mesh.position.set(wallCoord, doorH + lintelH / 2, doorAt);
    }
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    g.add(mesh);
  }
  function buildWall(axis, side, doorsOnWall) {
    const length = axis === 'x' ? w : l;
    const wallCoord = axis === 'x' ? (side < 0 ? -HZr : HZr) : (side < 0 ? -HXr : HXr);
    const sorted = (doorsOnWall || []).slice().sort((a, b) => a.at - b.at);
    let cursor = -length / 2;
    for (const d of sorted) {
      const start = d.at - d.width / 2;
      const end = d.at + d.width / 2;
      if (start > cursor) {
        const segLen = start - cursor;
        if (segLen > 0.01) addWallSeg(axis, side, wallCoord, cursor + segLen / 2, segLen);
      }
      const doorH = d.h || 2.1;
      if (doorH < h) addLintel(axis, side, wallCoord, d.at, d.width, h - doorH, doorH);
      cursor = end;
    }
    if (cursor < length / 2) {
      const segLen = length / 2 - cursor;
      if (segLen > 0.01) addWallSeg(axis, side, wallCoord, cursor + segLen / 2, segLen);
    }
  }
  buildWall('x', -1, doors.filter(d => d.side === 'n'));
  buildWall('x', +1, doors.filter(d => d.side === 's'));
  buildWall('z', +1, doors.filter(d => d.side === 'e'));
  buildWall('z', -1, doors.filter(d => d.side === 'w'));
  return { group: g, bounds: { w, l, h, HXr, HZr } };
}
function buildDoorway(parent, opts) {
  const w = opts.width || 0.9;
  const h = opts.height || 2.05;
  const g = new THREE.Group();
  if (opts.axis === 'x') {
    g.position.set(opts.at, 0, opts.side < 0 ? -opts.roomL / 2 : opts.roomL / 2);
  } else {
    g.position.set(opts.side < 0 ? -opts.roomW / 2 : opts.roomW / 2, 0, opts.at);
    g.rotation.y = Math.PI / 2;
  }
  parent.add(g);
  const fm = MAT.woodDark;
  const fw = 0.06;
  addBox(g, fw, h + fw, 0.14, fm, -w / 2 - fw / 2, (h + fw) / 2, 0);
  addBox(g, fw, h + fw, 0.14, fm, w / 2 + fw / 2, (h + fw) / 2, 0);
  addBox(g, w + fw * 2, fw, 0.14, fm, 0, h + fw / 2, 0);
  const slab = addBox(g, w - 0.02, h - 0.03, 0.045, MAT.woodDark, 0, (h - 0.03) / 2 + 0.015, 0);
  slab.userData.interact = 'door';
  slab.userData.doorRef = { to: opts.to, spawnAt: opts.spawnAt, locked: opts.locked, keyId: opts.keyId, name: opts.name };
  addBox(g, w - 0.20, h * 0.36, 0.012, MAT.woodMid, 0, h * 0.70, 0.026, 0, 0, 0, false, true);
  addBox(g, w - 0.20, h * 0.30, 0.012, MAT.woodMid, 0, h * 0.28, 0.026, 0, 0, 0, false, true);
  const hg = new THREE.Group();
  hg.position.set(w / 2 - 0.12, h * 0.48, 0.035);
  g.add(hg);
  const rose = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.012, 12), MAT.brass);
  rose.rotation.x = Math.PI / 2;
  hg.add(rose);
  const lever = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.010, 0.09, 8), MAT.brass);
  lever.rotation.z = Math.PI / 2;
  lever.position.set(-0.04, 0, 0.018);
  hg.add(lever);
  return { group: g, slab };
}

  (function buildFloor() {

    const plankH = 0.028;
    const xStart = -HXr - 0.35, xEnd = HXr + 0.35;
    const zStart = -HZr - 0.35, zEnd = HZr + 0.35;

    while (x < xEnd) {
      const w = 0.105 + rnd() * 0.115;
      const cx = x + w / 2;
      let z = zStart;
      while (z < zEnd) {
        const len = 0.85 + rnd() * 0.75;
        const cz = Math.min(z + len / 2, zEnd + 0.2);
        const l = Math.min(len, zEnd + 0.4 - z);
        if (l < 0.12) break;
        const yOff = (rnd() - 0.5) * 0.008;
        const b = (col + (rnd() < 0.5 ? 0 : 1)) % 3;
        buckets[b].push({
          x: cx, y: -plankH / 2 + yOff, z: cz,
          sx: w - 0.006, sy: plankH, sz: l - 0.008,
          ry: (rnd() - 0.5) * 0.014, rz: (rnd() - 0.5) * 0.006, rx: (rnd() - 0.5) * 0.010,
          tint: 0.62 + rnd() * 0.55

        z += len + 0.006 + rnd() * 0.02;
      }

    }

  const W = 4.5, L = 4.0, H = 2.8;
  const HXr = W / 2, HZr = L / 2;
  const shell = buildRoomShell({
    w: W, l: L, h: H,

    floorMat: MAT.plank[2],
    ceilMat: MAT.ceiling,
    doors: [{ side: 's', at: 0, width: 0.85 }]
  });
  const g = shell.group;
  const colliders = [];
  const interactables = [];

  const chLight = new THREE.PointLight(0xbb8855, 0.9, 6.0, 2.0);
  chLight.position.set(0, H - 0.3, 0);
  g.add(chLight);

  const bed = new THREE.Group();
  bed.position.set(-HXr + 0.55, 0, -0.6);
  g.add(bed);
  const bw = 1.0, bl = 1.7;
  addBox(bed, 0.05, 0.5, 0.05, MAT.woodDark, -bw / 2, 0.25, -bl / 2);
  addBox(bed, 0.05, 0.5, 0.05, MAT.woodDark, bw / 2, 0.25, -bl / 2);
  addBox(bed, 0.05, 0.5, 0.05, MAT.woodDark, -bw / 2, 0.25, bl / 2);
  addBox(bed, 0.05, 0.5, 0.05, MAT.woodDark, bw / 2, 0.25, bl / 2);
  addBox(bed, bw, 0.04, bl, MAT.woodMid, 0, 0.28, 0);
  const mat = new THREE.Mesh(new THREE.BoxGeometry(bw - 0.06, 0.16, bl - 0.06), MAT.mattress);
  mat.position.y = 0.38;
  mat.castShadow = true;
  bed.add(mat);
  const pil = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.12, 0.3), MAT.pillow);
  pil.position.set(0, 0.52, -bl / 2 + 0.25);
  bed.add(pil);
  const blk = new THREE.Mesh(new THREE.BoxGeometry(bw + 0.08, 0.05, 1.0), MAT.blanket);
  blk.position.set(0, 0.48, 0.2);
  bed.add(blk);

  const desk = new THREE.Group();
  desk.position.set(HXr - 0.5, 0, 0.6);
  desk.rotation.y = -Math.PI / 2;
  g.add(desk);
  addBox(desk, 0.9, 0.04, 0.5, MAT.woodMid, 0, 0.55, 0);
  addBox(desk, 0.05, 0.55, 0.05, MAT.woodDark, -0.4, 0.275, -0.2);
  addBox(desk, 0.05, 0.55, 0.05, MAT.woodDark, 0.4, 0.275, -0.2);
  addBox(desk, 0.05, 0.55, 0.05, MAT.woodDark, -0.4, 0.275, 0.2);
  addBox(desk, 0.05, 0.55, 0.05, MAT.woodDark, 0.4, 0.275, 0.2);

  const drawing = new THREE.Group();
  drawing.position.set(0, 0.58, 0);
  drawing.rotation.set(-Math.PI / 2, 0, 0.1);
  desk.add(drawing);
  drawing.add(new THREE.Mesh(new THREE.PlaneGeometry(0.28, 0.38), MAT.paper));
  drawing.userData.interact = 'drawing';
  interactables.push(drawing);

  const toysG = new THREE.Group();
  toysG.position.set(-0.5, 0, 1.2);
  g.add(toysG);
  const toyRnd = mulberry32(200);
  for (let i = 0; i < 4; i++) {
    const t = new THREE.Mesh(
      new THREE.BoxGeometry(0.06 + toyRnd() * 0.08, 0.06 + toyRnd() * 0.08, 0.06 + toyRnd() * 0.08),
      new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(toyRnd() * 0.6, 0.5, 0.3) })
    );
    t.position.set((toyRnd() - 0.5) * 0.5, 0.04, (toyRnd() - 0.5) * 0.5);
    t.rotation.y = toyRnd() * 3;
    toysG.add(t);
  }

  // Anya's doll
  const doll = new THREE.Group();
  doll.position.set(0, 0.56, 0.4);
  bed.add(doll);
  addBox(doll, 0.07, 0.10, 0.05, MAT.pillow, 0, 0.05, 0);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), MAT.pillow);
  head.position.y = 0.13;
  doll.add(head);
  addBox(doll, 0.10, 0.08, 0.07, new THREE.MeshStandardMaterial({ color: 0x8a3a3a, roughness: 1.0 }), 0, 0.05, 0);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.038, 10, 8), new THREE.MeshStandardMaterial({ color: 0x2a1a10, roughness: 1.0 }));
  hair.position.y = 0.15;
  hair.scale.set(1.0, 0.85, 1.05);
  doll.add(hair);
  doll.userData.interact = 'pickup';
  doll.userData.itemId = 'anyaDoll';
  doll.userData.itemName = 'Кукла Ани';
  doll.userData.itemDesc = 'Тряпичная кукла. Тёплая. Как будто её только что держали в руках.';
  doll.userData.itemIcon = '✦';
  interactables.push(doll);

  // Marыia's final page
  const noteG = new THREE.Group();
  noteG.position.set(1.2, 0.02, -1.4);
  noteG.rotation.set(-Math.PI / 2, 0, 1.2);
  g.add(noteG);
  noteG.add(new THREE.Mesh(new THREE.PlaneGeometry(0.21, 0.29), MAT.paper));
  noteG.userData.interact = 'note';
  noteG.userData.noteId = 'maria2';
  interactables.push(noteG);

  // Children's room key is on the small desk now (top of the desk, drawn as a tiny brass object)
  const crKey = new THREE.Group();
  crKey.position.set(0.3, 0.575, -0.1);
  desk.add(crKey);
  const keyMat3 = new THREE.MeshStandardMaterial({ color: 0x6b5a34, roughness: 0.42, metalness: 0.9 });
  addBox(crKey, 0.006, 0.004, 0.06, keyMat3, 0, 0, 0);
  const cring = new THREE.Mesh(new THREE.TorusGeometry(0.014, 0.0025, 6, 12), keyMat3);
  cring.rotation.x = Math.PI / 2;
  cring.position.z = 0.035;
  crKey.add(cring);
  crKey.userData.interact = 'pickup';
  crKey.userData.itemId = 'childrensKey';
  crKey.userData.itemName = 'Ключ из детской';
  crKey.userData.itemDesc = 'Маленький железный ключ. Тёплый, будто его только что держали в руке.';
  crKey.userData.itemIcon = '⚿';
  interactables.push(crKey);

  colliders.push(
    { minX: -HXr, maxX: -HXr + 1.05, minZ: -1.45, maxZ: 0.25 },
    { minX: HXr - 1.05, maxX: HXr, minZ: 0.35, maxZ: 0.85 }
  );

  return {
    id: 'children',
    group: g,
    bounds: { w: W, l: L, h: H, HXr, HZr },
    colliders,
    interactables,
    spawns: { fromStudy: { x: 0, z: HZr - 0.55, yaw: Math.PI } }

}

/* ---------- BASEMENT (with electrical panel) ---------- */
function buildBasement() {
  const W = 6.0, L = 6.0, H = 2.5;
  const HXr = W / 2, HZr = L / 2;
  const shell = buildRoomShell({
    w: W, l: L, h: H,
    wallMat: MAT.wallStone,
    floorMat: MAT.stoneFloor,
    ceilMat: MAT.wallStone,
    doors: [{ side: 'n', at: -1.5, width: 0.8 }]
  });
  const g = shell.group;
  const colliders = [];
  const interactables = [];

  const bsLight = new THREE.PointLight(0x8899cc, 0.5, 5.0, 2.0);
  bsLight.position.set(0, H - 0.3, 0);
  g.add(bsLight);

  const sh = new THREE.Group();
  sh.position.set(HXr - 0.25, 0, 0);
  sh.rotation.y = -Math.PI / 2;
  g.add(sh);
  addBox(sh, 2.2, 2.0, 0.4, MAT.woodDark, 0, 1.0, 0);
  for (let s = 0; s < 4; s++) addBox(sh, 2.1, 0.03, 0.36, MAT.woodMid, 0, 0.3 + s * 0.5, 0, 0, 0, 0, false, true);

  const jarRnd = mulberry32(933);
  for (let s = 0; s < 4; s++) {
    for (let i = 0; i < 5; i++) {
      const jar = new THREE.Mesh(
        new THREE.CylinderGeometry(0.04, 0.04, 0.10, 8),
        new THREE.MeshStandardMaterial({ color: 0x2a2a2e, roughness: 0.5 })
      );
      jar.position.set(-0.9 + i * 0.45, 0.32 + s * 0.5 + 0.05, 0.02);
      sh.add(jar);
    }
  }

  const bench = new THREE.Group();
  bench.position.set(-1.2, 0, 0.4);
  g.add(bench);
  addBox(bench, 1.4, 0.05, 0.6, MAT.woodMid, 0, 0.76, 0);
  addBox(bench, 0.06, 0.75, 0.06, MAT.woodDark, -0.65, 0.375, -0.25);
  addBox(bench, 0.06, 0.75, 0.06, MAT.woodDark, 0.65, 0.375, -0.25);
  addBox(bench, 0.06, 0.75, 0.06, MAT.woodDark, -0.65, 0.375, 0.25);
  addBox(bench, 0.06, 0.75, 0.06, MAT.woodDark, 0.65, 0.375, 0.25);

  const brokenChair = new THREE.Group();
  brokenChair.position.set(-HXr + 0.6, 0, -HZr + 0.6);
  brokenChair.rotation.y = 0.6;
  brokenChair.rotation.z = 0.15;
  g.add(brokenChair);
  addBox(brokenChair, 0.4, 0.04, 0.4, MAT.woodDark, 0, 0.42, 0);
  addBox(brokenChair, 0.04, 0.42, 0.04, MAT.woodDark, -0.16, 0.21, -0.16);
  addBox(brokenChair, 0.04, 0.42, 0.04, MAT.woodDark, 0.16, 0.21, -0.16);
  addBox(brokenChair, 0.04, 0.42, 0.04, MAT.woodDark, -0.16, 0.21, 0.16);

  // ==== ELECTRICAL PANEL on the wall (interactable) ====
  const panelG = new THREE.Group();
  panelG.position.set(-HXr + 0.09, 1.5, -0.8);
  panelG.rotation.y = Math.PI / 2;
  g.add(panelG);
  // panel box
  addBox(panelG, 0.42, 0.55, 0.10, MAT.metalDark, 0, 0, 0);
  addBox(panelG, 0.40, 0.53, 0.02, new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6, metalness: 0.5 }), 0, 0, 0.06);
  // switch row
  for (let i = 0; i < 6; i++) {
    const sw = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.045, 0.02), MAT.metalBright);
    sw.position.set(-0.14 + i * 0.056, 0.12, 0.075);
    sw.rotation.x = (i % 3 === 0) ? 0.4 : -0.2;
    panelG.add(sw);
  }
  // fuse slot (empty)
  const slot = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.06, 0.03), new THREE.MeshStandardMaterial({
    color: 0x0a0a0a, roughness: 0.9, metalness: 0.1
  }));
  slot.position.set(0, -0.05, 0.06);
  panelG.add(slot);
  panelG.userData.interact = 'panel';
  interactables.push(panelG);
  window.__panelSlot = slot;

  // Basement final note
  const noteG = new THREE.Group();
  noteG.position.set(-1.2, 0.79, 0.4);
  noteG.rotation.set(-Math.PI / 2, 0, -0.1);
  g.add(noteG);
  noteG.add(new THREE.Mesh(new THREE.PlaneGeometry(0.21, 0.29), MAT.paper));
  noteG.userData.interact = 'note';
  noteG.userData.noteId = 'andreiFinal';
  interactables.push(noteG);

  // Hidden door — locked, needs anyaDoll
  const hiddenDoor = buildDoorway(g, {
    axis: 'z', side: -1, at: 1.0,
    width: 0.85, height: 1.95,
    roomW: W, roomL: L,
    to: 'hiddenRoom', spawnAt: 'fromBasement',
    locked: true, keyId: 'anyaDoll',
    name: 'Скрытая дверь'
  });
  interactables.push(hiddenDoor.slab);

  colliders.push(
    { minX: HXr - 0.5, maxX: HXr, minZ: -1.1, maxZ: 1.1 },
    { minX: -1.95, maxX: -0.45, minZ: 0.05, maxZ: 0.75 },
    { minX: -HXr, maxX: -HXr + 0.9, minZ: -HZr, maxZ: -HZr + 0.9 }
  );

  return {
    id: 'basement',
    group: g,
    bounds: { w: W, l: L, h: H, HXr, HZr },
    colliders,
    interactables,
    spawns: {
      fromKitchen: { x: -1.5, z: HZr - 0.6, yaw: Math.PI },
      fromHidden: { x: -HXr + 0.7, z: 1.0, yaw: Math.PI / 2 }
    }
  };
}

/* ---------- HIDDEN ROOM ---------- */
function buildHiddenRoom() {
  const W = 4.0, L = 4.0, H = 2.4;
  const HXr = W / 2, HZr = L / 2;
  const shell = buildRoomShell({
    w: W, l: L, h: H,
    wallMat: MAT.wallStone,
    floorMat: MAT.stoneFloor,
    ceilMat: MAT.wallStone,
    doors: [{ side: 'e', at: 1.0, width: 0.85 }]
  });
  const g = shell.group;
  const colliders = [];
  const interactables = [];

  const hrLight = new THREE.PointLight(0x9955aa, 0.8, 5.0, 2.0);
  hrLight.position.set(0, H - 0.4, 0);
  g.add(hrLight);

  const wallG = new THREE.Group();
  wallG.position.set(0, 1.4, -HZr + 0.05);
  g.add(wallG);
  const rnd = mulberry32(4444);
  for (let i = 0; i < 14; i++) {
    const px = -1.6 + (i % 7) * 0.5;
    const py = 0.4 - Math.floor(i / 7) * 0.55;
    const size = 0.18 + rnd() * 0.06;
    addBox(wallG, size, size * 1.2, 0.01, MAT.paper, px, py, 0);

  }

  const chair = new THREE.Group();
  chair.position.set(0, 0, 0.4);
  g.add(chair);
  addBox(chair, 0.36, 0.03, 0.36, MAT.woodDark, 0, 0.44, 0);
  addBox(chair, 0.035, 0.44, 0.035, MAT.woodDark, -0.14, 0.22, -0.14);
  addBox(chair, 0.035, 0.44, 0.035, MAT.woodDark, 0.14, 0.22, -0.14);
  addBox(chair, 0.035, 0.44, 0.035, MAT.woodDark, -0.14, 0.22, 0.14);
  addBox(chair, 0.035, 0.44, 0.035, MAT.woodDark, 0.14, 0.22, 0.14);

  const altar = new THREE.Group();
  altar.position.set(0, 0, -HZr + 1.2);
  g.add(altar);
  addBox(altar, 0.9, 0.7, 0.5, MAT.woodDark, 0, 0.35, 0);
  addBox(altar, 0.95, 0.05, 0.55, MAT.woodMid, 0, 0.72, 0);

  const shoes = new THREE.Group();
  shoes.position.set(0.5, 0, -HZr + 1.2);
  shoes.rotation.y = -0.5;
  g.add(shoes);
  addBox(shoes, 0.10, 0.05, 0.20, MAT.woodDark, -0.06, 0.03, 0);
  addBox(shoes, 0.10, 0.05, 0.20, MAT.woodDark, 0.06, 0.03, 0);
  shoes.userData.interact = 'finalShoes';
  interactables.push(shoes);

  const finalNote = new THREE.Group();
  finalNote.position.set(0, 0.75, -HZr + 1.2);
  finalNote.rotation.x = -Math.PI / 2;
  finalNote.rotation.z = 0.15;
  g.add(finalNote);
  finalNote.add(new THREE.Mesh(new THREE.PlaneGeometry(0.21, 0.29), MAT.paper));
  finalNote.userData.interact = 'note';
  finalNote.userData.noteId = 'andreiFinalLetter';
  interactables.push(finalNote);

  colliders.push({ minX: -0.5, maxX: 0.5, minZ: -HZr + 0.9, maxZ: -HZr + 1.5 });

  return {
    id: 'hiddenRoom',
    group: g,
    bounds: { w: W, l: L, h: H, HXr, HZr },
    colliders,
    interactables,
    spawns: { fromBasement: { x: HXr - 0.6, z: 1.0, yaw: -Math.PI / 2 } }
  };
}

/* ---------- UPSTAIRS HALL (new) ---------- */
function buildUpstairsHall() {
  const W = 3.0, L = 8.0, H = 2.9;
  const HXr = W / 2, HZr = L / 2;
  const shell = buildRoomShell({
    w: W, l: L, h: H,
    wallMat: MAT.wallUpstairs,
    floorMat: MAT.plank[0],
    ceilMat: MAT.ceiling,
    doors: [
      { side: 'e', at: 3.0, width: 1.0 },      // back downstairs
      { side: 'n', at: 0, width: 0.85 },       // to sealed bedroom
      { side: 'w', at: -2.5, width: 0.85 }     // to storage room
    ]
  });
  const g = shell.group;
  const colliders = [];
  const interactables = [];

  // Dim emergency light (flickers only if no power)
  const upLight = new THREE.PointLight(0x8899bb, 0.25, 6.0, 2.0);
  upLight.position.set(0, H - 0.4, 0);
  g.add(upLight);
  const upLight2 = new THREE.PointLight(0xffcc88, 0.0, 6.0, 2.0);
  upLight2.position.set(0, H - 0.4, -3);
  g.add(upLight2);
  window.__upstairsLight = upLight;
  window.__upstairsLight2 = upLight2;

  // Old portraits hanging
  for (let i = 0; i < 3; i++) {
    const z = -3 + i * 3;
    const pG = new THREE.Group();
    pG.position.set(-HXr + 0.06, 1.7, z);
    pG.rotation.y = Math.PI / 2;
    g.add(pG);
    addBox(pG, 0.32, 0.40, 0.012, MAT.paper, 0, 0, 0);
    addBox(pG, 0.36, 0.05, 0.04, MAT.woodDark, 0, 0.22, -0.02);
    addBox(pG, 0.36, 0.05, 0.04, MAT.woodDark, 0, -0.22, -0.02);
  }

  // Cobweb effect via thin dark planes in corners (visual)
  // A covered mirror on east wall
  const coveredMirror = new THREE.Group();
  coveredMirror.position.set(HXr - 0.06, 1.6, -1.5);
  coveredMirror.rotation.y = -Math.PI / 2;
  g.add(coveredMirror);
  addBox(coveredMirror, 0.5, 0.7, 0.02, MAT.paper, 0, 0, 0);
  addBox(coveredMirror, 0.55, 0.05, 0.05, MAT.woodDark, 0, 0.36, -0.02);
  addBox(coveredMirror, 0.55, 0.05, 0.05, MAT.woodDark, 0, -0.36, -0.02);
  coveredMirror.userData.interact = 'coveredMirror';
  interactables.push(coveredMirror);

  // Door to sealed bedroom — permanently locked (story)
  const sealed = buildDoorway(g, {
    axis: 'x', side: -1, at: 0,
    width: 0.85, height: 2.05,
    roomW: W, roomL: L,
    to: null, spawnAt: null,
    locked: true, keyId: 'never',
    name: 'Запертая спальня'
  });
  sealed.slab.userData.doorRef.customMessage = 'Заперто изнутри. Ключа нет. Дверь не поддаётся.';
  interactables.push(sealed.slab);

  // Storage room door — unlocked once upstairs is reachable
  const storageDoor = buildDoorway(g, {
    axis: 'z', side: -1, at: -2.5,
    width: 0.85, height: 2.0,
    roomW: W, roomL: L,
    to: 'storage', spawnAt: 'fromUpstairs',
    locked: false, name: 'Кладовая'
  });
  interactables.push(storageDoor.slab);

  // Back downstairs door (opened from the inside — no lock)
  const downDoor = buildDoorway(g, {
    axis: 'z', side: 1, at: 3.0,
    width: 1.0, height: 2.15,
    roomW: W, roomL: L,
    to: 'hallway', spawnAt: 'fromUpstairs',
    locked: false, name: 'Лестница вниз'
  });
  interactables.push(downDoor.slab);

  // A small note on the floor — story beat
  const noteG = new THREE.Group();
  noteG.position.set(0.2, 0.02, 1.2);
  noteG.rotation.set(-Math.PI / 2, 0, 0.4);
  g.add(noteG);
  noteG.add(new THREE.Mesh(new THREE.PlaneGeometry(0.21, 0.29), MAT.paper));
  noteG.userData.interact = 'note';
  noteG.userData.noteId = 'upstairsNote';
  interactables.push(noteG);

  return {
    id: 'upstairsHall',
    group: g,
    bounds: { w: W, l: L, h: H, HXr, HZr },
    colliders,
    interactables,
    spawns: {
      fromMainHall: { x: HXr - 0.7, z: 3.0, yaw: -Math.PI / 2 },
      fromStorage: { x: -HXr + 0.7, z: -2.5, yaw: Math.PI / 2 }
    }
  };
}

/* ---------- STORAGE ROOM (new) ---------- */
function buildStorage() {
  const W = 3.5, L = 3.5, H = 2.5;
  const HXr = W / 2, HZr = L / 2;
  const shell = buildRoomShell({
    w: W, l: L, h: H,
    wallMat: MAT.wallUpstairs,
    floorMat: MAT.plank[1],
    ceilMat: MAT.ceiling,
    doors: [{ side: 'e', at: 0, width: 0.85 }]
  });
  const g = shell.group;
  const colliders = [];
  const interactables = [];

  const stLight = new THREE.PointLight(0x8899bb, 0.3, 4.5, 2.0);
  stLight.position.set(0, H - 0.3, 0);
  g.add(stLight);
  window.__storageLight = stLight;

  // Lots of stacked boxes
  const rnd = mulberry32(7777);
  for (let i = 0; i < 14; i++) {
    const bx = (rnd() - 0.5) * (W - 0.8);
    const bz = (rnd() - 0.5) * (L - 0.8);
    const bw = 0.25 + rnd() * 0.35;
    const bh = 0.25 + rnd() * 0.35;
    const bd = 0.25 + rnd() * 0.35;
    const tone = 0.2 + rnd() * 0.15;
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(0.08, 0.35, tone),
      roughness: 0.9, metalness: 0.0
    });
    addBox(g, bw, bh, bd, mat, bx, bh / 2, bz);
  }

  // Old wardrobe pushed against wall — hiding place
  const wardrobe = new THREE.Group();
  wardrobe.position.set(-HXr + 0.4, 0, -1.0);
  wardrobe.rotation.y = Math.PI / 2;
  g.add(wardrobe);
  addBox(wardrobe, 1.0, 2.0, 0.55, MAT.woodDark, 0, 1.0, 0);
  addBox(wardrobe, 0.95, 0.05, 0.5, MAT.wardrobeInterior, 0, 1.9, 0, 0, 0, 0, false, true);
  const wdoor = addBox(wardrobe, 0.48, 1.9, 0.04, MAT.woodMid, -0.24, 1.0, 0.30);
  wdoor.userData.interact = 'storageWardrobe';
  interactables.push(wdoor);
  const wdoor2 = addBox(wardrobe, 0.48, 1.9, 0.04, MAT.woodMid, 0.24, 1.0, 0.30);
  wdoor2.userData.interact = 'storageWardrobe';
  interactables.push(wdoor2);

  // Note
  const noteG = new THREE.Group();
  noteG.position.set(0.4, 0.02, 1.2);

  noteG.userData.noteId = 'storageNote';
  interactables.push(noteG);

  // Old family photo (very important clue — the same photo but with the "future" player visible)
  const photo = new THREE.Group();
  photo.position.set(HXr - 0.06, 1.6, 0.8);
  photo.rotation.y = -Math.PI / 2;
  g.add(photo);
  addBox(photo, 0.30, 0.40, 0.012, MAT.paper, 0, 0, 0);
  addBox(photo, 0.34, 0.05, 0.04, MAT.woodDark, 0, 0.22, -0.02);
  addBox(photo, 0.34, 0.05, 0.04, MAT.woodDark, 0, -0.22, -0.02);
  photo.userData.interact = 'familyPhotoOld';
  interactables.push(photo);

  colliders.push(
    { minX: -HXr, maxX: -HXr + 0.75, minZ: -1.35, maxZ: -0.65 }
  );

  return {
    id: 'storage',
    group: g,
    bounds: { w: W, l: L, h: H, HXr, HZr },
    colliders,
    interactables,
    spawns: { fromUpstairs: { x: HXr - 0.65, z: 0, yaw: -Math.PI / 2 } }
  };
}

/* ============================================================
   TRANSITIONS
   ============================================================ */
const fadeEl = document.getElementById('fade');
let transitioning = false;

function transitionTo(roomId, spawnKey) {
  if (transitioning) return;
  if (!Rooms[roomId]) return;
  transitioning = true;
  fadeEl.classList.add('on');
  setTimeout(() => {
    const cur = Rooms[GameState.currentRoom];
    if (cur) cur.group.visible = false;
    const next = Rooms[roomId];
    next.group.visible = true;
    GameState.currentRoom = roomId;
    const sp = (next.spawns && (next.spawns[spawnKey] || next.spawns[Object.keys(next.spawns)[0]])) || { x: 0, z: 0, yaw: 0 };
    player.pos.set(sp.x, 0, sp.z);
    player.vel.set(0, 0, 0);
    player.yaw = sp.yaw;
    player.pitch = 0;
    player.bobT = 0;
    setTimeout(() => {
      fadeEl.classList.remove('on');
      transitioning = false;
      onEnterRoom(roomId);
    }, 100);
  }, 350);
}

function onEnterRoom(roomId) {
  if (roomId === 'hallway' && !getFlag('seen_hallway')) {
    setFlag('seen_hallway', true);
    showCaption('Пустой коридор. Дом кажется больше, чем снаружи.', 6000);
  }
  if (roomId === 'kitchen' && !getFlag('seen_kitchen')) {
    setFlag('seen_kitchen', true);
    showCaption('Кухня. Кто-то недавно ужинал здесь.', 5000);
  }
  if (roomId === 'children' && !getFlag('seen_children')) {
    setFlag('seen_children', true);
    showCaption('Детская. Вещи нетронуты. Как будто ждут её возвращения.', 6500);
  }
  if (roomId === 'basement' && !getFlag('seen_basement')) {
    setFlag('seen_basement', true);
    showCaption('Подвал. Пахнет землёй и ржавчиной.', 5000);
    Audio.distantRumble(0.05);
  }
  if (roomId === 'hiddenRoom' && !getFlag('seen_hidden')) {
    setFlag('seen_hidden', true);
    showCaption('...', 2000);
  }
  if (roomId === 'upstairsHall' && !getFlag('seen_upstairs')) {
    setFlag('seen_upstairs', true);
    showCaption('Второй этаж. Здесь холоднее.', 4500);
    // Once here, if we return to bedroom later, dynamic events will trigger
  }
  if (roomId === 'storage' && !getFlag('seen_storage')) {
    setFlag('seen_storage', true);
    showCaption('Кладовая. Пыль, коробки, запах старой ткани.', 5500);
    setObjective('Вернуться в спальню и осмотреть фотографию');
  }

  // Dynamic environment: when player returns to bedroom after power/upstairs, trigger subtle changes
  if (roomId === 'bedroom' && getFlag('seen_upstairs') && !getFlag('bedroomChanged')) {
    setFlag('bedroomChanged', true);
    applyBedroomChange();
  }
}

function applyBedroomChange() {
  const r = Rooms.bedroom;
  if (!r || !r.dynamicRefs) return;
  // Move the chair
  if (r.dynamicRefs.chair) {
    const ch = r.dynamicRefs.chair;
    ch.position.set(0.2, 0, -0.85);
    ch.rotation.y = 0.4;
  }
  // Slightly rotate the photo
  if (r.dynamicRefs.photo) {
    r.dynamicRefs.photo.rotation.y = -0.4;
  }
  showCaption('...', 2000);
  setTimeout(() => {
    showCaption('Стул стоит не там, где ты его оставил. И фотография повёрнута.', 6500);
  }, 2400);
  Audio.whisper();
}
