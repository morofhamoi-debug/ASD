Renderers.terminal = (body) => {
  body.innerHTML = `<div class="term-app" id="termBody" style="background:#0a0a0c;color:#e8e8e8;font-family:'SF Mono','Menlo',monospace;font-size:13.5px;line-height:1.55;padding:14px;overflow-y:auto;height:100%">
    <div>NovaOS Terminal v1.0</div>
    <div>Введите <span style="color:#30d158">help</span> для списка команд.</div>
    <div id="termOut"></div>
    <div><span style="color:#30d158">$</span> <input id="termInput" style="background:transparent;border:none;color:#e8e8e8;font:inherit;outline:none;width:70%" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
  </div>`;
  const termBody = body.querySelector('#termBody');
  const input = body.querySelector('#termInput');
  const out = body.querySelector('#termOut');
  setTimeout(() => input.focus(), 300);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const cmd = input.value.trim();
      input.value = '';
      const result = runCmd(cmd);
      const line = el('div', {html:`<span style="color:#30d158">$</span> ${esc(cmd)}` + (result ? `\n${result}` : '')});
      line.style.whiteSpace = 'pre-wrap';
      termBody.insertBefore(line, out.parentElement);
      termBody.scrollTop = termBody.scrollHeight;
      input.focus();
    }
  });
  termBody.onclick = () => input.focus();

  function runCmd(cmd) {
    const c = cmd.toLowerCase().trim();
    if (!c) return '';
    if (c === 'help') return 'Команды: help, date, time, whoami, ver, apps, open [app], echo [текст], clear, theme [dark|light], wall [0-5]';
    if (c === 'date') return new Date().toLocaleDateString('ru-RU');
    if (c === 'time') return new Date().toLocaleTimeString('ru-RU');
    if (c === 'whoami') return 'admin';
    if (c === 'ver') return 'NovaOS v1.0';
    if (c === 'apps') return Object.keys(APPS).join(', ');
    if (c.startsWith('echo ')) return esc(cmd.slice(5));
    if (c.startsWith('open ')) {
      const id = c.slice(5).trim();
      if (APPS[id]) { AppManager.open(id); return `Открываю ${APPS[id].name}`; }
      return `Приложение не найдено: ${esc(id)}`;
    }
    if (c.startsWith('theme ')) {
      const t = c.slice(6).trim();
      if (t === 'dark' || t === 'light') { S.theme = t; save(); applyTheme(); return `Тема: ${t}`; }
      return 'Использование: theme dark | light';
    }
    if (c.startsWith('wall ')) {
      const n = parseInt(c.slice(5));
      if (n >= 0 && n < WALLS.length) { S.wallpaper = n; save(); applyWallpaper(); return `Обои: ${n}`; }
      return `Обои 0-${WALLS.length-1}`;
    }
    if (c === 'clear') { termBody.innerHTML = `<div><span style="color:#30d158">$</span> <input id="termInput" style="background:transparent;border:none;color:#e8e8e8;font:inherit;outline:none;width:70%" autocomplete="off"></div>`; setTimeout(() => { const i2 = termBody.querySelector('#termInput'); i2.focus(); Renderers.terminal(body); }, 10); return ''; }
    return `Команда не найдена: ${esc(cmd)}`;
  }
};

/* ============================================================
   HOME BAR / HOME GESTURE
============================================================ */
function initHomeBar() {
  const bar = $('#homeBar');
  let startY = null, startTime = 0, holding = false, holdTimer = null;

  function start(y) {
    startY = y; startTime = Date.now(); holding = false;
    holdTimer = setTimeout(() => {
      holding = true;
      vibrate(15);
    }, 400);
  }
  function end(y) {
    clearTimeout(holdTimer);
    if (startY === null) return;
    const dy = startY - y;
    const dt = Date.now() - startTime;
    if (holding || (dy > 60 && dt > 400)) {
      // Long hold OR slow drag → App Switcher
      Switcher.open();
      AppManager.closeAll();
    } else if (dy > 60) {
      AppManager.goHome();
    }
    startY = null; holding = false;
  }

  bar.style.pointerEvents = 'auto';
  bar.addEventListener('pointerdown', e => start(e.clientY));
  bar.addEventListener('pointerup', e => end(e.clientY));
  bar.addEventListener('pointercancel', () => { startY = null; clearTimeout(holdTimer); });
}

/* ============================================================
   INIT
============================================================ */
function init() {
  applyTheme();
  applyWallpaper();
  applyBrightness();
  updateStatusBar();
  setInterval(updateStatusBar, 1000);
  setInterval(() => {
    // Battery drain simulation
    if (!S.charging && S.battery > 5 && Math.random() < 0.15) {
      S.battery -= 1;
      save();
    }
    // Charging
    if (S.charging && S.battery < 100) {
      S.battery += 1;
      save();
    }
  }, 30000);

  Lock.init();
  Home.init();
  CC.init();
  NC.init();
  Switcher.init();
  Spot.init();
  Gestures.init();
  initHomeBar();

  // Initial unlock check
  if (S.unlocked) {
    Lock.unlock();
  }

  // Unlock on swipe (also for desktop clicks on bottom of lock)
  $('#lock').addEventListener('dblclick', () => Lock.showPin('unlock'));

  // Home bar always available when unlocked
  document.addEventListener('keydown', e => {
    // Escape closes topmost
    if (e.key === 'Escape') {
      if ($('#pinScreen').classList.contains('open')) return;
      if (Spot && Spot.close) {
        const sp = $('#spotlight');
        if (sp.classList.contains('open')) { Spot.close(); return; }
      }
      const sw = $('#switcher');
      if (sw.classList.contains('open')) { Switcher.close(); return; }
      const cc = $('#cc');
      if (cc.classList.contains('open')) { CC.close(); return; }
      const nc = $('#nc');
      if (nc.classList.contains('open')) { NC.close(); return; }
      const al = $('#appLib');
      if (al.classList.contains('open')) { AppLib.close(); return; }
    }
    // 'h' for home on desktop
    if (e.key === 'h' && !e.target.matches('input, textarea')) {
      AppManager.goHome();
    }
  });

  console.log('%cNovaOS v1.0', 'color:#0a84ff;font-size:18px;font-weight:bold;padding:4px;');
  console.log('Сочетания клавиш: H = Home, Esc = Закрыть');
  console.log('Управление: свайп вверх для разблокировки, PIN по умолчанию: 1234');
}

// Boot
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else init();

// Global error handler
window.addEventListener('error', e => {
  console.error('NovaOS error:', e.error || e.message);
});
</script>
