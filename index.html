<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Preview Studio — iPhone 16 Pro Max</title>
<style>
  :root{
    --bg:#080b11;
    --panel:#0d1117;
    --panel-2:#141b26;
    --border:#1e2734;
    --text:#e6edf3;
    --muted:#7d8aa3;
    --accent:#4f8cff;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }

  /* ---------- TOP BAR ---------- */
  .topbar{
    flex:0 0 auto;height:56px;display:flex;align-items:center;gap:10px;
    padding:0 14px;overflow-x:auto;overflow-y:hidden;
    background:linear-gradient(180deg,#0e1420,#0a0f19);
    border-bottom:1px solid var(--border);
  }
  .brand{
    display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;
    white-space:nowrap;letter-spacing:-.01em;
  }
  .brand .bolt{
    width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
    background:linear-gradient(135deg,#4f8cff,#a855f7);font-size:13px;
  }
  .sep{width:1px;height:24px;background:var(--border);flex:0 0 auto}
  .field{display:flex;align-items:center;gap:7px;white-space:nowrap}
  .field > span{font-size:12px;color:var(--muted)}

  .control{
    appearance:none;-webkit-appearance:none;
    background:var(--panel-2);color:var(--text);
    border:1px solid var(--border);border-radius:9px;
    padding:7px 11px;font-size:13px;font-family:inherit;
    cursor:pointer;outline:none;transition:.15s border-color,.15s background;
  }
  .control:hover{border-color:#31405a;background:#182130}
  .control:active{transform:translateY(1px)}
  select.control{min-width:190px}

  .icon-btn{width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:15px}

  .zoom-group{
    display:flex;align-items:center;gap:2px;background:var(--panel-2);
    border:1px solid var(--border);border-radius:9px;padding:2px;
  }
  .zoom-group button{
    width:28px;height:28px;border:0;border-radius:7px;background:transparent;
    color:var(--text);font-size:15px;cursor:pointer;line-height:1;
  }
  .zoom-group button:hover{background:#1d2735}
  .zoom-val{min-width:46px;text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

  .check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
  .check input{accent-color:var(--accent);cursor:pointer}
  .spacer{flex:1 1 auto;min-width:8px}

  /* ---------- LAYOUT ---------- */
  main{flex:1;display:flex;min-height:0}
  .pane{display:flex;flex-direction:column;min-width:0;min-height:0}
  .editor-pane{width:42%;flex:0 0 auto;background:var(--panel)}
  .preview-pane{flex:1 1 auto;background:#05070b}

  .splitter{
    flex:0 0 6px;cursor:col-resize;background:transparent;position:relative;z-index:5;
  }
  .splitter::after{
    content:"";position:absolute;inset:0 2px;background:var(--border);border-radius:2px;transition:.15s;
  }
  .splitter:hover::after{background:var(--accent)}

  .pane-head{
    flex:0 0 auto;height:38px;display:flex;align-items:center;gap:10px;
    padding:0 14px;font-size:12px;color:var(--muted);
    background:#0b101a;border-bottom:1px solid var(--border);
    user-select:none;
  }
  .pane-head .hint{margin-left:auto;font-size:11px;opacity:.65}
  .dims{
    margin-left:auto;font-variant-numeric:tabular-nums;font-size:11px;
    background:var(--panel-2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;
  }
  .live-dot{
    width:7px;height:7px;border-radius:50%;background:#22c55e;
    box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}
    70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}
    100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}
  }

  /* ---------- EDITOR ---------- */
  .editor-body{flex:1;display:flex;min-height:0;background:#0d1117}
  .gutter{
    flex:0 0 54px;overflow:hidden;padding:12px 10px 60px 0;text-align:right;
    font:13px/21px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:#3d4a63;background:#0b1017;border-right:1px solid #161d28;
    user-select:none;white-space:pre;
  }
  #code{
    flex:1;min-width:0;padding:12px 16px 60px 12px;border:0;outline:0;resize:none;
    background:#0d1117;color:#dbe4f0;
    font:13px/21px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    white-space:pre;overflow:auto;tab-size:2;
  }
  #code::selection{background:#2a4a7f}

  /* ---------- PREVIEW STAGE ---------- */
  .stage{
    flex:1;min-height:0;overflow:auto;padding:28px;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 0%,#101a2b 0%,#05070b 65%);
  }
  .device-wrap{
    flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  }
  .device{
    position:relative;display:flex;flex-direction:column;
    background:#0b0d12;border-radius:12px;overflow:hidden;
    transform-origin:center center;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.85), 0 0 0 1px #263042;
  }
  .device iframe{border:0;display:block;background:#fff;flex:0 0 auto}

  /* browser chrome (не для телефонов) */
  .chrome{
    display:none;flex:0 0 36px;height:36px;align-items:center;gap:6px;
    padding:0 12px;background:#161c26;border-bottom:1px solid #222b3a;
  }
  .device:not(.phone):not(.fluid) .chrome{display:flex}
  .cdot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .cdot.r{background:#ff5f57}.cdot.y{background:#febc2e}.cdot.g{background:#28c840}
  .curl{
    flex:1;height:20px;margin-left:10px;border-radius:6px;background:#0a0e15;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#5d6a82;font-family:ui-monospace,monospace;
  }

  /* телефон */
  .device.phone{
    box-sizing:content-box;padding:12px;border-radius:54px;
    background:linear-gradient(160deg,#39414f,#0c0f15 35%,#1a212c 75%,#0c0f15);
    box-shadow:
      0 40px 90px -25px rgba(0,0,0,.95),
      0 0 0 1px #3b4658,
      inset 0 0 0 1px rgba(255,255,255,.07);
    overflow:visible;
  }
  .device.phone iframe{border-radius:42px}

  .notch{
    display:none;position:absolute;top:16px;left:50%;transform:translateX(-50%);
    width:108px;height:30px;border-radius:16px;background:#000;z-index:10;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .device.phone .notch{display:block}
  .home-bar{
    display:none;position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
    width:120px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);z-index:10;
  }
  .device.phone .home-bar{display:block}

  /* fluid */
  .device.fluid{
    width:100%!important;height:100%!important;border-radius:0;
    box-shadow:none;background:transparent;transform:none!important;
  }
  .device.fluid .chrome{display:none}

  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#222d3d;border-radius:6px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#33415a;background-clip:content-box}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="bolt">⚡</span>Live&nbsp;Preview</div>
  <div class="sep"></div>

  <div class="field">
    <span>Устройство</span>
    <select id="deviceSel" class="control"></select>
  </div>

  <button id="rotateBtn" class="control icon-btn" title="Повернуть (портрет / ландшафт)">⟳</button>

  <div class="zoom-group">
    <button id="zoomOut" title="Уменьшить">−</button>
    <div class="zoom-val" id="zoomVal">100%</div>
    <button id="zoomIn" title="Увеличить">+</button>
  </div>

  <label class="check"><input type="checkbox" id="autoFit" checked> Вписать</label>

  <div class="spacer"></div>
  <button id="resetBtn" class="control">Сбросить код</button>
</header>

<main>
  <section class="pane editor-pane" id="editorPane">
    <div class="pane-head">
      <span>index.html</span>
      <span class="hint">Ctrl + Enter — обновить сразу</span>
    </div>
    <div class="editor-body">
      <div class="gutter" id="gutter"></div>
      <textarea id="code" spellcheck="false" wrap="off" autocomplete="off"
        autocapitalize="off" autocorrect="off"></textarea>
    </div>
  </section>

  <div class="splitter" id="splitter"></div>

  <section class="pane preview-pane">
    <div class="pane-head">
      <span class="live-dot"></span>
      <span>Предпросмотр</span>
      <span class="dims" id="dims">—</span>
    </div>
    <div class="stage" id="stage">
      <div class="device-wrap" id="deviceWrap">
        <div class="device" id="deviceFrame">
          <div class="chrome">
            <span class="cdot r"></span><span class="cdot y"></span><span class="cdot g"></span>
            <div class="curl">localhost:3000</div>
          </div>
          <iframe id="preview" title="Предпросмотр"
            sandbox="allow-scripts allow-forms allow-modals allow-popups allow-pointer-lock"></iframe>
          <div class="notch"></div>
          <div class="home-bar"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
/* ============================================================
   УСТРОЙСТВА  (логические CSS-пиксели)
   ============================================================ */
const DEVICES = [
  { id:'ip16pm',   name:'iPhone 16 Pro Max',  w:440,  h:956,  phone:true  },
  { id:'ip16p',    name:'iPhone 16 Pro',      w:402,  h:874,  phone:true  },
  { id:'ip16',     name:'iPhone 16',          w:393,  h:852,  phone:true  },
  { id:'ip15',     name:'iPhone 15 / 14 Pro', w:393,  h:852,  phone:true  },
  { id:'ipse',     name:'iPhone SE',          w:375,  h:667,  phone:true  },
  { id:'gs24u',    name:'Galaxy S24 Ultra',   w:412,  h:915,  phone:true  },
  { id:'px9p',     name:'Pixel 9 Pro',        w:412,  h:923,  phone:true  },
  { id:'ipadmini', name:'iPad mini',          w:744,  h:1133, phone:false },
  { id:'ipadpro',  name:'iPad Pro 12.9"',     w:1024, h:1366, phone:false },
  { id:'mbp14',    name:'MacBook Pro 14"',    w:1512, h:982,  phone:false },
  { id:'desktop',  name:'Desktop 1440',       w:1440, h:900,  phone:false },
  { id:'fluid',    name:'Без рамки (резиновый)', w:null, h:null, phone:false }
];

/* ============================================================
   КОД ПО УМОЛЧАНИЮ
   ============================================================ */
const DEFAULT_CODE = `<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Моё приложение</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#eef2ff;
    background:radial-gradient(120% 80% at 50% 0%, #241a4d 0%, #0b1020 55%, #05070f 100%);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card{
    width:100%; max-width:380px; text-align:center;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    border-radius:28px; padding:28px 24px 22px;
    backdrop-filter:blur(14px);
    box-shadow:0 30px 60px -20px rgba(0,0,0,.7);
  }
  .avatar{
    width:84px; height:84px; border-radius:50%; margin:0 auto 16px;
    display:grid; place-items:center; font-size:34px;
    background:conic-gradient(from 210deg,#7c5cff,#22d3ee,#7c5cff);
  }
  h1{ margin:0 0 6px; font-size:22px; letter-spacing:-.02em; }
  p{ margin:0 0 22px; color:#a5b0d0; font-size:14px; line-height:1.5; }
  .row{ display:flex; gap:10px; }
  button{
    flex:1; padding:13px 16px; border-radius:14px; border:0;
    font-size:15px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .primary{ background:linear-gradient(135deg,#7c5cff,#4f46e5); color:#fff; }
  .ghost{ background:rgba(255,255,255,.08); color:#dfe4ff; border:1px solid rgba(255,255,255,.14); }
  .stats{ display:flex; gap:8px; margin-top:20px; }
  .stat{ flex:1; background:rgba(255,255,255,.05); border-radius:14px; padding:12px 8px; }
  .stat b{ display:block; font-size:17px; }
  .stat span{ font-size:10px; color:#93a0c4; text-transform:uppercase; letter-spacing:.06em; }
  @media (min-width:600px){ .card{ max-width:460px; } }
<\/style>
</head>
<body>
  <div class="card">
    <div class="avatar">🚀</div>
    <h1>Привет, разработчик!</h1>
    <p>Меняй код слева — предпросмотр справа обновится сам. Устройство переключается сверху.</p>
    <div class="row">
      <button class="primary" id="go">Начать</button>
      <button class="ghost">Позже</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="v">0</b><span>Клики</span></div>
      <div class="stat"><b>100%</b><span>Живой</span></div>
      <div class="stat"><b>24/7</b><span>Онлайн</span></div>
    </div>
  </div>
  <script>
    let n = 0;
    document.getElementById('go').addEventListener('click', () => {
      document.getElementById('v').textContent = ++n;
    });
  <\/script>
</body>
</html>`;

/* ============================================================
   ЭЛЕМЕНТЫ
   ============================================================ */
const $ = id => document.getElementById(id);
const els = {
  deviceSel : $('deviceSel'),
  rotateBtn : $('rotateBtn'),
  zoomIn    : $('zoomIn'),
  zoomOut   : $('zoomOut'),
  zoomVal   : $('zoomVal'),
  autoFit   : $('autoFit'),
  resetBtn  : $('resetBtn'),
  stage     : $('stage'),
  wrap      : $('deviceWrap'),
  frame     : $('deviceFrame'),
  iframe    : $('preview'),
  code      : $('code'),
  gutter    : $('gutter'),
  dims      : $('dims'),
  editorPane: $('editorPane'),
  splitter  : $('splitter')
};

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
const state = {
  deviceId : 'ip16pm',
  landscape: false,
  zoom     : 1,
  autoFit  : true
};

/* ============================================================
   ЗАПОЛНЯЕМ СПИСОК УСТРОЙСТВ
   ============================================================ */
DEVICES.forEach(d => {
  const o = document.createElement('option');
  o.value = d.id;
  o.textContent = d.name + (d.w ? `  —  ${d.w}×${d.h}` : '');
  els.deviceSel.appendChild(o);
});
els.deviceSel.value = state.deviceId;

/* ============================================================
   РАСКЛАДКА ПРЕДПРОСМОТРА
   ============================================================ */
function currentDevice(){
  return DEVICES.find(d => d.id === state.deviceId) || DEVICES[0];
}

function layout(){
  const d = currentDevice();
  const isPhone = !!d.phone;

  let w = d.w, h = d.h;
  if (w && h && state.landscape) { const t = w; w = h; h = t; }

  const frame = els.frame, wrap = els.wrap, iframe = els.iframe;

  frame.classList.toggle('phone', isPhone);
  frame.classList.toggle('fluid', !w);
  iframe.classList.toggle('fluid', !w);

  /* --- резиновый режим --- */
  if (!w){
    frame.style.width = '100%';
    frame.style.height = '100%';
    wrap.style.width = '100%';
    wrap.style.height = '100%';
    iframe.style.width = '100%';
    iframe.style.height = '100%';
    els.dims.textContent = 'резиновый';
    els.zoomVal.textContent = '—';
    return;
  }

  /* --- размеры --- */
  if (isPhone){
    frame.style.width  = w + 'px';
    frame.style.height = h + 'px';
    iframe.style.width  = w + 'px';
    iframe.style.height = h + 'px';
  } else {
    frame.style.width  = w + 'px';
    frame.style.height = (h + 36) + 'px';
    iframe.style.width  = w + 'px';
    iframe.style.height = h + 'px';
  }

  const totalW = isPhone ? w + 24 : w;
  const totalH = isPhone ? h + 24 : h + 36;

  /* --- масштаб --- */
  let scale = state.zoom;
  if (state.autoFit){
    const pad = 64;
    const sw = els.stage.clientWidth  - pad;
    const sh = els.stage.clientHeight - pad;
    scale = Math.min(1, sw / totalW, sh / totalH);
    scale = Math.max(0.1, scale);
  }
  state.effectiveZoom = scale;

  frame.style.transform = `scale(${scale})`;
  wrap.style.width  = (totalW * scale) + 'px';
  wrap.style.height = (totalH * scale) + 'px';

  els.dims.textContent = `${w} × ${h}`;
  els.zoomVal.textContent = Math.round(scale * 100) + '%';
}

/* ============================================================
   ПРЕДПРОСМОТР В РЕАЛЬНОМ ВРЕМЕНИ
   ============================================================ */
let previewTimer = null;
function schedulePreview(delay = 350){
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => {
    els.iframe.srcdoc = els.code.value;
  }, delay);
}

/* ============================================================
   РЕДАКТОР
   ============================================================ */
function updateGutter(){
  const lines = els.code.value.split('\n').length;
  let s = '';
  for (let i = 1; i <= lines; i++) s += (i === lines ? i : i + '\n');
  els.gutter.textContent = s;
  els.gutter.scrollTop = els.code.scrollTop;
}

let saveTimer = null;
function onInput(){
  updateGutter();
  schedulePreview();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem('lps.code', els.code.value); } catch(e){}
  }, 600);
}

els.code.addEventListener('input', onInput);
els.code.addEventListener('scroll', () => { els.gutter.scrollTop = els.code.scrollTop; });

/* Tab = 2 пробела */
els.code.addEventListener('keydown', e => {
  if (e.key === 'Tab'){
    e.preventDefault();
    const ta = e.target;
    const s = ta.selectionStart, en = ta.selectionEnd;
    ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(en);
    ta.selectionStart = ta.selectionEnd = s + 2;
    onInput();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
    e.preventDefault();
    clearTimeout(previewTimer);
    els.iframe.srcdoc = els.code.value;
  }
});

/* ============================================================
   УПРАВЛЕНИЕ
   ============================================================ */
els.deviceSel.addEventListener('change', e => {
  state.deviceId = e.target.value;
  layout();
});

els.rotateBtn.addEventListener('click', () => {
  state.landscape = !state.landscape;
  els.rotateBtn.style.color = state.landscape ? 'var(--accent)' : '';
  layout();
});

function setZoom(v){
  state.autoFit = false;
  els.autoFit.checked = false;
  state.zoom = Math.min(2.5, Math.max(0.15, v));
  layout();
}
els.zoomIn.addEventListener('click', () => setZoom((state.effectiveZoom || 1) + 0.1));
els.zoomOut.addEventListener('click', () => setZoom((state.effectiveZoom || 1) - 0.1));

els.autoFit.addEventListener('change', e => {
  state.autoFit = e.target.checked;
  if (!state.autoFit) state.zoom = state.effectiveZoom || 1;
  layout();
});

els.resetBtn.addEventListener('click', () => {
  if (!confirm('Вернуть исходный код? Твои изменения будут потеряны.')) return;
  els.code.value = DEFAULT_CODE;
  onInput();
  clearTimeout(previewTimer);
  els.iframe.srcdoc = els.code.value;
});

/* ============================================================
   ПЕРЕТАСКИВАНИЕ РАЗДЕЛИТЕЛЯ
   ============================================================ */
let dragging = false;
els.splitter.addEventListener('mousedown', e => {
  dragging = true;
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  e.preventDefault();
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const rect = document.querySelector('main').getBoundingClientRect();
  let w = e.clientX - rect.left;
  w = Math.max(220, Math.min(rect.width - 280, w));
  els.editorPane.style.width = w + 'px';
  layout();
});
window.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
});

/* ============================================================
   ПЕРЕСЧЁТ ПРИ ИЗМЕНЕНИИ ОКНА
   ============================================================ */
if (window.ResizeObserver){
  new ResizeObserver(() => layout()).observe(els.stage);
} else {
  window.addEventListener('resize', layout);
}
window.addEventListener('resize', layout);

/* ============================================================
   СТАРТ
   ============================================================ */
(function init(){
  let saved = null;
  try { saved = localStorage.getItem('lps.code'); } catch(e){}
  els.code.value = saved || DEFAULT_CODE;
  updateGutter();
  els.iframe.srcdoc = els.code.value;
  layout();
  requestAnimationFrame(layout);
})();
</script>
</body>
</html>
