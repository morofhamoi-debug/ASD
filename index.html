<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F2F3F5" />
<title>ASD BANK</title>
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<style>
:root {
  --bg: #F2F3F5;
  --bg-card: #FFFFFF;
  --bg-sunken: #EDEEF1;
  --bg-tile: #F0F1F3;
  --fg: #1A1A1A;
  --fg-muted: #8A8F98;
  --fg-subtle: #A8ADB5;
  --green: #B4E33D;
  --green-fg: #1A1A1A;
  --red: #FF3B30;
  --yellow: #FFCC00;
  --blue: #2E7CFF;
  --purple: #7C3BFF;
  --card-radius: 24px;
  --tile-radius: 20px;
  --radius-pill: 999px;
  --shadow: 0 2px 8px rgba(0,0,0,.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,.06);
  --transition: 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
[data-theme="dark"] {
  --bg: #0E0E10;
  --bg-card: #1C1C1E;
  --bg-sunken: #2A2A2C;
  --bg-tile: #252528;
  --fg: #F2F2F5;
  --fg-muted: #8E8E93;
  --fg-subtle: #636366;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: Inter, -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--fg);
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
a { color: inherit; text-decoration: none; }
input, select, textarea { font-family: inherit; font-size: inherit; }
[hidden] { display: none !important; }
::selection { background: var(--green); color: var(--green-fg); }
#app { width: 100%; max-width: 480px; min-height: 100vh; padding-bottom: 100px; position: relative; }
@media (min-width: 768px) {
  body { background: #E5E6E9; padding: 20px 0; }
  #app { background: var(--bg); min-height: calc(100vh - 40px); border-radius: 32px; box-shadow: 0 20px 60px rgba(0,0,0,.1); overflow: hidden; }
}

/* TOPBAR */
.topbar { display: flex; align-items: center; gap: 12px; padding: 16px 20px 12px; }
.avatar-circle { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-sunken); display: grid; place-items: center; color: var(--fg-muted); flex-shrink: 0; }
.avatar-circle svg { width: 20px; height: 20px; }
.topbar .name { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 4px; }
.topbar .name svg { width: 16px; height: 16px; color: var(--fg-subtle); }
.topbar .balance-pill { margin-left: auto; background: var(--green); color: var(--green-fg); font-weight: 700; font-size: 14px; padding: 8px 14px; border-radius: var(--radius-pill); white-space: nowrap; }

/* SECTIONS */
.section { padding: 0 16px; margin-bottom: 12px; }
.balance-card { background: var(--bg-card); border-radius: var(--card-radius); padding: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); }
.balance-card .label { font-size: 15px; color: var(--fg-muted); margin-bottom: 6px; }
.balance-card .amount { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; }
.balance-card .amount small { font-size: 20px; font-weight: 700; }
.balance-card .card-mini { width: 68px; height: 46px; border-radius: 8px; padding: 6px 8px; display: flex; flex-direction: column; justify-content: space-between; position: relative; color: white; }
.balance-card .card-mini .brand { font-size: 10px; font-weight: 800; }
.balance-card .card-mini .last4 { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; }
.balance-card .card-mini .mir { position: absolute; bottom: 5px; right: 6px; font-size: 8px; font-weight: 700; }

/* PROMO */
.promo { background: var(--bg-card); border-radius: var(--card-radius); overflow: hidden; box-shadow: var(--shadow); margin-top: 12px; }
.promo-top { padding: 18px 20px 14px; display: flex; justify-content: space-between; align-items: flex-start; }
.promo-top .txt { font-size: 15px; color: var(--fg-muted); }
.promo-top .title { font-size: 18px; font-weight: 700; color: var(--fg); margin-top: 4px; letter-spacing: -0.02em; }
.promo-top .close { width: 28px; height: 28px; display: grid; place-items: center; color: var(--fg-subtle); }
.promo-bottom { background: #D9E9FF; color: #1A3A6B; padding: 14px 20px; font-size: 14px; font-weight: 500; }
[data-theme="dark"] .promo-bottom { background: #0F2547; color: #B7D2FF; }

/* SEARCH */
.search-row { display: flex; gap: 8px; padding: 16px 16px 8px; align-items: center; }
.search-box { flex: 1; height: 48px; background: var(--bg-card); border-radius: var(--radius-pill); padding: 0 16px 0 44px; display: flex; align-items: center; position: relative; color: var(--fg-subtle); font-size: 15px; }
.search-box .icon { position: absolute; left: 14px; width: 22px; height: 22px; color: var(--fg); }
.search-box input { width: 100%; border: none; background: none; outline: none; color: var(--fg); font-size: 15px; }
.search-box input::placeholder { color: var(--fg-subtle); }
.circle-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--bg-card); display: grid; place-items: center; color: var(--fg); transition: transform var(--transition); flex-shrink: 0; }
.circle-btn:active { transform: scale(0.94); }
.circle-btn svg { width: 22px; height: 22px; }

/* SECTION HEAD */
.sec-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 12px; }
.sec-head h3 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 6px; }
.sec-head h3 svg { width: 16px; height: 16px; color: var(--fg-subtle); }

/* QUICK ACTIONS */
.quick-scroll { display: flex; gap: 14px; padding: 4px 16px 8px; overflow-x: auto; scrollbar-width: none; }
.quick-scroll::-webkit-scrollbar { display: none; }
.quick-item { flex-shrink: 0; width: 76px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.quick-item .icon-circle { width: 68px; height: 68px; border-radius: 50%; background: var(--bg-card); display: grid; place-items: center; transition: transform var(--transition); box-shadow: var(--shadow); }
.quick-item:active .icon-circle { transform: scale(0.92); }
.quick-item .icon-circle svg { width: 26px; height: 26px; }
.quick-item .icon-circle.green { background: var(--green); color: var(--green-fg); }
.quick-item .icon-circle.blue { background: #D9E9FF; color: #2E7CFF; }
.quick-item .icon-circle.red { background: #FFE0DF; color: #FF3B30; }
.quick-item .icon-circle.yellow { background: #FFF2CC; color: #B58B00; }
.quick-item .icon-circle.purple { background: #EDE0FF; color: #7C3BFF; }
.quick-item .icon-circle.dark { background: #2A2A2A; color: #FFFFFF; }
.quick-item .label { font-size: 12px; font-weight: 500; color: var(--fg); line-height: 1.25; }

/* PRIVILEGES */
.priv-scroll { display: flex; gap: 12px; padding: 4px 16px 8px; overflow-x: auto; scrollbar-width: none; }
.priv-scroll::-webkit-scrollbar { display: none; }
.priv-card { flex-shrink: 0; width: 260px; height: 130px; border-radius: var(--tile-radius); padding: 16px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; color: #1A1A1A; }
.priv-card .title { font-size: 15px; font-weight: 700; }
.priv-card .desc { font-size: 12px; opacity: 0.85; margin-top: 4px; }
.priv-card .emoji { font-size: 32px; position: absolute; right: 16px; bottom: 12px; }
.priv-card.teal { background: linear-gradient(135deg, #A8E6E6, #7DD3D3); }
.priv-card.blue { background: linear-gradient(135deg, #D9E9FF, #B8D4FF); }
.priv-card.pink { background: linear-gradient(135deg, #FFD9E5, #FFB8CF); }
.priv-card.green { background: linear-gradient(135deg, #E0F5B8, #C8E98D); }

/* LIST */
.list-card { background: var(--bg-card); border-radius: var(--card-radius); padding: 4px 16px; margin: 0 16px; box-shadow: var(--shadow); }
.list-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--bg-sunken); }
.list-row:last-child { border-bottom: none; }
.tx-icon { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; background: var(--bg-tile); color: var(--fg); font-weight: 700; font-size: 14px; }
.tx-icon.in { background: #E0F5B8; color: #4B7A00; }
.tx-icon.out { background: #FFE0DF; color: #C8102E; }
.tx-icon svg { width: 20px; height: 20px; }
.tx-meta { flex: 1; min-width: 0; }
.tx-title { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-sub { font-size: 12px; color: var(--fg-muted); margin: 2px 0 0; }
.tx-amount { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tx-amount.in { color: #4B7A00; }

/* BOTTOM NAV */
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--bg-card); display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid var(--bg-sunken); z-index: 50; }
@media (min-width: 768px) { .bottom-nav { border-radius: 0 0 32px 32px; } }
.bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; font-size: 11px; font-weight: 500; color: var(--fg-muted); position: relative; }
.bottom-nav a.active { color: var(--fg); }
.bottom-nav svg { width: 24px; height: 24px; }
.bottom-nav .badge { position: absolute; top: 0; right: 24%; background: var(--red); color: white; font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; display: grid; place-items: center; padding: 0 4px; }

/* PAGE HEADER */
.page-header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; }
.page-header .back { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-card); display: grid; place-items: center; box-shadow: var(--shadow); }
.page-header .back svg { width: 20px; height: 20px; }
.page-header h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }

/* BUTTONS */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 20px; border-radius: var(--radius-pill); font-size: 15px; font-weight: 600; transition: all var(--transition); white-space: nowrap; }
.btn svg { width: 18px; height: 18px; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--fg); color: var(--bg-card); }
.btn-primary:hover { opacity: 0.9; }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-green { background: var(--green); color: var(--green-fg); }
.btn-secondary { background: var(--bg-sunken); color: var(--fg); }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 14px; font-size: 13px; }

/* INPUTS */
.input, .select, .textarea { width: 100%; padding: 16px 18px; border-radius: 16px; border: none; background: var(--bg-card); color: var(--fg); font-size: 16px; transition: box-shadow var(--transition); }
.input:focus, .select:focus, .textarea:focus { outline: none; box-shadow: 0 0 0 2px var(--green); }
.input.error { box-shadow: 0 0 0 2px var(--red); }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.field label { font-size: 13px; font-weight: 500; color: var(--fg-muted); padding-left: 4px; }
.field .err { font-size: 12px; color: var(--red); padding-left: 4px; }

/* BANK CARD */
.bank-card { aspect-ratio: 1.586; border-radius: 20px; padding: 20px; color: white; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; background: linear-gradient(135deg, #E63946, #C8102E); box-shadow: 0 10px 30px rgba(200,16,46,.3); }
.bank-card.black { background: linear-gradient(135deg, #2A2A2A, #0E0E10); }
.bank-card.green { background: linear-gradient(135deg, #B4E33D, #8CB81F); color: #1A1A1A; }
.bank-card.blue  { background: linear-gradient(135deg, #2E7CFF, #1E4FBF); }
.bank-card .bc-brand { font-size: 14px; font-weight: 800; letter-spacing: 0.06em; }
.bank-card .bc-num { font-family: 'SF Mono', ui-monospace, monospace; font-size: 19px; letter-spacing: 0.14em; margin-top: auto; }
.bank-card .bc-bottom { display: flex; justify-content: space-between; align-items: end; font-size: 11px; opacity: 0.85; margin-top: 10px; }
.bank-card .bc-bottom b { display: block; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }

/* CHIPS / TABS */
.tabs-scroll { display: flex; gap: 8px; padding: 8px 16px 16px; overflow-x: auto; scrollbar-width: none; }
.tabs-scroll::-webkit-scrollbar { display: none; }
.chip { padding: 8px 16px; border-radius: var(--radius-pill); font-size: 14px; font-weight: 500; background: var(--bg-card); color: var(--fg-muted); white-space: nowrap; transition: all var(--transition); flex-shrink: 0; }
.chip.active { background: var(--fg); color: var(--bg-card); font-weight: 600; }

/* AUTH */
.auth-wrap { min-height: 100vh; padding: 32px 24px; display: flex; flex-direction: column; }
.auth-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 40px; }
.auth-logo .mark { width: 40px; height: 40px; border-radius: 12px; background: var(--fg); color: var(--bg-card); display: grid; place-items: center; font-weight: 800; font-size: 15px; }
.auth-logo .name { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
.auth-wrap h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; margin: 0 0 8px; }
.auth-wrap .sub { color: var(--fg-muted); font-size: 15px; margin: 0 0 28px; }

/* BADGE */
.badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; background: var(--bg-sunken); color: var(--fg-muted); }
.badge.success { background: #E0F5B8; color: #4B7A00; }
.badge.danger { background: #FFE0DF; color: #C8102E; }

/* TOAST */
.toast-wrap { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 200; width: calc(100% - 32px); max-width: 448px; pointer-events: none; }
.toast { background: var(--fg); color: var(--bg-card); padding: 14px 18px; border-radius: 16px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow-md); animation: toastIn 240ms cubic-bezier(0.2, 0.8, 0.2, 1); pointer-events: auto; }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* UTILS */
.empty { padding: 40px 20px; text-align: center; color: var(--fg-muted); }
.empty h3 { margin: 0 0 6px; color: var(--fg); font-size: 16px; font-weight: 600; }
.empty p { margin: 0 0 16px; font-size: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; } .mt-20 { margin-top: 20px; }
.muted { color: var(--fg-muted); }
.mono { font-family: 'SF Mono', ui-monospace, monospace; }
.text-c { text-align: center; }
.page-anim { animation: pageIn 240ms cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div id="app"></div>
<div class="toast-wrap" id="toasts"></div>

<script>
/* ==================================================================
 * ASD BANK — Mobile SPA
 * ================================================================== */

const CONFIG = {
  APP_NAME: 'ASD BANK',
  CURRENCY: 'RUB',
};

const State = {
  user: null,
  settings: { theme: 'light', language: 'ru' },
  listeners: [],
  subscribe(fn) { this.listeners.push(fn); return () => this.listeners = this.listeners.filter(f => f !== fn); },
  emit() { this.listeners.forEach(fn => fn(this)); },
};

/* ===================== DB ===================== */
const DB = (() => {
  const data = { users: [], accounts: [], cards: [], transactions: [], notifications: [], sessions: [], audit_logs: [] };
  let nextId = { users: 10000, accounts: 20000, cards: 30000, transactions: 40000, notifications: 50000 };
  const id = t => ++nextId[t];
  const insert = (t, row) => { row.id = id(t); data[t].push(row); return row; };
  const update = (t, id, patch) => { const i = data[t].findIndex(x => x.id === id); if (i >= 0) Object.assign(data[t][i], patch); return data[t][i]; };
  const byUser = (t, uid) => data[t].filter(x => x.user_id === uid);
  const byId = (t, id) => data[t].find(x => x.id === id);
  return { data, insert, update, byUser, byId };
})();

/* ===================== SEED ===================== */
async function seed() {
  if (DB.data.users.length > 0) return;
  const pwd = async (p) => await Hash.sha256(p + ':asd-salt');
  const users = [
    { asd_id: 'ASD-10000001', first_name: 'Александр', last_name: 'Морозов', email: 'alex@asd.ru', phone: '+79001112233', password_hash: await pwd('Demo123!'), role: 'USER', status: 'active' },
    { asd_id: 'ASD-10000002', first_name: 'Борис', last_name: 'Иванов', email: 'boris@asd.ru', phone: '+79001112244', password_hash: await pwd('Demo123!'), role: 'USER', status: 'active' },
    { asd_id: 'ASD-10000003', first_name: 'Чарли', last_name: 'Смит', email: 'charlie@asd.ru', phone: '+79001112255', password_hash: await pwd('Demo123!'), role: 'USER', status: 'active' },
    { asd_id: 'ASD-10000004', first_name: 'Морф', last_name: 'Пользователь', email: 'demo@asd.ru', phone: '+79001112266', password_hash: await pwd('Demo123!'), role: 'USER', status: 'active' },
    { asd_id: 'ASD-10000099', first_name: 'Admin', last_name: 'Root', email: 'admin@asd.ru', phone: '+79001112299', password_hash: await pwd('Admin123!'), role: 'SUPER_ADMIN', status: 'active' },
  ];
  for (const u of users) {
    u.created_at = Date.now() - 30 * 86400000;
    u.last_login = null;
    const user = DB.insert('users', u);
    DB.insert('accounts', {
      user_id: user.id,
      account_number: '40817810099' + String(1000000000 + user.id),
      currency: 'RUB', kind: 'main', balance: 0, available_balance: 0, status: 'active',
      created_at: Date.now(), updated_at: Date.now(),
    });
  }
  const init = [['ASD-10000001', 125400.50], ['ASD-10000002', 42300], ['ASD-10000003', 18700.25], ['ASD-10000004', 84520.10]];
  for (const [asdId, amount] of init) {
    const u = DB.data.users.find(x => x.asd_id === asdId);
    const acc = DB.data.accounts.find(a => a.user_id === u.id);
    acc.balance = amount; acc.available_balance = amount;
  }
  const demo = DB.data.users.find(u => u.email === 'demo@asd.ru');
  const demoAcc = DB.data.accounts.find(a => a.user_id === demo.id);
  DB.insert('cards', {
    user_id: demo.id, account_id: demoAcc.id, pan_last4: '4383',
    exp_month: 12, exp_year: 29, brand: 'ASD', kind: 'debit', status: 'active',
    daily_limit: 150000, color: 'red', holder: 'MORF USER', created_at: Date.now(),
  });
  const sampleTx = [
    { type: 'payment', direction: 'out', amount: 2890.90, description: 'Супермаркет «Пятёрочка»', category: 'food', days: 1 },
    { type: 'transfer', direction: 'out', amount: 15000, description: 'Перевод Александру', counterparty: DB.data.users[0].id, days: 2 },
    { type: 'deposit', direction: 'in', amount: 85000, description: 'Зарплата', days: 3 },
    { type: 'payment', direction: 'out', amount: 650, description: 'Яндекс.Такси', category: 'transport', days: 4 },
    { type: 'payment', direction: 'out', amount: 2990, description: 'Иви', category: 'subs', days: 6 },
    { type: 'transfer', direction: 'in', amount: 30000, description: 'Перевод от Бориса', counterparty: DB.data.users[1].id, days: 8 },
    { type: 'payment', direction: 'out', amount: 8900, description: 'Спортмастер', category: 'shopping', days: 10 },
    { type: 'payment', direction: 'out', amount: 4520, description: 'Ресторан «Пушкин»', category: 'fun', days: 12 },
  ];
  for (const tx of sampleTx) {
    const d = Date.now() - tx.days * 86400000;
    DB.insert('transactions', {
      ref: genRef(), user_id: demo.id, account_id: demoAcc.id,
      type: tx.type, direction: tx.direction, amount: tx.amount, currency: 'RUB',
      status: 'completed', description: tx.description,
      counterparty: tx.counterparty || null, category: tx.category || null,
      created_at: d, completed_at: d,
    });
  }
  DB.insert('notifications', { user_id: demo.id, category: 'transfer', title: 'Вам поступили деньги', body: '+30 000 ₽ от Бориса', is_read: false, created_at: Date.now() - 3600000 });
  DB.insert('notifications', { user_id: demo.id, category: 'card', title: 'Карта выпущена', body: 'Дебетовая карта •••• 4383', is_read: false, created_at: Date.now() - 7200000 });
  DB.insert('notifications', { user_id: demo.id, category: 'security', title: 'Новый вход', body: 'iOS · Safari', is_read: true, created_at: Date.now() - 86400000 });
}

/* ===================== CRYPTO ===================== */
const Hash = {
  async sha256(str) {
    const buf = new TextEncoder().encode(str);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2,'0')).join('');
  }
};
function genRef() {
  const d = new Date();
  const date = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  const rnd = [...crypto.getRandomValues(new Uint8Array(4))].map(b => b.toString(16).padStart(2,'0')).join('').toUpperCase();
  return `ASD-TRX-${date}-${rnd}`;
}
function genIdem() {
  return [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2,'0')).join('');
}

/* ===================== AUDIT ===================== */
function audit(action, meta = {}) {
  DB.insert('audit_logs', { user_id: State.user?.id || null, action, meta, created_at: Date.now() });
}

/* ===================== NOTIFICATIONS ===================== */
function notify(userId, category, title, body) {
  DB.insert('notifications', { user_id: userId, category, title, body, is_read: false, created_at: Date.now() });
  if (State.user && State.user.id === userId) {
    State.emit();
    toast(title);
  }
}

/* ===================== TOAST ===================== */
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity 200ms, transform 200ms';
    el.style.opacity = '0';
    el.style.transform = 'translateY(12px)';
    setTimeout(() => el.remove(), 200);
  }, 2800);
}

/* ===================== API ===================== */
const API = {
  async login(login, password) {
    await sleep(300);
    const u = DB.data.users.find(x => x.email.toLowerCase() === login.toLowerCase() || x.phone === login);
    if (!u) throw new Error('Пользователь не найден');
    const h = await Hash.sha256(password + ':asd-salt');
    if (h !== u.password_hash) throw new Error('Неверный пароль');
    DB.update('users', u.id, { last_login: Date.now() });
    audit('login');
    return { user: u };
  },
  async register(p) {
    await sleep(300);
    if (DB.data.users.find(u => u.email.toLowerCase() === p.email.toLowerCase())) throw new Error('Email занят');
    const h = await Hash.sha256(p.password + ':asd-salt');
    const asdId = 'ASD-' + String(10000000 + DB.data.users.length + 1);
    const u = DB.insert('users', {
      asd_id: asdId, first_name: p.first_name, last_name: p.last_name,
      email: p.email, phone: p.phone, password_hash: h,
      role: 'USER', status: 'active', created_at: Date.now(), last_login: Date.now(),
    });
    DB.insert('accounts', {
      user_id: u.id,
      account_number: '40817810099' + String(2000000000 + u.id),
      currency: 'RUB', kind: 'main', balance: 0, available_balance: 0, status: 'active',
      created_at: Date.now(), updated_at: Date.now(),
    });
    notify(u.id, 'system', 'Добро пожаловать в ASD BANK', 'Ваш ASD ID: ' + asdId);
    return { user: u };
  },
  async transfer({ fromAccountId, toUserId, amount, description, idempotencyKey }) {
    await sleep(400);
    const from = DB.byId('accounts', fromAccountId);
    const to = DB.data.accounts.find(a => a.user_id === toUserId);
    const toUser = DB.byId('users', toUserId);
    if (!from) throw new Error('Счёт не найден');
    if (!to || !toUser) throw new Error('Получатель не найден');
    if (amount > from.available_balance) throw new Error('Недостаточно средств');
    if (idempotencyKey) {
      const ex = DB.data.transactions.find(t => t.idempotency === idempotencyKey);
      if (ex) return { transaction: ex, duplicate: true };
    }
    from.balance -= amount; from.available_balance -= amount;
    to.balance += amount; to.available_balance += amount;
    const ref = genRef();
    const txOut = DB.insert('transactions', {
      ref, user_id: from.user_id, account_id: from.id, type: 'transfer', direction: 'out',
      amount, currency: from.currency, status: 'completed',
      description: description || `Перевод ${toUser.first_name}`,
      counterparty: toUser.id, idempotency: idempotencyKey,
      created_at: Date.now(), completed_at: Date.now(),
    });
    DB.insert('transactions', {
      ref, user_id: to.user_id, account_id: to.id, type: 'transfer', direction: 'in',
      amount, currency: to.currency, status: 'completed',
      description: description || `Перевод от ${DB.byId('users', from.user_id).first_name}`,
      counterparty: from.user_id, created_at: Date.now(), completed_at: Date.now(),
    });
    notify(from.user_id, 'transfer', 'Перевод выполнен', `−${fmt(amount)} → ${toUser.first_name}`);
    notify(to.user_id, 'transfer', 'Вам поступили деньги', `+${fmt(amount)} от ${DB.byId('users', from.user_id).first_name}`);
    audit('transfer', { ref, amount });
    State.emit();
    return { transaction: txOut };
  },
  async accounts(uid) { return DB.byUser('accounts', uid); },
  async cards(uid) { return DB.byUser('cards', uid); },
  async transactions(uid) { return DB.byUser('transactions', uid).sort((a,b) => b.created_at - a.created_at); },
  async notifications(uid) { return DB.byUser('notifications', uid).sort((a,b) => b.created_at - a.created_at); },
  async searchUsers(q) {
    q = q.trim().toLowerCase();
    if (!q) return [];
    return DB.data.users.filter(u =>
      u.asd_id.toLowerCase().includes(q) ||
      u.email.toLowerCase().includes(q) ||
      u.phone.includes(q) ||
      (u.first_name + ' ' + u.last_name).toLowerCase().includes(q)
    ).slice(0, 10);
  },
};
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ===================== FORMAT ===================== */
function fmt(a, c = 'RUB') {
  return new Intl.NumberFormat('ru-RU', { style: 'currency', currency: c, minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(a).replace('RUB','₽').replace(/\s/g,' ');
}
function fmtNum(a) {
  return new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(a);
}
function fmtDate(ts, withTime = false) {
  const d = new Date(ts);
  return d.toLocaleString('ru-RU', withTime
    ? { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }
    : { day: '2-digit', month: 'long' });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function initials(u) { return (u.first_name[0] + (u.last_name[0] || '')).toUpperCase(); }

/* ===================== ROUTER ===================== */
const Router = (() => {
  const routes = [];
  let cleanup = null;
  let notFound = null;
  function on(pattern, handler, opts = {}) {
    const keys = [];
    const rx = new RegExp('^' + pattern.replace(/:([a-z_]+)/g, (_, k) => { keys.push(k); return '([^/]+)'; }) + '/?$');
    routes.push({ rx, keys, handler, opts });
  }
  function match(path) {
    for (const r of routes) {
      const m = path.match(r.rx);
      if (m) { const params = {}; r.keys.forEach((k,i) => params[k] = decodeURIComponent(m[i+1])); return { ...r, params }; }
    }
    return null;
  }
  async function resolve(path) {
    if (cleanup) { try { cleanup(); } catch {} cleanup = null; }
    const m = match(path);
    if (!m) { if (notFound) await notFound(); return; }
    if (m.opts.auth && !State.user) { navigate('/login'); return; }
    if (m.opts.guest && State.user) { navigate('/'); return; }
    if (m.opts.role && !m.opts.role.includes(State.user?.role)) { render403(); return; }
    cleanup = await m.handler(m.params);
  }
  function navigate(path, replace = false) {
    if (path === location.pathname && !replace) return;
    if (replace) history.replaceState(null, '', path); else history.pushState(null, '', path);
    resolve(path);
  }
  window.addEventListener('popstate', () => resolve(location.pathname));
  window.addEventListener('click', (e) => {
    const a = e.target.closest('[data-link]');
    if (!a) return;
    e.preventDefault();
    navigate(a.getAttribute('href'));
  });
  function setNotFound(fn) { notFound = fn; }
  return { on, navigate, resolve, setNotFound };
})();

function attachTransferForm() {
  const form = document.getElementById('transfer-form');
  const search = document.getElementById('recipient-search');
  const result = document.getElementById('recipient-result');
  let selected = null;

  search.addEventListener('input', async () => {
    const q = search.value;
    if (q.length < 2) { result.innerHTML = ''; return; }
    const users = (await API.searchUsers(q)).filter(u => u.id !== State.user.id);
    if (!users.length) { result.innerHTML = `<div class="muted mt-8" style="font-size:13px">Не найдено</div>`; return; }
    result.innerHTML = users.map(u => `
      <div class="list-row" style="padding:8px 0">
        <div class="tx-icon">${initials(u)}</div>
        <div class="tx-meta"><p class="tx-title">${escapeHtml(u.first_name)} ${escapeHtml(u.last_name)}</p><p class="tx-sub mono">${u.asd_id}</p></div>
        <button class="btn btn-secondary btn-sm" type="button" data-pick="${u.id}">Выбрать</button>
      </div>
    `).join('');
  });

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-pick]');
    if (!b) return;
    selected = DB.byId('users', +b.dataset.pick);
    search.value = `${selected.first_name} ${selected.last_name}`;
    result.innerHTML = `<div class="mt-8" style="font-size:13px;background:#E0F5B8;padding:8px 12px;border-radius:12px"><b>${escapeHtml(selected.first_name)}</b> · ${selected.asd_id}</div>`;
  });

  form.addEventListener('submit', e => {
    e.preventDefault();
    if (!selected) { toast('Выберите получателя'); return; }
    const amount = parseFloat(document.getElementById('amount').value);
    if (!(amount > 0)) { document.getElementById('amount-err').textContent = 'Введите сумму'; return; }
    const fromId = +document.getElementById('from-account').value;
    const from = DB.byId('accounts', fromId);
    if (amount > from.available_balance) { document.getElementById('amount-err').textContent = 'Недостаточно средств'; return; }
    sessionStorage.setItem('asd_pending', JSON.stringify({
      fromAccountId: fromId, toUserId: selected.id, amount,
      description: document.getElementById('description').value.trim(),
      idempotencyKey: genIdem(),
      recipient: { name: `${selected.first_name} ${selected.last_name}`, asd_id: selected.asd_id, email: selected.email },
      account: { id: from.id, number: from.account_number },
    }));
    Router.navigate('/transfer-confirmation');
  });
}

function qrSvg(seed) {
  const size = 21, cell = 6;
  let h = parseInt(seed.split('').reduce((a,c) => a + c.charCodeAt(0), 0)) || 12345;
  const rand = () => { h = (h * 9301 + 49297) % 233280; return h / 233280; };
  let cells = '';
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const corner = (x < 7 && y < 7) || (x > size-8 && y < 7) || (x < 7 && y > size-8);
    let on;
    if (corner) {
      const lx = x < 7 ? x : x - (size - 7);
      const ly = y < 7 ? y : y - (size - 7);
      on = (lx === 0 || lx === 6 || ly === 0 || ly === 6 || (lx >= 2 && lx <= 4 && ly >= 2 && ly <= 4));
    } else on = rand() > 0.5;
    if (on) cells += `<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}" fill="#1A1A1A"/>`;
  }
  return `<svg width="${size*cell}" height="${size*cell}" viewBox="0 0 ${size*cell} ${size*cell}">${cells}</svg>`;
}

async function PageAnalytics() {
  const txs = await API.transactions(State.user.id);
  const out = txs.filter(t => t.direction === 'out');
  const total = out.reduce((s,t) => s + t.amount, 0) || 1;
  const byCat = {};
  out.forEach(t => { const k = t.category || 'other'; byCat[k] = (byCat[k] || 0) + t.amount; });
  const names = { food: 'Продукты', transport: 'Транспорт', fun: 'Развлечения', shopping: 'Покупки', subs: 'Подписки', other: 'Другое' };
  const html = `
    <div class="page-header">
      <h1>Аналитика</h1>
    </div>
    <div class="section">
      <div class="balance-card" style="flex-direction:column;align-items:stretch;gap:10px">
        <div class="muted">Расходы за период</div>
        <div style="font-size:28px;font-weight:800">${fmt(total)}</div>
        <svg viewBox="0 0 300 100" style="width:100%;height:100px;margin-top:12px">
          ${(() => {
            const days = [];
            for (let i = 6; i >= 0; i--) {
              const d = new Date(); d.setDate(d.getDate() - i); d.setHours(0,0,0,0);
              const next = d.getTime() + 86400000;
              const amount = out.filter(t => t.created_at >= d.getTime() && t.created_at < next).reduce((s,t) => s + t.amount, 0);
              days.push(amount);
            }
            const max = Math.max(...days, 1);
            return days.map((v, i) => {
              const w = 300 / 7, h = (v / max) * 70;
              return `<rect x="${i * w + 8}" y="${85 - h}" width="${w - 16}" height="${h}" rx="6" fill="var(--green)"/>`;
            }).join('');
          })()}
        </svg>
      </div>
    </div>
    <div class="sec-head"><h3>По категориям</h3></div>
    <div class="list-card">
      ${Object.entries(byCat).length === 0 ? `<div class="empty">Нет данных</div>` : Object.entries(byCat).map(([k,v]) => `
        <div class="list-row">
          <div class="tx-meta"><p class="tx-title">${names[k] || k}</p><p class="tx-sub">${((v/total)*100).toFixed(0)}% от расходов</p></div>
          <div class="tx-amount">${fmt(v)}</div>
        </div>
      `).join('')}
    </div>
    ${BottomNav()}
  `;
  render(html);
}

async function PageLogin() {
  const html = `
    <div class="auth-wrap">
      <div class="auth-logo"><div class="mark">ASD</div><div class="name">ASD BANK</div></div>
      <h1>Вход</h1>
      <p class="sub">Введите данные для входа в аккаунт</p>
      <form id="login-form" style="display:flex;flex-direction:column;gap:12px">
        <div class="field"><label>Email или телефон</label><input class="input" name="login" required autocomplete="username" /></div>
        <div class="field"><label>Пароль</label><input class="input" name="password" type="password" required autocomplete="current-password" /></div>
        <button class="btn btn-green btn-block" type="submit" id="login-btn">Войти</button>
        <div class="row between mt-12" style="font-size:13px">
          <a class="muted" href="/forgot-password" data-link>Забыли пароль?</a>
          <a class="muted" href="/register" data-link>Создать аккаунт</a>
        </div>
      </form>
    </div>`;
  render(html, { noScroll: true });
  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const b = document.getElementById('login-btn');
    b.disabled = true; b.textContent = 'Вход...';
    try {
      const { user } = await API.login(fd.get('login'), fd.get('password'));
      State.user = user;
      localStorage.setItem('asd_uid', user.id);
      State.emit();
      toast('Добро пожаловать, ' + user.first_name);
      Router.navigate('/');
    } catch (err) {
      toast(err.message);
      b.disabled = false; b.textContent = 'Войти';
    }
  });
}

  render(`
    <div class="auth-wrap text-c" style="justify-content:center">

function render403() {
  render(`
    <div class="auth-wrap text-c" style="justify-content:center">
      <div style="font-size:72px;font-weight:800;color:var(--red);letter-spacing:-0.04em">403</div>
      <h1 style="margin-top:16px">Доступ запрещён</h1>
      <p class="sub">У вас нет прав для этой страницы</p>
      <a href="/" data-link class="btn btn-green">На главную</a>
    </div>`);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  const v = el.dataset.value;

  if (a === 'copy' && v) { navigator.clipboard.writeText(v); toast('Скопировано'); }
  if (a === 'logout') { State.user = null; localStorage.removeItem('asd_uid'); Router.navigate('/login'); }
  if (a === 'logout-all') { State.user = null; localStorage.removeItem('asd_uid'); toast('Вы вышли со всех устройств'); Router.navigate('/login'); }
  if (a === 'create-card') {
    const acc = DB.data.accounts.find(x => x.user_id === State.user.id);
    const last4 = String(Math.floor(1000 + Math.random() * 9000));
    DB.insert('cards', {
      user_id: State.user.id, account_id: acc.id,
      pan_last4: last4, exp_month: 12, exp_year: new Date().getFullYear() + 4,
      brand: 'ASD', kind: 'debit', status: 'active', daily_limit: 150000,
      color: ['red','black','green','blue'][Math.floor(Math.random()*4)],
      holder: (State.user.first_name + ' ' + State.user.last_name).toUpperCase(),
      created_at: Date.now(),
    });
    audit('card_create');
    toast('Карта выпущена');
    PageCards();
  }
  if (a === 'reveal-card') toast('Требуется подтверждение');
  if (a === 'toggle-card') {
    const c = DB.byId('cards', +el.dataset.id);
    c.status = c.status === 'active' ? 'locked' : 'active';
    audit('card_' + c.status, { id: c.id });
    toast(c.status === 'locked' ? 'Карта заблокирована' : 'Карта разблокирована');
    PageCardDetail({ id: c.id });
  }
  if (a === 'reissue-card') toast('Перевыпуск запрошен');
  if (a === 'open-account') {
    DB.insert('accounts', {
      user_id: State.user.id,
      account_number: '40817810099' + String(3000000000 + DB.data.accounts.length),
      currency: 'RUB', kind: 'savings', balance: 0, available_balance: 0, status: 'active',
      created_at: Date.now(), updated_at: Date.now(),
    });
    toast('Счёт открыт');
    PageAccounts();
  }
  if (a === 'repeat-tx') {
    const tx = DB.byId('transactions', +el.dataset.id);
    if (!tx || tx.direction !== 'out' || !tx.counterparty) { toast('Повтор недоступен'); return; }
    const rcp = DB.byId('users', tx.counterparty);
    const a2 = DB.byId('accounts', tx.account_id);
    sessionStorage.setItem('asd_pending', JSON.stringify({
      fromAccountId: tx.account_id, toUserId: tx.counterparty, amount: tx.amount,
      currency: tx.currency, description: 'Повтор операции',
      idempotencyKey: genIdem(),
      recipient: { name: rcp.first_name + ' ' + rcp.last_name, asd_id: rcp.asd_id, email: rcp.email },
      account: { id: a2.id, number: a2.account_number },
    }));
    Router.navigate('/transfer-confirmation');
  }
  if (a === 'set-theme') {
    State.settings.theme = el.dataset.theme;
    document.documentElement.dataset.theme = el.dataset.theme;
    PageSettingsAppearance();
  }
  if (a === 'save-privacy' || a === 'save-notifications') toast('Сохранено');
  if (a === 'start-chat') toast('Чат откроется после подключения');
});

function buildRoutes() {
  Router.on('/',                     PageHome,                { auth: true });
  Router.on('/accounts',             PageAccounts,            { auth: true });
  Router.on('/accounts/:id',         PageAccountDetail,       { auth: true });
  Router.on('/cards',                PageCards,               { auth: true });
  Router.on('/cards/:id',            PageCardDetail,          { auth: true });
  Router.on('/transfers',            PageTransfers,            { auth: true });
  Router.on('/transfer-confirmation',PageTransferConfirmation,{ auth: true });
  Router.on('/transfer-success',     PageTransferSuccess,     { auth: true });
  Router.on('/transactions',         PageTransactions,        { auth: true });
  Router.on('/transactions/:id/receipt', PageReceipt,         { auth: true });
  Router.on('/transactions/:id',     PageTransactionDetail,   { auth: true });
  Router.on('/payments',             PagePayments,            { auth: true });
  Router.on('/payments/:id',         PagePaymentCategory,     { auth: true });
  Router.on('/deposit',              PageDeposit,             { auth: true });
  Router.on('/receive',              PageReceive,             { auth: true });
  Router.on('/qr',                   PageQR,                  { auth: true });
  Router.on('/notifications',        PageNotifications,       { auth: true });
  Router.on('/analytics',            PageAnalytics,           { auth: true });
  Router.on('/profile',              PageProfile,             { auth: true });
  Router.on('/profile/edit',         PageProfileEdit,         { auth: true });
  Router.on('/settings',             PageSettings,            { auth: true });
  Router.on('/settings/security',    PageSettingsSecurity,    { auth: true });
  Router.on('/settings/privacy',     PageSettingsPrivacy,     { auth: true });
  Router.on('/settings/notifications', PageSettingsNotifications, { auth: true });
  Router.on('/settings/appearance',  PageSettingsAppearance,  { auth: true });
  Router.on('/settings/limits',      PageSettingsLimits,      { auth: true });
  Router.on('/settings/devices',     PageSettingsDevices,     { auth: true });
  Router.on('/search',               PageSearch,              { auth: true });
  Router.on('/support',              PageSupport,             { auth: true });
  Router.on('/admin',                PageAdmin,               { auth: true, role: ['ADMIN','SUPER_ADMIN'] });
  Router.on('/admin/users',          PageAdminUsers,          { auth: true, role: ['ADMIN','SUPER_ADMIN'] });
  Router.on('/admin/transactions',   PageAdminTransactions,   { auth: true, role: ['ADMIN','SUPER_ADMIN'] });
  Router.on('/admin/security',       PageAdminSecurity,       { auth: true, role: ['ADMIN','SUPER_ADMIN'] });
  Router.on('/login',                PageLogin,               { guest: true });
  Router.on('/register',             PageRegister,            { guest: true });
  Router.on('/forgot-password',      PageForgot,              { guest: true });
  Router.setNotFound(() => render404());
}

(async () => {
  await seed();
  const uid = localStorage.getItem('asd_uid');
  if (uid) State.user = DB.byId('users', +uid) || null;
  buildRoutes();
  const path = location.pathname;
  const guestOnly = ['/login','/register','/forgot-password'].includes(path);
  if (!State.user && !guestOnly) { history.replaceState(null, '', '/login'); Router.resolve('/login'); }
  else Router.resolve(path);
})();
</script>
