<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>MMA 3D — Mobile</title>
<style>
  * { -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin:0; padding:0; overflow:hidden; background:#111; font-family:Arial; color:#fff;
               touch-action:none; height:100%; width:100%; position:fixed; }
  canvas { display:block; }

  #hud { position:fixed; top:8px; left:0; width:100%; pointer-events:none; z-index:10; }
  .bar { position:absolute; width:38%; height:16px; background:#222; border:2px solid #555; border-radius:4px; }
  .fill { height:100%; transition:width 0.15s; border-radius:2px; }
  #p1bar { left:2%; top:0; }
  #p1fill { background:linear-gradient(90deg,#0f0,#8f8); width:100%; }
  #p2bar { right:2%; top:0; }
  #p2fill { background:linear-gradient(90deg,#f88,#f00); width:100%; float:right; }
  .stam { position:absolute; width:38%; height:6px; background:#222; border:1px solid #444; top:22px; border-radius:3px; }
  #p1stam { left:2%; }
  #p2stam { right:2%; }
  .sfill { height:100%; background:#fc0; width:100%; transition:width 0.1s; border-radius:3px; }

  #msg { position:fixed; top:42%; width:100%; text-align:center; font-size:14vw; font-weight:bold;
         text-shadow:0 0 20px #000; pointer-events:none; opacity:0; transition:opacity 0.3s; z-index:20; }

  /* --- Сенсорные кнопки --- */
  #touchUI { position:fixed; bottom:0; left:0; width:100%; height:45%; display:none; z-index:30; pointer-events:none; }
  #touchUI.active { display:block; }
  .tbtn {
    position:absolute; bottom:12px;
    width:70px; height:70px; border-radius:50%;
    background:rgba(255,255,255,0.12);
    border:2px solid rgba(255,255,255,0.35);
    color:#fff; font-size:22px; font-weight:bold;
    display:flex; align-items:center; justify-content:center;
    pointer-events:auto; touch-action:none;
    backdrop-filter:blur(4px);
    transition:transform 0.08s, background 0.08s;
    text-align:center; line-height:1;
  }
  .tbtn.pressed { background:rgba(255,255,255,0.35); transform:scale(0.92); }

  #btnLeft  { left:12px; bottom:90px; }
  #btnRight { left:100px; bottom:90px; }
  #btnJump  { left:56px;  bottom:12px; font-size:20px; }

  #btnPunch { right:12px; bottom:90px; background:rgba(255,80,80,0.2); border-color:rgba(255,80,80,0.6); }
  #btnKick  { right:100px; bottom:90px; background:rgba(255,140,60,0.2); border-color:rgba(255,140,60,0.6); font-size:26px; }
  #btnBlock { right:12px; bottom:12px; background:rgba(80,140,255,0.2); border-color:rgba(80,140,255,0.6); font-size:20px; }
  #btnDodge { right:100px; bottom:12px; background:rgba(80,200,120,0.2); border-color:rgba(80,200,120,0.6); font-size:20px; }

  /* Подсказка для десктопа */
  #hint { position:fixed; bottom:8px; width:100%; text-align:center; font-size:12px; opacity:0.5; z-index:5; pointer-events:none; }
  #hint.mobile { display:none; }

  /* Кнопка поворота экрана */
  #rotateHint { position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.9); color:#fff; display:none; align-items:center; justify-content:center;
    font-size:20px; text-align:center; z-index:100; flex-direction:column; gap:20px; }
  #rotateHint.show { display:flex; }
</style>
</head>
<body>

<div id="hud">
  <div id="p1bar" class="bar"><div id="p1fill" class="fill"></div></div>
  <div id="p2bar" class="bar"><div id="p2fill" class="fill"></div></div>
  <div id="p1stam" class="stam"><div id="p1sfill" class="sfill"></div></div>
  <div id="p2stam" class="stam"><div id="p2sfill" class="sfill"></div></div>
</div>
<div id="msg"></div>

<div id="touchUI">
  <div class="tbtn" id="btnLeft">◀</div>
  <div class="tbtn" id="btnRight">▶</div>
  <div class="tbtn" id="btnJump">⤒</div>
  <div class="tbtn" id="btnPunch">👊</div>
  <div class="tbtn" id="btnKick">🦵</div>
  <div class="tbtn" id="btnBlock">🛡</div>
  <div class="tbtn" id="btnDodge">↩</div>
</div>

<div id="hint">A/D — двигаться · W — прыжок · J — рука · K — нога · L — блок · Space — уклонение</div>

<div id="rotateHint">
  <div style="font-size:60px;">📱↻</div>
  <div>Поверни телефон горизонтально<br>для лучшего обзора</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
} }
</script>

<script type="module">
import * as THREE from 'three';

// --- Детект мобильного ---
const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
                 ('ontouchstart' in window && window.innerWidth < 1024);

// --- Сцена ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2a);
scene.fog = new THREE.Fog(0x1a1a2a, 15, 40);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 6, 12);
camera.lookAt(0, 1.2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: !isMobile, powerPreference:'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
renderer.shadowMap.enabled = !isMobile; // на мобилке тени выкл для FPS
document.body.appendChild(renderer.domElement);

// --- Свет ---
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const key = new THREE.DirectionalLight(0xffffff, 1.0);
key.position.set(5, 10, 5);
if (!isMobile) { key.castShadow = true; key.shadow.mapSize.set(1024,1024);
  key.shadow.camera.left=-10; key.shadow.camera.right=10;
  key.shadow.camera.top=10; key.shadow.camera.bottom=-10; }
scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 0.5);
rim.position.set(-5, 5, -5);
scene.add(rim);

// --- Октагон ---
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(7, 8),
  new THREE.MeshStandardMaterial({ color:0x334466, roughness:0.7 })
);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = !isMobile;
scene.add(floor);

const wall = new THREE.Mesh(
  new THREE.CylinderGeometry(7, 7, 2.2, 8, 1, true),
  new THREE.MeshStandardMaterial({ color:0x6688aa, transparent:true, opacity:0.15, side:THREE.DoubleSide })
);
wall.position.y = 1.1;
scene.add(wall);

const grid = new THREE.GridHelper(14, 14, 0x4466aa, 0x223355);
grid.position.y = 0.01;
scene.add(grid);

// --- Боец ---
class Fighter {
  constructor(color, x, facing) {
    this.hp = 100;
    this.stamina = 100;
    this.maxStamina = 100;
    this.speed = 0.09;
    this.velY = 0; this.y = 0; this.onGround = true;
    this.facing = facing;
    this.blocking = false;
    this.attackCooldown = 0;
    this.hitCooldown = 0;
    this.dodgeCooldown = 0;
    this.dodgeTimer = 0;
    this.dodgeDir = 0;
    this.alive = true;
    this.punchAnim = 0;
    this.kickAnim = 0;

    this.group = new THREE.Group();
    this.group.position.set(x, 0, 0);

    const bodyMat = new THREE.MeshStandardMaterial({ color, roughness:0.6 });
    const skinMat = new THREE.MeshStandardMaterial({ color:0xddaa88, roughness:0.8 });

    const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 0.8, 6, 12), bodyMat);
    torso.position.y = 1.4; torso.castShadow = !isMobile;
    this.group.add(torso);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16), skinMat);
    head.position.y = 2.15; head.castShadow = !isMobile;
    this.group.add(head);

    const armGeo = new THREE.CapsuleGeometry(0.11, 0.65, 5, 8);
    this.lArm = new THREE.Mesh(armGeo, skinMat);
    this.lArm.position.set(-0.5, 1.55, 0.15); this.lArm.rotation.z = 0.15;
    this.group.add(this.lArm);
    this.rArm = new THREE.Mesh(armGeo, skinMat);
    this.rArm.position.set(0.5, 1.55, 0.15); this.rArm.rotation.z = -0.15;
    this.group.add(this.rArm);

    const legGeo = new THREE.CapsuleGeometry(0.13, 0.7, 5, 8);
    this.lLeg = new THREE.Mesh(legGeo, bodyMat);
    this.lLeg.position.set(-0.18, 0.55, 0); this.group.add(this.lLeg);
    this.rLeg = new THREE.Mesh(legGeo, bodyMat);
    this.rLeg.position.set(0.18, 0.55, 0); this.group.add(this.rLeg);

    this.group.rotation.y = facing === 1 ? Math.PI/2 : -Math.PI/2;
    scene.add(this.group);
  }

  get x() { return this.group.position.x; }
  set x(v) { this.group.position.x = v; }

  update(dt, opponent) {
    if (this.attackCooldown > 0) this.attackCooldown -= dt;
    if (this.hitCooldown > 0) this.hitCooldown -= dt;
    if (this.dodgeCooldown > 0) this.dodgeCooldown -= dt;
    if (this.punchAnim > 0) this.punchAnim = Math.max(0, this.punchAnim - dt*6);
    if (this.kickAnim > 0) this.kickAnim = Math.max(0, this.kickAnim - dt*5);

    if (this.stamina < this.maxStamina) {
      this.stamina = Math.min(this.maxStamina, this.stamina + dt * (this.blocking ? 8 : 15));
    }

    if (this.dodgeTimer > 0) {
      this.dodgeTimer -= dt;
      this.x += this.dodgeDir * this.speed * 3.2;
    }

    if (!this.onGround) {
      this.velY -= 0.02;
      this.y += this.velY;
      if (this.y <= 0) { this.y = 0; this.velY = 0; this.onGround = true; }
      this.group.position.y = this.y;
    }

    const dx = opponent.x - this.x;
    this.facing = dx > 0 ? 1 : -1;
    this.group.rotation.y = THREE.MathUtils.lerp(
      this.group.rotation.y,
      this.facing === 1 ? Math.PI/2 : -Math.PI/2,
      dt * 10
    );

    const punchOffset = Math.sin(this.punchAnim * Math.PI) * 0.6;
    this.lArm.rotation.z = 0.15 + punchOffset * 0.5;
    this.rArm.rotation.z = -0.15 - punchOffset * 0.5;
    this.lArm.position.z = 0.15 + punchOffset;
    this.rArm.position.z = 0.15 + punchOffset;

    const kickOffset = Math.sin(this.kickAnim * Math.PI) * 0.8;
    this.rLeg.rotation.x = -kickOffset;
    this.rLeg.position.z = kickOffset * 0.5;

    if (this.blocking) {
      this.lArm.position.y = 1.9;
      this.rArm.position.y = 1.9;
    } else {
      this.lArm.position.y = 1.55;
      this.rArm.position.y = 1.55;
    }

    const r = Math.sqrt(this.x*this.x);
    if (r > 6.5) this.x = (this.x / r) * 6.5;

    const dist = Math.abs(opponent.x - this.x);
    if (dist < 0.9 && this.onGround && opponent.onGround) {
      const push = (0.9 - dist) * 0.5;
      const dir = this.x < opponent.x ? -1 : 1;
      this.x += dir * push;
    }
  }

  attack(type, opponent) {
    if (this.attackCooldown > 0 || !this.alive) return;
    const cost = type === 'punch' ? 8 : 15;
    if (this.stamina < cost) return;

    this.stamina -= cost;
    const range = type === 'punch' ? 1.6 : 1.9;
    const damage = type === 'punch' ? 6 : 11;
    const cooldown = type === 'punch' ? 0.32 : 0.55;

    if (type === 'punch') this.punchAnim = 1;
    else this.kickAnim = 1;

    this.attackCooldown = cooldown;

    const dist = Math.abs(opponent.x - this.x);
    if (dist <= range) {
      const dir = Math.sign(opponent.x - this.x);
      if (dir === this.facing) {
        if (opponent.blocking && opponent.stamina > 5) {
          opponent.stamina -= damage * 0.5;
          return;
        }
        if (opponent.hitCooldown > 0) return;
        opponent.hp = Math.max(0, opponent.hp - damage);
        opponent.hitCooldown = 0.25;
        opponent.stamina = Math.max(0, opponent.stamina - 5);
        opponent.x += this.facing * 0.15;

        if (opponent.hp <= 0) {
          opponent.alive = false;
          opponent.group.rotation.z = this.facing * Math.PI/2 * 0.9;
        }
      }
    }
  }
}

const player = new Fighter(0x2255cc, -2, 1);
const enemy  = new Fighter(0xcc2222,  2, -1);

// --- Клавиатура ---
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  if (e.code === 'KeyJ' && player.alive) player.attack('punch', enemy);
  if (e.code === 'KeyK' && player.alive) player.attack('kick', enemy);
  if (e.code === 'Space' && player.alive && player.dodgeCooldown <= 0 && player.stamina >= 12) {
    player.stamina -= 12;
    player.dodgeTimer = 0.18;
    player.dodgeDir = -player.facing;
    player.dodgeCooldown = 0.5;
  }
});
addEventListener('keyup', e => keys[e.code] = false);

// --- Сенсорные кнопки ---
const touchState = { left:false, right:false, block:false };

function setupTouch(id, onDown, onUp) {
  const el = document.getElementById(id);
  if (!el) return;
  const down = (e) => { e.preventDefault(); el.classList.add('pressed'); onDown && onDown(); };
  const up = (e) => { e.preventDefault(); el.classList.remove('pressed'); onUp && onUp(); };

  el.addEventListener('touchstart', down, { passive:false });
  el.addEventListener('touchend', up, { passive:false });
  el.addEventListener('touchcancel', up, { passive:false });
  el.addEventListener('mousedown', down);
  el.addEventListener('mouseup', up);
  el.addEventListener('mouseleave', up);
}

if (isMobile) {
  document.getElementById('touchUI').classList.add('active');
  document.getElementById('hint').classList.add('mobile');

  setupTouch('btnLeft', () => touchState.left = true, () => touchState.left = false);
  setupTouch('btnRight', () => touchState.right = true, () => touchState.right = false);
  setupTouch('btnBlock', () => touchState.block = true, () => touchState.block = false);

  setupTouch('btnJump', () => {
    if (player.alive && player.onGround && player.stamina >= 10) {
      player.velY = 0.35; player.onGround = false; player.stamina -= 10;
    }
  });

  setupTouch('btnPunch', () => player.alive && player.attack('punch', enemy));
  setupTouch('btnKick',  () => player.alive && player.attack('kick', enemy));

  setupTouch('btnDodge', () => {
    if (player.alive && player.dodgeCooldown <= 0 && player.stamina >= 12) {
      player.stamina -= 12;
      player.dodgeTimer = 0.18;
      player.dodgeDir = -player.facing;
      player.dodgeCooldown = 0.5;
    }
  });
}

// --- HUD ---
const p1fill = document.getElementById('p1fill');
const p2fill = document.getElementById('p2fill');
const p1sfill = document.getElementById('p1sfill');
const p2sfill = document.getElementById('p2sfill');
const msgEl = document.getElementById('msg');

function updateHUD() {
  p1fill.style.width = player.hp + '%';
  p2fill.style.width = enemy.hp + '%';
  p1sfill.style.width = player.stamina + '%';
  p2sfill.style.width = enemy.stamina + '%';
}

function showMsg(text, color='#fff') {
  msgEl.textContent = text;
  msgEl.style.color = color;
  msgEl.style.opacity = 1;
}

// --- ИИ ---
let aiTimer = 0;
function updateAI(dt) {
  if (!enemy.alive || !player.alive) return;
  aiTimer -= dt;
  const dist = Math.abs(player.x - enemy.x);

  if (dist > 1.4) {
    const dir = Math.sign(player.x - enemy.x);
    enemy.x += dir * enemy.speed * 0.8;
  }

  enemy.blocking = (dist < 1.8 && enemy.stamina > 30 && Math.random() < 0.3 && aiTimer <= 0);

  if (aiTimer <= 0 && dist < 1.9) {
    const r = Math.random();
    if (r < 0.5) { enemy.attack('punch', player); aiTimer = 0.5 + Math.random()*0.4; }
    else if (r < 0.85) { enemy.attack('kick', player); aiTimer = 0.7 + Math.random()*0.5; }
    else { enemy.blocking = true; aiTimer = 0.3; }
  }
}

// --- Игровой цикл ---
let last = performance.now();
let gameOver = false;

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (!gameOver) {
    if (player.alive) {
      // Управление: клавиатура ИЛИ тач
      const goLeft  = keys['KeyA'] || touchState.left;
      const goRight = keys['KeyD'] || touchState.right;
      const block   = keys['KeyL'] || touchState.block;

      player.blocking = block;
      if (!player.blocking && player.dodgeTimer <= 0) {
        if (goLeft)  player.x -= player.speed * (player.stamina > 20 ? 1 : 0.6);
        if (goRight) player.x += player.speed * (player.stamina > 20 ? 1 : 0.6);
      }
      if (keys['KeyW'] && player.onGround && player.stamina >= 10) {
        player.velY = 0.35; player.onGround = false; player.stamina -= 10;
      }
    }

    updateAI(dt);
    player.update(dt, enemy);
    enemy.update(dt, player);
    updateHUD();

    const centerX = (player.x + enemy.x) / 2;
    camera.position.x = THREE.MathUtils.lerp(camera.position.x, centerX * 0.5, dt * 3);
    camera.lookAt(centerX * 0.5, 1.3, 0);

    if (!player.alive || !enemy.alive) {
      gameOver = true;
      if (enemy.alive) showMsg('ПОРАЖЕНИЕ', '#f44');
      else if (player.alive) showMsg('ПОБЕДА!', '#4f4');
      else showMsg('НИЧЬЯ', '#ff0');
      setTimeout(() => {
        showMsg('Перезагрузка...', '#aaa');
        setTimeout(() => location.reload(), 1500);
      }, 2000);
    }
  }

  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

// --- Ресайз ---
function onResize() {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));

  // Подсказка про поворот
  const rotate = document.getElementById('rotateHint');
  if (isMobile && innerHeight > innerWidth) rotate.classList.add('show');
  else rotate.classList.remove('show');
}
addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 200));
onResize();
</script>
</body>
</html>
