<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>NovaOS</title>
<style>
:root{--accent:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--yellow:#ffd60a;--purple:#bf5af2;--pink:#ff375f;--teal:#64d2ff;--dur:.32s;--ease:cubic-bezier(.32,.72,0,1);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
[data-theme="light"]{--bg:#f2f2f7;--sf:#fff;--sf2:#e5e5ea;--sf3:#d1d1d6;--tx:#000;--tx2:#8e8e93;--tx3:#c7c7cc;--bd:rgba(0,0,0,.08);--hb:rgba(242,242,247,.78)}
[data-theme="dark"]{--bg:#000;--sf:#1c1c1e;--sf2:#2c2c2e;--sf3:#3a3a3c;--tx:#fff;--tx2:#8e8e93;--tx3:#48484a;--bd:rgba(255,255,255,.08);--hb:rgba(28,28,30,.78)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;position:fixed;inset:0;background:#050507;font-family:-apple-system,'SF Pro Display','Inter',sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center;color:var(--tx)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:inherit;background:none;border:none;outline:none;-webkit-user-select:text;user-select:text}
svg{display:block;flex-shrink:0}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
#phone{position:relative;width:100vw;height:100vh;max-width:430px;max-height:932px;overflow:hidden;background:#000;isolation:isolate}
@media(min-width:480px) and (min-height:950px){#phone{border-radius:58px;box-shadow:0 0 0 2px #1c1c1e,0 0 0 13px #0a0a0a,0 0 0 15px #2a2a2e,0 60px 120px -20px rgba(0,0,0,.9)}}
#brightness{position:absolute;inset:0;z-index:9990;pointer-events:none;background:#000;opacity:0;transition:opacity .2s}
#wall{position:absolute;inset:0;z-index:0;transition:background .4s}
.status-bar{position:absolute;top:0;left:0;right:0;height:54px;z-index:9000;display:flex;align-items:center;justify-content:space-between;padding:var(--st) 32px 0 34px;color:#fff;font-size:16px;font-weight:600;pointer-events:none;transition:color .25s}
.status-bar.dark{color:#000}
.status-bar .time{min-width:56px;letter-spacing:.2px;font-feature-settings:"tnum"}
.status-bar .icons{display:flex;align-items:center;gap:5px}
.status-bar .icons svg{height:12px;width:auto}
.home-bar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.95);z-index:9995;pointer-events:none;transition:background .25s,opacity .2s;margin-bottom:var(--sb)}
.home-bar.dark{background:rgba(0,0,0,.75)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:37px;background:#000;border-radius:22px;z-index:9999;transition:all .5s var(--ease);overflow:hidden;pointer-events:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#fff;font-size:12px;font-weight:600;margin-top:var(--st)}
.island .dot{width:8px;height:8px;border-radius:50%;background:#1a1a1f}
.island .cam{width:9px;height:9px;border-radius:50%;background:#050508;box-shadow:inset 0 0 0 1px #222}
.island.expanded{width:92%;height:66px;border-radius:36px;padding:0 22px}
@media(max-width:479px){.island{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;font-size:15px;font-weight:600;transition:transform .12s,opacity .15s}
.btn:active{transform:scale(.96);opacity:.85}
.btn-primary{background:var(--accent);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.switch{position:relative;width:51px;height:31px;border-radius:16px;background:var(--sf3);transition:background .25s;flex-shrink:0;cursor:pointer}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(20px)}
.list{background:var(--sf);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;font-size:16px;border-bottom:1px solid var(--bd);cursor:pointer;transition:background .15s}
.row:last-child{border-bottom:none}
.row:active{background:var(--sf2)}
.ico-box{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.ico-box svg{width:18px;height:18px}
.grow{flex:1;min-width:0}
.val{color:var(--tx2);font-size:15px}
.chev{color:var(--tx3)}
.grp-title{font-size:13px;color:var(--tx2);padding:24px 20px 6px;text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.modal-bd{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-bd.open{opacity:1;pointer-events:auto}
.modal{background:var(--sf);border-radius:14px;max-width:340px;width:100%;overflow:hidden;transform:scale(.92);transition:transform .25s var(--ease);box-shadow:0 20px 40px rgba(0,0,0,.4)}
.modal-bd.open .modal{transform:scale(1)}
.modal-body{padding:20px 20px 8px}
.modal-title{font-size:17px;font-weight:600;text-align:center;margin-bottom:8px}
.modal-msg{font-size:13px;color:var(--tx2);text-align:center;line-height:1.4}
.modal-actions{display:flex;border-top:1px solid var(--bd);margin-top:18px}
.modal-actions button{flex:1;padding:14px;font-size:17px;color:var(--accent);border-right:1px solid var(--bd)}
.modal-actions button:last-child{border-right:none}
.modal-actions button.danger{color:var(--red)}
.modal-actions button.primary{font-weight:600}
#toasts{position:absolute;top:60px;left:0;right:0;z-index:10050;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 20px}
.toast{background:rgba(30,30,35,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:toastIn .3s var(--ease);max-width:100%}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
.toast.out{animation:toastOut .25s forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(-12px) scale(.94)}}
#lock{position:absolute;inset:0;z-index:8000;color:#fff;display:flex;flex-direction:column;transition:transform .55s var(--ease),opacity .4s;overflow:hidden;padding-top:calc(var(--st) + 60px)}
#lock::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at top,rgba(255,255,255,.12),transparent 60%);pointer-events:none}
#lock>*{position:relative;z-index:1}
#lock.unlocked{transform:translateY(-100%);opacity:0;pointer-events:none}
.lock-time{text-align:center;font-size:88px;font-weight:200;letter-spacing:-4px;line-height:1;font-feature-settings:"tnum";text-shadow:0 2px 20px rgba(0,0,0,.3)}
.lock-date{text-align:center;font-size:20px;font-weight:500;opacity:.9;margin-top:6px;text-shadow:0 1px 10px rgba(0,0,0,.4)}
.lock-w{display:flex;gap:10px;padding:0 24px;margin-top:30px}
.lock-widget{flex:1;background:rgba(255,255,255,.14);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:14px}
.lock-widget .lwh{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;opacity:.75;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.lock-widget .lwb{font-size:24px;font-weight:500}
.lock-widget .lws{font-size:12px;opacity:.75;margin-top:2px}
.lock-actions{position:absolute;left:0;right:0;bottom:calc(var(--sb) + 70px);display:flex;justify-content:space-between;padding:0 40px;z-index:2}
.lock-action{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;color:#fff;transition:background .15s,transform .1s}
.lock-action:active{transform:scale(.92);background:rgba(255,255,255,.32)}
.lock-action svg{width:22px;height:22px}
.lock-action.on{background:#fff;color:#000}
.lock-hint{position:absolute;left:0;right:0;bottom:calc(var(--sb) + 24px);text-align:center;font-size:13px;opacity:.65;font-weight:500;animation:bounceHint 2.2s infinite;z-index:2}
@keyframes bounceHint{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-6px);opacity:.9}}
.pin-screen{position:absolute;inset:0;z-index:9000;background:rgba(0,0,0,.65);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;color:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.pin-screen.open{opacity:1;pointer-events:auto}
.pin-screen.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pin-title{font-size:18px;font-weight:500;margin-bottom:26px}
.pin-dots{display:flex;gap:20px;margin-bottom:40px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);transition:background .15s}
.pin-dot.filled{background:#fff}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:280px;width:100%}
.pin-key{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:30px;font-weight:300;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .12s,transform .1s;border:1px solid rgba(255,255,255,.06)}
.pin-key:active{transform:scale(.9);background:rgba(255,255,255,.32)}
.pin-key .letters{font-size:9px;letter-spacing:2px;font-weight:600;opacity:.7;margin-top:-2px}
.pin-key.empty{visibility:hidden}
.pin-key.del svg{width:26px;height:26px}
#home{position:absolute;inset:0;z-index:1000;display:flex;flex-direction:column;padding-top:calc(var(--st) + 54px);padding-bottom:calc(var(--sb) + 14px);opacity:0;pointer-events:none;transition:opacity .4s;overflow:hidden}
#home.visible{opacity:1;pointer-events:auto}
.widgets-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 18px 16px;flex-shrink:0}
.widget{background:rgba(28,28,32,.55);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:14px;color:#fff;aspect-ratio:1;display:flex;flex-direction:column;position:relative;overflow:hidden}
.widget.weather{background:linear-gradient(160deg,rgba(10,132,255,.55),rgba(94,92,230,.55));cursor:pointer;transition:transform .15s}
.widget.weather:active{transform:scale(.97)}
.widget .wt-city{font-size:14px;font-weight:500;opacity:.9}
.widget .wt-temp{font-size:42px;font-weight:200;letter-spacing:-2px;line-height:1;margin-top:6px}
.widget .wt-desc{font-size:12px;opacity:.85;margin-top:auto}
.widget .wt-icon{position:absolute;top:12px;right:14px;opacity:.85}
.widget .wt-time{font-size:42px;font-weight:200;letter-spacing:-2px;line-height:1;font-feature-settings:"tnum"}
.widget .wt-date{font-size:12px;opacity:.7;margin-top:auto;text-transform:uppercase;letter-spacing:.5px}
#homePages{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#homePages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:start;padding:0 14px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:min-content;gap:20px 4px;align-content:start;padding-bottom:12px;overflow-y:auto;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.app-icon{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:transform .2s var(--ease);padding:2px;position:relative}
.app-icon:active{transform:scale(.9)}
.app-icon .bg{width:60px;height:60px;border-radius:22.5%;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.18);position:relative;overflow:hidden}
.app-icon .bg::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.14) 0%,transparent 45%)}
.app-icon .bg svg{width:32px;height:32px;position:relative;z-index:1}
.app-icon .name{font-size:11.5px;font-weight:500;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);max-width:74px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;letter-spacing:.1px}
.app-icon .badge{position:absolute;top:-4px;right:calc(50% - 32px);background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:flex;align-items:center;justify-content:center;border:2px solid rgba(0,0,0,.15)}
.folder-bg{width:60px;height:60px;border-radius:22.5%;background:rgba(255,255,255,.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:4px}
.folder-bg .mini{border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff}
.folder-bg .mini svg{width:16px;height:16px}
#pageDots{display:flex;justify-content:center;gap:7px;padding:4px 0 10px;flex-shrink:0}
#pageDots .dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);transition:background .25s;cursor:pointer}
#pageDots .dot.active{background:#fff}
#dock{margin:0 12px;padding:10px 6px;background:rgba(255,255,255,.16);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.12);border-radius:32px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex-shrink:0}
#dock .app-icon .name{display:none}
#dock .app-icon .bg{width:56px;height:56px}
#dock .app-icon .bg svg{width:30px;height:30px}
#home.edit .app-icon{animation:jiggle .32s infinite}
#home.edit .app-icon:nth-child(2n){animation-delay:.08s;animation-direction:reverse}
@keyframes jiggle{0%,100%{transform:rotate(-1.2deg) scale(1)}50%{transform:rotate(1.2deg) scale(.98)}}
#home.edit .app-icon .del{position:absolute;top:-2px;left:2px;width:22px;height:22px;border-radius:50%;background:#e0e0e0;color:#000;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;z-index:10;cursor:pointer;border:1px solid rgba(0,0,0,.1);line-height:1}
#home.edit .app-icon .del::before{content:'−'}
.app-window{position:absolute;inset:0;z-index:2000;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;transform:scale(1.06);opacity:0;pointer-events:none;transition:transform .38s var(--ease),opacity .28s;overflow:hidden}
.app-window.open{transform:scale(1);opacity:1;pointer-events:auto}
.app-window.closing{transform:scale(1.06);opacity:0;pointer-events:none}
.app-header{height:56px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;padding-top:var(--st);background:var(--hb);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--bd)}
.app-header .title{font-size:17px;font-weight:600;letter-spacing:-.2px}
.app-header .back{position:absolute;left:8px;top:var(--st);height:56px;display:flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;padding:0 8px;border-radius:10px;transition:opacity .15s}
.app-header .back:active{opacity:.5}
.app-header .back svg{width:11px;height:18px}
.app-header .action{position:absolute;right:8px;top:var(--st);height:56px;display:flex;align-items:center;color:var(--accent);font-size:17px;font-weight:600;padding:0 10px;border-radius:10px}
.app-header .action:active{opacity:.5}
.app-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
.app-body::-webkit-scrollbar{width:6px}
.app-body::-webkit-scrollbar-thumb{background:var(--sf3);border-radius:3px}
#cc,#nc{position:absolute;inset:0;z-index:7500;background:rgba(0,0,0,.42);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);transform:translateY(-100%);transition:transform .42s var(--ease);padding:calc(var(--st) + 60px) 14px calc(var(--sb) + 20px);color:#fff;overflow-y:auto;scrollbar-width:none}
#cc::-webkit-scrollbar,#nc::-webkit-scrollbar{display:none}
#cc.open,#nc.open{transform:translateY(0)}
#nc{z-index:7400}
.cc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cc-card{background:rgba(120,120,128,.32);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:22px;padding:14px;transition:background .2s,transform .1s;cursor:pointer;user-select:none}
.cc-card:active{transform:scale(.96)}
.cc-card.span2{grid-column:span 2;grid-row:span 2;padding:16px;display:flex;flex-direction:column;gap:12px}
.cc-tog{width:42px;height:42px;border-radius:50%;background:rgba(120,120,128,.5);display:flex;align-items:center;justify-content:center;transition:background .2s,transform .1s;flex-shrink:0}
.cc-tog svg{width:20px;height:20px}
.cc-tog.on{background:var(--accent);color:#fff}
.cc-tog.on.green{background:var(--green)}
.cc-tog.on.orange{background:var(--orange)}
.cc-tog.on.purple{background:var(--purple)}
.cc-tog.on.yellow{background:var(--yellow);color:#000}
.cc-row{display:flex;align-items:center;gap:12px}
.cc-lbl{font-size:12px;font-weight:600}
.cc-slider{height:150px;position:relative;background:rgba(120,120,128,.32);border-radius:22px;overflow:hidden;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.cc-slider .fill{position:absolute;left:8px;right:8px;bottom:8px;background:#fff;border-radius:16px;transition:height .05s linear}
.cc-slider svg{position:relative;z-index:1;mix-blend-mode:difference;color:#fff}
.nc-header{display:flex;justify-content:space-between;align-items:center;padding:0 6px 18px}
.nc-header h2{font-size:30px;font-weight:700;letter-spacing:-.5px}
.nc-clear{font-size:14px;color:rgba(255,255,255,.75);font-weight:500;padding:6px 14px;background:rgba(255,255,255,.14);border-radius:20px;transition:background .15s}
.nc-clear:active{background:rgba(255,255,255,.25)}
.nc-empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,.5);font-size:15px}
.nc-empty svg{width:56px;height:56px;opacity:.4;margin:0 auto 16px}
.notif{background:rgba(120,120,128,.4);border-radius:20px;padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;animation:notifIn .35s var(--ease);cursor:pointer;transition:transform .12s}
.notif:active{transform:scale(.98)}
@keyframes notifIn{from{opacity:0;transform:translateY(-10px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.notif .ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.notif .txt{flex:1;min-width:0}
.notif .t{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600;margin-bottom:2px}
.notif .t .time{font-size:12px;font-weight:400;opacity:.7}
.notif .m{font-size:13px;opacity:.9;line-height:1.35;word-break:break-word}
#switcher{position:absolute;inset:0;z-index:7200;background:rgba(0,0,0,.65);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);opacity:0;pointer-events:none;transition:opacity .3s;padding:calc(var(--st) + 40px) 0 calc(var(--sb) + 40px);display:flex;align-items:center}
#switcher.open{opacity:1;pointer-events:auto}
#switcherScroll{display:flex;gap:16px;overflow-x:auto;padding:0 40px;scroll-snap-type:x mandatory;scrollbar-width:none;width:100%}
#switcherScroll::-webkit-scrollbar{display:none}
.switch-card{flex:0 0 72%;scroll-snap-align:center;aspect-ratio:9/17;max-height:70vh;background:var(--bg);border-radius:32px;overflow:hidden;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.5);transition:transform .3s,opacity .3s;cursor:pointer;border:1px solid rgba(255,255,255,.08)}
.switch-card .head{position:absolute;top:0;left:0;right:0;padding:14px 18px;display:flex;align-items:center;gap:10px;color:#fff;font-size:14px;font-weight:600;z-index:2;background:linear-gradient(180deg,rgba(0,0,0,.4),transparent)}

<script>
'use strict';
/* ============================================================
   SAFE STORAGE
============================================================ */
const Store = (() => {
  let mem = {};
  const ok = (() => { try { localStorage.setItem('_t','1'); localStorage.removeItem('_t'); return true; } catch(e){ return false; } })();
  return {
    get(k, def) { try { const v = ok ? localStorage.getItem('nova_'+k) : mem[k]; return v ? JSON.parse(v) : def; } catch(e){ return def; } },
    set(k, v) { try { const s = JSON.stringify(v); if (ok) localStorage.setItem('nova_'+k, s); else mem[k] = s; } catch(e){} },
    del(k) { try { if (ok) localStorage.removeItem('nova_'+k); else delete mem[k]; } catch(e){} },
    clear() { try { if (ok) Object.keys(localStorage).forEach(k=>k.startsWith('nova_')&&localStorage.removeItem(k)); else mem = {}; } catch(e){} }
  };
})();

/* ============================================================
   STATE
============================================================ */
const ALL_APPS = ['phone','messages','safari','music','notes','calculator','clock','calendar','weather','gallery','files','camera','settings','store','terminal','browser','photos'];
const DEFAULT_STATE = {
  theme: 'dark',

    else if (k === 'html') e.innerHTML = props[k];
    else if (k === 'text') e.textContent = props[k];
    else e.setAttribute(k, props[k]);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => c && e.appendChild(c));
  return e;
};
const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vibrate = (ms=8) => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };
const fmtTime = d => d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
const fmtTimeSec = d => d.toLocaleTimeString('ru-RU');
const fmtDate = d => { const s = d.toLocaleDateString('ru-RU', {weekday:'long', day:'numeric', month:'long'}); return s.charAt(0).toUpperCase()+s.slice(1); };
const fmtDateShort = d => d.toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
const uid = () => Math.random().toString(36).slice(2, 10);

/* ============================================================
   TOAST / MODAL
============================================================ */
const Toast = (() => {
  const container = $('#toasts');
  return (msg, dur=2200) => {
    const t = el('div', {class:'toast', text:msg});
    container.appendChild(t);
    setTimeout(() => {
      t.classList.add('out');
      setTimeout(() => t.remove(), 280);
    }, dur);
  };
})();

const Modal = (() => {
  let current = null;
  function close(result) {
    if (!current) return;
    const {resolve, bd} = current;
    bd.classList.remove('open');
    setTimeout(() => bd.remove(), 260);
    current = null;
    resolve && resolve(result);
  }
  function show({title, message, actions, allowBackdrop=true}) {
    return new Promise(resolve => {
      const bd = el('div', {class:'modal-bd'});
      const m = el('div', {class:'modal'});
      const body = el('div', {class:'modal-body'});
      if (title) body.appendChild(el('div', {class:'modal-title', text:title}));
      if (message) body.appendChild(el('div', {class:'modal-msg', text:message}));
      m.appendChild(body);
      const acts = el('div', {class:'modal-actions'});
      actions.forEach(a => {
        acts.appendChild(el('button', {
          class: a.primary ? 'primary' : (a.danger ? 'danger' : ''),
          text: a.label,
          onclick: () => close(a.value)
        }));
      });
      m.appendChild(acts);
      bd.appendChild(m);
      document.body.appendChild(bd);
      requestAnimationFrame(() => bd.classList.add('open'));
      current = {resolve, bd};
      if (allowBackdrop) bd.addEventListener('click', e => { if (e.target === bd) close(null); });
      const esc = e => { if (e.key === 'Escape') { close(null); document.removeEventListener('keydown', esc); } };
      document.addEventListener('keydown', esc);
    });
  }
  return {
    alert: (title, message) => show({title, message, actions:[{label:'OK', value:true, primary:true}]}),
    confirm: (title, message, confirmLabel='OK') => show({title, message, actions:[
      {label:'Отмена', value:false}, {label:confirmLabel, value:true, primary:true}
    ]}),
    danger: (title, message, confirmLabel='Удалить') => show({title, message, actions:[
      {label:'Отмена', value:false}, {label:confirmLabel, value:true, danger:true}
    ]}),
    prompt: (title, def='') => new Promise(resolve => {
      const bd = el('div', {class:'modal-bd'});
      const m = el('div', {class:'modal'});
      const body = el('div', {class:'modal-body'});
      body.appendChild(el('div', {class:'modal-title', text:title}));
      const inp = el('input', {style:'width:100%;padding:10px;border-radius:8px;background:var(--sf2);color:var(--tx);margin-top:8px;font-size:16px', value:def});
      body.appendChild(inp);
      m.appendChild(body);
      const acts = el('div', {class:'modal-actions'});
      acts.appendChild(el('button', {text:'Отмена', onclick:() => { close(null); }}));
      acts.appendChild(el('button', {class:'primary', text:'OK', onclick:() => { close(inp.value); }}));
      m.appendChild(acts);
      bd.appendChild(m);
      document.body.appendChild(bd);
      requestAnimationFrame(() => { bd.classList.add('open'); inp.focus(); inp.select(); });
      current = {resolve, bd};
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') close(inp.value); });
    })
  };
})();

const Lock = (() => {
  const lockEl = $('#lock');
  const pinScreen = $('#pinScreen');
  let startY = null, entered = '';
  let pinPurpose = 'unlock';
  let pinCallback = null;

  function updateClock() {
    const now = new Date();
    $('#lkTime').textContent = fmtTime(now);
    $('#lkDate').textContent = fmtDate(now);
  }

  function buildWidgets() {
    $('#lkW').innerHTML = `
      <div class="lock-widget">
        <div class="lwh">${I.weather.replace('width="32"','width="14"')} Погода</div>
        <div class="lwb">+18°</div>
        <div class="lws">Ясно · Москва</div>
      </div>
      <div class="lock-widget">
        <div class="lwh">${I.calendar.replace('width="32"','width="14"')} Календарь</div>
        <div class="lwb">${new Date().getDate()} ${new Date().toLocaleDateString('ru-RU',{month:'short'})}</div>
        <div class="lws">${Object.keys(S.events).length} событий</div>
      </div>`;
    $('#lkFlash').innerHTML = I.flash;
    $('#lkCam').innerHTML = I.camera.replace('width="32"','width="22"');
    $('#lkFlash').classList.toggle('on', S.flashlight);
  }

  function showPin(purpose, callback) {
    pinPurpose = purpose;
    pinCallback = callback;
    entered = '';
    renderPin();
    pinScreen.classList.add('open');
  }

  function hidePin() {
    pinScreen.classList.remove('open');
  }

  function renderPin() {
    const titles = {
      unlock: 'Введите PIN-код',
      confirm: 'Подтвердите PIN-код',
      change: 'Текущий PIN-код'
    };
    pinScreen.innerHTML = `
      <div class="pin-title">${titles[pinPurpose] || 'Введите PIN'}</div>
      <div class="pin-dots">
        ${[0,1,2,3].map(i => `<div class="pin-dot${i < entered.length ? ' filled' : ''}"></div>`).join('')}
      </div>
      <div class="pin-pad">
        ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="pin-key" data-n="${n}">${n}</button>`).join('')}
        <button class="pin-key empty"></button>
        <button class="pin-key" data-n="0">0</button>
        <button class="pin-key del" data-act="del">${I.del.replace('width="32"','width="26"')}</button>
      </div>`;
    pinScreen.querySelectorAll('.pin-key').forEach(k => {
      k.onclick = () => {
        const act = k.dataset.act;
        const n = k.dataset.n;
        vibrate(6);
        if (act === 'del') {
          entered = entered.slice(0, -1);
        } else if (n !== undefined && entered.length < 4) {
          entered += n;
        }
        renderPin();
        if (entered.length === 4) {
          setTimeout(() => checkPin(), 150);
        }
      };
    });
  }

  function checkPin() {
    if (entered === S.pin) {
      hidePin();
      if (pinPurpose === 'unlock') {
        unlock();
      } else if (pinCallback) {
        const cb = pinCallback;
        pinCallback = null;
        cb(true);
      }
    } else {
      vibrate(60);
      pinScreen.classList.add('shake');
      setTimeout(() => pinScreen.classList.remove('shake'), 420);
      entered = '';
      setTimeout(() => renderPin(), 300);
      Toast('Неверный PIN-код');
    }
  }

  function unlock() {
    S.unlocked = true;
    save();
    lockEl.classList.add('unlocked');
    $('#home').classList.add('visible');
    expandIsland('Разблокировано');
  }

  function swipeStart(y) { startY = y; }
  function swipeMove(y) {
    if (startY === null) return;
    const dy = y - startY;
    if (dy < 0) {
      lockEl.style.transform = `translateY(${dy}px)`;
      lockEl.style.opacity = Math.max(0, 1 + dy / 400);
    }
  }
  function swipeEnd(y) {
    if (startY === null) return;
    const dy = y - startY;
    if (dy < -80) {
      showPin('unlock');
      lockEl.style.transform = '';
      lockEl.style.opacity = '';
    } else {
      lockEl.style.transform = '';
      lockEl.style.opacity = '';
    }
    startY = null;
  }

  function init() {
    updateClock();
    buildWidgets();
    setInterval(() => { updateClock(); if (!$('#home').classList.contains('visible')) buildWidgets(); }, 1000);

    lockEl.addEventListener('touchstart', e => swipeStart(e.touches[0].clientY), {passive:true});
    lockEl.addEventListener('touchmove', e => swipeMove(e.touches[0].clientY), {passive:true});
    lockEl.addEventListener('touchend', e => swipeEnd(e.changedTouches[0].clientY));

    let md = false;
    lockEl.addEventListener('mousedown', e => { md = true; swipeStart(e.clientY); });
    window.addEventListener('mousemove', e => { if (md) swipeMove(e.clientY); });
    window.addEventListener('mouseup', e => { if (md) { swipeEnd(e.clientY); md = false; } });

    $('#lkFlash').onclick = (e) => {
      e.stopPropagation();
      S.flashlight = !S.flashlight;
      save();
      buildWidgets();
      Toast(S.flashlight ? 'Фонарик включён' : 'Фонарик выключен');
      vibrate(10);
    };
    $('#lkCam').onclick = async (e) => {
      e.stopPropagation();
      showPin('unlock', () => {
        unlock();
        setTimeout(() => AppManager.open('camera'), 400);
      });
    };
  }

  return {init, showPin, hidePin, unlock, renderPin};
})();

const Home = (() => {

  function renderWidgets() {

      </div>`;
    $('#widgets .weather').onclick = () => AppManager.open('weather');
  }

  function updateTime() {
    const now = new Date();
    const wt = $('#wTime'); const wd = $('#wDate');
    if (wt) wt.textContent = fmtTime(now);
    if (wd) wd.textContent = fmtDateShort(now);
  }

  function renderAppIcon(appId, inDock=false) {
    const app = APPS[appId];
    if (!app) return null;
    const div = el('div', {class:'app-icon', 'data-app':appId});
    div.innerHTML = `
      <div class="bg" style="background:${app.color}">${app.icon}</div>
      <div class="name">${app.name}</div>
      ${editMode && !inDock ? '<div class="del"></div>' : ''}`;
    div.onclick = (e) => {
      if (editMode) return;
      if (e.target.classList.contains('del')) return;
      AppManager.open(appId);
    };
    // Long press
    let lt = null;
    div.addEventListener('pointerdown', e => {
      if (inDock) return;
      lt = setTimeout(() => {
        lt = null;
        enterEdit();
        vibrate(15);
      }, 550);
    });
    ['pointerup','pointerleave','pointercancel'].forEach(ev => div.addEventListener(ev, () => {
      if (lt) { clearTimeout(lt); lt = null; }
    }));
    // Del button
    const del = div.querySelector('.del');
    if (del) del.onclick = async (e) => {
      e.stopPropagation();
      const ok = await Modal.danger(`Удалить ${app.name}?`, 'Приложение будет удалено с домашнего экрана');
      if (ok) {
        S.installed = S.installed.filter(id => id !== appId);
        S.homePages = S.homePages.map(p => p.filter(id => id !== appId));
        save();
        render();
        Toast(`${app.name} удалено`);
      }
    };
    return div;
  }

  function render() {
    // Pages
    const pages = $('#homePages');
    pages.innerHTML = '';
    const pageCount = Math.max(S.homePages.length, 1);
    for (let i = 0; i < pageCount; i++) {
      const pageEl = el('div', {class:'page'});
      (S.homePages[i] || []).forEach(id => {
        if (S.installed.includes(id)) {
          const icon = renderAppIcon(id);
          if (icon) pageEl.appendChild(icon);
        }
      });
      pages.appendChild(pageEl);
    }
    // Dots
    const dots = $('#pageDots');
    dots.innerHTML = '';
    for (let i = 0; i < pageCount; i++) {
      const d = el('div', {class:'dot' + (i === 0 ? ' active' : '')});
      d.onclick = () => pages.scrollTo({left: i * pages.offsetWidth, behavior:'smooth'});
      dots.appendChild(d);
    }
    // Dock
    const dock = $('#dock');
    dock.innerHTML = '';
    S.dock.forEach(id => {
      if (S.installed.includes(id)) {
        const icon = renderAppIcon(id, true);
        if (icon) dock.appendChild(icon);
      }
    });
    // Page scroll listener
    pages.onscroll = () => {
      const idx = Math.round(pages.scrollLeft / pages.offsetWidth);
      $$('#pageDots .dot').forEach((d, i) => d.classList.toggle('active', i === idx));
    };
  }

  function enterEdit() {
    editMode = true;
    $('#home').classList.add('edit');
    render();
    Toast('Режим редактирования. Tap вне иконки для выхода');
  }

  function exitEdit() {
    editMode = false;
    $('#home').classList.remove('edit');
    render();
  }

  function init() {
    renderWidgets();
    render();
    setInterval(updateTime, 1000);
    // Click outside to exit edit
    $('#home').addEventListener('click', e => {
      if (editMode && !e.target.closest('.app-icon')) exitEdit();
    });
    // Swipe up for App Library
    let sy = null, st = 0;
    $('#homePages').addEventListener('touchstart', e => { sy = e.touches[0].clientY; st = Date.now(); }, {passive:true});
    $('#homePages').addEventListener('touchend', e => {
      if (sy === null) return;
      const dy = e.changedTouches[0].clientY - sy;
      const dt = Date.now() - st;
      if (dy < -80 && dt < 500) AppLib.open();
      sy = null;
    });
  }

  return {init, render, renderWidgets, enterEdit, exitEdit, isEdit: () => editMode};
})();

          if (n.app && APPS[n.app]) {
            close();
            setTimeout(() => AppManager.open(n.app), 200);
          }
        };
        // Swipe right to dismiss
        let sx = null;
        div.addEventListener('pointerdown', e => { sx = e.clientX; });
        div.addEventListener('pointerup', e => {
          if (sx !== null && e.clientX - sx > 80) {
            S.notifications = S.notifications.filter(x => x.id !== n.id);
            save();
            render();
          }
          sx = null;
        });
        list.appendChild(div);
      });
      $('#ncClear').onclick = async () => {
        const ok = await Modal.confirm('Очистить все уведомления?', '', 'Очистить');
        if (ok) { S.notifications = []; save(); render(); }
      };
    }
  }
  function open() { render(); ncEl.classList.add('open'); }
  function close() { ncEl.classList.remove('open'); }
  function push(app, title, message, color) {
    S.notifications.unshift({id:uid(), app, title, message, color, time:Date.now()});
    if (S.notifications.length > 50) S.notifications = S.notifications.slice(0, 50);
    save();
    if (!ncEl.classList.contains('open')) {
      expandIsland(`${title}: ${message}`);
    } else render();
  }
  function init() {
    ncEl.addEventListener('click', e => { if (e.target === ncEl) close(); });
  }
  return {open, close, push, render, init};
})();

const Spot = (() => {
  const sp = $('#spotlight');
  const input = $('#spotInput');
  const results = $('#spotResults');

  function search(q) {
    q = q.toLowerCase().trim();
    results.innerHTML = '';
    const appMatches = Object.entries(APPS).filter(([id, a]) =>
      S.installed.includes(id) && (!q || a.name.toLowerCase().includes(q)));
    if (appMatches.length === 0 && !q) {
      // Show all apps when empty
      Object.entries(APPS).filter(([id]) => S.installed.includes(id)).forEach(([id, a]) => {
        results.appendChild(makeAppIcon(id, a));
      });
      return;
    }
    if (!q) return;
    if (appMatches.length > 0) {
      results.appendChild(el('div', {style:'grid-column:1/-1;font-size:13px;opacity:.6;text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-top:6px', text:'Приложения'}));
      appMatches.forEach(([id, a]) => results.appendChild(makeAppIcon(id, a)));
    }
    // Notes
    const noteMatches = S.notes.filter(n => n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q));
    if (noteMatches.length > 0) {
      results.appendChild(el('div', {style:'grid-column:1/-1;font-size:13px;opacity:.6;text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-top:6px', text:'Заметки'}));
      noteMatches.slice(0, 3).forEach(n => {
        const item = el('div', {class:'app-icon'});
        item.innerHTML = `<div class="bg" style="background:linear-gradient(180deg,#ffd60a,#ff9f0a)">${I.notes}</div><div class="name">${esc(n.title.slice(0, 20))}</div>`;
        item.onclick = () => { close(); setTimeout(() => AppManager.open('notes', {noteId:n.id}), 200); };
        results.appendChild(item);
      });
    }
    if (results.children.length === 0) {
      results.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;opacity:.6">Ничего не найдено</div>';
    }
  }

  function makeAppIcon(id, app) {
    const item = el('div', {class:'app-icon'});
    item.innerHTML = `<div class="bg" style="background:${app.color}">${app.icon}</div><div class="name">${app.name}</div>`;
    item.onclick = () => { close(); setTimeout(() => AppManager.open(id), 200); };
    return item;
  }

  function open() {
    sp.classList.add('open');
    search('');
    setTimeout(() => input.focus(), 200);
  }
  function close() { sp.classList.remove('open'); input.value = ''; }
  function init() {
    input.addEventListener('input', e => search(e.target.value));
    input.addEventListener('keydown', e => {
      if (e.key === 'Escape') close();
    });
    sp.addEventListener('click', e => { if (e.target === sp) close(); });
  }
  return {open, close, init};
})();

/* ============================================================
   APP MANAGER
============================================================ */
const AppManager = (() => {
  const open = {};
  const winCount = {};

  function create(id, opts={}) {
    const app = APPS[id];
    if (!app) return null;

    const win = el('div', {class:'app-window' + (app.dark ? '' : ''), 'data-app-id':id});
    win.style.background = app.dark ? '#000' : 'var(--bg)';

    const header = el('div', {class:'app-header'});
    header.innerHTML = `
      <button class="back">${I.chevronL.replace('width="32"','width="11" height="18"')} Назад</button>
      <div class="title">${app.name}</div>
      <div class="action-slot"></div>`;
    win.appendChild(header);

    const body = el('div', {class:'app-body'});
    win.appendChild(body);

    // back
    header.querySelector('.back').onclick = () => close(id);

    // Render content
    const renderer = Renderers[id];
    if (renderer) {
      try {
        renderer(body, header.querySelector('.action-slot'), opts);
      } catch (e) {
        console.error('App render error', id, e);
        body.innerHTML = `<div style="padding:40px 20px;text-align:center;color:var(--tx2)">Ошибка приложения</div>`;
      }
    } else {
      body.innerHTML = `<div style="padding:40px 20px;text-align:center;color:var(--tx2)">Приложение в разработке</div>`;
    }

    return win;
  }

  function open_(id, opts={}) {
    if (open[id]) {
      // Bring to front
      const w = open[id];
      w.classList.add('open');
      w.classList.remove('closing');
      return;
    }
    const win = create(id, opts);
    if (!win) return;
    $('#phone').appendChild(win);
    open[id] = win;
    requestAnimationFrame(() => requestAnimationFrame(() => win.classList.add('open')));
    vibrate(6);
    // Track
    S.lastApps = S.lastApps.filter(x => x !== id);
    S.lastApps.push(id);
    if (S.lastApps.length > 10) S.lastApps.shift();
    save();
    updateStatusBar();
  }

  function close(id) {
    const w = open[id];
    if (!w) return;
    w.classList.remove('open');
    w.classList.add('closing');
    setTimeout(() => {
      w.remove();
      delete open[id];
      updateStatusBar();
    }, 380);
  }

  function closeAll() {
    Object.keys(open).forEach(id => close(id));
  }

  function goHome() {
    // close all windows
    Object.keys(open).forEach(id => close(id));
    // close panels
    CC.close(); NC.close(); Switcher.close(); Spot.close(); AppLib.close();
  }

  return {open: open_, close, closeAll, goHome, isOpen: id => !!open[id]};
})();

============================================================ */
const Gestures = (() => {
  let tStart = null;

  function init() {
    document.addEventListener('touchstart', e => {
      if (!S.unlocked) return;
      if (AppManager.isOpen(APP_ID_ANY())) return;
      const t = e.touches[0];
      const y = t.clientY;
      const x = t.clientX;
      // Top edge
      if (y < 40) {
        tStart = {y, x, side: x > window.innerWidth / 2 ? 'right' : 'left'};
      }
      // Bottom edge (home gesture)
      else if (y > window.innerHeight - 40) {
        tStart = {y, x, side: 'bottom'};
      }
    }, {passive:true});

    document.addEventListener('touchmove', e => {
      if (!tStart) return;
      const t = e.touches[0];
      const dy = t.clientY - tStart.y;
      if (tStart.side === 'right' && dy > 30) {
        CC.open();
        tStart = null;
      } else if (tStart.side === 'left' && dy > 30) {
        NC.open();
        tStart = null;
      }
    }, {passive:true});

    document.addEventListener('touchend', e => {
      if (!tStart) return;
      if (tStart.side === 'bottom') {
        const t = e.changedTouches[0];
        const dy = tStart.y - t.clientY;
        if (dy > 80) {
          AppManager.goHome();
        }
      }
      tStart = null;
    });

    // Desktop: click to top edge
    document.addEventListener('mousedown', e => {
      if (!S.unlocked) return;
      if (e.clientY < 40 && !e.target.closest('.app-window') && !e.target.closest('.app-icon')) {
        tStart = {y: e.clientY, x: e.clientX, side: e.clientX > window.innerWidth / 2 ? 'right' : 'left'};
      }
    });
    document.addEventListener('mousemove', e => {
      if (!tStart) return;
      const dy = e.clientY - tStart.y;
      if (tStart.side === 'right' && dy > 30) { CC.open(); tStart = null; }
      else if (tStart.side === 'left' && dy > 30) { NC.open(); tStart = null; }
    });
    document.addEventListener('mouseup', () => { tStart = null; });

    // Swipe down from home center → Spotlight
    let spotStart = null;
    $('#home').addEventListener('touchstart', e => {
      if (e.target.closest('.app-icon')) return;
      spotStart = {y: e.touches[0].clientY, time: Date.now()};
    }, {passive:true});
    $('#home').addEventListener('touchend', e => {
      if (!spotStart) return;
      const dy = e.changedTouches[0].clientY - spotStart.y;
      const dt = Date.now() - spotStart.time;
      if (dy > 60 && dt < 400 && spotStart.y > 150) Spot.open();
      spotStart = null;
    });
    // Desktop alt: hover over home area then drag — skip, use keyboard
  }
  return {init};
})();

/* ---------- CALCULATOR ---------- */
Renderers.calculator = (body) => {
  let cur = '0', prev = null, op = null, reset = false;
  let history = Store.get('calc_history', []);

  function calc(a, b, op) {
    a = parseFloat(a); b = parseFloat(b);
    let r;
    switch(op) {
      case '+': r = a + b; break;
      case '-': r = a - b; break;
      case '*': r = a * b; break;
      case '/': r = b === 0 ? NaN : a / b; break;
      default: return b;
    }
    if (!isFinite(r) || isNaN(r)) return 'Ошибка';
    return String(Math.round(r * 1e10) / 1e10);
  }

  function render() {
    const keys = [
      {l:'AC', cls:'gray', act:'C'},
      {l:'+/−', cls:'gray', act:'±'},
      {l:'%', cls:'gray', act:'%'},
      {l:'÷', cls:'op', act:'/'},
      {l:'7', act:'7'},{l:'8', act:'8'},{l:'9', act:'9'},{l:'×', cls:'op', act:'*'},
      {l:'4', act:'4'},{l:'5', act:'5'},{l:'6', act:'6'},{l:'−', cls:'op', act:'-'},
      {l:'1', act:'1'},{l:'2', act:'2'},{l:'3', act:'3'},{l:'+', cls:'op', act:'+'},
      {l:'0', cls:'zero', act:'0'},{l:'.', act:'.'},{l:'=', cls:'op', act:'='}
    ];
    body.innerHTML = `
      <div class="calc">
        <div class="calc-display" id="calcDisp">${esc(cur)}</div>
        <div class="calc-keys">
          ${keys.map(k => `<button class="${k.cls||''}" data-act="${k.act}">${k.l}</button>`).join('')}
        </div>
      </div>`;
    body.querySelectorAll('.calc-keys button').forEach(b => {
      b.onclick = () => { press(b.dataset.act); };
    });
  }

  function press(v) {
    vibrate(4);
    if (v === 'C') { cur = '0'; prev = null; op = null; reset = false; }
    else if (v === '±') cur = String(parseFloat(cur) * -1);
    else if (v === '%') cur = String(parseFloat(cur) / 100);
    else if (['+','-','*','/'].includes(v)) {
      if (op && !reset) cur = calc(prev, cur, op);
      prev = cur; op = v; reset = true;
    }
    else if (v === '=') {
      if (op) {
        const result = calc(prev, cur, op);
        history.unshift(`${prev} ${op} ${cur} = ${result}`);
        history = history.slice(0, 30);
        Store.set('calc_history', history);
        cur = result;
        op = null; prev = null; reset = true;
      }
    }
    else if (v === '.') {
      if (reset) { cur = '0'; reset = false; }
      if (!cur.includes('.')) cur += '.';
    }
    else {
      if (reset || cur === '0') { cur = v; reset = false; }
      else if (cur.length < 12) cur += v;
    }
    const d = body.querySelector('#calcDisp');
    d.textContent = cur;
    d.style.fontSize = cur.length > 8 ? '48px' : cur.length > 6 ? '60px' : '80px';
  }

  render();
};

Renderers.notes = (body, actionSlot, opts={}) => {

      return;
    }
    body.innerHTML = '';
    const sorted = [...S.notes].sort((a,b) => (b.pinned?1:0) - (a.pinned?1:0) || b.date - a.date);
    sorted.forEach(n => {
      const div = el('div', {class:'note-item'});

        <div class="prv">${esc(n.body)}</div>
        <div class="dt">${new Date(n.date).toLocaleDateString('ru-RU', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})}</div>`;
      div.onclick = () => openEditor(n.id);
      body.appendChild(div);
    });
  }

  function openEditor(noteId) {
    const note = noteId ? S.notes.find(n => n.id === noteId) : {id:uid(), title:'', body:'', date:Date.now(), pinned:false};
    const isNew = !noteId;
    actionSlot.innerHTML = `
      <button class="action save">Готово</button>
      ${!isNew ? `<button class="action del">🗑</button>` : ''}`;
    body.innerHTML = `
      <div class="note-editor">
        <input class="title" placeholder="Заголовок" value="${esc(note.title)}">
        <textarea placeholder="Текст заметки...">${esc(note.body)}</textarea>
      </div>`;
    const titleI = body.querySelector('input.title');
    const bodyT = body.querySelector('textarea');
    actionSlot.querySelector('.save').onclick = () => {
      note.title = titleI.value.trim() || 'Без названия';
      note.body = bodyT.value;
      note.date = Date.now();
      if (isNew) S.notes.unshift(note);
      else {
        const idx = S.notes.findIndex(n => n.id === note.id);
        if (idx >= 0) S.notes[idx] = note;
      }
      save();
      Toast('Заметка сохранена');
      renderList();
    };
    if (!isNew) {
      actionSlot.querySelector('.del').onclick = async () => {
        const ok = await Modal.danger('Удалить заметку?', 'Действие нельзя отменить');
        if (ok) {
          S.notes = S.notes.filter(n => n.id !== note.id);
          save();
          renderList();
          Toast('Удалено');
        }
      };
    }
    setTimeout(() => (isNew ? titleI : bodyT).focus(), 100);
  }

  renderList();
};

/* ---------- CLOCK ---------- */
Renderers.clock = (body) => {
  let tab = 'clock';
  let swRunning = false, swStart = 0, swElapsed = 0;
  let timerLeft = 0, timerRunning = false, timerInt = null;
  let clockInt = null;

  function render() {
    if (clockInt) { clearInterval(clockInt); clockInt = null; }
    body.innerHTML = `
      <div class="clock-app">
        <div class="clock-tabs">
          <button data-tab="clock" class="${tab==='clock'?'active':''}">Часы</button>
          <button data-tab="stopwatch" class="${tab==='stopwatch'?'active':''}">Секундомер</button>
          <button data-tab="timer" class="${tab==='timer'?'active':''}">Таймер</button>
        </div>
        <div id="clockContent"></div>
      </div>`;
    body.querySelectorAll('.clock-tabs button').forEach(b => {
      b.onclick = () => { tab = b.dataset.tab; render(); };
    });
    const c = body.querySelector('#clockContent');
    if (tab === 'clock') renderClock(c);
    else if (tab === 'stopwatch') renderStopwatch(c);
    else renderTimer(c);
  }

  function renderClock(c) {
    const update = () => {
      const now = new Date();
      c.innerHTML = `
        <div class="clock-big">${fmtTimeSec(now)}</div>
        <div class="clock-date">${fmtDate(now)}</div>`;
    };
    update();
    clockInt = setInterval(update, 1000);
  }

  function renderStopwatch(c) {
    const fmt = ms => {
      const m = Math.floor(ms/60000);
      const s = Math.floor((ms%60000)/1000);
      const cs = Math.floor((ms%1000)/10);
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
    };
    const update = () => {
      const t = c.querySelector('.sw-time');
      if (t) t.textContent = fmt(swElapsed + (swRunning ? Date.now() - swStart : 0));
    };
    c.innerHTML = `<div class="sw-time">${fmt(swElapsed)}</div>
      <div class="sw-ctrl">
        ${swRunning ? '<button class="sw-btn stop" data-act="stop">Стоп</button>' : '<button class="sw-btn start" data-act="start">Старт</button>'}
        <button class="sw-btn lap" data-act="reset">Сброс</button>
      </div>`;
    c.querySelectorAll('.sw-btn').forEach(b => {
      b.onclick = () => {
        if (b.dataset.act === 'start') { swStart = Date.now(); swRunning = true; }
        else if (b.dataset.act === 'stop') { swElapsed += Date.now() - swStart; swRunning = false; }
        else if (b.dataset.act === 'reset') { swElapsed = 0; swRunning = false; }
        render();
      };
    });
    if (swRunning) {
      const iv = setInterval(() => {
        if (!document.body.contains(c)) { clearInterval(iv); return; }
        update();
      }, 30);
    }
  }

  function renderTimer(c) {
    const fmt = s => {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    };
    c.innerHTML = `
      <div class="timer-disp">${fmt(timerLeft)}</div>
      <div class="timer-inp">
        <input type="number" id="tM" min="0" max="99" placeholder="00" value="${Math.floor(timerLeft/60)}">
        <span>:</span>
        <input type="number" id="tS" min="0" max="59" placeholder="00" value="${timerLeft%60}">
      </div>
      <div class="sw-ctrl">
        <button class="sw-btn ${timerRunning?'stop':'start'}" data-act="tog">${timerRunning?'Стоп':'Старт'}</button>
        <button class="sw-btn lap" data-act="tr">Сброс</button>
      </div>`;
    const mI = c.querySelector('#tM');
    const sI = c.querySelector('#tS');
    mI.oninput = sI.oninput = () => {
      if (timerRunning) return;
      timerLeft = (parseInt(mI.value)||0) * 60 + (parseInt(sI.value)||0);
    };
    c.querySelectorAll('.sw-btn').forEach(b => {
      b.onclick = () => {
        if (b.dataset.act === 'tog') {
          if (!timerRunning) {
            if (timerLeft === 0) timerLeft = (parseInt(mI.value)||0)*60 + (parseInt(sI.value)||0);
            if (timerLeft === 0) { Toast('Введите время'); return; }
            timerRunning = true;
            timerInt = setInterval(() => {
              timerLeft--;
              const t = c.querySelector('.timer-disp');
              if (t) t.textContent = fmt(timerLeft);
              if (timerLeft <= 0) {
                clearInterval(timerInt); timerInt = null; timerRunning = false;
                Toast('Таймер завершён!');
                vibrate([100, 100, 100]);
                render();
              }
            }, 1000);
          } else {
            timerRunning = false;
            clearInterval(timerInt); timerInt = null;
          }
        } else {
          timerRunning = false;
          clearInterval(timerInt); timerInt = null;
          timerLeft = 0;
        }
        render();
      };
    });
  }

  render();
};

/* ---------- MESSAGES ---------- */
Renderers.messages = (body, actionSlot, opts={}) => {
  if (opts.chatId) return openChat(opts.chatId);

  function renderList() {
    body.innerHTML = '';
    actionSlot.innerHTML = '';
    const chats = Object.entries(S.chats).sort((a,b) => {
      const la = a[1].messages.slice(-1)[0]; const lb = b[1].messages.slice(-1)[0];
      return (lb?.time||0) - (la?.time||0);
    });
    if (chats.length === 0) {
      body.innerHTML = '<div style="padding:80px 20px;text-align:center;color:var(--tx2)">Нет чатов</div>';
      return;
    }
    chats.forEach(([id, c]) => {
      const last = c.messages.slice(-1)[0];
      const div = el('div', {class:'msg-row'});
      div.innerHTML = `
        <div class="av" style="background:${c.color}">${c.avatar}</div>
        <div class="info">
          <div class="nm"><span>${esc(c.name)}</span><span class="time">${last ? fmtTime(new Date(last.time)) : ''}</span></div>
          <div class="txt">${esc(last ? last.text : 'Нет сообщений')}</div>
        </div>`;
      div.onclick = () => { AppManager.close('messages'); setTimeout(() => AppManager.open('messages', {chatId:id}), 200); };
      body.appendChild(div);
    });
  }

  function openChat(chatId) {
    const chat = S.chats[chatId];
    if (!chat) return renderList();
    actionSlot.innerHTML = '';
    body.innerHTML = `
      <div class="chat-view">
        <div class="chat-body" id="chatBody"></div>
        <div class="chat-input">
          <input id="chatInput" placeholder="Сообщение..." autocomplete="off">
          <button class="send" id="chatSend">${I.arrowUp.replace('width="32"','width="18" height="18"')}</button>
        </div>
      </div>`;
    const cb = body.querySelector('#chatBody');
    chat.messages.forEach(m => {
      const b = el('div', {class:'bubble ' + (m.sent ? 'sent' : 'recv')});
      b.textContent = m.text;
      cb.appendChild(b);
    });
    cb.scrollTop = cb.scrollHeight;
    const input = body.querySelector('#chatInput');
    const send = body.querySelector('#chatSend');
    function sendMsg() {
      const txt = input.value.trim();
      if (!txt) return;
      chat.messages.push({text:txt, sent:true, time:Date.now()});
      save();
      input.value = '';
      openChat(chatId);
      // Auto-reply after 1s
      setTimeout(() => {
        const replies = ['Понятно', 'Ок', 'Хорошо', 'Договорились', 'Интересно!', 'Спасибо!', '👍'];
        chat.messages.push({text:replies[Math.floor(Math.random()*replies.length)], sent:false, time:Date.now()});
        save();
        if (AppManager.isOpen('messages')) openChat(chatId);
      }, 1200);
    }
    send.onclick = sendMsg;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });
    setTimeout(() => input.focus(), 100);
  }

  renderList();
};

Renderers.phone = (body) => {

  function render() {
    body.innerHTML = `
      <div class="phone-app" style="padding:20px 0">
        <div class="dial-num">${esc(num) || '&nbsp;'}</div>
        <div class="dial-grid">
          ${[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']].map(([n,l]) => `
            <button class="dial-key" data-n="${n}"><div class="n">${n}</div>${l ? `<div class="l">${l}</div>` : ''}</button>
          `).join('')}
          <button class="dial-key call" id="callBtn">${I.phone.replace('width="32"','width="30" height="30"')}</button>
        </div>
      </div>`;
    body.querySelectorAll('.dial-key[data-n]').forEach(b => {
      b.onclick = () => { num += b.dataset.n; vibrate(4); render(); };
    });
    body.querySelector('#callBtn').onclick = () => {
      if (!num) return;
      startCall(num);
    };
  }

  function startCall(number) {
    const win = $('.app-window[data-app-id="phone"]');
    const call = el('div', {class:'call-screen'});
    call.innerHTML = `
      <div class="who">
        <div class="nm">${esc(number)}</div>
        <div class="stat" id="callStat">Звонок...</div>
      </div>
      <div class="call-actions">
        <button class="call-btn end" id="endCall">${I.phone.replace('width="32"','width="32" height="32"')}</button>
      </div>`;
    win.appendChild(call);
    let sec = 0;
    const stat = call.querySelector('#callStat');
    setTimeout(() => {
      stat.textContent = 'Соединение...';
      setTimeout(() => {
        stat.textContent = '00:00';
        const iv = setInterval(() => {
          if (!document.body.contains(call)) { clearInterval(iv); return; }
          sec++;
          stat.textContent = `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
        }, 1000);
        call._iv = iv;
      }, 1500);
    }, 800);
    call.querySelector('#endCall').onclick = () => {
      if (call._iv) clearInterval(call._iv);
      call.remove();
      num = '';
      render();
      Toast('Звонок завершён');
    };
  }

  render();
};

Renderers.camera = async (body) => {
  body.innerHTML = `
    <div style="height:100%;display:flex;flex-direction:column;background:#000;color:#fff">
      <div class="cam-view" id="camView">
        <div class="fallback">
          ${I.camera.replace('width="32"','width="80" height="80"')}
          <p>Запрос доступа к камере...</p>
        </div>
      </div>
      <div class="cam-ctrl">
        <div style="width:60px"></div>
        <button class="cam-shutter" id="camShoot" aria-label="Снять"></button>
        <div style="width:60px"></div>
      </div>
    </div>`;
  const view = body.querySelector('#camView');
  const shutter = body.querySelector('#camShoot');
  const video = el('video', {autoplay:'', playsinline:'', muted:''});
  let stream = null;
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
    video.srcObject = stream;
    view.innerHTML = '';
    view.appendChild(video);
    shutter.onclick = () => {
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const dataUrl = canvas.toDataURL('image/jpeg');
      // Save to gallery
      let gallery = Store.get('gallery', []);
      gallery.unshift({id:uid(), src:dataUrl, date:Date.now()});
      gallery = gallery.slice(0, 50);
      Store.set('gallery', gallery);
      Toast('Фото сохранено в галерею');
      vibrate(20);
      // Flash effect
      view.style.opacity = '.3';
      setTimeout(() => view.style.opacity = '1', 100);
    };
  } catch (e) {
    view.innerHTML = `
      <div class="fallback">
        ${I.camera.replace('width="32"','width="80" height="80"')}
        <p><b>Камера недоступна</b><br>Разрешение не получено или API не поддерживается.<br>Доступен демо-режим.</p>
      </div>`;
    shutter.onclick = () => {
      let gallery = Store.get('gallery', []);
      const colors = ['#667eea,#764ba2','#f093fb,#f5576c','#4facfe,#00f2fe','#43e97b,#38f9d7','#fa709a,#fee140'];
      const c = colors[Math.floor(Math.random()*colors.length)];
      gallery.unshift({id:uid(), src:`linear-gradient(135deg,${c})`, date:Date.now(), demo:true});
      gallery = gallery.slice(0, 50);
      Store.set('gallery', gallery);
      Toast('Демо-фото сохранено');
    };
  }
  // Cleanup on close
  const cleanup = () => {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  };
  // Observe removal
  const observer = new MutationObserver(() => {
    if (!document.body.contains(body)) { cleanup(); observer.disconnect(); }
  });
  observer.observe(document.body, {childList:true, subtree:true});
};

Renderers.gallery = Renderers.photos = (body) => {
  function render() {
    let gallery = Store.get('gallery', []);
    if (gallery.length === 0) {
      // Demo photos
      const colors = ['#667eea,#764ba2','#f093fb,#f5576c','#4facfe,#00f2fe','#43e97b,#38f9d7','#fa709a,#fee140','#ff9a9e,#fecfef'];
      gallery = colors.map((c, i) => ({id:'demo'+i, src:`linear-gradient(135deg,${c})`, date:Date.now()-i*86400000, demo:true}));
    }
    body.innerHTML = `<div class="gallery-grid" id="gGrid"></div>`;
    const grid = body.querySelector('#gGrid');
    gallery.forEach(item => {
      const div = el('div', {class:'gallery-item'});
      if (item.src.startsWith('data:')) {
        div.innerHTML = `<img src="${item.src}" style="width:100%;height:100%;object-fit:cover">`;
      } else {
        div.style.background = item.src;
      }
      div.onclick = () => openViewer(item);
      grid.appendChild(div);
    });
  }

  function openViewer(item) {
    const v = el('div', {class:'gallery-viewer open'});
    const inner = el('div');
    inner.style.cssText = 'max-width:100%;max-height:100%;display:flex;flex-direction:column;gap:16px;align-items:center';
    if (item.src.startsWith('data:')) {
      inner.innerHTML = `<img src="${item.src}" style="max-width:90vw;max-height:80vh;border-radius:12px">`;
    } else {
      const box = el('div');
      box.style.cssText = `width:80vw;max-width:500px;aspect-ratio:1;background:${item.src};border-radius:12px`;
      inner.appendChild(box);
    }
    const actions = el('div');
    actions.style.cssText = 'display:flex;gap:20px';
    const del = el('button', {class:'btn btn-danger', text:'Удалить'});
    del.onclick = async () => {
      const ok = await Modal.danger('Удалить фото?', '');
      if (ok) {
        let gal = Store.get('gallery', []);
        gal = gal.filter(x => x.id !== item.id);
        Store.set('gallery', gal);
        v.remove();
        render();
      }
    };
    const close = el('button', {class:'btn', text:'Закрыть', style:'background:rgba(255,255,255,.15);color:#fff'});
    close.onclick = () => v.remove();
    actions.append(del, close);
    inner.appendChild(actions);
    v.appendChild(inner);
    v.onclick = (e) => { if (e.target === v) v.remove(); };
    document.body.appendChild(v);
  }

  render();
};

Renderers.files = (body, actionSlot) => {
  let cwd = null;
  function render() {
    if (cwd) renderFolder(cwd);
    else renderRoot();
  }
  function renderRoot() {
    actionSlot.innerHTML = '';
    body.innerHTML = '';
    Object.keys(S.files).forEach(name => {
      const div = el('div', {class:'files-row'});
      const cnt = S.files[name].length;
      div.innerHTML = `
        <div class="ic">${I.folder.replace('width="32"','width="24" height="24"')}</div>
        <div class="nm">${esc(name)}</div>
        <div class="sz">${cnt} ${cnt === 1 ? 'файл' : 'файлов'}</div>`;
      div.onclick = () => { cwd = name; render(); };
      body.appendChild(div);
    });
  }
  function renderFolder(name) {
    actionSlot.innerHTML = `<button class="action add">+ Файл</button>`;
    actionSlot.querySelector('.add').onclick = async () => {
      const fname = await Modal.prompt('Имя файла');
      if (!fname) return;
      S.files[name].push({name:fname, size:'0 КБ', type:'doc'});
      save();
      render();
      Toast('Файл создан');
    };
    const header = el('div', {class:'app-header', style:'position:sticky;top:0;background:var(--bg);z-index:2;height:auto;padding:10px 16px;display:flex;align-items:center'});
    header.innerHTML = `<button style="color:var(--accent);display:flex;align-items:center;gap:4px">${I.chevronL.replace('width="32"','width="11" height="18"')} Назад</button>
      <div style="flex:1;text-align:center;font-weight:600">${esc(name)}</div>
      <div style="width:60px"></div>`;
    header.querySelector('button').onclick = () => { cwd = null; render(); };
    body.innerHTML = '';
    body.appendChild(header);
    const list = el('div');
    if (S.files[name].length === 0) {
      list.innerHTML = '<div style="padding:60px 20px;text-align:center;color:var(--tx2)">Папка пуста</div>';
    } else {
      S.files[name].forEach((f, i) => {
        const div = el('div', {class:'files-row'});
        let icon = I.doc;
        if (f.type === 'img') icon = I.image;
        else if (f.type === 'audio') icon = I.music;
        div.innerHTML = `
          <div class="ic">${icon.replace('width="32"','width="24" height="24"')}</div>
          <div class="nm">${esc(f.name)}</div>
          <div class="sz">${esc(f.size)}</div>`;
        div.onclick = async () => {
          const ok = await Modal.danger(`Удалить ${f.name}?`, '');
          if (ok) {
            S.files[name].splice(i, 1);
            save();
            render();
          }
        };
        list.appendChild(div);
      });
    }
    body.appendChild(list);
  }
  render();
};

Renderers.browser = Renderers.safari = (body, actionSlot) => {
  let url = 'example.com';
  let history = [url], histIdx = 0;
  body.innerHTML = `
    <div style="height:100%;display:flex;flex-direction:column">
      <div class="browser-bar">
        <button id="bBack">${I.chevronL.replace('width="32"','width="14" height="20"')}</button>
        <input id="bUrl" value="${esc(url)}" autocomplete="off" autocapitalize="off">
        <button id="bGo">${I.search.replace('width="32"','width="18" height="18"')}</button>
      </div>
      <div id="bContent" style="flex:1;display:flex;overflow:hidden"></div>
    </div>`;
  const content = body.querySelector('#bContent');
  const urlI = body.querySelector('#bUrl');

  function load(u) {
    u = u.trim();
    if (!u.startsWith('http')) u = 'https://' + u;
    url = u;
    urlI.value = u;
    content.innerHTML = `
      <div class="browser-error">
        ${I.browser.replace('width="32"','width="60" height="60"')}
        <div style="font-size:16px;font-weight:600;margin-bottom:8px">Загрузка страницы</div>
        <div>${esc(u)}</div>
        <div style="margin-top:20px;padding:14px;background:var(--sf);border-radius:12px;max-width:400px;text-align:left;font-size:13px;color:var(--tx2)">
          <b>Техническое ограничение:</b> большинство сайтов запрещают отображение внутри iframe из соображений безопасности (X-Frame-Options). Браузер корректно обрабатывает ошибку и показывает это сообщение.
        </div>
        <button class="btn btn-primary" style="margin-top:20px" onclick="window.open('${esc(u)}','_blank')">Открыть в новой вкладке</button>
      </div>`;
    // Try iframe
    const iframe = el('iframe', {src:u, style:'width:100%;height:100%;border:none;background:#fff'});
    iframe.onload = () => {
      // Check if it actually loaded
      try {
        // If we can access contentWindow location it's not cross-origin blocked
        if (iframe.contentWindow.location.href === 'about:blank') throw new Error('blocked');
        content.innerHTML = '';
        content.appendChild(iframe);
      } catch(e) {
        // Cross-origin — keep fallback but replace with iframe for user to see
        content.innerHTML = '';
        content.appendChild(iframe);
      }
    };
    iframe.onerror = () => { /* keep fallback */ };
    setTimeout(() => {
      // After 2.5s try to show iframe anyway
      if (content.querySelector('.browser-error')) {
        // leave fallback
      }
    }, 2500);
  }

  urlI.addEventListener('keydown', e => {
    if (e.key === 'Enter') { history.push(urlI.value); histIdx = history.length - 1; load(urlI.value); }
  });
  body.querySelector('#bGo').onclick = () => { history.push(urlI.value); histIdx = history.length - 1; load(urlI.value); };
  body.querySelector('#bBack').onclick = () => {
    if (histIdx > 0) { histIdx--; load(history[histIdx]); }
    else AppManager.close(body.closest('.app-window').dataset.appId);
  };
  load(url);
};

Renderers.store = (body) => {
  let tab = 'all';
  const TABS = [
    {id:'all', label:'Все'},
    {id:'installed', label:'Установлено'},
    {id:'utilities', label:'Утилиты'},
    {id:'media', label:'Медиа'},
    {id:'productivity', label:'Продуктивность'},
    {id:'system', label:'Система'}
  ];

  function render() {
    body.innerHTML = `
      <div class="store-tabs">
        ${TABS.map(t => `<button class="${tab===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('')}
      </div>
      <div id="storeList"></div>`;
    body.querySelectorAll('[data-tab]').forEach(b => {
      b.onclick = () => { tab = b.dataset.tab; render(); };
    });
    const list = body.querySelector('#storeList');
    let apps = Object.entries(APPS);
    if (tab === 'installed') apps = apps.filter(([id]) => S.installed.includes(id));
    else if (tab === 'utilities') apps = apps.filter(([,a]) => a.category === 'Утилиты');
    else if (tab === 'media') apps = apps.filter(([,a]) => a.category === 'Медиа');
    else if (tab === 'productivity') apps = apps.filter(([,a]) => a.category === 'Продуктивность');
    else if (tab === 'system') apps = apps.filter(([,a]) => a.category === 'Система');

    if (apps.length === 0) {
      list.innerHTML = '<div style="padding:60px 20px;text-align:center;color:var(--tx2)">Нет приложений</div>';
      return;
    }

    apps.forEach(([id, app]) => {
      const installed = S.installed.includes(id);
      const div = el('div', {class:'store-app'});
      div.innerHTML = `
        <div class="ai" style="background:${app.color}">${app.icon}</div>
        <div class="inf"><div class="nm">${app.name}</div><div class="dsc">${app.category} · 1.0.0</div></div>
        <button class="store-inst ${installed?'installed':''}">${installed ? 'Удалить' : 'Загрузить'}</button>`;
      const btn = div.querySelector('.store-inst');
      btn.onclick = async () => {
        if (S.installed.includes(id)) {
          const ok = await Modal.danger(`Удалить ${app.name}?`, '');
          if (ok) {
            S.installed = S.installed.filter(x => x !== id);
            S.homePages = S.homePages.map(p => p.filter(x => x !== id));
            save();
            Home.render();
            Toast(`${app.name} удалено`);
            render();
          }
        } else {
          S.installed.push(id);
          // Add to first page with free space
          let added = false;
          for (let i = 0; i < S.homePages.length; i++) {
            if (S.homePages[i].length < 20) { S.homePages[i].push(id); added = true; break; }
          }
          if (!added) S.homePages.push([id]);
          save();
          Home.render();
          Toast(`${app.name} установлено`);
          render();
        }
      };
      list.appendChild(div);
    });
  }
  render();
};

/* ---------- CALENDAR ---------- */
Renderers.calendar = (body, actionSlot) => {
  let viewDate = new Date();
  function render() {
    const y = viewDate.getFullYear(), m = viewDate.getMonth();
    const monthName = viewDate.toLocaleDateString('ru-RU', {month:'long', year:'numeric'});
    const firstDay = new Date(y, m, 1);
    const startDow = (firstDay.getDay() + 6) % 7; // Mon = 0
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const prevDays = new Date(y, m, 0).getDate();
    const today = new Date();
    const isToday = d => d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth() && d.getDate() === today.getDate();

    let days = [];
    for (let i = startDow - 1; i >= 0; i--) {
      const d = prevDays - i;
      days.push({d, other:true, date:new Date(y, m-1, d)});
    }
    for (let i = 1; i <= daysInMonth; i++) {
      days.push({d:i, date:new Date(y, m, i)});
    }
    while (days.length % 7 !== 0) {
      const i = days.length - (startDow + daysInMonth) + 1;
      days.push({d:i, other:true, date:new Date(y, m+1, i)});
    }

    actionSlot.innerHTML = '';
    body.innerHTML = `
      <div class="cal-header">
        <button id="prevM">${I.chevronL.replace('width="32"','width="14" height="22"')}</button>
        <h2>${monthName}</h2>
        <button id="nextM">${I.chevron.replace('width="32"','width="14" height="22"')}</button>
      </div>
      <div class="cal-grid">
        ${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d => `<div class="cal-dow">${d}</div>`).join('')}
        ${days.map(({d, other, date}) => {
          const key = date.toISOString().slice(0,10);
          const hasEv = S.events[key] && S.events[key].length > 0;
          return `<div class="cal-day ${other?'other':''} ${isToday(date)?'today':''}" data-date="${key}">${d}${hasEv?'<div class="ev"></div>':''}</div>`;
        }).join('')}
      </div>`;

    body.querySelector('#prevM').onclick = () => { viewDate = new Date(y, m-1, 1); render(); };
    body.querySelector('#nextM').onclick = () => { viewDate = new Date(y, m+1, 1); render(); };
    body.querySelectorAll('.cal-day').forEach(d => {
      d.onclick = () => showDay(d.dataset.date);
    });
  }
  async function showDay(key) {
    const events = S.events[key] || [];
    const lines = events.map((e,i) => `${i+1}. ${e.time} — ${e.title}`).join('\n') || '(нет событий)';
    const add = await Modal.confirm(`${key}\n\n${lines}`, '', 'Добавить');
    if (add) {
      const title = await Modal.prompt('Название события');
      if (!title) return;
      const time = await Modal.prompt('Время (ЧЧ:ММ)', '12:00');
      if (!time) return;
      S.events[key] = S.events[key] || [];
      S.events[key].push({title, time});
      save();
      render();
      Toast('Событие добавлено');
    }
  }
  render();
};
