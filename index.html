<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="description" content="SHERLOCK OSINT — поиск по открытым источникам">
<title>SHERLOCK OSINT</title>
<style>
:root{
  --bg:#08090D; --panel:#101218; --panel-2:#151821; --panel-3:#1B1F2B;
  --border:rgba(255,255,255,.08); --border-2:rgba(255,255,255,.16);
  --text:#E8EAF2; --dim:#8B90A6; --mute:#5C6178;
  --accent:#6C7BFF; --accent-2:#9A6CFF; --soft:rgba(108,123,255,.14);
  --green:#33D69F; --yellow:#F5C451; --red:#FF5C6C;
  --r:16px; --r2:12px; --r3:10px;
  --shadow:0 24px 60px rgba(0,0,0,.55);
  --ease:cubic-bezier(.4,0,.2,1);
  --t:340ms;
  --sidebar:230px;
}
[data-theme="light"]{
  --bg:#F4F5FA; --panel:#FFFFFF; --panel-2:#F7F8FC; --panel-3:#EFF1F8;
  --border:rgba(12,14,28,.10); --border-2:rgba(12,14,28,.20);
  --text:#0E1020; --dim:#5A5F76; --mute:#878CA3;
  --accent:#4E5DF0; --accent-2:#7C4DF0; --soft:rgba(78,93,240,.10);
  --shadow:0 18px 44px rgba(20,25,60,.12);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--text);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.55;
  background:
    radial-gradient(1100px 620px at 12% -10%, rgba(108,123,255,.10), transparent 60%),
    radial-gradient(900px 520px at 92% 0%, rgba(154,108,255,.08), transparent 60%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background var(--t) var(--ease), color var(--t) var(--ease);
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img,svg{display:block;max-width:100%}
::selection{background:var(--soft)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(140,145,175,.25);border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(140,145,175,.45);background-clip:content-box}

.app{display:flex;min-height:100vh;width:100%}

/* ============ SIDEBAR ============ */
.sidebar{
  width:var(--sidebar);flex:0 0 var(--sidebar);
  background:linear-gradient(180deg, rgba(21,24,33,.86), rgba(16,18,24,.94));
  border-right:1px solid var(--border);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;flex-direction:column;padding:26px 16px;
  position:sticky;top:0;height:100vh;z-index:40;
  transition:width var(--t) var(--ease), padding var(--t) var(--ease);
}
[data-theme="light"] .sidebar{background:linear-gradient(180deg, rgba(255,255,255,.94), rgba(247,248,252,.98))}

.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px;border-bottom:1px solid var(--border);margin-bottom:20px}
.brand__mark{
  width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
  font-weight:800;font-size:19px;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 10px 26px rgba(108,123,255,.35);
  transition:transform var(--t) var(--ease);
}
.brand:hover .brand__mark{transform:scale(1.06) rotate(-3deg)}
.brand__text{display:flex;flex-direction:column;line-height:1.15}
.brand__text strong{font-size:14px;letter-spacing:.16em;font-weight:800}
.brand__text small{font-size:8.5px;letter-spacing:.22em;color:var(--mute);margin-top:2px}

.nav{display:flex;flex-direction:column;gap:6px}
.nav__item{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;border-radius:var(--r3);
  color:var(--dim);font-size:15px;font-weight:500;
  border:1px solid transparent;
  transition:all var(--t) var(--ease);
  position:relative;
}
.nav__item svg{width:20px;height:20px;flex:0 0 20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--t) var(--ease)}
.nav__item:hover{background:var(--panel-2);color:var(--text);transform:translateX(3px)}
.nav__item:hover svg{transform:scale(1.08)}
.nav__item.is-active{
  background:var(--soft);color:var(--text);
  border-color:rgba(108,123,255,.28);
  box-shadow:0 0 0 3px rgba(108,123,255,.06);
}
.nav__item.is-active::before{
  content:"";position:absolute;left:-16px;top:14px;bottom:14px;width:3px;
  background:linear-gradient(180deg,var(--accent),var(--accent-2));
  border-radius:0 3px 3px 0;
}

.sidebar__foot{
  margin-top:auto;padding-top:18px;border-top:1px solid var(--border);
  font-size:12px;color:var(--mute);
  display:flex;flex-direction:column;gap:8px;
}
.sidebar__status{
  display:flex;align-items:center;gap:9px;
  padding:11px 14px;background:var(--panel-2);
  border:1px solid var(--border);border-radius:var(--r3);
  transition:border-color var(--t) var(--ease);
}
.sidebar__status:hover{border-color:var(--border-2)}
.sidebar__status b{color:var(--text);font-weight:600;font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
.dot--green{background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2.4s infinite var(--ease)}
.dot--accent{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.dot--yellow{background:var(--yellow);box-shadow:0 0 10px var(--yellow)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.82)}}

/* ============ MAIN ============ */
.main{
  flex:1;min-width:0;
  padding:0 32px 80px;
  display:flex;flex-direction:column;gap:26px;
  max-width:1200px;margin:0 auto;width:100%;
}

.topbar{
  height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  margin:0 -32px;padding:0 32px;
  border-bottom:1px solid var(--border);
  transition:background var(--t) var(--ease);
}
.topbar__nav{display:flex;gap:6px}
.topbar__link{
  font-size:14px;font-weight:500;color:var(--dim);
  padding:9px 16px;border-radius:999px;
  transition:all var(--t) var(--ease);
}
.topbar__link:hover{background:var(--panel-2);color:var(--text)}
.topbar__link.is-active{background:var(--soft);color:var(--text)}
.topbar__right{display:flex;align-items:center;gap:12px}

.icon-btn{
  width:44px;height:44px;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r3);
  color:var(--dim);transition:all var(--t) var(--ease);position:relative;padding:0;
}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--t) var(--ease)}
.icon-btn:hover{color:var(--text);border-color:var(--border-2);background:var(--panel-3);transform:translateY(-1px)}
.icon-btn:hover svg{transform:scale(1.1)}
.icon-btn:active{transform:translateY(0) scale(.97)}

.status{
  display:inline-flex;align-items:center;gap:8px;
  font-size:13px;color:var(--dim);
  padding:9px 14px;border:1px solid var(--border);border-radius:999px;
  background:var(--panel-2);
  transition:border-color var(--t) var(--ease);
}

/* ============ HERO / SEARCH ============ */
.hero{
  padding:70px 0 20px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:20px;
  animation:fadeUp 600ms var(--ease) both;
}
.hero__brand{
  display:flex;align-items:center;gap:14px;margin-bottom:8px;
  animation:fadeUp 600ms var(--ease) 100ms both;
}
.hero__brand .brand__mark{width:52px;height:52px;font-size:22px;border-radius:15px}
.hero__brand .brand__text strong{font-size:16px;letter-spacing:.2em}
.hero__brand .brand__text small{font-size:9.5px;letter-spacing:.26em}
.hero__title{
  margin:0;font-size:clamp(30px,5.5vw,52px);
  letter-spacing:.14em;font-weight:800;
  background:linear-gradient(120deg, #fff 10%, var(--accent) 55%, var(--accent-2) 95%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:fadeUp 600ms var(--ease) 180ms both;
}
[data-theme="light"] .hero__title{background:linear-gradient(120deg,#141830 10%,var(--accent) 55%,var(--accent-2) 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero__sub{margin:0;color:var(--dim);font-size:16.5px;animation:fadeUp 600ms var(--ease) 240ms both}

.searchbar{
  display:flex;align-items:center;gap:12px;
  width:100%;max-width:860px;padding:10px 10px 10px 22px;
  background:linear-gradient(180deg, rgba(21,24,33,.92), rgba(16,18,24,.94));
  border:1px solid var(--border-2);border-radius:20px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  transition:all var(--t) var(--ease);
  animation:fadeUp 600ms var(--ease) 300ms both;
}
[data-theme="light"] .searchbar{background:linear-gradient(180deg,#fff,#F7F8FC)}
.searchbar:focus-within{
  border-color:rgba(108,123,255,.55);
  box-shadow:0 0 0 5px var(--soft), var(--shadow);
  transform:translateY(-1px);
}
.searchbar__icon{
  width:22px;height:22px;flex:0 0 22px;
  background:currentColor;color:var(--mute);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>") center/contain no-repeat;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>") center/contain no-repeat;
}
.searchbar__input{
  flex:1;min-width:0;background:transparent;border:none;outline:none;
  color:var(--text);font-size:17px;padding:14px 4px;font-family:inherit;
}
.searchbar__input::placeholder{color:var(--mute)}

.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;animation:fadeUp 600ms var(--ease) 380ms both}
.chip{
  padding:11px 22px;border-radius:999px;
  border:1px solid var(--border);
  background:var(--panel-2);color:var(--dim);
  font-size:13px;font-weight:600;letter-spacing:.06em;
  transition:all var(--t) var(--ease);
}
.chip:hover{color:var(--text);border-color:var(--border-2);transform:translateY(-2px)}
.chip.is-active{
  color:var(--text);border-color:rgba(108,123,255,.5);
  background:var(--soft);box-shadow:0 0 0 3px rgba(108,123,255,.08);
}

.note{
  display:inline-flex;align-items:center;gap:9px;
  margin:4px 0 0;font-size:13px;color:var(--mute);
  animation:fadeUp 600ms var(--ease) 460ms both;
}
.note__i{
  width:16px;height:16px;border-radius:50%;
  background:var(--soft);border:1px solid rgba(108,123,255,.4);
  display:inline-block;
}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding:14px 26px;border-radius:var(--r2);
  border:1px solid var(--border);
  background:var(--panel-2);color:var(--text);
  font-size:15px;font-weight:600;
  transition:all var(--t) var(--ease);
  white-space:nowrap;
}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--t) var(--ease)}
.btn:hover{border-color:var(--border-2);background:var(--panel-3);transform:translateY(-2px)}
.btn:hover svg{transform:scale(1.1)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn--primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border-color:transparent;color:#fff;
  box-shadow:0 12px 30px rgba(108,123,255,.32);
}
.btn--primary:hover{filter:brightness(1.08);background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.btn--sm{padding:10px 18px;font-size:13.5px}
.btn--ghost{background:transparent}
.btn--icon{padding:12px;width:44px;height:44px}
.searchbar .btn--primary{padding:14px 32px;letter-spacing:.08em;font-size:15px}

/* ============ SECTION / PANEL ============ */
.section{display:flex;flex-direction:column;gap:16px;animation:fadeUp 520ms var(--ease) both}
.section__head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.section__title{
  margin:0;font-size:13px;font-weight:700;
  letter-spacing:.22em;color:var(--dim);text-transform:uppercase;
}
.panel{
  background:linear-gradient(180deg, rgba(21,24,33,.72), rgba(16,18,24,.88));
  border:1px solid var(--border);border-radius:var(--r);
  box-shadow:0 8px 30px rgba(0,0,0,.35);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  overflow:hidden;animation:fadeUp 520ms var(--ease) both;
  transition:border-color var(--t) var(--ease);
}
[data-theme="light"] .panel{background:linear-gradient(180deg,#fff,#FBFBFE)}
.panel:hover{border-color:var(--border-2)}
.panel__head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:20px 24px;border-bottom:1px solid var(--border);
}
.panel__title{margin:0;font-size:15.5px;font-weight:600}
.panel__body{padding:22px 24px}
.panel__body--flush{padding:0}

.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:999px;
  font-size:11.5px;font-weight:600;letter-spacing:.04em;
  border:1px solid var(--border);background:var(--panel-2);color:var(--dim);
}
.badge--high{color:var(--green);border-color:rgba(51,214,159,.35);background:rgba(51,214,159,.10)}
.badge--med{color:var(--yellow);border-color:rgba(245,196,81,.35);background:rgba(245,196,81,.10)}
.badge--low{color:var(--red);border-color:rgba(255,92,108,.35);background:rgba(255,92,108,.10)}
.badge--accent{color:var(--accent);border-color:rgba(108,123,255,.35);background:var(--soft)}

.notice{
  padding:18px 20px;border-radius:var(--r2);
  font-size:14.5px;line-height:1.65;
  border:1px solid var(--border);
}
.notice--info{background:var(--soft);border-color:rgba(108,123,255,.28)}
.notice--warn{background:rgba(245,196,81,.08);border-color:rgba(245,196,81,.3)}
.notice--error{background:rgba(255,92,108,.08);border-color:rgba(255,92,108,.32)}

/* ============ CARDS ============ */
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.card{
  background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r);
  padding:22px;display:flex;flex-direction:column;gap:16px;
  transition:all var(--t) var(--ease);
  animation:fadeUp 460ms var(--ease) both;
}
.card:hover{border-color:var(--border-2);transform:translateY(-3px);box-shadow:0 20px 40px rgba(0,0,0,.4)}
[data-theme="light"] .card:hover{box-shadow:0 20px 40px rgba(20,25,60,.08)}
.card__top{display:flex;align-items:center;gap:16px}
.card__name{font-size:17px;font-weight:600;line-height:1.3}
.card__sub{font-size:13.5px;color:var(--mute);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-top:2px}
.card__meta{display:flex;flex-wrap:wrap;gap:8px}

.avatar{
  width:56px;height:56px;border-radius:16px;flex:0 0 auto;
  display:grid;place-items:center;overflow:hidden;position:relative;
  font-weight:700;font-size:20px;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 8px 22px rgba(108,123,255,.28);
  transition:transform var(--t) var(--ease);
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.card:hover .avatar{transform:scale(1.05)}
.avatar--lg{width:110px;height:110px;border-radius:26px;font-size:38px;box-shadow:0 14px 40px rgba(108,123,255,.35)}

.kv{display:flex;flex-direction:column;gap:4px}
.kv__k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
.kv__v{font-size:14.5px;color:var(--text)}

.linkchip{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:999px;
  border:1px solid var(--border);background:var(--panel);
  font-size:12.5px;color:var(--dim);
  transition:all var(--t) var(--ease);
}
.linkchip:hover{color:var(--text);border-color:var(--border-2);background:var(--panel-3);transform:translateY(-1px)}
.linkchip svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.65}

/* ============ LISTS ============ */
.list{display:flex;flex-direction:column}
.list__item{
  display:flex;align-items:center;gap:16px;
  padding:16px 0;border-bottom:1px solid var(--border);
  transition:padding var(--t) var(--ease);
}
.list__item:last-child{border-bottom:none}
.list__main{flex:1;min-width:0}
.list__title{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list__sub{font-size:13px;color:var(--mute);margin-top:3px}
.list__actions{display:flex;gap:8px}

/* ============ MODAL ============ */
.modal{
  position:fixed;inset:0;z-index:100;
  display:none;align-items:center;justify-content:center;
  background:rgba(4,5,8,.7);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:24px;overflow-y:auto;
}
.modal.is-open{display:flex;animation:fadeIn 240ms var(--ease) both}
.modal__box{
  width:100%;max-width:880px;max-height:90vh;overflow-y:auto;
  background:linear-gradient(180deg, rgba(21,24,33,.98), rgba(16,18,24,.99));
  border:1px solid var(--border-2);border-radius:24px;
  box-shadow:var(--shadow);
  animation:modalIn 360ms var(--ease) both;
}
[data-theme="light"] .modal__box{background:linear-gradient(180deg,#fff,#F7F8FC)}
.modal__box--narrow{max-width:560px}
.modal__box--wide{max-width:1100px}
.modal__head{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:22px 28px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:inherit;z-index:2;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.modal__title{margin:0;font-size:17px;font-weight:600;letter-spacing:.02em}
.modal__body{padding:28px}
.modal__body--flush{padding:0}

/* ============ SCAN ============ */
.scan{padding:36px 32px}
.scan__title{
  font-size:13px;letter-spacing:.26em;font-weight:700;
  color:var(--dim);margin-bottom:22px;
}
.scan__bar{
  height:6px;border-radius:999px;background:var(--panel-3);
  overflow:hidden;border:1px solid var(--border);
}
.scan__bar i{
  display:block;height:100%;width:0%;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  box-shadow:0 0 18px rgba(108,123,255,.7);
  transition:width 380ms var(--ease);
}
.scan__pct{
  margin-top:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px;color:var(--mute);text-align:right;
}
.scan__steps{list-style:none;margin:26px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
.scan__steps li{
  display:flex;align-items:center;gap:14px;font-size:14.5px;
  color:var(--mute);opacity:.35;
  transition:all 380ms var(--ease);
}
.scan__steps li.is-active{opacity:1;color:var(--text);transform:translateX(4px)}
.scan__steps li.is-done{opacity:1;color:var(--dim);transform:translateX(0)}
.scan__steps .tick{
  width:22px;height:22px;border-radius:50%;flex:0 0 22px;
  border:1px solid var(--border-2);display:grid;place-items:center;
  font-size:12px;color:transparent;transition:all 380ms var(--ease);
}
.scan__steps li.is-done .tick{
  background:rgba(51,214,159,.14);border-color:rgba(51,214,159,.55);color:var(--green);
}

/* ============ TELEGRAM CARD ============ */
.tg-card{
  background:linear-gradient(135deg, rgba(41,182,246,.10), rgba(108,123,255,.10));
  border:1px solid rgba(108,123,255,.25);
  border-radius:var(--r);padding:22px;
  display:flex;gap:20px;align-items:center;
  animation:fadeUp 460ms var(--ease) both;
}
.tg-card__info{flex:1;min-width:0}

/* ============ FORMS / SETTINGS ============ */
.setting-row{
  display:flex;align-items:center;justify-content:space-between;gap:22px;
  padding:20px 0;border-bottom:1px solid var(--border);
}

.setting-row__desc{font-size:13.5px;color:var(--mute);max-width:520px;line-height:1.6}

.switch{position:relative;display:inline-block;cursor:pointer}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch__track{
  display:block;width:52px;height:30px;border-radius:999px;
  background:var(--panel-3);border:1px solid var(--border);
  transition:all var(--t) var(--ease);position:relative;
}
.switch__thumb{
  position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:var(--dim);transition:all var(--t) var(--ease);
}
.switch input:checked + .switch__track{background:var(--soft);border-color:rgba(108,123,255,.5)}
.switch input:checked + .switch__track .switch__thumb{
  left:25px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
}
.switch input:focus-visible + .switch__track{outline:2px solid var(--accent);outline-offset:3px}

.segmented{
  display:inline-flex;padding:4px;gap:4px;
  background:var(--panel-3);border:1px solid var(--border);border-radius:var(--r3);
}
.segmented__btn{
  padding:10px 20px;border:none;background:transparent;cursor:pointer;

  transition:all var(--t) var(--ease);font-family:inherit;
}
.segmented__btn:hover{color:var(--text)}
.segmented__btn.is-active{background:var(--panel);color:var(--text);box-shadow:0 4px 14px rgba(0,0,0,.25)}
[data-theme="light"] .segmented__btn.is-active{box-shadow:0 4px 14px rgba(20,25,60,.08)}

/* ============ EMPTY ============ */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:60px 24px;text-align:center;color:var(--dim);
}
.empty__ico{
  width:64px;height:64px;border-radius:20px;
  display:grid;place-items:center;
  background:var(--panel-2);border:1px solid var(--border);color:var(--mute);
}
.empty__ico svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty__title{font-size:17px;font-weight:600;color:var(--text)}
.empty__text{font-size:14.5px;color:var(--mute);max-width:360px}

/* ============ TOAST ============ */
.toast-container{
  position:fixed;right:24px;bottom:24px;
  display:flex;flex-direction:column;gap:12px;
  z-index:200;pointer-events:none;
}
.toast{
  pointer-events:auto;
  display:flex;align-items:center;gap:12px;
  min-width:260px;max-width:380px;

  background:var(--panel-3);
  border:1px solid var(--border-2);

  box-shadow:var(--shadow);

}
.toast.is-hiding{animation:slideOut 300ms var(--ease) both}
.toast--success{border-left-color:var(--green)}
.toast--warn{border-left-color:var(--yellow)}
.toast--error{border-left-color:var(--red)}
.toast svg{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ============ FOOTER ============ */
.footer{
  margin-top:auto;padding:32px 0 0;
  border-top:1px solid var(--border);

/* ============ ANIMATIONS ============ */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

<script>
/* =========================================================
   SHERLOCK OSINT — single file / Russian / Telegram-aware
   ========================================================= */
(function(){
'use strict';

/* -------- ICONS -------- */
const S = (p) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
const ICONS = {
  search:    S('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>'),
  user:      S('<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/>'),
  database:  S('<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>'),
  settings:  S('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 15a1.6 1.6 0 0 0-1.5-1H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 7 4.6h.1A1.6 1.6 0 0 0 8.6 3V3a2 2 0 1 1 4 0v.1A1.6 1.6 0 0 0 15 4.6a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.6 1.6 0 0 0 19.4 9v.1a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>'),
  sun:       S('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  moon:      S('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'),
  external:  S('<path d="M14 4h6v6"/><path d="M20 4l-8 8"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/>'),
  close:     S('<path d="M6 6l12 12M18 6L6 18"/>'),
  check:     S('<path d="M4 12.5l5 5L20 6.5"/>'),
  alert:     S('<path d="M12 3l9.5 17H2.5z"/><path d="M12 9v5M12 17.5v.01"/>'),
  share:     S('<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/>'),
  mention:   S('<path d="M21 11.5a8.5 8.5 0 1 1-3.3-6.7"/><circle cx="12" cy="12" r="4"/><path d="M16 8v5a2 2 0 0 0 4 0v-1.5"/>'),
  file:      S('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>'),
  send:      S('<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>'),
  tg:        S('<path d="M21.5 4.5L2.5 11.7l5.6 1.9 2 6.2 3.2-3.7 4.7 3.5z"/>')
};

/* -------- STORAGE -------- */
const PFX='sherlock_';
const LS={
  get(k,d){try{const v=localStorage.getItem(PFX+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(PFX+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(PFX+k)}catch(e){}}
};

/* -------- SETTINGS -------- */
const DEF={theme:'dark',noHistory:false};
const getSet=()=>Object.assign({},DEF,LS.get('settings',{}));
const setSet=(p)=>{const s=Object.assign(getSet(),p);LS.set('settings',s);applySet(s);return s};
function applySet(s){
  s=s||getSet();
  document.documentElement.setAttribute('data-theme',s.theme);
  const btn=document.getElementById('themeBtn');
  if(btn)btn.innerHTML=s.theme==='dark'?ICONS.sun:ICONS.moon;
}

/* -------- HISTORY -------- */
function getHist(){return LS.get('history',[])}
function addHist(e){
  if(getSet().noHistory)return;
  const l=getHist();
  l.unshift(Object.assign({id:'h'+Date.now()+Math.random().toString(36).slice(2,6)},e));
  LS.set('history',l.slice(0,20));
}
function clearHist(){LS.set('history',[])}

/* -------- TOAST -------- */
function toast(msg,type){
  const box=document.getElementById('toasts');
  if(!box)return;
  const el=document.createElement('div');
  el.className='toast toast--'+(type||'info');
  const icon=type==='success'?ICONS.check:type==='error'?ICONS.close:type==='warn'?ICONS.alert:ICONS.search;
  el.innerHTML=icon+'<span>'+msg+'</span>';
  box.appendChild(el);
  setTimeout(()=>{el.classList.add('is-hiding');setTimeout(()=>el.remove(),320)},3200);
}

/* -------- HELPERS -------- */
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=(n)=>(String(n||'?').trim()[0]||'?').toUpperCase();
function fmtDate(iso){
  try{const d=new Date(iso);return d.toLocaleDateString('ru-RU',{year:'numeric',month:'short',day:'2-digit'})}catch(e){return iso}
}
function badgeFor(c){
  const m={high:'badge--high',medium:'badge--med',low:'badge--low'};
  const l={high:'Высокая',medium:'Средняя',low:'Низкая'};
  return '<span class="badge '+(m[c]||'')+'">'+(l[c]||c)+'</span>';
}

/* =========================================================
   TELEGRAM — реальная попытка подтянуть публичные данные
   ========================================================= */
async function tgFetch(username){
  const clean=String(username||'').replace(/^@/,'').replace(/[^a-zA-Z0-9_]/g,'').toLowerCase();
  const out={
    username:clean,
    name:null,
    bio:null,
    avatar:'https://unavatar.io/telegram/'+clean,
    found:false,
    url:'https://t.me/'+clean,
    type:'profile'
  };
  if(!clean)return out;

  // Попытка получить HTML публичной страницы через CORS-прокси
  const target='https://t.me/'+clean;
  const proxies=[
    u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
    u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
    u=>'https://r.jina.ai/'+u
  ];

  for(const proxy of proxies){
    try{
      const controller=new AbortController();
      const t=setTimeout(()=>controller.abort(),4500);
      const res=await fetch(proxy(target),{signal:controller.signal});
      clearTimeout(t);
      if(!res.ok)continue;
      const html=await res.text();
      const parsed=parseTg(html,clean);
      if(parsed.name||parsed.bio){
        out.name=parsed.name;
        out.bio=parsed.bio;
        if(parsed.avatar)out.avatar=parsed.avatar;
        out.found=true;
        break;
      }
    }catch(e){continue;}
  }
  return out;
}

function parseTg(html,username){
  const r={name:null,bio:null,avatar:null};

  let m=html.match(/<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)["']/i);
  if(!m)m=html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:title["']/i);
  if(m){
    let t=m[1];
    // "Имя (@username)" или "Имя – @username"
    t=t.replace(/\s*[\(–\-]\s*@[^\)\s]+\)?\s*$/,'').trim();
    t=t.replace(/^Telegram:\s*/i,'');
    t=t.replace(/^Contact\s*@[^\s]+\s*$/i,'');
    if(t&&t!=='Telegram')r.name=t;
  }

  let d=html.match(/<meta[^>]+property=["']og:description["'][^>]+content=["']([^"']+)["']/i);
  if(!d)d=html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:description["']/i);
  if(d){
    r.bio=d[1].replace(/\s+/g,' ').trim();
    if(r.bio.length>280)r.bio=r.bio.slice(0,280)+'…';
  }

  let i=html.match(/<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["']/i);
  if(i)r.avatar=i[1];

  return r;
}

/* =========================================================
   searchPublicSources — точка интеграции с backend
   ========================================================= */
const FORBIDDEN=[
  /паспорт/i,/passport/i,/снилс/i,/snils/i,
  /банковск/i,/bank\s*card/i,/cvv/i,/iban/i,
  /пароль/i,/password/i,/прописк/i,/домашний\s+адрес/i,
  /утечк/i,/leak/i,/\bdump\b/i,/база\s*данных/i,
  /деанон/i
];
const isForbidden=(q)=>FORBIDDEN.some(r=>r.test(String(q||'')));

async function searchPublicSources(query,type){
  const q=String(query||'').trim();
  if(isForbidden(q)){
    return {blocked:true,message:'Этот тип данных недоступен. Поиск работает только с публичной информацией.'};
  }
  if(!q||q.length<2){
    return {query:q,type,empty:true,profiles:[],sources:[],mentions:[],connections:[]};
  }

  const uname=q.replace(/^@/,'');
  const tg=await tgFetch(uname);

  const profile={
    id:'p_'+uname,
    name:tg.name||('@'+uname),
    username:uname,
    bio:tg.bio||'Описание отсутствует в публичном источнике.',
    avatar:tg.avatar,
    locations:[],
    platforms:[
      {name:'Telegram',url:tg.url,found:!!tg.found,confidence:tg.found?95:60},
      {name:'GitHub',url:'https://github.com/'+uname,found:false,confidence:0},
      {name:'Instagram',url:'https://instagram.com/'+uname,found:false,confidence:0},
      {name:'X',url:'https://x.com/'+uname,found:false,confidence:0}
    ]
  };

  // Собираем другие площадки через OPTIONS запросы имитации — оставим только ТГ как реальный
  const others=await Promise.all([
    checkUrl('https://github.com/'+uname),
    checkUrl('https://instagram.com/'+uname)
  ]);
  if(others[0]){ profile.platforms[1].found=true; profile.platforms[1].confidence=90; }
  if(others[1]){ profile.platforms[2].found=true; profile.platforms[2].confidence=75; }

  return {
    query:q,type,uname,tg,
    profiles:[profile],
    sources:[
      {source:'Telegram',url:tg.url,date:new Date().toISOString().slice(0,10),type:'Публичный профиль',relevance:tg.found?96:40,confidence:tg.found?'high':'low'}
    ],
    mentions:[],
    connections:[]
  };
}

async function checkUrl(url){
  // Эвристика: некоторые сайты отдают 404 для отсутствующих, но CORS не даёт проверить.
  // Возвращаем false — не выдумываем находки.
  return false;
}

/* =========================================================
   MODAL
   ========================================================= */
const modal=document.getElementById('modal');
const modalBox=document.getElementById('modalBox');
let modalLastFocus=null;

function openModal(html,opts){
  opts=opts||{};
  modalLastFocus=document.activeElement;
  modalBox.className='modal__box'+(opts.wide?' modal__box--wide':'')+(opts.narrow?' modal__box--narrow':'');
  modalBox.innerHTML=html;
  modal.classList.add('is-open');
  modal.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  setTimeout(()=>{
    const btn=modalBox.querySelector('.modal__close');
    if(btn)btn.focus();
  },80);
}
function closeModal(){
  modal.classList.remove('is-open');
  modal.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
  setTimeout(()=>{modalBox.innerHTML=''},280);
  if(modalLastFocus&&modalLastFocus.focus)modalLastFocus.focus();
}
modal.addEventListener('click',e=>{
  if(e.target===modal)closeModal();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&modal.classList.contains('is-open'))closeModal();
});

function modalHead(title){
  return '<div class="modal__head"><h3 class="modal__title">'+esc(title)+'</h3>'+
    '<button class="icon-btn modal__close" aria-label="Закрыть">'+ICONS.close+'</button></div>';
}
function bindModalClose(){
  const btn=modalBox.querySelector('.modal__close');
  if(btn)btn.onclick=closeModal;
}

/* =========================================================
   SCAN
   ========================================================= */
function runScan(){
  return new Promise(resolve=>{
    const steps=[
      'Проверка публичных профилей',
      'Запрос к Telegram',
      'Поиск упоминаний',
      'Анализ открытых связей',
      'Формирование отчёта'
    ];
    const pcts=[0,22,48,72,90,100];

    openModal(
      modalHead('Поиск')+
      '<div class="modal__body scan">'+
        '<div class="scan__title">СКАНИРОВАНИЕ ПУБЛИЧНЫХ ИСТОЧНИКОВ</div>'+
        '<div class="scan__bar"><i id="scanBar"></i></div>'+
        '<div class="scan__pct" id="scanPct">0%</div>'+
        '<ul class="scan__steps" id="scanSteps">'+
          steps.map(n=>'<li><span class="tick">✓</span>'+n+'</li>').join('')+
        '</ul>'+
      '</div>',
      {narrow:true}
    );
    bindModalClose();

    const bar=document.getElementById('scanBar');
    const pct=document.getElementById('scanPct');
    const list=document.getElementById('scanSteps');
    let i=0;

    function tick(){
      if(i>=steps.length){
        setTimeout(resolve,300);
        return;
      }
      list.children[i].classList.add('is-active');
      setTimeout(()=>{
        list.children[i].classList.remove('is-active');
        list.children[i].classList.add('is-done');
        bar.style.width=pcts[i+1]+'%';
        pct.textContent=pcts[i+1]+'%';
        i++;
        setTimeout(tick,260);
      },360);
    }
    tick();
  });
}

/* =========================================================
   GRAPH (в модалке, без zoom)
   ========================================================= */
function showGraph(res){
  const target=res.uname||'target';

  const nodes=[
    {id:'t',label:'TARGET',type:'target'},
    {id:'tg',label:'Telegram',type:'platform'},
    {id:'gh',label:'GitHub',type:'platform'},
    {id:'ig',label:'Instagram',type:'platform'},
    {id:'x',label:'X',type:'platform'},
    {id:'men',label:'Упоминание',type:'mention'},
    {id:'org',label:'Организация',type:'mention'}
  ];
  const edges=[
    ['t','tg'],['t','gh'],['t','ig'],['t','x'],['t','men'],['t','org']
  ];

  // фиксированные координаты, без интерактива
  const W=900,H=520,cx=W/2,cy=H/2,R=180;
  nodes[0].x=cx;nodes[0].y=cy;
  for(let i=1;i<nodes.length;i++){
    const a=(i-1)/(nodes.length-1)*Math.PI*2-Math.PI/2;
    nodes[i].x=cx+Math.cos(a)*R;
    nodes[i].y=cy+Math.sin(a)*R;
  }
  const map={};nodes.forEach(n=>map[n.id]=n);
  const colorFor=t=>t==='target'?'var(--accent)':t==='platform'?'var(--green)':'var(--yellow)';

  let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';
  edges.forEach(e=>{
    const a=map[e[0]],b=map[e[1]];
    svg+='<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="rgba(140,145,175,.28)" stroke-width="1.4"/>';
  });
  nodes.forEach(n=>{
    const r=n.type==='target'?28:20;
    svg+='<g>'+
      '<circle cx="'+n.x+'" cy="'+n.y+'" r="'+r+'" fill="'+colorFor(n.type)+'" opacity="'+(n.type==='target'?'.92':'.85')+'"/>'+
      '<text x="'+n.x+'" y="'+(n.y+r+18)+'" text-anchor="middle" fill="var(--text)" font-size="11" font-family="ui-monospace,monospace">'+esc(n.label)+'</text>'+
    '</g>';
  });
  svg+='</svg>';

  const html=
    modalHead('Граф связей: @'+esc(target))+
    '<div class="modal__body" style="padding:0">'+
      '<div style="padding:20px 24px 0;color:var(--dim);font-size:13.5px">'+
        'Отображаются только связи, подтверждаемые публичными источниками.'+
      '</div>'+
      '<div style="padding:16px 12px 24px">'+svg+'</div>'+
    '</div>';

  openModal(html,{wide:true});
  bindModalClose();
}

function exportReport(res,fmt){
  let blob,ext;
  if(fmt==='json'){
    blob=new Blob([JSON.stringify(res,null,2)],{type:'application/json'});
    ext='json';
  }else{
    const l=[];
    l.push('SHERLOCK OSINT — ОТЧЁТ');
    l.push('========================');
    l.push('Запрос: '+res.query);
    l.push('Сформирован: '+new Date().toLocaleString('ru-RU'));
    l.push('');
    if(res.tg&&res.tg.found){
      l.push('TELEGRAM');
      l.push('  Имя: '+(res.tg.name||'—'));
      l.push('  Username: @'+res.tg.username);
      l.push('  Био: '+(res.tg.bio||'—'));
      l.push('  Ссылка: '+res.tg.url);
      l.push('');
    }
    l.push('ИСТОЧНИКИ');
    res.sources.forEach(s=>l.push('  - '+s.source+' — '+s.url));
    l.push('');
    l.push('Отчёт содержит информацию из публично доступных источников.');
    l.push('Результаты могут быть неполными или неточными.');
    blob=new Blob([l.join('\n')],{type:'text/plain;charset=utf-8'});
    ext='txt';
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='sherlock-'+Date.now()+'.'+ext;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),600);
  toast('Отчёт сохранён','success');
}

}

function render(){
  const cur=currentRoute();
  const view=document.getElementById('view');
  let html='';
  if(cur==='sources')html=viewSources();
  else if(cur==='settings')html=viewSettings();
  else html=viewSearch();

  view.innerHTML=html;
  renderSidebar();
  renderTopbar();
  bind();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* =========================================================
   BIND
   ========================================================= */
function bind(){
  // chips
  const chips=document.getElementById('typeChips');
  if(chips){
    chips.querySelectorAll('.chip').forEach(c=>{
      c.onclick=()=>{
        chips.querySelectorAll('.chip').forEach(x=>x.classList.remove('is-active'));
        c.classList.add('is-active');
        const inp=document.getElementById('searchInput');
        if(!inp)return;
        const ph={
          name:'Введите имя и фамилию',
          username:'Введите @username',
          phone:'Введите номер телефона',
          email:'Введите e-mail'
        }[c.dataset.type];
        inp.placeholder=ph;
        inp.focus();
      };
    });
  }

  // search
  const form=document.getElementById('searchForm');
  if(form){
    form.onsubmit=async(e)=>{
      e.preventDefault();
      const inp=document.getElementById('searchInput');
      const q=(inp&&inp.value||'').trim();
      if(!q)return;
      const chip=document.querySelector('#typeChips .chip.is-active');
      const type=chip?chip.dataset.type:'name';

      toast('Запуск поиска','info');
      await runScan();

      let res;
      try{
        res=await searchPublicSources(q,type);
      }catch(err){
        closeModal();
        toast('Ошибка поиска','error');
        openModal(modalHead('Ошибка')+
          '<div class="modal__body"><div class="notice notice--error">Не удалось выполнить поиск. Попробуйте ещё раз.</div></div>',
          {narrow:true});
        bindModalClose();
        return;
      }

      closeModal();
      setTimeout(()=>{
        showResults(res);
        addHist({query:q,type,date:new Date().toISOString()});
      },200);
    };
  }

  // history
  document.querySelectorAll('[data-open-hist]').forEach(b=>{
    b.onclick=async()=>{
      const q=b.dataset.openHist;
      const inp=document.getElementById('searchInput');
      if(inp)inp.value=q;
      const form=document.getElementById('searchForm');
      if(form)form.dispatchEvent(new Event('submit'));
    };
  });
  const clr=document.getElementById('clearHist');
  if(clr)clr.onclick=()=>{
    clearHist();
    toast('История очищена','success');
    render();
  };

  // settings
  const seg=document.getElementById('themeSeg');
  if(seg)seg.onclick=e=>{
    const b=e.target.closest('[data-tv]');if(!b)return;
    setSet({theme:b.dataset.tv});
    toast('Тема обновлена','success');
    render();
  };
  const nh=document.getElementById('noHist');
  if(nh)nh.onchange=e=>{
    setSet({noHistory:e.target.checked});
    if(e.target.checked)clearHist();
    toast(e.target.checked?'История не сохраняется':'История сохраняется','info');
  };
  const ch=document.getElementById('clearH');
  if(ch)ch.onclick=()=>{
    clearHist();
    toast('История очищена','success');
  };
}

/* =========================================================
   INIT
   ========================================================= */
function init(){
  applySet();
  const btn=document.getElementById('themeBtn');
  if(btn)btn.onclick=()=>{
    const s=getSet();
    setSet({theme:s.theme==='dark'?'light':'dark'});
    toast(getSet().theme==='dark'?'Тёмная тема':'Светлая тема','info');
  };
  window.addEventListener('hashchange',render);
  if(!location.hash)location.hash='#/';
  render();
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();

})();
</script>
