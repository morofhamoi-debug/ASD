<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Приора 3D</title>
<style>
  body { margin: 0; overflow: hidden; background: #87ceeb; font-family: Arial, sans-serif; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 15px; left: 15px;
    color: #fff; font-size: 22px; font-weight: bold;
    text-shadow: 2px 2px 4px #000;
    pointer-events: none;
  }
  #hud small { display: block; font-size: 14px; color: #ddd; font-weight: normal; margin-top: 5px; }
  #gameover {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-align: center;
  }
  #gameover h1 { color: #ff3333; font-size: 60px; margin: 0; }
  #gameover p { font-size: 24px; margin: 15px 0; }
  #gameover button {
    margin-top: 20px;
    padding: 15px 40px;
    font-size: 20px;
    font-weight: bold;
    background: #ffcc00;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  #controls {
    position: fixed; bottom: 15px; left: 15px;
    color: #fff; font-size: 14px;
    text-shadow: 1px 1px 3px #000;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="hud">Счёт: <span id="score">0</span><small id="speed">Скорость: 120 км/ч</small></div>
<div id="controls">← → или A/D — руль | Пробел — заново</div>

<div id="gameover">
  <h1>АВАРИЯ!</h1>
  <p>Счёт: <span id="finalScore">0</span></p>
  <button onclick="resetGame()">ЗАНОВО</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ================== СЦЕНА ==================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 100, 400);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 6, 12);
camera.lookAt(0, 1, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ================== СВЕТ ==================
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(30, 50, 20);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;
scene.add(sun);

// ================== ЗЕМЛЯ ==================
const groundGeo = new THREE.PlaneGeometry(2000, 2000);
const groundMat = new THREE.MeshLambertMaterial({ color: 0x2d5c2d });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ================== ДОРОГА ==================
const ROAD_WIDTH = 16;
const roadGeo = new THREE.PlaneGeometry(ROAD_WIDTH, 2000);
const roadMat = new THREE.MeshLambertMaterial({ color: 0x2a2a2a });
const road = new THREE.Mesh(roadGeo, roadMat);
road.rotation.x = -Math.PI / 2;
road.position.y = 0.01;
road.receiveShadow = true;
scene.add(road);

// Обочины
const shoulderMat = new THREE.MeshLambertMaterial({ color: 0x666666 });
const shoulderL = new THREE.Mesh(new THREE.PlaneGeometry(2, 2000), shoulderMat);
shoulderL.rotation.x = -Math.PI / 2;
shoulderL.position.set(-ROAD_WIDTH/2 - 1, 0.02, 0);
scene.add(shoulderL);
const shoulderR = shoulderL.clone();
shoulderR.position.x = ROAD_WIDTH/2 + 1;
scene.add(shoulderR);

// Разметка (прерывистая)
const lineMat = new THREE.MeshBasicMaterial({ color: 0xffdd00 });
const lineGeo = new THREE.PlaneGeometry(0.5, 4);
const lineGroup = new THREE.Group();
const TOTAL_LINES = 60;
const SPACING = 15;
for (let i = 0; i < TOTAL_LINES; i++) {
  const line = new THREE.Mesh(lineGeo, lineMat);
  line.rotation.x = -Math.PI / 2;
  line.position.set(0, 0.03, -i * SPACING);
  lineGroup.add(line);
}
scene.add(lineGroup);

// Белые боковые линии
const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const edgeL = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 2000), whiteMat);
edgeL.rotation.x = -Math.PI / 2;
edgeL.position.set(-ROAD_WIDTH/2 + 0.5, 0.03, 0);
scene.add(edgeL);
const edgeR = edgeL.clone();
edgeR.position.x = ROAD_WIDTH/2 - 0.5;
scene.add(edgeR);

// ================== МОДЕЛЬ ПРИОРЫ ==================
function createPriora(color = 0x000000) {
  const car = new THREE.Group();

  const bodyMat = new THREE.MeshPhongMaterial({
    color: color,
    shininess: 90,
    specular: 0x555555
  });
  const glassMat = new THREE.MeshPhongMaterial({
    color: 0x0a0a0a,
    shininess: 100,
    specular: 0xffffff,
    transparent: true,
    opacity: 0.85
  });
  const tireMat = new THREE.MeshLambertMaterial({ color: 0x0a0a0a });
  const chromeMat = new THREE.MeshPhongMaterial({ color: 0xc0c0c0, shininess: 100 });
  const redMat = new THREE.MeshPhongMaterial({ color: 0xff1111, emissive: 0x330000 });
  const whiteMat = new THREE.MeshPhongMaterial({ color: 0xfff4c8, emissive: 0x332200 });

  // Основной кузов — низ
  const lowerBody = new THREE.Mesh(
    new THREE.BoxGeometry(2, 0.6, 4.4),
    bodyMat
  );
  lowerBody.position.y = 0.65;
  lowerBody.castShadow = true;
  car.add(lowerBody);

  // Капот (слегка скошен вперёд)
  const hood = new THREE.Mesh(
    new THREE.BoxGeometry(1.9, 0.25, 1.2),
    bodyMat
  );
  hood.position.set(0, 1.0, 1.5);
  hood.castShadow = true;
  car.add(hood);

  // Багажник
  const trunk = new THREE.Mesh(
    new THREE.BoxGeometry(1.9, 0.25, 1.0),
    bodyMat
  );
  trunk.position.set(0, 1.0, -1.6);
  trunk.castShadow = true;
  car.add(trunk);

  // Кабина (средняя часть с крышей)
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.85, 0.65, 2.2),
    bodyMat
  );
  cabin.position.set(0, 1.15, 0);
  cabin.castShadow = true;
  car.add(cabin);

  // Крыша
  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(1.7, 0.08, 1.9),
    bodyMat
  );
  roof.position.set(0, 1.5, 0);
  roof.castShadow = true;
  car.add(roof);

  // Лобовое стекло
  const windshield = new THREE.Mesh(
    new THREE.BoxGeometry(1.7, 0.55, 0.1),
    glassMat
  );
  windshield.position.set(0, 1.25, 1.05);
  windshield.rotation.x = -0.35;
  car.add(windshield);

  // Заднее стекло
  const rearGlass = new THREE.Mesh(
    new THREE.BoxGeometry(1.7, 0.5, 0.1),
    glassMat
  );
  rearGlass.position.set(0, 1.25, -1.05);
  rearGlass.rotation.x = 0.4;
  car.add(rearGlass);

  // Боковые стёкла
  const sideGlassL = new THREE.Mesh(
    new THREE.BoxGeometry(0.05, 0.45, 1.9),
    glassMat
  );
  sideGlassL.position.set(-0.9, 1.3, 0);
  car.add(sideGlassL);
  const sideGlassR = sideGlassL.clone();
  sideGlassR.position.x = 0.9;
  car.add(sideGlassR);

  // Решётка радиатора (чёрная полоса)
  const grill = new THREE.Mesh(
    new THREE.BoxGeometry(1.4, 0.2, 0.05),
    new THREE.MeshPhongMaterial({ color: 0x000000 })
  );
  grill.position.set(0, 0.85, 2.21);
  car.add(grill);

  // Хром-полоска на решётке
  const chrome = new THREE.Mesh(
    new THREE.BoxGeometry(1.4, 0.04, 0.02),
    chromeMat
  );
  chrome.position.set(0, 0.95, 2.22);
  car.add(chrome);

  // Фары
  const headlightGeo = new THREE.BoxGeometry(0.5, 0.25, 0.1);
  const hlL = new THREE.Mesh(headlightGeo, whiteMat);
  hlL.position.set(-0.65, 0.85, 2.21);
  car.add(hlL);
  const hlR = hlL.clone();
  hlR.position.x = 0.65;
  car.add(hlR);

  // Задние фонари
  const taillightGeo = new THREE.BoxGeometry(0.55, 0.3, 0.1);
  const tlL = new THREE.Mesh(taillightGeo, redMat);
  tlL.position.set(-0.65, 0.9, -2.21);
  car.add(tlL);
  const tlR = tlL.clone();
  tlR.position.x = 0.65;
  car.add(tlR);

  // Зеркала
  const mirrorGeo = new THREE.BoxGeometry(0.15, 0.12, 0.25);
  const mL = new THREE.Mesh(mirrorGeo, bodyMat);
  mL.position.set(-1.05, 1.35, 1.0);
  car.add(mL);
  const mR = mL.clone();
  mR.position.x = 1.05;
  car.add(mR);

  // Колёса (чёрные штамповки)
  const wheelGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.28, 20);
  const wheelPositions = [
    [-1.0, 0.38, 1.4],
    [1.0, 0.38, 1.4],
    [-1.0, 0.38, -1.4],
    [1.0, 0.38, -1.4]
  ];
  wheelPositions.forEach(pos => {
    const wheel = new THREE.Mesh(wheelGeo, tireMat);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(...pos);
    wheel.castShadow = true;
    car.add(wheel);

    // Диск (тёмный, штамповка)
    const discGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.3, 12);
    const disc = new THREE.Mesh(discGeo, new THREE.MeshPhongMaterial({ color: 0x1a1a1a }));
    disc.rotation.z = Math.PI / 2;
    disc.position.set(...pos);
    car.add(disc);
  });

  // Номерной знак спереди
  const plateGeo = new THREE.BoxGeometry(0.7, 0.18, 0.03);
  const plateMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const plate = new THREE.Mesh(plateGeo, plateMat);
  plate.position.set(0, 0.6, 2.22);
  car.add(plate);

  // Задний номер
  const plateRear = new THREE.Mesh(plateGeo, plateMat);
  plateRear.position.set(0, 0.65, -2.22);
  car.add(plateRear);

  return car;
}

// ================== ИГРОК ==================
const playerCar = createPriora(0x000000); // ЧЁРНАЯ как на фото
playerCar.position.set(0, 0, 0);
scene.add(playerCar);

// ================== ВРАГИ ==================
const enemyColors = [0xe74c3c, 0x3498db, 0xf39c12, 0x9b59b6, 0x2ecc71, 0xecf0f1, 0x7f8c8d];
const enemies = [];

function spawnEnemy() {
  const car = createPriora(enemyColors[Math.floor(Math.random() * enemyColors.length)]);
  // Случайная полоса (левая или правая)
  const lane = Math.random() < 0.5 ? -1 : 1;
  const laneX = lane * (ROAD_WIDTH / 4);
  // Небольшой сдвиг внутри полосы
  const offset = (Math.random() - 0.5) * 2;

  car.position.set(laneX + offset, 0, -150 - Math.random() * 50);
  // Развернуть врагов навстречу (они едут в нашу сторону)
  car.rotation.y = Math.PI;
  car.userData.speed = 25 + Math.random() * 15;
  car.userData.lane = lane;
  scene.add(car);
  enemies.push(car);
}

// ================== УПРАВЛЕНИЕ ==================
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' && gameOver) resetGame();
});
document.addEventListener('keyup', e => keys[e.key] = false);

// Мобильное управление
let touchX = null;
document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; });
document.addEventListener('touchmove', e => { touchX = e.touches[0].clientX; });
document.addEventListener('touchend', () => touchX = null);

// ================== ЛОГИКА ИГРЫ ==================
let gameOver = false;
let score = 0;
let frameCount = 0;
const scoreEl = document.getElementById('score');
const speedEl = document.getElementById('speed');
const finalScoreEl = document.getElementById('finalScore');
const gameoverEl = document.getElementById('gameover');

const CAR_SPEED = 0.5; // скорость бокового движения
const FORWARD_SPEED = 60; // визуальная скорость движения вперёд

function resetGame() {
  gameOver = false;
  score = 0;
  scoreEl.textContent = '0';
  gameoverEl.style.display = 'none';
  playerCar.position.x = 0;
  enemies.forEach(e => scene.remove(e));
  enemies.length = 0;
}

function updateGame(dt) {
  if (gameOver) return;

  frameCount++;

  // Боковое управление
  let dx = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A'] || keys['ф'] || keys['Ф']) dx -= CAR_SPEED;
  if (keys['ArrowRight'] || keys['d'] || keys['D'] || keys['в'] || keys['В']) dx += CAR_SPEED;

  if (touchX !== null) {
    const target = ((touchX / window.innerWidth) * 2 - 1) * (ROAD_WIDTH / 2 - 2);
    dx = (target - playerCar.position.x) * 0.08;
  }

  playerCar.position.x += dx;

  // Ограничение по дороге
  const limit = ROAD_WIDTH / 2 - 1.2;
  if (playerCar.position.x < -limit) playerCar.position.x = -limit;
  if (playerCar.position.x > limit) playerCar.position.x = limit;

  // Наклон при повороте (эффект)
  playerCar.rotation.z = -dx * 0.15;
  playerCar.rotation.y = -dx * 0.08;

  // Движение разметки (эффект движения)
  lineGroup.children.forEach(line => {
    line.position.z += FORWARD_SPEED * dt;
    if (line.position.z > 50) {
      line.position.z -= TOTAL_LINES * SPACING;
    }
  });

  // Спавн врагов
  if (frameCount % 45 === 0) {
    spawnEnemy();
  }

  // Обновление врагов
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.position.z += (e.userData.speed + FORWARD_SPEED) * dt;

    // Столкновение
    const dx2 = Math.abs(e.position.x - playerCar.position.x);
    const dz2 = Math.abs(e.position.z - playerCar.position.z);
    if (dx2 < 1.6 && dz2 < 3.8) {
      gameOver = true;
      finalScoreEl.textContent = score;
      gameoverEl.style.display = 'flex';
      return;
    }

    // Удаление
    if (e.position.z > 30) {
      scene.remove(e);
      enemies.splice(i, 1);
      score += 10;
      scoreEl.textContent = score;
    }
  }
}

// ================== АНИМАЦИЯ ==================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  updateGame(dt);

  // Камера следует за машиной
  camera.position.x += (playerCar.position.x * 0.6 - camera.position.x) * 0.08;
  camera.position.y = 5.5;
  camera.position.z = 11;
  camera.lookAt(playerCar.position.x * 0.3, 1, -5);

  renderer.render(scene, camera);
}

animate();

// ================== РЕСАЙЗ ==================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
