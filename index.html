<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Камера</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
  :root {
    --bg: #0a0c10;
    --panel: rgba(18, 21, 27, 0.72);
    --panel-solid: #12151b;
    --border: rgba(255, 255, 255, 0.08);
    --text: #e8ecf1;
    --muted: #7c8798;
    --accent: #3ea6ff;
    --accent-glow: rgba(62, 166, 255, 0.35);
    --danger: #ff4757;
    --ok: #2ed573;
    --radius: 14px;
    --blur: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  #stage {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    display: block;
  }

  /* ---------- Верхняя панель ---------- */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
    z-index: 30;
    transition: opacity .35s ease, transform .35s ease;
    pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: .2px;
  }
  .brand .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--muted);
    box-shadow: 0 0 0 0 transparent;
    transition: background .3s, box-shadow .3s;
  }
  .brand .dot.live {
    background: var(--ok);
    box-shadow: 0 0 12px 2px rgba(46, 213, 115, .5);
    animation: pulse 2s infinite;
  }
  .brand .dot.err { background: var(--danger); box-shadow: 0 0 12px 2px rgba(255,71,87,.5); }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: .55; }
  }

  .clock {
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    color: var(--muted);
    font-weight: 500;
    letter-spacing: .5px;
  }

  /* ---------- Нижняя панель ---------- */
  .bottombar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    z-index: 30;
    transition: opacity .35s ease, transform .35s ease;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 46px;
    min-width: 46px;
    padding: 0 16px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: background .18s, transform .12s, border-color .18s, color .18s;
    outline: none;
  }
  .btn:hover { background: rgba(35, 40, 50, 0.85); border-color: rgba(255,255,255,.14); }
  .btn:active { transform: scale(.94); }
  .btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .btn.active { background: var(--accent); border-color: var(--accent); color: #04121f; box-shadow: 0 0 22px var(--accent-glow); }

  /* ---------- PTZ панель ---------- */
  .ptz {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%) translateX(30px);
    opacity: 0;
    pointer-events: none;
    z-index: 40;
    transition: opacity .3s ease, transform .3s ease;
    display: grid;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(3, 52px);
    gap: 8px;
    padding: 14px;
    background: var(--panel);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .ptz.show { opacity: 1; transform: translateY(-50%) translateX(0); pointer-events: auto; }

  .ptz button {
    width: 52px; height: 52px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.03);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, transform .1s, color .15s, border-color .15s;
    outline: none;
  }
  .ptz button:hover { background: rgba(62,166,255,.12); border-color: rgba(62,166,255,.4); color: var(--accent); }
  .ptz button:active { transform: scale(.9); background: var(--accent); color: #04121f; }
  .ptz button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ptz .center {
    background: rgba(62,166,255,.08);
    border-color: rgba(62,166,255,.25);
    color: var(--accent);
  }

  /* ---------- Оверлей загрузки / ошибки ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: rgba(10, 12, 16, 0.92);
    backdrop-filter: blur(8px);
    z-index: 50;
    transition: opacity .4s ease;
    text-align: center;
    padding: 24px;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  .spinner {
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,.1);
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .overlay .msg { color: var(--muted); font-size: 14px; max-width: 380px; line-height: 1.5; }
  .overlay .msg strong { color: var(--text); display: block; margin-bottom: 6px; font-size: 15px; font-weight: 600; }

  /* ---------- Скрытие UI ---------- */
  body.idle .topbar { opacity: 0; transform: translateY(-10px); pointer-events: none; }
  body.idle .bottombar { opacity: 0; transform: translateY(10px); pointer-events: none; }
  body.idle { cursor: none; }

  /* ---------- Мобильные ---------- */
  @media (max-width: 640px) {
    .btn span { display: none; }
    .btn { padding: 0; width: 46px; }
    .topbar { padding: 12px 14px; }
    .bottombar { padding: 14px; gap: 8px; }
    .ptz { right: 12px; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); padding: 10px; gap: 6px; }
    .ptz button { width: 46px; height: 46px; }
  }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline autoplay muted></video>
</div>

<!-- Верхняя панель -->
<div class="topbar">
  <div class="brand">
    <div class="dot" id="statusDot"></div>
    <div id="title">Камера</div>
  </div>
  <div class="clock" id="clock">--:--:--</div>
</div>

<!-- Нижняя панель -->
<div class="bottombar">
  <button class="btn" id="btnPtz" title="Управление (P)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>
    <span>PTZ</span>
  </button>
  <button class="btn" id="btnSnap" title="Снимок (S)">
    <svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.5"/></svg>
    <span>Снимок</span>
  </button>
  <button class="btn" id="btnAudio" title="Звук (M)">
    <svg viewBox="0 0 24 24" id="audioIcon"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>
    <span>Звук</span>
  </button>
  <button class="btn" id="btnFull" title="Полный экран (F)">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    <span>Экран</span>
  </button>
</div>

<!-- PTZ -->
<div class="ptz" id="ptz">
  <button data-cmd="upleft"><svg viewBox="0 0 24 24"><path d="M17 7 7 17M7 11V7h4"/></svg></button>
  <button data-cmd="up"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  <button data-cmd="upright"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 13v4h-4"/></svg></button>

  <button data-cmd="left"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button>
  <button class="center" data-cmd="home"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/></svg></button>
  <button data-cmd="right"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>

  <button data-cmd="downleft"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M7 13v4h4"/></svg></button>
  <button data-cmd="down"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg></button>
  <button data-cmd="downright"><svg viewBox="0 0 24 24"><path d="M17 17 7 7M13 17h4v-4"/></svg></button>

  <button data-cmd="zoomin" style="grid-column: span 1.5;"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M21 21l-4.5-4.5"/></svg></button>
  <button data-cmd="zoomout" style="grid-column: span 1.5;"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M21 21l-4.5-4.5"/></svg></button>
</div>

<!-- Оверлей состояния -->
<div class="overlay" id="overlay">
  <div class="spinner" id="spinner"></div>
  <div class="msg" id="overlayMsg"><strong>Подключение к камере…</strong>Ожидание видеопотока</div>
</div>

<script>
/* =========================================================
   НАСТРОЙКА — поменяй только эти значения
   ========================================================= */
const CONFIG = {
  // Название камеры в шапке
  title: 'Камера',

  // HLS-поток из go2rtc (или другого сервера).
  // Пример: http://192.168.1.50:1984/api/stream.m3u8?src=my_camera
  streamUrl: 'http://localhost:1984/api/stream.m3u8?src=my_camera',

  // Необязательно: URL, куда будут уходить PTZ-команды.
  // Оставь пустым — кнопки PTZ просто ничего не будут делать.
  // Пример: http://192.168.1.50:8090/ptz
  ptzUrl: '',

  // Начинать со звуком или без
  startMuted: true
};
/* ========================================================= */

const video     = document.getElementById('video');
const overlay   = document.getElementById('overlay');
const overlayMsg= document.getElementById('overlayMsg');
const spinner   = document.getElementById('spinner');
const statusDot = document.getElementById('statusDot');
const titleEl   = document.getElementById('title');
const clockEl   = document.getElementById('clock');
const ptzPanel  = document.getElementById('ptz');
const btnPtz    = document.getElementById('btnPtz');
const btnSnap   = document.getElementById('btnSnap');
const btnAudio  = document.getElementById('btnAudio');
const btnFull   = document.getElementById('btnFull');

titleEl.textContent = CONFIG.title;
video.muted = CONFIG.startMuted;
updateAudioBtn();

/* ---------- Часы ---------- */
setInterval(() => {
  const d = new Date();
  clockEl.textContent = d.toLocaleTimeString('ru-RU', { hour12: false });
}, 1000);

/* ---------- Поток ---------- */
let hls = null;

function showOverlay(title, text, spinning = true) {
  overlay.classList.remove('hidden');
  spinner.style.display = spinning ? 'block' : 'none';
  overlayMsg.innerHTML = `<strong>${title}</strong>${text}`;
}
function hideOverlay() { overlay.classList.add('hidden'); }
function setStatus(state) {
  statusDot.className = 'dot' + (state === 'live' ? ' live' : state === 'err' ? ' err' : '');
}

function startStream() {
  setStatus('wait');
  showOverlay('Подключение к камере…', 'Ожидание видеопотока');

  if (hls) { hls.destroy(); hls = null; }

  if (Hls.isSupported()) {
    hls = new Hls({
      lowLatencyMode: true,
      enableWorker: true,
      liveSyncDurationCount: 2,
      backBufferLength: 30
    });
    hls.loadSource(CONFIG.streamUrl);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      setStatus('live');
      hideOverlay();
      video.play().catch(() => {});
    });

    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) {
        setStatus('err');
        switch (data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR:
            showOverlay('Нет связи с потоком', 'Проверь адрес в CONFIG.streamUrl и доступность сервера');
            hls.startLoad();
            break;
          case Hls.ErrorTypes.MEDIA_ERROR:
            hls.recoverMediaError();
            break;
          default:
            showOverlay('Ошибка воспроизведения', 'Поток недоступен. Перезагрузка через 5 секунд…');
            setTimeout(startStream, 5000);
            break;
        }
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari / iOS — нативный HLS
    video.src = CONFIG.streamUrl;
    video.addEventListener('loadedmetadata', () => {
      setStatus('live'); hideOverlay(); video.play().catch(() => {});
    }, { once: true });
    video.addEventListener('error', () => {
      setStatus('err');
      showOverlay('Нет связи с потоком', 'Проверь адрес потока');
    }, { once: true });
  } else {
    setStatus('err');
    showOverlay('Браузер не поддерживает HLS', 'Открой страницу в современном браузере', false);
  }
}

startStream();

/* ---------- PTZ ---------- */
async function sendPtz(cmd) {
  if (!CONFIG.ptzUrl) return;
  try {
    await fetch(CONFIG.ptzUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd })
    });
  } catch (e) {
    console.warn('PTZ error:', e);
  }
}

ptzPanel.querySelectorAll('button[data-cmd]').forEach(btn => {
  btn.addEventListener('click', () => sendPtz(btn.dataset.cmd));
});

btnPtz.addEventListener('click', () => {
  ptzPanel.classList.toggle('show');
  btnPtz.classList.toggle('active', ptzPanel.classList.contains('show'));
});

/* ---------- Снимок ---------- */
btnSnap.addEventListener('click', () => {
  if (!video.videoWidth) return;
  const canvas = document.createElement('canvas');
  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const t = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    a.href = url;
    a.download = `camera_${t}.jpg`;
    a.click();
    URL.revokeObjectURL(url);
  }, 'image/jpeg', 0.95);
});

/* ---------- Звук ---------- */
function updateAudioBtn() {
  const icon = btnAudio.querySelector('#audioIcon');
  if (video.muted) {
    icon.innerHTML = '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/>';
    btnAudio.classList.remove('active');
  } else {
    icon.innerHTML = '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 9a4 4 0 0 1 0 6"/>';
    btnAudio.classList.add('active');
  }
}
btnAudio.addEventListener('click', () => {
  video.muted = !video.muted;
  updateAudioBtn();
});

/* ---------- Полный экран ---------- */
btnFull.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
});

/* ---------- Горячие клавиши ---------- */
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'p') btnPtz.click();
  else if (k === 's') btnSnap.click();
  else if (k === 'm') btnAudio.click();
  else if (k === 'f') btnFull.click();
  else if (k === 'escape' && ptzPanel.classList.contains('show')) btnPtz.click();
});

/* ---------- Автоскрытие интерфейса ---------- */
let idleTimer;
function resetIdle() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (!ptzPanel.classList.contains('show')) document.body.classList.add('idle');
  }, 3500);
}
['mousemove', 'mousedown', 'touchstart', 'keydown'].forEach(ev =>
  document.addEventListener(ev, resetIdle, { passive: true })
);
resetIdle();

/* ---------- Возврат к потоку ---------- */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && hls && hls.media) {
    video.play().catch(() => {});
  }
});

/* ---------- Двойной клик — полный экран ---------- */
video.addEventListener('dblclick', () => btnFull.click());
</script>
</body>
</html>
