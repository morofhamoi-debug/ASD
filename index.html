<!DOCTYPE html>
<html lang="ru" data-theme="system">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B0D12" />
<title>ASD BANK</title>
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22ASD%20BANK%22%2C%22short_name%22%3A%22ASD%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230B0D12%22%2C%22theme_color%22%3A%22%230B0D12%22%7D" />
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">

<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --bg: #F7F8FA;
  --bg-elev: #FFFFFF;
  --bg-sunken: #EEF0F4;
  --fg: #0B0D12;
  --fg-muted: #5B6472;
  --fg-subtle: #8A93A3;
  --border: #E4E7EC;
  --border-strong: #D0D5DD;
  --accent: #3B5BFF;
  --accent-hover: #2E4BE0;
  --accent-soft: #EEF1FF;
  --success: #12B76A;
  --success-soft: #E7F8EF;
  --danger: #F04438;
  --danger-soft: #FEECEB;
  --warning: #F79009;
  --warning-soft: #FEF3E2;
  --shadow-sm: 0 1px 2px rgba(16,24,40,.05);
  --shadow-md: 0 4px 12px rgba(16,24,40,.08);
  --shadow-lg: 0 12px 32px rgba(16,24,40,.10);
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --transition: 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
  --sidebar-w: 260px;
  --header-h: 64px;
}
[data-theme="dark"] {
  --bg: #0B0D12;
  --bg-elev: #14171F;
  --bg-sunken: #0F1218;
  --fg: #F2F4F7;
  --fg-muted: #98A2B3;
  --fg-subtle: #667085;
  --border: #1F2430;
  --border-strong: #2A3040;
  --accent: #5B78FF;
  --accent-hover: #7089FF;
  --accent-soft: #1A2140;
  --success-soft: #0E2A1E;
  --danger-soft: #2A1310;
  --warning-soft: #2A1F0A;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 4px 12px rgba(0,0,0,.5);
  --shadow-lg: 0 12px 32px rgba(0,0,0,.6);
}

/* ============================================================
   BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--fg);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background var(--transition), color var(--transition);
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
a { color: inherit; text-decoration: none; }
input, select, textarea { font-family: inherit; font-size: inherit; }
[hidden] { display: none !important; }
::selection { background: var(--accent); color: white; }

/* ============================================================
   APP LAYOUT
   ============================================================ */
#app { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-elev);
  border-right: 1px solid var(--border);
  padding: 20px 14px;
  display: flex; flex-direction: column;
  position: fixed; top: 0; left: 0; bottom: 0;
  overflow-y: auto;
  z-index: 30;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 10px 22px;
  font-weight: 700; letter-spacing: -0.01em;
}
.brand-mark {
  width: 32px; height: 32px; border-radius: 9px;
  background: linear-gradient(135deg, #3B5BFF, #7C3BFF);
  display: grid; place-items: center;
  color: white; font-weight: 800; font-size: 13px;
  box-shadow: var(--shadow-md);
}
.brand-text { font-size: 16px; }
.brand-text small { display: block; font-size: 10px; color: var(--fg-subtle); font-weight: 500; letter-spacing: 0.08em; }

.nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav-section {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--fg-subtle); padding: 16px 10px 6px; font-weight: 600;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  color: var(--fg-muted);
  font-size: 14px; font-weight: 500;
  transition: background var(--transition), color var(--transition);
  position: relative;
}
.nav-item:hover { background: var(--bg-sunken); color: var(--fg); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); }
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.nav-item .badge-dot {
  margin-left: auto; background: var(--danger); color: white;
  font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px;
}

.main {
  flex: 1;
  margin-left: var(--sidebar-w);
  min-width: 0;
  display: flex; flex-direction: column;
}
.header {
  height: var(--header-h);
  padding: 0 28px;
  display: flex; align-items: center; gap: 16px;
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(12px);
  position: sticky; top: 0; z-index: 20;
}
.header h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.header .spacer { flex: 1; }

.icon-btn {
  width: 38px; height: 38px; border-radius: 10px;
  display: grid; place-items: center;
  color: var(--fg-muted);
  transition: background var(--transition), color var(--transition);
  position: relative;
}
.icon-btn:hover { background: var(--bg-sunken); color: var(--fg); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn .dot {
  position: absolute; top: 8px; right: 8px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--danger); border: 2px solid var(--bg);
}

.avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, #3B5BFF, #7C3BFF);
  color: white; display: grid; place-items: center;
  font-weight: 600; font-size: 13px;
  cursor: pointer; transition: transform var(--transition);
}
.avatar:hover { transform: scale(1.05); }

.content {
  flex: 1;
  padding: 28px;
  max-width: 1280px;
  width: 100%;
  animation: pageIn 260ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes pageIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   COMPONENTS
   ============================================================ */
.card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.card.hoverable:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
.card-title { font-size: 13px; color: var(--fg-muted); font-weight: 500; margin: 0 0 6px; }
.card-value { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0; font-variant-numeric: tabular-nums; }

.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 14px; font-weight: 600;
  transition: all var(--transition);
  white-space: nowrap;
}
.btn svg { width: 16px; height: 16px; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: var(--bg-sunken); color: var(--fg); }
.btn-secondary:hover { background: var(--border); }
.btn-ghost { background: transparent; color: var(--fg-muted); }
.btn-ghost:hover { background: var(--bg-sunken); color: var(--fg); }
.btn-danger { background: var(--danger-soft); color: var(--danger); }
.btn-danger:hover { background: var(--danger); color: white; }
.btn-block { width: 100%; }
.btn-sm { padding: 7px 12px; font-size: 13px; }

.input, .select, .textarea {
  width: 100%;
  padding: 11px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg-elev);
  color: var(--fg);
  font-size: 14px;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.input.error { border-color: var(--danger); }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; font-weight: 500; color: var(--fg-muted); }
.field .err { font-size: 12px; color: var(--danger); }

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 12px; font-weight: 600;
  background: var(--bg-sunken); color: var(--fg-muted);
}
.badge.success { background: var(--success-soft); color: var(--success); }
.badge.danger  { background: var(--danger-soft);  color: var(--danger); }
.badge.warning { background: var(--warning-soft); color: var(--warning); }
.badge.accent  { background: var(--accent-soft);  color: var(--accent); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; }
.tab {
  padding: 10px 14px;
  font-size: 14px; font-weight: 500;
  color: var(--fg-muted);
  border-bottom: 2px solid transparent;
  transition: all var(--transition);
  white-space: nowrap;
}
.tab:hover { color: var(--fg); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.list { display: flex; flex-direction: column; }
.list-row {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 4px;
  border-bottom: 1px solid var(--border);
  transition: background var(--transition);
  cursor: pointer;
}
.list-row:last-child { border-bottom: none; }
.list-row:hover { background: var(--bg-sunken); border-radius: 8px; padding-left: 10px; padding-right: 10px; margin: 0 -10px; }

.tx-icon {
  width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center;
  flex-shrink: 0;
  background: var(--bg-sunken); color: var(--fg-muted);
}
.tx-icon.in  { background: var(--success-soft); color: var(--success); }
.tx-icon.out { background: var(--danger-soft);  color: var(--danger); }
.tx-icon svg { width: 18px; height: 18px; }

.tx-meta { flex: 1; min-width: 0; }
.tx-title { font-size: 14px; font-weight: 600; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-sub { font-size: 12px; color: var(--fg-subtle); margin: 2px 0 0; }
.tx-amount { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tx-amount.in  { color: var(--success); }
.tx-amount.out { color: var(--fg); }

.quick-actions { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
.quick-action {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 16px 8px;
  border-radius: var(--radius);
  background: var(--bg-elev);
  border: 1px solid var(--border);
  font-size: 12px; font-weight: 500;
  transition: all var(--transition);
  text-align: center;
}
.quick-action:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.quick-action .qa-icon {
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center;
}
.quick-action svg { width: 18px; height: 18px; }

/* Bank card visual */
.bank-card {
  aspect-ratio: 1.586;
  border-radius: 18px;
  padding: 20px;
  color: white;
  display: flex; flex-direction: column; justify-content: space-between;
  position: relative; overflow: hidden;
  background: linear-gradient(135deg, #1a1f2e 0%, #0B0D12 100%);
  box-shadow: var(--shadow-lg);
  transition: transform var(--transition);
}
.bank-card:hover { transform: translateY(-4px); }
.bank-card.black { background: linear-gradient(135deg, #232838 0%, #0B0D12 100%); }
.bank-card.blue  { background: linear-gradient(135deg, #3B5BFF 0%, #1E2F8F 100%); }
.bank-card.purple{ background: linear-gradient(135deg, #7C3BFF 0%, #3B1E8F 100%); }
.bank-card::after {
  content: ''; position: absolute;
  top: -40%; right: -20%;
  width: 60%; height: 120%;
  background: radial-gradient(circle, rgba(255,255,255,.08) 0%, transparent 70%);
  pointer-events: none;
}
.bank-card .bc-brand { font-size: 13px; font-weight: 700; letter-spacing: 0.1em; }
.bank-card .bc-chip {
  width: 34px; height: 26px; border-radius: 6px;
  background: linear-gradient(135deg, #D4AF37, #A17E1A);
  margin-top: auto;
}
.bank-card .bc-number { font-family: 'SF Mono', ui-monospace, monospace; font-size: 18px; letter-spacing: 0.12em; margin-top: 10px; }
.bank-card .bc-bottom { display: flex; justify-content: space-between; align-items: end; font-size: 12px; opacity: 0.85; margin-top: 10px; }
.bank-card .bc-bottom b { display: block; font-size: 14px; font-weight: 600; letter-spacing: 0.05em; }

/* Skeleton */
.skeleton {
  background: linear-gradient(90deg, var(--bg-sunken) 25%, var(--border) 50%, var(--bg-sunken) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: 8px;
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* Toast */
.toast-wrap {
  position: fixed; bottom: 24px; right: 24px;
  display: flex; flex-direction: column; gap: 10px;
  z-index: 100;
  pointer-events: none;
}
.toast {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  box-shadow: var(--shadow-lg);
  font-size: 14px;
  min-width: 260px;
  display: flex; align-items: center; gap: 10px;
  animation: toastIn 240ms cubic-bezier(0.2, 0.8, 0.2, 1);
  pointer-events: auto;
}
.toast.success { border-left: 3px solid var(--success); }
.toast.error   { border-left: 3px solid var(--danger); }
.toast.info    { border-left: 3px solid var(--accent); }
@keyframes toastIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

/* Empty state */
.empty {
  padding: 60px 20px; text-align: center;
  color: var(--fg-muted);
}
.empty svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.4; }
.empty h3 { margin: 0 0 6px; color: var(--fg); font-size: 16px; }
.empty p { margin: 0 0 16px; font-size: 14px; }

/* Auth layout */
.auth-wrap {
  min-height: 100vh;
  display: grid; place-items: center;
  padding: 24px;
  background: var(--bg);
}
.auth-card {
  width: 100%; max-width: 420px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 32px;
  box-shadow: var(--shadow-lg);
}
.auth-card h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.01em; }
.auth-card p.sub { margin: 0 0 24px; color: var(--fg-muted); font-size: 14px; }
.auth-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }

/* Mobile bottom nav */
.mobile-nav {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg-elev);
  border-top: 1px solid var(--border);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  z-index: 40;
}
.mobile-nav-inner { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.mobile-nav a {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 4px; border-radius: 10px;
  font-size: 10px; font-weight: 500; color: var(--fg-subtle);
  transition: color var(--transition);
}
.mobile-nav a.active { color: var(--accent); }
.mobile-nav svg { width: 22px; height: 22px; }

/* Demo banner */
.demo-banner {
  background: var(--warning-soft); color: var(--warning);
  font-size: 12px; font-weight: 600;
  padding: 6px 14px; text-align: center;
  border-bottom: 1px solid color-mix(in srgb, var(--warning) 25%, transparent);
}

/* Password strength */
.pwd-strength { display: flex; gap: 4px; margin-top: 6px; }
.pwd-strength span { flex: 1; height: 4px; border-radius: 2px; background: var(--border); transition: background var(--transition); }
.pwd-strength[data-level="1"] span:nth-child(1) { background: var(--danger); }
.pwd-strength[data-level="2"] span:nth-child(-n+2) { background: var(--warning); }
.pwd-strength[data-level="3"] span:nth-child(-n+3) { background: #84CC16; }
.pwd-strength[data-level="4"] span { background: var(--success); }

/* Charts */
.chart-svg { width: 100%; height: 220px; display: block; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; font-size: 12px; color: var(--fg-muted); }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* Progress */
.progress { height: 6px; border-radius: 3px; background: var(--bg-sunken); overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); transition: width 400ms cubic-bezier(0.2,0.8,0.2,1); }
.progress.warn > div { background: var(--warning); }
.progress.danger > div { background: var(--danger); }

/* Row */
.row { display: flex; align-items: center; gap: 12px; }
.row.between { justify-content: space-between; }
.mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; } .mt-8 { margin-top: 8px; }
.muted { color: var(--fg-muted); }
.subtle { color: var(--fg-subtle); font-size: 12px; }
.mono { font-family: 'SF Mono', ui-monospace, monospace; }
.text-c { text-align: center; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 1024px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
  .quick-actions { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 768px) {
  .sidebar { display: none; }
  .main { margin-left: 0; }
  .content { padding: 16px; padding-bottom: 90px; }
  .header { padding: 0 16px; }
  .header h1 { font-size: 16px; }
  .mobile-nav { display: block; }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .quick-actions { grid-template-columns: repeat(3, 1fr); }
  .card-value { font-size: 24px; }
  .toast-wrap { left: 16px; right: 16px; bottom: 90px; }
  .toast { min-width: 0; }
}
@media (max-width: 380px) {
  .quick-actions { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<div id="app"></div>
<div class="toast-wrap" id="toasts"></div>

<script>
/* ==================================================================
 * ASD BANK — Demo SPA
 * Внутренняя архитектура организована секциями.
 * В production каждая секция = отдельный модуль/файл.
 * ================================================================== */

/* ==================================================================
 * SECTION: APP CONFIG
 * ================================================================== */
const CONFIG = {
  APP_NAME: 'ASD BANK',
  DEMO_MODE: true,
  CURRENCY_DEFAULT: 'EUR',
  CURRENCIES: ['EUR', 'USD', 'GBP', 'RUB'],
  LOCALES: ['ru', 'en', 'et'],
  THEMES: ['light', 'dark', 'system'],
  TRANSFER_OTP_THRESHOLD: 1000,   // выше — требовать OTP
  DAILY_LIMIT: 5000,
  SUPPORTED_ROLES: ['USER', 'SUPPORT', 'ADMIN', 'SUPER_ADMIN'],
};

/* ==================================================================
 * SECTION: STATE
 * ================================================================== */
const State = {
  user: null,               // текущий пользователь
  session: null,            // токен сессии (mock)
  settings: {
    theme: 'system',
    language: 'ru',
    currency: 'EUR',
  },
  cache: {},                // кэш сущностей
  listeners: [],
  subscribe(fn) { this.listeners.push(fn); return () => this.listeners = this.listeners.filter(f => f !== fn); },
  emit() { this.listeners.forEach(fn => fn(this)); },
};

/* ==================================================================
 * SECTION: DB (IndexedDB, с fallback на in-memory)
 * Для demo используется in-memory + IndexedDB sync.
 * В production — REST API к PostgreSQL.
 * ================================================================== */
const DB = (() => {
  const data = {
    users: [],
    accounts: [],
    cards: [],
    transactions: [],
    notifications: [],
    beneficiaries: [],
    sessions: [],
    audit_logs: [],
    otp_codes: [],
    settings: [],
    categories: [
      { id: 'food', name: { ru: 'Продукты', en: 'Groceries', et: 'Toidukaubad' }, color: '#F79009' },
      { id: 'transport', name: { ru: 'Транспорт', en: 'Transport', et: 'Transport' }, color: '#3B5BFF' },
      { id: 'fun', name: { ru: 'Развлечения', en: 'Entertainment', et: 'Meelelahutus' }, color: '#7C3BFF' },
      { id: 'shopping', name: { ru: 'Покупки', en: 'Shopping', et: 'Ostlemine' }, color: '#F04438' },

  const byId = (table, id) => data[table].find(x => x.id === id);

  const insert = (table, row) => {
    row.id = id(table);
    data[table].push(row);
    return row;
  };

  const update = (table, id, patch) => {
    const idx = data[table].findIndex(x => x.id === id);
    if (idx >= 0) Object.assign(data[table][idx], patch);
    return data[table][idx];
  };

  return { data, insert, update, byUser, byId };
})();

/* ==================================================================
 * SECTION: CRYPTO — хэширование пароля и генерация ID
 * В production: argon2id на backend. Здесь — SHA-256 для demo.
 * ================================================================== */
const Hash = {
  async sha256(str) {
    const buf = new TextEncoder().encode(str);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
  },
};

function genRef() {
  const d = new Date();
  const date = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  const rnd = [...crypto.getRandomValues(new Uint8Array(4))].map(b => b.toString(16).padStart(2,'0')).join('').toUpperCase();
  return `ASD-TRX-${date}-${rnd}`;
}

function genIdempotencyKey() {
  return [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2,'0')).join('');
}

/* ==================================================================
 * SECTION: ROUTER
 * History API, реальные URL, guards, back/forward.
 * ================================================================== */
const Router = (() => {
  const routes = [];
  let currentCleanup = null;
  let notFoundHandler = null;

  function on(pattern, handler, opts = {}) {
    // pattern: '/cards/:id'
    const keys = [];
    const rx = new RegExp('^' + pattern.replace(/:([a-z_]+)/g, (_, k) => { keys.push(k); return '([^/]+)'; }) + '/?$');
    routes.push({ rx, keys, handler, opts });
  }

  function match(path) {
    for (const r of routes) {
      const m = path.match(r.rx);
      if (m) {
        const params = {};
        r.keys.forEach((k, i) => params[k] = decodeURIComponent(m[i+1]));
        return { ...r, params };
      }
    }
    return null;
  }

  async function resolve(path) {
    const m = match(path);
    if (currentCleanup) { try { currentCleanup(); } catch {} currentCleanup = null; }
    if (!m) {
      if (notFoundHandler) currentCleanup = await notFoundHandler();
      return;
    }
    // Guard
    if (m.opts.auth && !State.user) { navigate('/login'); return; }
    if (m.opts.guest && State.user) { navigate('/'); return; }
    if (m.opts.role && !m.opts.role.includes(State.user?.role)) {
      render403();
      return;
    }
    currentCleanup = await m.handler(m.params);
  }

  function navigate(path, replace = false) {
    if (path === location.pathname && !replace) return;
    if (replace) history.replaceState(null, '', path);
    else history.pushState(null, '', path);
    resolve(path);
  }

  window.addEventListener('popstate', () => resolve(location.pathname));
  window.addEventListener('click', (e) => {
    const a = e.target.closest('[data-link]');
    if (!a) return;
    e.preventDefault();
    navigate(a.getAttribute('href'));
  });

  function setNotFound(fn) { notFoundHandler = fn; }

  return { on, navigate, resolve, setNotFound };
})();

/* ==================================================================
 * SECTION: UI KIT (components)
 * ================================================================== */
const UI = {
  btn(label, { variant = 'primary', icon = '', href = '', onclick = '', size = '', block = false, disabled = false, type = 'button' } = {}) {
    const cls = ['btn', `btn-${variant}`, size && `btn-${size}`, block && 'btn-block'].filter(Boolean).join(' ');
    const attrs = [
      `class="${cls}"`,
      `type="${type}"`,
      disabled && 'disabled',
      href ? `data-link href="${href}"` : '',
      onclick ? `data-action="${onclick}"` : '',
    ].filter(Boolean).join(' ');
    return `<${href ? 'a' : 'button'} ${attrs}>${icon}${label ? `<span>${label}</span>` : ''}</${href ? 'a' : 'button'}>`;
  },

  field({ label, name, type = 'text', value = '', placeholder = '', required = false, autocomplete = '', error = '' }) {
    return `
      <div class="field">
        ${label ? `<label for="${name}">${label}</label>` : ''}
        <input class="input ${error ? 'error' : ''}" id="${name}" name="${name}" type="${type}" value="${escapeHtml(value)}" placeholder="${escapeHtml(placeholder)}" ${required ? 'required' : ''} ${autocomplete ? `autocomplete="${autocomplete}"` : ''} />
        ${error ? `<div class="err">${escapeHtml(error)}</div>` : ''}
      </div>`;
  },

  badge(text, kind = '') { return `<span class="badge ${kind}">${escapeHtml(text)}</span>`; },

  txRow(tx) {
    const isIn = tx.direction === 'in';
    const cp = tx.counterparty ? DB.byId('users', tx.counterparty) : null;
    const title = tx.description || (cp ? `${cp.first_name} ${cp.last_name}` : 'Операция');
    const sub = `${fmtDate(tx.created_at, true)}${cp ? ' · ' + (cp.first_name + ' ' + cp.last_name) : ''}`;
    return `
      <a class="list-row" href="/transactions/${tx.id}" data-link>
        <div class="tx-icon ${isIn ? 'in' : 'out'}">${isIn ? Icons.arrowDown : Icons.arrowUp}</div>
        <div class="tx-meta">
          <p class="tx-title">${escapeHtml(title)}</p>
          <p class="tx-sub">${escapeHtml(sub)}</p>
        </div>
        <div class="tx-amount ${isIn ? 'in' : 'out'}">${isIn ? '+' : '−'}${fmt(tx.amount, tx.currency)}</div>
      </a>`;
  },
};

function attachTransferForm() {
  const form = document.getElementById('transfer-form');
  const search = document.getElementById('recipient-search');
  const result = document.getElementById('recipient-result');
  let selectedUser = null;

  search.addEventListener('input', async () => {
    const q = search.value;
    if (q.length < 2) { result.innerHTML = ''; return; }
    const users = (await API.searchUsers(q)).filter(u => u.id !== State.user.id);
    if (users.length === 0) {
      result.innerHTML = `<div class="subtle">Ничего не найдено</div>`;
      return;
    }
    result.innerHTML = users.map(u => `
      <div class="list-row" data-pick="${u.id}">
        <div class="avatar">${initials(u)}</div>
        <div class="tx-meta"><p class="tx-title">${escapeHtml(u.first_name)} ${escapeHtml(u.last_name)}</p><p class="tx-sub mono">${u.asd_id} · ${u.email}</p></div>
        <button class="btn btn-secondary btn-sm" type="button" data-action="pick-user" data-id="${u.id}">Выбрать</button>
      </div>
    `).join('');
  });

  document.addEventListener('click', function pickHandler(e) {
    const btn = e.target.closest('[data-action="pick-user"]');
    if (!btn) return;
    const id = +btn.dataset.id;
    const u = DB.byId('users', id);
    if (!u) return;
    selectedUser = u;
    search.value = `${u.first_name} ${u.last_name}`;
    result.innerHTML = `
      <div class="card" style="background:var(--accent-soft);border-color:var(--accent)">
        <div class="row">
          <div class="avatar">${initials(u)}</div>
          <div><b>${escapeHtml(u.first_name)} ${escapeHtml(u.last_name)}</b><div class="subtle mono">${u.asd_id} · ${u.email}</div></div>
        </div>
      </div>`;
  }, { once: false });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const errBox = document.getElementById('recipient-err');
    errBox.textContent = '';
    if (!selectedUser) { errBox.textContent = 'Выберите получателя'; return; }
    const amount = parseFloat(document.getElementById('amount').value);
    const currency = document.getElementById('currency').value;
    const description = document.getElementById('description').value.trim();
    const fromAccountId = +document.getElementById('from-account').value;
    if (!(amount > 0)) { document.getElementById('amount-err').textContent = 'Введите корректную сумму'; return; }

    const fromAcc = DB.byId('accounts', fromAccountId);
    if (amount > fromAcc.available_balance) { document.getElementById('amount-err').textContent = 'Недостаточно средств'; return; }

    // сохраним черновик перевода для страницы подтверждения
    sessionStorage.setItem('asd_pending_transfer', JSON.stringify({
      fromAccountId, toUserId: selectedUser.id, amount, currency, description,
      idempotencyKey: genIdempotencyKey(),
      recipient: { name: `${selectedUser.first_name} ${selectedUser.last_name}`, asd_id: selectedUser.asd_id, email: selectedUser.email },
      account: { id: fromAcc.id, number: fromAcc.account_number },
    }));

    Router.navigate('/transfer-confirmation');
  });
}

/* ---------- TRANSACTIONS LIST ---------- */
async function PageTransactions(query) {
  const all = await API.transactions(State.user.id);
  const filter = query.filter || 'all';
  const search = (query.q || '').toLowerCase();
  let list = all;
  if (filter === 'in') list = list.filter(t => t.direction === 'in');
  else if (filter === 'out') list = list.filter(t => t.direction === 'out');
  else if (filter === 'transfer') list = list.filter(t => t.type === 'transfer');
  else if (filter === 'payment') list = list.filter(t => t.type === 'payment');
  if (search) list = list.filter(t => (t.description || '').toLowerCase().includes(search) || t.ref.toLowerCase().includes(search));

  const html = `
    <div class="row" style="gap:8px;margin-bottom:16px">
      <input class="input" id="tx-search" placeholder="Поиск по описанию или ID" value="${escapeHtml(query.q || '')}" style="max-width:320px" />
      <a href="/export" data-link class="btn btn-secondary">Экспорт</a>
    </div>
    <div class="tabs">
      <a class="tab ${filter === 'all' ? 'active' : ''}" href="/transactions" data-link>Все</a>
      <a class="tab ${filter === 'in' ? 'active' : ''}" href="/transactions?filter=in" data-link>Поступления</a>
      <a class="tab ${filter === 'out' ? 'active' : ''}" href="/transactions?filter=out" data-link>Списания</a>
      <a class="tab ${filter === 'transfer' ? 'active' : ''}" href="/transactions?filter=transfer" data-link>Переводы</a>
      <a class="tab ${filter === 'payment' ? 'active' : ''}" href="/transactions?filter=payment" data-link>Платежи</a>
    </div>
    <div class="card" style="padding:8px 16px">
      ${list.length === 0 ? `<div class="empty"><h3>Операций не найдено</h3><p>Попробуйте изменить фильтр</p>${UI.btn('Совершить перевод', { href: '/transfers', icon: Icons.send })}</div>` : `<div class="list">${list.map(UI.txRow).join('')}</div>`}
    </div>
  `;
  render(Shell(html, { title: 'История операций' }));

    if (e.key === 'Enter') {
      const q = s.value.trim();
      Router.navigate('/transactions' + (q ? `?q=${encodeURIComponent(q)}` : ''));
    }
  });
}

/* Псевдо-QR — визуальный, не настоящий. В production — библиотека qrcode. */
function qrSvg(seed) {
  const size = 21, cell = 6;
  let h = parseInt(seed.split('').reduce((a,c) => a + c.charCodeAt(0), 0)) || 12345;
  const rand = () => { h = (h * 9301 + 49297) % 233280; return h / 233280; };
  let cells = '';
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const corner = (x < 7 && y < 7) || (x > size-8 && y < 7) || (x < 7 && y > size-8);
    let on;
    if (corner) {
      const inPos = (x < 7 && y < 7) || (x > size-8 && y < 7) || (x < 7 && y > size-8);
      const lx = x < 7 ? x : x - (size - 7);
      const ly = y < 7 ? y : y - (size - 7);
      on = (lx === 0 || lx === 6 || ly === 0 || ly === 6 || (lx >= 2 && lx <= 4 && ly >= 2 && ly <= 4));
    } else {
      on = rand() > 0.5;
    }
    if (on) cells += `<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}" fill="#0B0D12"/>`;
  }
  return `<svg width="${size*cell}" height="${size*cell}" viewBox="0 0 ${size*cell} ${size*cell}">${cells}</svg>`;
}

            <div class="pwd-strength" id="pwd-strength" data-level="0"><span></span><span></span><span></span><span></span></div>
          </div>
          <div class="field"><label>Повторите пароль</label><input class="input" type="password" name="confirm" required /></div>
          <button class="btn btn-primary btn-block" type="submit">Изменить пароль</button>
        </form>
      </div>
      <div>
        <div class="card" style="margin-bottom:16px">

        </div>
        <div class="card">
          <h4 style="margin:0 0 14px;font-size:14px">Активные сессии (${sessions.length})</h4>
          <div class="list">
            ${sessions.length === 0 ? `<div class="subtle">Нет активных сессий</div>` : sessions.map(s => `
              <div class="list-row">
                <div class="tx-icon">${Icons.device}</div>
                <div class="tx-meta">
                  <p class="tx-title">${escapeHtml(s.device)}</p>
                  <p class="tx-sub">${fmtDate(s.last_active, true)}${s.current ? ' · текущая' : ''}</p>
                </div>
                ${s.current ? UI.badge('Текущая','success') : `<button class="btn btn-ghost btn-sm" data-action="end-session" data-id="${s.id}">Завершить</button>`}
              </div>
            `).join('')}
          </div>
          <button class="btn btn-danger btn-block" style="margin-top:12px" data-action="logout-all">Выйти со всех устройств</button>
        </div>
      </div>
    </div>
  `;
  render(Shell(html, { title: 'Безопасность', showBack: true }));

  const pwd = document.getElementById('new-pwd');
  const strength = document.getElementById('pwd-strength');
  pwd.addEventListener('input', () => {
    const v = pwd.value;
    let lvl = 0;
    if (v.length >= 8) lvl++;
    if (/[A-Z]/.test(v) && /[a-z]/.test(v)) lvl++;
    if (/\d/.test(v)) lvl++;
    if (/[^A-Za-z0-9]/.test(v)) lvl++;
    strength.dataset.level = lvl;
  });

  document.getElementById('pwd-form').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const currentHash = await Hash.sha256(fd.get('current') + ':asd-salt');

    DB.update('users', State.user.id, { password_hash: newHash, updated_at: Date.now() });
    audit('password_change', {});
    notify(State.user.id, 'security', 'Пароль изменён', 'Если это были не вы — срочно свяжитесь с поддержкой.');

    Router.navigate('/settings/security');
  });
}

/* ---------- ANALYTICS ---------- */
async function PageAnalytics() {
  const txs = await API.transactions(State.user.id);
  const out = txs.filter(t => t.direction === 'out');
  const byCategory = {};
  out.forEach(t => { const k = t.category || 'other'; byCategory[k] = (byCategory[k] || 0) + t.amount; });
  const total = Object.values(byCategory).reduce((a,b) => a + b, 0) || 1;

  // Диаграмма расходов за последние 7 дней
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const day = new Date(); day.setDate(day.getDate() - i); day.setHours(0,0,0,0);
    const next = day.getTime() + 86400000;
    const amount = out.filter(t => t.created_at >= day.getTime() && t.created_at < next).reduce((s,t) => s + t.amount, 0);
    days.push({ label: day.toLocaleDateString('ru-RU', { weekday: 'short' }), amount });
  }
  const max = Math.max(...days.map(d => d.amount), 1);

  const html = `
    <div class="grid grid-2" style="margin-bottom:20px">
      <div class="card">
        <h4 style="margin:0 0 14px;font-size:14px">Расходы за 7 дней</h4>
        <svg class="chart-svg" viewBox="0 0 320 220" preserveAspectRatio="none">
          ${days.map((d, i) => {
            const w = 320 / days.length;
            const h = (d.amount / max) * 160;
            return `<rect x="${i * w + 8}" y="${180 - h}" width="${w - 16}" height="${h}" rx="6" fill="var(--accent)" opacity="0.85"/>`;
          }).join('')}
          ${days.map((d, i) => {
            const w = 320 / days.length;
            return `<text x="${i * w + w/2}" y="205" text-anchor="middle" font-size="11" fill="var(--fg-subtle)">${d.label}</text>`;
          }).join('')}
        </svg>
      </div>
      <div class="card">
        <h4 style="margin:0 0 14px;font-size:14px">Категории расходов</h4>
        ${Object.keys(byCategory).length === 0 ? '<div class="empty">Нет данных</div>' : `
          <svg class="chart-svg" viewBox="0 0 220 220" style="height:180px">
            ${(() => {
              let start = -Math.PI / 2;
              const r = 90, cx = 110, cy = 110;
              return Object.entries(byCategory).map(([cat, val]) => {
                const pct = val / total;
                const end = start + pct * Math.PI * 2;
                const x1 = cx + r * Math.cos(start), y1 = cy + r * Math.sin(start);
                const x2 = cx + r * Math.cos(end), y2 = cy + r * Math.sin(end);
                const large = pct > 0.5 ? 1 : 0;
                const path = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`;
                const c = DB.data.categories.find(c => c.id === cat)?.color || '#667085';
                start = end;
                return `<path d="${path}" fill="${c}" opacity="0.9"/>`;
              }).join('');
            })()}
          </svg>
          <div class="chart-legend">
            ${Object.entries(byCategory).map(([cat, val]) => {
              const c = DB.data.categories.find(c => c.id === cat);
              const name = c ? c.name.ru : cat;
              const color = c ? c.color : '#667085';
              return `<span><i style="background:${color}"></i>${name} · ${fmt(val)}</span>`;
            }).join('')}
          </div>
        `}
      </div>
    </div>
    <div class="grid grid-3">
      <div class="card"><p class="card-title">Всего расходов</p><p class="card-value">${fmt(out.reduce((s,t) => s + t.amount, 0))}</p></div>
      <div class="card"><p class="card-title">Всего доходов</p><p class="card-value" style="color:var(--success)">${fmt(txs.filter(t => t.direction === 'in').reduce((s,t) => s + t.amount, 0))}</p></div>
      <div class="card"><p class="card-title">Операций</p><p class="card-value">${txs.length}</p></div>
    </div>
  `;
  render(Shell(html, { title: 'Аналитика' }));
}

/* ---------- BUDGET ---------- */
async function PageBudget() {
  const txs = await API.transactions(State.user.id);
  const limits = { food: 400, transport: 150, fun: 200, shopping: 300, subs: 50 };
  const html = `
    <div class="grid grid-2">
      ${DB.data.categories.map(c => {
        const spent = txs.filter(t => t.direction === 'out' && t.category === c.id).reduce((s,t) => s + t.amount, 0);
        const limit = limits[c.id] || 200;
        const pct = Math.min(100, (spent / limit) * 100);
        const cls = pct >= 100 ? 'danger' : pct > 80 ? 'warn' : '';
        return `
          <div class="card">
            <div class="row between" style="margin-bottom:10px">
              <div class="row"><span style="width:10px;height:10px;border-radius:3px;background:${c.color};display:inline-block"></span><b style="margin-left:8px">${c.name.ru}</b></div>
              <span class="subtle">${fmt(spent)} / ${fmt(limit)}</span>
            </div>
            <div class="progress ${cls}"><div style="width:${pct}%"></div></div>
            <p class="subtle" style="margin:8px 0 0">Осталось: ${fmt(Math.max(0, limit - spent))}</p>
          </div>`;
      }).join('')}
    </div>
  `;
  render(Shell(html, { title: 'Бюджет' }));
}

  });
}

    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-logo"><div class="brand-mark">ASD</div></div>
        <h2>Восстановление пароля</h2>

          <div class="field"><label>Email или телефон</label><input class="input" required /></div>
          <button class="btn btn-primary btn-block" type="submit">Отправить ссылку</button>
        </form>
        <div class="text-c" style="margin-top:14px;font-size:13px">
          <a href="/login" data-link style="color:var(--accent)">Назад ко входу</a>
        </div>
      </div>

  `;

/* ==================================================================
 * SECTION: RENDER + GLOBAL ACTIONS
 * ================================================================== */
function render(html) {
  document.getElementById('app').outerHTML = html;
  applyTheme();
}

function applyTheme() {
  const t = State.settings.theme;
  const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const val = el.dataset.value;

  if (action === 'copy' && val) {
    navigator.clipboard.writeText(val);
    toast('Скопировано', 'success');
  }
  if (action === 'back') {
    history.back();
  }
  if (action === 'logout') {
    audit('logout');
    State.user = null;
    sessionStorage.clear();
    Router.navigate('/login');
  }
  if (action === 'logout-all') {
    audit('logout_all');
    State.user = null;
    sessionStorage.clear();
    toast('Вы вышли со всех устройств', 'success');
    Router.navigate('/login');
  }
  if (action === 'end-session') {
    const id = +el.dataset.id;
    DB.update('sessions', id, { revoked: true });
    toast('Сессия завершена', 'success');
    render(Shell(document.getElementById('content').innerHTML, { title: 'Безопасность', showBack: true }));
  }
  if (action === 'reveal-card') {
    const card = DB.byId('cards', +el.dataset.id);
    // Дополнительная проверка (в production — OTP / биометрия)
    const pan = `•••• •••• •••• ${card.pan_last4}`;
    toast('В production здесь потребуется биометрия / OTP', 'info');
    // Демонстрация: показываем маску (никогда не реальный PAN)
    const el2 = document.getElementById('card-pan');
    if (el2) el2.textContent = pan;
  }
  if (action === 'toggle-card') {
    const card = DB.byId('cards', +el.dataset.id);
    card.status = card.status === 'active' ? 'locked' : 'active';
    audit('card_' + (card.status === 'locked' ? 'lock' : 'unlock'), { card_id: card.id });
    notify(State.user.id, 'card', 'Статус карты изменён', `Карта •••• ${card.pan_last4}: ${card.status}`);
    toast('Карта обновлена', 'success');
    PageCardDetail({ id: card.id });
  }
  if (action === 'reissue-card') {
    toast('Перевыпуск запрошен. В production — через 3 рабочих дня.', 'info');
    audit('card_reissue', { card_id: +el.dataset.id });
  }
  if (action === 'create-card') {
    const acc = DB.data.accounts.find(a => a.user_id === State.user.id);
    if (!acc) { toast('Нет счёта для привязки карты', 'error'); return; }
    const last4 = String(Math.floor(1000 + Math.random() * 9000));
    const card = DB.insert('cards', {
      user_id: State.user.id, account_id: acc.id,
      pan_last4: last4, exp_month: 12, exp_year: new Date().getFullYear() + 4,
      brand: 'ASD', kind: 'virtual', status: 'active',
      daily_limit: 1000, color: ['black','blue','purple'][Math.floor(Math.random()*3)],
      holder: (State.user.first_name + ' ' + State.user.last_name).toUpperCase(),
      created_at: Date.now(),
    });
    audit('card_create', { card_id: card.id });
    toast('Виртуальная карта создана', 'success');
    PageCards();
  }
  if (action === 'open-account') {
    DB.insert('accounts', {
      user_id: State.user.id,
      account_number: 'EE' + String(30000000000000000000n + BigInt(DB.data.accounts.length)).slice(0,18),
      currency: 'EUR', kind: 'savings',
      balance: 0, available_balance: 0, status: 'active',
      created_at: Date.now(), updated_at: Date.now(),
    });
    audit('account_create');
    toast('Новый счёт открыт', 'success');
    PageAccounts();
  }
  if (action === 'read-all') {
    DB.byUser('notifications', State.user.id).forEach(n => n.is_read = true);
    State.emit();
    PageNotifications();
  }
  if (action === 'repeat-tx') {
    const tx = DB.byId('transactions', +el.dataset.id);
    if (!tx || tx.direction !== 'out' || !tx.counterparty) { toast('Повтор недоступен', 'error'); return; }
    sessionStorage.setItem('asd_pending_transfer', JSON.stringify({
      fromAccountId: tx.account_id, toUserId: tx.counterparty,
      amount: tx.amount, currency: tx.currency, description: 'Повтор операции',
      idempotencyKey: genIdempotencyKey(),
      recipient: (() => { const u = DB.byId('users', tx.counterparty); return { name: u.first_name + ' ' + u.last_name, asd_id: u.asd_id, email: u.email }; })(),
      account: (() => { const a = DB.byId('accounts', tx.account_id); return { id: a.id, number: a.account_number }; })(),
    }));
    Router.navigate('/transfer-confirmation');
  }
  if (action === 'report-tx') {
    toast('Обращение создано. Support свяжется с вами.', 'success');
    audit('tx_report', { tx_id: +el.dataset.id });
  }
  if (action === 'set-theme') {
    State.settings.theme = el.dataset.theme;
    applyTheme();
    PageSettingsAppearance();
  }
  if (action === 'set-lang') {
    State.settings.language = el.dataset.lang;
    toast('Язык сохранён: ' + el.dataset.lang.toUpperCase(), 'success');
    PageSettingsAppearance();
  }
  if (action === 'toggle-2fa') toast('Настройка 2FA появится после подключения backend', 'info');
  if (action === 'save-privacy' || action === 'save-notifications') { toast('Настройки сохранены', 'success'); audit(action); }
});

  Router.on('/',                    PageHome,                { auth: true });

  Router.on('/accounts/:id',        PageAccountDetail,       { auth: true });
  Router.on('/cards',               PageCards,               { auth: true });
  Router.on('/cards/:id',           PageCardDetail,          { auth: true });
  Router.on('/transfers',           PageTransfers,            { auth: true });
  Router.on('/transfer-confirmation', PageTransferConfirmation, { auth: true });
  Router.on('/transfer-success',    PageTransferSuccess,     { auth: true });
  Router.on('/transactions',        PageTransactions,        { auth: true });
  Router.on('/transactions/:id/receipt', PageReceipt,        { auth: true });
  Router.on('/transactions/:id',    PageTransactionDetail,   { auth: true });
  Router.on('/payments',            PagePayments,            { auth: true });
  Router.on('/payments/:id',        PagePaymentCategory,     { auth: true });
  Router.on('/deposit',             PageDeposit,             { auth: true });
  Router.on('/receive',             PageReceive,             { auth: true });
  Router.on('/qr',                  PageQR,                  { auth: true });
  Router.on('/notifications',       PageNotifications,       { auth: true });
  Router.on('/analytics',           PageAnalytics,           { auth: true });
  Router.on('/budget',              PageBudget,              { auth: true });
  Router.on('/profile',             PageProfile,             { auth: true });
  Router.on('/profile/edit',        PageProfileEdit,         { auth: true });
  Router.on('/settings',            PageSettings,            { auth: true });
  Router.on('/settings/security',   PageSettingsSecurity,    { auth: true });
  Router.on('/settings/privacy',    PageSettingsPrivacy,     { auth: true });
  Router.on('/settings/notifications', PageSettingsNotifications, { auth: true });
  Router.on('/settings/appearance', PageSettingsAppearance,  { auth: true });
  Router.on('/settings/limits',     PageSettingsLimits,      { auth: true });
  Router.on('/settings/devices',    PageSettingsDevices,     { auth: true });
  Router.on('/search',              PageSearch,              { auth: true });
  Router.on('/help',                PageHelp,                { auth: true });
  Router.on('/support',             PageSupport,             { auth: true });

  Router.on('/admin',               PageAdmin,               { auth: true, role: ['ADMIN','SUPER_ADMIN'] });
  Router.on('/admin/users',         PageAdminUsers,          { auth: true, role: ['ADMIN','SUPER_ADMIN'] });
  Router.on('/admin/transactions',  PageAdminTransactions,   { auth: true, role: ['ADMIN','SUPER_ADMIN'] });
  Router.on('/admin/security',      PageAdminSecurity,       { auth: true, role: ['ADMIN','SUPER_ADMIN'] });
  Router.on('/admin/audit',         PageAdminAudit,          { auth: true, role: ['ADMIN','SUPER_ADMIN'] });

  Router.on('/login',    PageLogin,    { guest: true });
  Router.on('/register', PageRegister, { guest: true });
  Router.on('/forgot-password', PageForgot, { guest: true });

  Router.setNotFound(() => render404());
}

/* ==================================================================
 * SECTION: BOOTSTRAP
 * ================================================================== */
(async function bootstrap() {
  // Тема
  const savedTheme = localStorage.getItem('asd_theme');
  if (savedTheme) State.settings.theme = savedTheme;
  State.subscribe(() => {
    localStorage.setItem('asd_theme', State.settings.theme);
    applyTheme();
  });
  applyTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

  // Seed demo
  await seed();

  // Восстановление сессии
  const savedUser = localStorage.getItem('asd_user_id');
  if (savedUser) {
    const u = DB.byId('users', +savedUser);
    if (u) State.user = u;
  }
  State.subscribe(() => {
    if (State.user) localStorage.setItem('asd_user_id', State.user.id);
    else localStorage.removeItem('asd_user_id');
  });

  // Роутер
  buildRoutes();

  // Deep link поддержка: при первом заходе если нет пользователя — /login
  const path = location.pathname;
  const guestOnly = ['/login', '/register', '/forgot-password'].includes(path);
  if (!State.user && !guestOnly) {
    history.replaceState(null, '', '/login');
    Router.resolve('/login');
  } else {
    Router.resolve(path);
  }
})();
</script>
