<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Дело №2024-0414 — Последний сеанс</title>
<style>
/* ============================================================
   ДЕЛО №2024-0414 — ПОСЛЕДНИЙ СЕАНС
   Часть 1 из 10 — ФУНДАМЕНТ ДВИЖКА
   ------------------------------------------------------------
   Все иконки интерфейса — SVG-контур (stroke=currentColor).
   Эмодзи появляются только в контенте телефона (в переписках,
   в галерее, в записках) — там где они уместны как реальные
   эмодзи, которые Марина могла бы отправлять.
   ============================================================ */

/* ------------------------------------------------------------
   ПЕРЕМЕННЫЕ ТЕМЫ (CSS CUSTOM PROPERTIES)
   ------------------------------------------------------------ */
:root{
  --bg:#05070c;
  --wall:#0a0e18;
  --panel:#11161f;
  --panel2:#1a202c;
  --panel3:#232b3a;
  --panel4:#2c3648;
  --line:#2a3444;
  --line2:#3a4658;
  --line3:#4a5870;
  --txt:#e8edf6;
  --txt2:#c8d1e2;
  --dim:#7a869c;
  --dim2:#4d576b;
  --acc:#5da9ff;
  --acc2:#8b6dff;
  --acc3:#4f8fe0;
  --ok:#3ddc97;
  --warn:#ffb84d;
  --danger:#ff5a6e;
  --rose:#ff7a9c;
  --glow:0 0 30px rgba(93,169,255,.35);
  --glow-strong:0 0 60px rgba(93,169,255,.55);
  --shadow-soft:0 4px 14px rgba(0,0,0,.4);
  --shadow-hard:0 14px 44px rgba(0,0,0,.7);
  --shadow-max:0 30px 90px rgba(0,0,0,.85);
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:22px;
  --radius-xl:34px;
  --radius-full:999px;
  --fast:.14s;
  --med:.22s;
  --slow:.35s;
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-bounce:cubic-bezier(.4,1.6,.5,1);
}

/* ------------------------------------------------------------
   БАЗОВЫЙ СБРОС
   ------------------------------------------------------------ */
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}
html,
body{
  height:100%;
  width:100%;
  overflow:hidden;
  overscroll-behavior:none;
}
body{
  background:
    radial-gradient(1400px 900px at 20% -20%, #16233d 0%, transparent 55%),
    radial-gradient(1000px 800px at 110% 120%, #2b1a3d 0%, transparent 55%),
    radial-gradient(800px 600px at 50% 50%, rgba(93,169,255,.04) 0%, transparent 70%),
    var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14px;
  line-height:1.4;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:14px;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}

/* ------------------------------------------------------------
   КОРПУС ТЕЛЕФОНА
   ------------------------------------------------------------ */
#phone{
  width:400px;
  height:840px;
  max-height:98vh;
  background:linear-gradient(160deg,#1a1e28,#05070c);
  border-radius:52px;
  padding:13px;
  position:relative;
  display:flex;
  flex-direction:column;
  box-shadow:
    0 0 0 1.5px #2c3342,
    0 0 0 3px #0c0f16,
    0 30px 90px rgba(0,0,0,.85),
    0 0 120px rgba(93,169,255,.10),
    inset 0 1px 0 rgba(255,255,255,.05);
}
#phone::before{
  content:"";
  position:absolute;
  top:13px;
  left:50%;
  transform:translateX(-50%);
  width:132px;
  height:29px;
  background:#000;
  border-radius:0 0 20px 20px;
  z-index:60;
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.06);
}
#phone::after{
  content:"";
  position:absolute;
  top:23px;
  left:50%;
  transform:translateX(-50%) translateX(38px);
  width:8px;
  height:8px;
  border-radius:50%;
  background:#0a0d14;
  z-index:61;
  box-shadow:inset 0 0 3px rgba(93,169,255,.5);
}

/* ------------------------------------------------------------
   ЭКРАН
   ------------------------------------------------------------ */
#screen{
  flex:1;
  background:var(--bg);
  border-radius:42px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* ------------------------------------------------------------
   СТАТУС-БАР
   ------------------------------------------------------------ */
#statusbar{
  height:42px;
  flex:0 0 42px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  padding:0 26px 8px;
  font-size:12px;
  color:var(--txt);
  letter-spacing:.2px;
  position:relative;
  z-index:30;
  font-weight:600;
}
#clock{
  color:var(--txt);
  font-variant-numeric:tabular-nums;
}
#sysicons{
  display:flex;
  align-items:center;
  gap:6px;
}
#sysicons .icon{
  opacity:.9;
}

/* ------------------------------------------------------------
   ОБЛАСТЬ ПРОСМОТРА
   ------------------------------------------------------------ */
#view{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  position:relative;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
#view::-webkit-scrollbar{
  display:none;
}
#view.fade{
  animation:vfade .32s cubic-bezier(.4,0,.2,1);
}
@keyframes vfade{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:none}
}

/* ------------------------------------------------------------
   SVG-ИКОНКИ
   ------------------------------------------------------------ */
.icon{
  display:block;
  flex:0 0 auto;
  stroke-linecap:round;
  stroke-linejoin:round;
  transition:color .15s;
}
.icon.fill{
  fill:currentColor;
  stroke:none;
}
.icon.bold{
  stroke-width:2.2;
}
.icon.thin{
  stroke-width:1.3;
}

/* ------------------------------------------------------------
   ЭКРАН БЛОКИРОВКИ
   ------------------------------------------------------------ */
.lock{
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:50px 28px 40px;
  text-align:center;
  background:
    radial-gradient(500px 400px at 50% 20%, rgba(93,169,255,.14), transparent 65%),
    radial-gradient(400px 300px at 50% 90%, rgba(139,109,255,.10), transparent 65%);
}
.lock .sysname{
  font-size:11.5px;
  color:var(--dim);
  letter-spacing:3px;
  text-transform:uppercase;
  margin-bottom:6px;
}
.lock h1{
  font-size:20px;
  font-weight:600;
  letter-spacing:.3px;
  margin-bottom:4px;
}
.lock .date{
  font-size:12px;
  color:var(--dim);
  margin-bottom:24px;
}
.lockface{
  width:74px;
  height:74px;
  border-radius:50%;
  background:linear-gradient(140deg,var(--panel2),var(--panel));
  border:1.5px solid var(--line2);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--acc);
  margin-bottom:22px;
  box-shadow:
    0 0 40px rgba(93,169,255,.2),
    inset 0 1px 0 rgba(255,255,255,.06);
}
#pinDots{
  display:flex;
  gap:15px;
  margin-bottom:8px;
  height:14px;
}
#pinDots i{
  width:12px;
  height:12px;
  border-radius:50%;
  border:2px solid var(--dim2);
  transition:.15s;
  display:block;
}
#pinDots i.on{
  background:var(--acc);
  border-color:var(--acc);
  box-shadow:0 0 14px var(--acc);
}
.pinmsg{
  font-size:12px;
  color:var(--dim);
  min-height:16px;
  margin-bottom:20px;
  transition:.2s;
}
.pinmsg.err{
  color:var(--danger);
  animation:shake .35s;
}
.pinmsg.ok{
  color:var(--ok);
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  75%{transform:translateX(6px)}
}
.keypad{
  display:grid;
  grid-template-columns:repeat(3,74px);
  gap:14px;
}
.kbtn{
  width:74px;
  height:74px;
  border-radius:50%;
  background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:1px solid var(--line);
  color:var(--txt);
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1px;
  transition:.14s;
  font-family:inherit;
  box-shadow:
    0 4px 14px rgba(0,0,0,.4),
    inset 0 1px 0 rgba(255,255,255,.04);
}
.kbtn:active{
  transform:scale(.93);
  background:var(--panel3);
}
.kbtn .num{
  font-size:24px;
  font-weight:300;
  line-height:1;
}
.kbtn .sub{
  font-size:8.5px;
  color:var(--dim);
  letter-spacing:1.5px;
  font-weight:600;
}
.kbtn.fn{
  background:transparent;
  border-color:transparent;
  box-shadow:none;
}
.kbtn.fn:active{
  background:var(--panel2);
}
.kbtn.enter{
  background:linear-gradient(160deg,rgba(93,169,255,.2),rgba(93,169,255,.08));
  border-color:var(--acc);
  color:var(--acc);
}
.lockhint{
  margin-top:auto;
  font-size:11px;
  color:var(--dim2);
  line-height:1.6;
  display:flex;
  align-items:center;
  gap:6px;
  justify-content:center;
}

/* ------------------------------------------------------------
   РАБОЧИЙ СТОЛ
   ------------------------------------------------------------ */
.wall{
  min-height:100%;
  display:flex;
  flex-direction:column;
  padding:44px 22px 18px;
  background:
    radial-gradient(600px 400px at 50% 0%, rgba(139,109,255,.16), transparent 70%),
    radial-gradient(500px 350px at 50% 100%, rgba(93,169,255,.10), transparent 70%);
}
.wallhead{
  text-align:center;
  margin-bottom:26px;
}
.wallhead .d1{
  font-size:44px;
  font-weight:200;
  letter-spacing:2px;
  line-height:1;
}
.wallhead .d2{
  font-size:12px;
  color:var(--dim);
  margin-top:6px;
  letter-spacing:1px;
}
.wallhead .case{
  display:inline-block;
  margin-top:12px;
  font-size:10px;
  letter-spacing:2px;
  color:var(--acc);
  text-transform:uppercase;
  border:1px solid rgba(93,169,255,.3);
  padding:4px 12px;
  border-radius:12px;
  background:rgba(93,169,255,.06);
}
.apps{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px 10px;
}
.app{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  cursor:pointer;
  transition:.16s;
  position:relative;
  user-select:none;
}
.app:active{
  transform:scale(.94);
}
.app .ico{
  width:60px;
  height:60px;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(155deg,var(--panel2),var(--panel));
  border:1px solid var(--line);
  color:var(--acc);
  box-shadow:
    0 6px 18px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.05);
  position:relative;
  transition:.16s;
}
.app:hover .ico{
  border-color:var(--line2);
  box-shadow:
    0 8px 24px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.08);
}
.app .ico .icon{
  width:28px;
  height:28px;
}
.app .lbl{
  font-size:10.5px;
  color:var(--dim);
  text-align:center;
  line-height:1.2;
  letter-spacing:.2px;
}
.app .badge{
  position:absolute;
  top:-5px;
  right:6px;
  min-width:20px;
  height:20px;
  border-radius:10px;
  background:var(--danger);
  color:#fff;
  font-size:10.5px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 6px;
  box-shadow:
    0 0 0 2.5px var(--wall),
    0 2px 8px rgba(255,90,110,.5);
  animation:pop .3s cubic-bezier(.4,1.6,.5,1);
}
@keyframes pop{
  from{transform:scale(0)}
  to{transform:scale(1)}
}
.app.alert .ico{
  animation:alertpulse 2s infinite;
  border-color:rgba(255,90,110,.4);
}
@keyframes alertpulse{
  0%,100%{
    box-shadow:
      0 6px 18px rgba(0,0,0,.45),
      inset 0 1px 0 rgba(255,255,255,.05);
  }
  50%{
    box-shadow:
      0 0 26px rgba(255,90,110,.45),
      inset 0 1px 0 rgba(255,255,255,.05);
  }
}
.dock{
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:rgba(26,32,44,.55);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--line);
  border-radius:28px;
  padding:12px 10px;
  margin-top:auto;
}
.dock .app .ico{
  width:52px;
  height:52px;
  border-radius:15px;
}
.dock .app .ico .icon{
  width:24px;
  height:24px;
}
.dock .app .lbl{
  display:none;
}

/* ------------------------------------------------------------
   ОБЩИЕ КОМПОНЕНТЫ
   ------------------------------------------------------------ */
.appbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 16px 14px 12px;
  background:rgba(17,22,31,.94);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid var(--line);
}
.back{
  width:36px;
  height:36px;
  border-radius:50%;
  flex:0 0 36px;
  background:var(--panel2);
  border:1px solid var(--line);
  color:var(--txt);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.14s;
  padding:0;
}
.back:active{
  transform:scale(.9);
  background:var(--panel3);
}
.back .icon{
  width:18px;
  height:18px;
}
.appbar .ttl{
  flex:1;
  min-width:0;
}
.appbar h2{
  font-size:15.5px;
  font-weight:600;
  letter-spacing:.1px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.appbar .sub{
  font-size:11px;
  color:var(--dim);
  margin-top:2px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.center{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 28px;
  text-align:center;
  gap:14px;
}
.center .bigico{
  width:80px;
  height:80px;
  border-radius:50%;
  background:linear-gradient(150deg,var(--panel2),var(--panel));
  border:1px solid var(--line2);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--acc);
  margin-bottom:6px;
  box-shadow:
    0 0 40px rgba(93,169,255,.15),
    inset 0 1px 0 rgba(255,255,255,.06);
}
.center .bigico .icon{
  width:36px;
  height:36px;
}
.center h2{
  font-size:19px;
  font-weight:600;
}
.center p{
  font-size:13.5px;
  color:var(--dim);
  line-height:1.7;
  max-width:300px;
}
.btn{
  padding:13px 28px;
  border-radius:24px;
  border:none;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
  font-family:inherit;
  background:linear-gradient(140deg,var(--acc),var(--acc2));
  color:#fff;
  transition:.18s;
  box-shadow:0 8px 26px rgba(93,169,255,.35);
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.btn:active{
  transform:scale(.96);
}
.btn.ghost{
  background:transparent;
  border:1px solid var(--line2);
  color:var(--txt);
  box-shadow:none;
}
.btn.ghost:active{
  background:var(--panel2);
}
.btn.danger{
  background:linear-gradient(140deg,var(--danger),#a8283d);
  box-shadow:0 8px 26px rgba(255,90,110,.3);
}
.btn .icon{
  width:16px;
  height:16px;
}

/* ------------------------------------------------------------
   ТОСТ (всплывающие уведомления)
   ------------------------------------------------------------ */
#toastwrap{
  position:absolute;
  left:0;
  right:0;
  bottom:28px;
  display:flex;
  justify-content:center;
  pointer-events:none;
  z-index:200;
  padding:0 22px;
}
.toast{
  max-width:340px;
  background:rgba(20,26,37,.97);
  border:1px solid var(--line2);
  border-radius:16px;
  padding:12px 16px;
  font-size:12.5px;
  line-height:1.5;
  color:var(--txt);
  display:flex;
  gap:11px;
  align-items:flex-start;
  box-shadow:0 14px 44px rgba(0,0,0,.7);
  opacity:0;
  transform:translateY(16px) scale(.96);
  transition:.3s cubic-bezier(.4,0,.2,1);
  backdrop-filter:blur(14px);
}
.toast.show{
  opacity:1;
  transform:none;
}
.toast .tico{
  width:26px;
  height:26px;
  border-radius:8px;
  flex:0 0 26px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(93,169,255,.14);
  color:var(--acc);
}
.toast .tico.warn{
  background:rgba(255,184,77,.14);
  color:var(--warn);
}
.toast .tico.err{
  background:rgba(255,90,110,.14);
  color:var(--danger);
}
.toast .tico.ok{
  background:rgba(61,220,151,.14);
  color:var(--ok);
}
.toast .tico .icon{
  width:15px;
  height:15px;
}
.toast .tx{
  flex:1;
  padding-top:1px;
}
.toast .tx b{
  display:block;
  font-size:11px;
  letter-spacing:.8px;
  text-transform:uppercase;
  color:var(--acc);
  margin-bottom:2px;
}

/* ------------------------------------------------------------
   ПРОГРЕСС-БАР
   ------------------------------------------------------------ */
.pbar{
  height:3px;
  background:var(--panel2);
  border-radius:2px;
  overflow:hidden;
}
.pbar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--acc),var(--acc2));
  transition:.6s cubic-bezier(.4,0,.2,1);
  border-radius:2px;
}

/* ------------------------------------------------------------
   СЛУЖЕБНЫЕ КЛАССЫ
   ------------------------------------------------------------ */
.hidden{
  display:none!important;
}
.spacer{
  flex:1;
}
.noselect{
  user-select:none;
  -webkit-user-select:none;
}
.text-center{
  text-align:center;
}
.mono{
  font-family:"SF Mono",Monaco,Consolas,"Courier New",monospace;
}
</style>
</head>
<body>

<!-- ============================================================
     КОРПУС ТЕЛЕФОНА
     ============================================================ -->
<div id="phone">
  <div id="screen">
    <div id="statusbar">
      <span id="clock">23:47</span>
      <span id="sysicons"></span>
    </div>
    <div id="view"></div>
    <div id="toastwrap"></div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
