<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор банковского QR (EPC / GiroCode)</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    margin: 0;
    padding: 24px;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 520px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 18px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #94a3b8;
    margin: 12px 0 4px;
  }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #475569;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 15px;
    outline: none;
  }
  input:focus { border-color: #38bdf8; }
  button {
    width: 100%;
    margin-top: 18px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #38bdf8;
    color: #0f172a;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #7dd3fc; }
  .qr-box {
    text-align: center;
    padding: 16px 0 4px;
  }
  #qrcode img, #qrcode canvas { border-radius: 8px; }
  .empty { color: #64748b; font-size: 14px; padding: 20px 0; }
  .hint { font-size: 12px; color: #64748b; margin-top: 10px; text-align: center; }
  .tabbar {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  .tabbar button {
    margin: 0;
    flex: 1;
    background: #1e293b;
    color: #94a3b8;
    border: 1px solid #334155;
    font-weight: 500;
  }
  .tabbar button.active {
    background: #38bdf8;
    color: #0f172a;
    border-color: #38bdf8;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <h1>Генератор QR</h1>
  <p class="sub">Банковский QR (EPC / GiroCode) + обычный QR из ссылки</p>

  <div class="tabbar">
    <button id="tabPay" class="active" onclick="showTab('pay')">Оплата на счёт</button>
    <button id="tabUrl" onclick="showTab('url')">QR из ссылки</button>
  </div>

  <!-- Вкладка: банковский QR -->
  <div id="payTab" class="card">
    <label>Имя получателя</label>
    <input id="payName" placeholder="Mario Rossi" value="Mario Rossi">

    <label>IBAN получателя</label>
    <input id="payIban" placeholder="EE382200221020145685" value="EE382200221020145685">

    <label>Сумма (EUR) — можно оставить пустой</label>
    <input id="payAmount" placeholder="0.00" type="number" step="0.01" min="0">

    <label>Назначение платежа — необязательно</label>
    <input id="payMsg" placeholder="Оплата услуги">

    <button onclick="generatePayQR()">Сгенерировать банковский QR</button>

    <div class="qr-box">
      <div id="qrcode-pay" class="empty">Здесь появится код</div>
    </div>
    <p class="hint">Сканируется в приложении любого банка (LHV, Swedbank, SEB, Coop…)</p>
  </div>

  <!-- Вкладка: QR из ссылки -->
  <div id="urlTab" class="card hidden">
    <label>Введите URL</label>
    <input id="urlInput" placeholder="https://example.com" value="https://example.com">
    <button onclick="generateUrlQR()">Сгенерировать QR из ссылки</button>

    <div class="qr-box">
      <div id="qrcode-url" class="empty">Здесь появится код</div>
    </div>
    <p class="hint">Просто кодирует ссылку — откроется в браузере телефона</p>
  </div>

</div>

<!-- Библиотека генерации QR -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<script>
/* ---------- Переключение вкладок ---------- */
function showTab(name) {
  const pay = document.getElementById('payTab');
  const url = document.getElementById('urlTab');
  const tPay = document.getElementById('tabPay');
  const tUrl = document.getElementById('tabUrl');

  if (name === 'pay') {
    pay.classList.remove('hidden');
    url.classList.add('hidden');
    tPay.classList.add('active');
    tUrl.classList.remove('active');
  } else {
    url.classList.remove('hidden');
    pay.classList.add('hidden');
    tUrl.classList.add('active');
    tPay.classList.remove('active');
  }
}

/* ---------- Формирование строки EPC / GiroCode ----------
   Формат (каждое поле с новой строки):
   1. BCD
   2. 002 (версия)
   3. 1 (кодировка UTF-8)
   4. SCT (SEPA Credit Transfer)
   5. BIC (пусто = необязательно)
   6. Имя получателя (макс 70)
   7. IBAN
   8. Сумма: EUR12.50 (или пусто)
   9. Назначение (макс 140)
   10. пусто (инфо получателю)
   11. пусто (инфо плательщику)
------------------------------------------------- */
function buildEpcString(name, iban, amount, msg) {
  // Убираем пробелы из IBAN
  iban = iban.replace(/\s+/g, '').toUpperCase();

  let amountStr = '';
  if (amount && parseFloat(amount) > 0) {
    amountStr = 'EUR' + parseFloat(amount).toFixed(2);
  }

  const lines = [
    'BCD',
    '002',
    '1',
    'SCT',
    '',                 // BIC не обязателен
    name.substring(0, 70),
    iban,
    amountStr,
    (msg || '').substring(0, 140),
    '',
    ''
  ];

  return lines.join('\n');
}

/* ---------- Генерация банковского QR ---------- */
function generatePayQR() {
  const name = document.getElementById('payName').value.trim();
  const iban = document.getElementById('payIban').value.trim();
  const amount = document.getElementById('payAmount').value;
  const msg = document.getElementById('payMsg').value.trim();

  if (!name || !iban) {
    alert('Заполните имя получателя и IBAN');
    return;
  }

  const epc = buildEpcString(name, iban, amount, msg);

  const container = document.getElementById('qrcode-pay');
  container.innerHTML = '';
  container.classList.remove('empty');

  new QRCode(container, {
    text: epc,
    width: 260,
    height: 260,
    correctLevel: QRCode.CorrectLevel.M
  });
}

/* ---------- Генерация обычного QR из URL ---------- */
function generateUrlQR() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) {
    alert('Введите ссылку');
    return;
  }

  const container = document.getElementById('qrcode-url');
  container.innerHTML = '';
  container.classList.remove('empty');

  new QRCode(container, {
    text: url,
    width: 260,
    height: 260,
    correctLevel: QRCode.CorrectLevel.M
  });
}
</script>

</body>
</html>
