const Save = (function () {
  let scheduled = null;
  function write() {
    try {
      const data = {
        v: 1,
        chapter: GameState.chapter,
        currentRoom: GameState.currentRoom,
        inventory: GameState.inventory,
        clues: GameState.clues,
        flags: GameState.flags,
        objective: GameState.objective,
        flashlightOn: GameState.flashlightOn,
        flashlightBattery: GameState.flashlightBattery,
        playerPos: { x: player.pos.x, z: player.pos.z, yaw: player.yaw, pitch: player.pitch },
        savedAt: Date.now()
      };
      localStorage.setItem('theroom_save_v1', JSON.stringify(data));
    } catch (e) {}
  }
  function schedule() {
    if (scheduled) return;
    scheduled = setTimeout(() => { scheduled = null; write(); }, 1200);
  }
  function load() {
    try {
      const raw = localStorage.getItem('theroom_save_v1');
      if (!raw) return false;
      const d = JSON.parse(raw);
      if (!d || d.v !== 1) return false;
      GameState.chapter = d.chapter || 1;
      GameState.currentRoom = d.currentRoom || 'bedroom';
      GameState.inventory = d.inventory || [];
      GameState.clues = d.clues || {};
      GameState.flags = d.flags || {};
      GameState.objective = d.objective || '';
      GameState.flashlightOn = !!d.flashlightOn;
      GameState.flashlightBattery = d.flashlightBattery != null ? d.flashlightBattery : 100;
      if (d.playerPos) {
        player.pos.set(d.playerPos.x, 0, d.playerPos.z);
        player.yaw = d.playerPos.yaw || 0;
        player.pitch = d.playerPos.pitch || 0;
      }
      return true;
    } catch (e) { return false; }
  }
  function clear() {
    try { localStorage.removeItem('theroom_save_v1'); } catch (e) {}
  }
  return { schedule, load, clear, write };
})();

/* ============================================================
   AUDIO
   ============================================================ */
const Audio = (function () {
  let ctx = null, master = null, ambBus = null;
  let lampBuzzGain = null, lampBuzzOsc = null, lampBuzzOsc2 = null;
  let windGain = null, droneGain = null, windSource = null;
  let noiseBuffer = null;
  let started = false;

  function makeNoise(seconds) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      d[i] = w * 0.6 + last * 3.2;
    }
    return buf;
  }

  function init() {
    if (started) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ctx = new AC(); } catch (e) { return; }
    started = true;
    master = ctx.createGain();
    master.gain.value = 0.0001;
    master.connect(ctx.destination);
    master.gain.exponentialRampToValueAtTime(0.85, ctx.currentTime + 3.0);
    ambBus = ctx.createGain();
    ambBus.gain.value = 1.0;
    ambBus.connect(master);
    noiseBuffer = makeNoise(6);
    droneGain = ctx.createGain();
    droneGain.gain.value = 0.055;
    const dFilt = ctx.createBiquadFilter();
    dFilt.type = 'lowpass';
    dFilt.frequency.value = 160;
    droneGain.connect(dFilt);
    dFilt.connect(ambBus);
    const o1 = ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = 41.5;
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 62.3;
    const o3 = ctx.createOscillator(); o3.type = 'triangle'; o3.frequency.value = 88.1;
    const og2 = ctx.createGain(); og2.gain.value = 0.42;
    const og3 = ctx.createGain(); og3.gain.value = 0.10;
    o1.connect(droneGain);
    o2.connect(og2); og2.connect(droneGain);
    o3.connect(og3); og3.connect(droneGain);
    o1.start(); o2.start(); o3.start();
    const lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.037;
    const lfoG = ctx.createGain(); lfoG.gain.value = 0.020;
    lfo.connect(lfoG); lfoG.connect(droneGain.gain); lfo.start();
    windGain = ctx.createGain();
    windGain.gain.value = 0.0;
    windGain.connect(ambBus);
    const wFilt = ctx.createBiquadFilter();
    wFilt.type = 'bandpass'; wFilt.frequency.value = 420; wFilt.Q.value = 0.65;
    wFilt.connect(windGain);
    windSource = ctx.createBufferSource();
    windSource.buffer = noiseBuffer; windSource.loop = true;
    windSource.connect(wFilt); windSource.start();
    const wLfo = ctx.createOscillator(); wLfo.type = 'sine'; wLfo.frequency.value = 0.058;
    const wLfoG = ctx.createGain(); wLfoG.gain.value = 0.030;
    wLfo.connect(wLfoG); wLfoG.connect(windGain.gain); wLfo.start();
    windGain.gain.value = 0.038;
    lampBuzzGain = ctx.createGain(); lampBuzzGain.gain.value = 0.0;
    const bFilt = ctx.createBiquadFilter();
    bFilt.type = 'bandpass'; bFilt.frequency.value = 820; bFilt.Q.value = 3.2;
    bFilt.connect(lampBuzzGain);
    lampBuzzGain.connect(master);
    lampBuzzOsc = ctx.createOscillator(); lampBuzzOsc.type = 'sawtooth'; lampBuzzOsc.frequency.value = 120;
    lampBuzzOsc.connect(bFilt); lampBuzzOsc.start();
    lampBuzzOsc2 = ctx.createOscillator(); lampBuzzOsc2.type = 'square'; lampBuzzOsc2.frequency.value = 60;
    const g2 = ctx.createGain(); g2.gain.value = 0.35;
    lampBuzzOsc2.connect(g2); g2.connect(bFilt); lampBuzzOsc2.start();
    setLampBuzz(true);
  }
  function setLampBuzz(on) {
    if (!ctx || !lampBuzzGain) return;
    const t = ctx.currentTime;
    lampBuzzGain.gain.cancelScheduledValues(t);
    lampBuzzGain.gain.linearRampToValueAtTime(on ? 0.011 : 0.0, t + 0.25);
  }
  function pannerNode(x, y, z) {
    const p = ctx.createPanner();
    p.panningModel = 'HRTF'; p.distanceModel = 'inverse';
    p.refDistance = 1.0; p.maxDistance = 40; p.rolloffFactor = 1.5;
    if (p.positionX) { p.positionX.value = x; p.positionY.value = y; p.positionZ.value = z; }
    else p.setPosition(x, y, z);
    return p;
  }
  function listenerFromCamera() {
    if (!ctx) return;
    const l = ctx.listener;
    const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
    const t = ctx.currentTime;
    if (l.positionX) {
      l.positionX.setTargetAtTime(camera.position.x, t, 0.02);
      l.positionY.setTargetAtTime(camera.position.y, t, 0.02);
      l.positionZ.setTargetAtTime(camera.position.z, t, 0.02);
      l.forwardX.setTargetAtTime(fwd.x, t, 0.02);
      l.forwardY.setTargetAtTime(fwd.y, t, 0.02);
      l.forwardZ.setTargetAtTime(fwd.z, t, 0.02);
      l.upX.setTargetAtTime(up.x, t, 0.02);
      l.upY.setTargetAtTime(up.y, t, 0.02);
      l.upZ.setTargetAtTime(up.z, t, 0.02);
    } else {
      l.setPosition(camera.position.x, camera.position.y, camera.position.z);
      l.setOrientation(fwd.x, fwd.y, fwd.z, up.x, up.y, up.z);
    }
  }
  function envGain(attack, hold, release, peak) {
    const g = ctx.createGain();
    const t = ctx.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + hold + release);
    return g;
  }
  function woodCreak(vol, panX, len) {
    if (!ctx) return;
    len = len || 0.5;
    const t = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer; src.loop = true;
    const filt = ctx.createBiquadFilter();
    filt.type = 'bandpass'; filt.Q.value = 14;
    filt.frequency.setValueAtTime(220 + Math.random() * 260, t);
    filt.frequency.linearRampToValueAtTime(120 + Math.random() * 180, t + len);
    const g = envGain(0.02, len * 0.5, len * 0.6, vol);
    const p = pannerNode(camera.position.x + (panX || 0) * 2.0, 0.6, camera.position.z + (Math.random() - 0.5) * 3.0);
    src.connect(filt); filt.connect(g); g.connect(p); p.connect(master);
    src.start(t); src.stop(t + len + 1.2);
  }
  function knock(vol, x, y, z) {
    if (!ctx) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(96, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.18);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
    const n = ctx.createBufferSource();
    n.buffer = noiseBuffer;
    const nf = ctx.createBiquadFilter();
    nf.type = 'bandpass'; nf.frequency.value = 1800; nf.Q.value = 1.2;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(vol * 0.5, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    n.connect(nf); nf.connect(ng);
    const p = pannerNode(x || 0, y || 1.0, z || 0);
    o.connect(g); g.connect(p); ng.connect(p); p.connect(master);
    o.start(t); o.stop(t + 0.5); n.start(t); n.stop(t + 0.2);
  }
  function distantRumble(vol) {
    if (!ctx) return;
    const t = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer; src.loop = true;
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(90, t);
    filt.frequency.linearRampToValueAtTime(52, t + 2.4);
    filt.Q.value = 1.4;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.8);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 3.6);
    src.connect(filt); filt.connect(g); g.connect(master);
    src.start(t); src.stop(t + 4.2);
  }
  function whisper() {
    if (!ctx) return;
    const t = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer; src.loop = true;
    src.playbackRate.value = 0.7 + Math.random() * 0.5;
    const filt = ctx.createBiquadFilter();
    filt.type = 'bandpass'; filt.Q.value = 6;
    filt.frequency.setValueAtTime(900, t);
    filt.frequency.linearRampToValueAtTime(1700, t + 1.4);
    filt.frequency.linearRampToValueAtTime(640, t + 2.6);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.028, t + 0.5);
    g.gain.linearRampToValueAtTime(0.0001, t + 2.8);
    const p = pannerNode(camera.position.x + (Math.random() - 0.5) * 3.5, 1.2, camera.position.z + (Math.random() - 0.5) * 3.5);
    src.connect(filt); filt.connect(g); g.connect(p); p.connect(master);
    src.start(t); src.stop(t + 3.2);
  }
  function doorRattle() {
    if (!ctx) return;
    const t = ctx.currentTime;
    for (let i = 0; i < 3; i++) {
      const o = ctx.createOscillator();
      o.type = 'square'; o.frequency.value = 240 + Math.random() * 120;
      const g = ctx.createGain();
      const tt = t + i * 0.075;
      g.gain.setValueAtTime(0.0001, tt);
      g.gain.exponentialRampToValueAtTime(0.030, tt + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.05);
      const filt = ctx.createBiquadFilter();
      filt.type = 'bandpass'; filt.frequency.value = 1400; filt.Q.value = 2.0;
      const p = pannerNode(camera.position.x + 1.5, 1.0, camera.position.z + 1.5);
      o.connect(filt); filt.connect(g); g.connect(p); p.connect(master);
      o.start(tt); o.stop(tt + 0.1);
    }
    knock(0.05, camera.position.x + 1.5, 0.9, camera.position.z + 1.5);
  }
  function pageTurn() {
    if (!ctx) return;
    const t = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer; src.loop = true;
    const filt = ctx.createBiquadFilter();
    filt.type = 'highpass'; filt.frequency.value = 2200;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.020, t + 0.05);
    g.gain.linearRampToValueAtTime(0.0001, t + 0.30);
    const p = pannerNode(camera.position.x, 1.0, camera.position.z);
    src.connect(filt); filt.connect(g); g.connect(p); p.connect(master);
    src.start(t); src.stop(t + 0.5);
  }
  function lampClick() {
    if (!ctx) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = 'square'; o.frequency.value = 1600;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.028, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    const p = pannerNode(camera.position.x, 1.0, camera.position.z);
    o.connect(g); g.connect(p); p.connect(master);
    o.start(t); o.stop(t + 0.08);
  }
  function windGust(amount, dur) {
    if (!ctx || !windGain) return;
    const t = ctx.currentTime;
    windGain.gain.cancelScheduledValues(t);
    windGain.gain.setValueAtTime(windGain.gain.value, t);
    windGain.gain.linearRampToValueAtTime(0.038 + amount, t + dur * 0.4);
    windGain.gain.linearRampToValueAtTime(0.038, t + dur);
  }
  function setSilence(on, dur) {
    if (!ctx || !ambBus) return;
    const t = ctx.currentTime;
    ambBus.gain.cancelScheduledValues(t);
    ambBus.gain.setValueAtTime(ambBus.gain.value, t);
    if (on) ambBus.gain.linearRampToValueAtTime(0.0001, t + 1.6);
    else ambBus.gain.linearRampToValueAtTime(1.0, t + (dur || 3.0));
  }
  function resume() {
    try {
      if (ctx && ctx.state === 'suspended') {
        const p = ctx.resume();
        if (p && p.catch) p.catch(() => {});
      }
    } catch (e) {}
  }
  function pickupChime() {
    if (!ctx) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(880, t);
    o.frequency.exponentialRampToValueAtTime(1320, t + 0.1);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.024, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.5);
  }
  function powerOn() {
    if (!ctx) return;
    const t = ctx.currentTime;
    // Electric thump + hum start
    const o = ctx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(60, t);
    o.frequency.exponentialRampToValueAtTime(120, t + 0.4);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.02, t + 0.8);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = 900;
    o.connect(filt); filt.connect(g); g.connect(master);
    o.start(t); o.stop(t + 2.0);
    setLampBuzz(true);
  }
  return {
    init, resume, setLampBuzz, woodCreak, knock, distantRumble, whisper,
    doorRattle, pageTurn, lampClick, windGust, setSilence,
    listenerFromCamera, pickupChime, powerOn,
    get ready() { return started; }
  };
})();

/* ============================================================
   FLASHLIGHT
   ============================================================ */
const flashlight = (function () {
  const spot = new THREE.SpotLight(0xffe9c0, 0, 8.0, Math.PI / 7, 0.35, 1.4);
  spot.castShadow = true;
  spot.shadow.mapSize.set(IS_MOBILE ? 512 : 1024, IS_MOBILE ? 512 : 1024);
  spot.shadow.bias = -0.0022;
  spot.shadow.normalBias = 0.02;
  spot.shadow.camera.near = 0.05;
  spot.shadow.camera.far = 9.0;
  spot.shadow.radius = 2.0;
  spot.position.set(0, 0, 0);
  scene.add(spot);
  const target = new THREE.Object3D();
  target.position.set(0, 0, -1);
  scene.add(target);
  spot.target = target;
  const glow = new THREE.PointLight(0xffd9a0, 0, 3.0, 2.0);
  scene.add(glow);

  function setOn(on) {
    GameState.flashlightOn = !!on;
    const hasFlashlight = hasItem('flashlight');
    if (!hasFlashlight) { spot.intensity = 0; glow.intensity = 0; return; }
    if (on && GameState.flashlightBattery > 0) { spot.intensity = 2.2; glow.intensity = 0.35; }
    else { spot.intensity = 0; glow.intensity = 0; }
    Save.schedule();
  }
  function update(dt) {
    const off = new THREE.Vector3(0.16, -0.10, -0.05).applyQuaternion(camera.quaternion);
    spot.position.copy(camera.position).add(off);
    target.position.copy(camera.position).add(
      new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).multiplyScalar(4.0)
    );
    glow.position.copy(camera.position).add(off);
    if (GameState.flashlightOn && hasItem('flashlight')) {
      GameState.flashlightBattery = clamp(GameState.flashlightBattery - dt * 0.55, 0, 100);
      const t = performance.now() * 0.001;
      const flick = 0.85 + 0.15 * Math.sin(t * 12.7) + 0.08 * Math.sin(t * 37.3);
      const batteryFactor = GameState.flashlightBattery < 15
        ? clamp(GameState.flashlightBattery / 15, 0.15, 1.0) : 1.0;
      spot.intensity = 2.2 * flick * batteryFactor;
      glow.intensity = 0.35 * batteryFactor;
      if (GameState.flashlightBattery <= 0) {
        GameState.flashlightOn = false;
        spot.intensity = 0;
        glow.intensity = 0;
        Toast.show('Батарея фонарика разрядилась');
      }
    } else {
      spot.intensity = 0;
      glow.intensity = 0;
    }
  }
  return { setOn, update, spot };
})();

document.getElementById('flashlight-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  if (!hasItem('flashlight')) return;
  flashlight.setOn(!GameState.flashlightOn);
  Audio.lampClick();
});
document.addEventListener('keydown', (e) => {
  if (e.code === 'KeyF' && gameStarted) {
    if (!hasItem('flashlight')) return;
    flashlight.setOn(!GameState.flashlightOn);
    Audio.lampClick();
  }
});
function updateFlashlightBtn() {
  const btn = document.getElementById('flashlight-btn');
  if (!btn) return;
  if (hasItem('flashlight')) {
    btn.classList.add('visible');
    btn.classList.toggle('on', GameState.flashlightOn);
  } else {
    btn.classList.remove('visible');
    btn.classList.remove('on');
  }
}

/* ============================================================
   INTERACTION
   ============================================================ */
const raycaster = new THREE.Raycaster();
raycaster.far = 2.6;
const centerNDC = new THREE.Vector2(0, 0);
const promptEl = document.getElementById('prompt');
const captionEl = document.getElementById('caption');
let captionTimer = null;
function showCaption(text, dur) {
  captionEl.textContent = text;
  captionEl.classList.add('on');
  if (captionTimer) clearTimeout(captionTimer);
  captionTimer = setTimeout(() => captionEl.classList.remove('on'), dur || 4200);
}
let currentTarget = null;

function labelFor(target) {
  if (!target) return null;
  const t = target.userData.interact;
  if (t === 'lamp') return '[ E ] включить лампу';
  if (t === 'wardrobe') return '[ E ] открыть шкаф';
  if (t === 'door') {
    const d = target.userData.doorRef;
    if (d && d.locked) {
      if (d.keyId === 'powerOn') return '[ E ] ' + (d.name || 'дверь') + ' (нет электричества)';
      if (d.keyId === 'never') return '[ E ] ' + (d.name || 'дверь') + ' (заперто)';
      return '[ E ] ' + (d.name || 'дверь') + ' (заперто)';
    }
    return '[ E ] открыть';
  }
  if (t === 'mirror') return '[ E ] посмотреть';
  if (t === 'bathroomMirror') return '[ E ] посмотреть в зеркало';
  if (t === 'coveredMirror') return '[ E ] снять покрывало';
  if (t === 'familyPhoto' || t === 'familyPhoto2' || t === 'familyPhoto3' ||
      t === 'familyPhotoOld') return '[ E ] осмотреть фотографию';
  if (t === 'andreiPortrait') return '[ E ] осмотреть портрет';
  if (t === 'note') return '[ E ] прочитать';
  if (t === 'drawing') return '[ E ] рассмотреть рисунок';
  if (t === 'pickup') return '[ E ] взять';
  if (t === 'deskDrawer') return '[ E ] открыть ящик';
  if (t === 'nightstandDrawer') return '[ E ] открыть ящик';
  if (t === 'panel') return '[ E ] открыть электрощит';
  if (t === 'finalShoes') return '[ E ] осмотреть';
  if (t === 'storageWardrobe') return '[ E ] открыть шкаф';
  return '[ E ] взаимодействовать';
}

function updateInteraction() {
  if (player.paused) { promptEl.classList.remove('on'); if (interactBtn) interactBtn.classList.remove('on'); currentTarget = null; return; }
  raycaster.setFromCamera(centerNDC, camera);
  const hits = raycaster.intersectObjects(getCurrentInteractables(), true);
  let found = null;
  for (let i = 0; i < hits.length; i++) {
    let o = hits[i].object;
    while (o && (!o.userData || !o.userData.interact)) o = o.parent;
    if (o && o.userData && o.userData.interact) { found = o; break; }
  }
  currentTarget = found;
  if (found) {
    const lbl = labelFor(found);
    promptEl.textContent = lbl;
    promptEl.classList.add('on');
    if (interactBtn) interactBtn.classList.add('on');
  } else {
    promptEl.classList.remove('on');
    if (interactBtn) interactBtn.classList.remove('on');
  }
}

let lampOn = true;

function tryInteract() {
  if (player.paused) return;
  if (!currentTarget) return;
  if (!IS_MOBILE && !locked && !IS_TOUCH) return;
  const t = currentTarget.userData.interact;

  if (t === 'lamp') {
    lampOn = !lampOn;
    Audio.lampClick();
    if (window.__bedroomLampLight) window.__bedroomLampLight.intensity = lampOn ? 6.0 : 0;
    Audio.setLampBuzz(lampOn && getFlag('powerRestored'));
    showCaption(lampOn ? 'Свет снова горит. Ненадолго.' : 'Темнота.');
  }
  else if (t === 'wardrobe' || t === 'storageWardrobe') {
    const rp = window.__wardrobeRightPivot;
    if (rp && t === 'wardrobe') {
      const opening = rp.rotation.y < 0.35;
      rp.rotation.y = opening ? 0.95 : 0.20;
      Audio.woodCreak(0.30, -0.2, 0.5);
      if (opening) showCaption('Пусто. Только старые вещи и запах пыли.');
      else showCaption('Шкаф закрыт. Почти.');
    } else if (t === 'storageWardrobe') {
      Audio.woodCreak(0.35, 0.1, 0.6);
      showCaption('Старые вещи. И что-то ещё, тяжёлое, за ними.');
    }
  }
  else if (t === 'door') {
    const d = currentTarget.userData.doorRef;
    if (!d) return;
    if (d.customMessage) {
      Audio.doorRattle();
      showCaption(d.customMessage);
      return;
    }
    if (d.locked) {
      // Determine whether we have the required item
      let unlocked = false;
      if (d.keyId === 'powerOn' && getFlag('powerRestored')) unlocked = true;
      else if (d.keyId !== 'powerOn' && d.keyId !== 'never' && hasItem(d.keyId)) unlocked = true;
      if (!unlocked) {
        Audio.doorRattle();
        let msg = 'Заперто.';
        if (d.keyId === 'basementKey') msg = 'Заперто. Нужен ключ от подвала.';
        else if (d.keyId === 'studyKey') msg = 'Заперто. Нужен ключ от кабинета.';
        else if (d.keyId === 'childrensKey') msg = 'Заперто. Нужен ключ от детской.';
        else if (d.keyId === 'anyaDoll') msg = 'Не поддаётся. Здесь нужна не сила — а что-то, что ей принадлежит.';
        else if (d.keyId === 'powerOn') msg = 'Механизм замка электрический. Нет питания.';
        else if (d.keyId === 'never') msg = 'Заперто. И ключа нет.';
        showCaption(msg);
        return;
      }
    }
    if (d.to) {
      Audio.woodCreak(0.35, -0.2, 0.4);
      transitionTo(d.to, d.spawnAt);
    } else {
      Audio.doorRattle();
      showCaption('Дверь не открывается.');
    }
  }
  else if (t === 'mirror') {
    Audio.whisper();
    showCaption('Стекло холодное. Отражение запаздывает на секунду.');
  }
  else if (t === 'bathroomMirror') {
    Audio.whisper();
    showCaption('Ты видишь себя. Только себя. Так ведь?');
  }
  else if (t === 'coveredMirror') {
    Audio.woodCreak(0.2, 0.1, 0.5);
    currentTarget.visible = false;
    const idx = Rooms[GameState.currentRoom].interactables.indexOf(currentTarget);
    if (idx >= 0) Rooms[GameState.currentRoom].interactables.splice(idx, 1);
    showCaption('Зеркало. В отражении — ты. И кто-то ещё, за плечом. Ты оборачиваешься — там пусто.', 7000);
  }
  else if (t === 'familyPhoto' || t === 'familyPhoto2' || t === 'familyPhoto3') {
    openNote('photoFamily');
  }
  else if (t === 'familyPhotoOld') {
    openNote('storageNote');
  }
  else if (t === 'andreiPortrait') {
    showCaption('Мужчина на портрете смотрит в сторону. Он не хочет смотреть на тебя.');
  }
  else if (t === 'note') {
    openNote(currentTarget.userData.noteId);
  }
  else if (t === 'drawing') {
    openNote('drawingChild');
  }
  else if (t === 'pickup') {
    const id = currentTarget.userData.itemId;
    const name = currentTarget.userData.itemName;
    const desc = currentTarget.userData.itemDesc;
    const icon = currentTarget.userData.itemIcon;
    if (addItem(id, name, desc, icon)) {
      Audio.pickupChime();
      currentTarget.visible = false;
      const arr = Rooms[GameState.currentRoom].interactables;
      const idx = arr.indexOf(currentTarget);
      if (idx >= 0) arr.splice(idx, 1);
      if (id === 'flashlight') {
        GameState.flashlightBattery = 100;
        Toast.show('Фонарик взят. [F] включить');
        updateFlashlightBtn();
        setObjective('Найти предохранитель и восстановить питание');
        // Reference the fuse in text
        setTimeout(() => showCaption('Фонарик. Значит, кто-то оставил его здесь для тебя.', 5000), 800);
      }
      if (id === 'basementKey') {
        Toast.show('Ключ от подвала');
        showCaption('Ключ тяжёлый. Он как будто тянет вниз.', 5000);
      }
      if (id === 'studyKey') {
        showCaption('На бирке — буква «А».', 4500);
      }
      if (id === 'childrensKey') {
        showCaption('Маленький ключ. Пахнет детским мылом.');
        if (getFlag('powerRestored')) {
          setObjective('Открыть детскую');
        }
      }
      if (id === 'anyaDoll') {
        showCaption('Кукла тёплая. Ты не сразу понимаешь, почему это неправильно.', 6500);
        if (getFlag('seen_basement')) setObjective('Спуститься в подвал к скрытой двери');
      }
      if (id === 'fuse') {
        showCaption('Предохранитель. Кто-то вытащил его и спрятал здесь. Зачем?', 5500);
        setObjective('Найти электрощит');
      }
    } else {
      Toast.show('Уже взято');
    }
  }
  else if (t === 'deskDrawer') {
    Audio.woodCreak(0.2, 0.1, 0.3);
    if (!getFlag('deskDrawerOpened')) {
      setFlag('deskDrawerOpened', true);
      showCaption('Пусто. Только пыль и волос.');
    } else showCaption('Ящик по-прежнему пуст.');
  }
  else if (t === 'nightstandDrawer') {
    Audio.woodCreak(0.2, 0.1, 0.3);
    if (!getFlag('nightstandOpened')) {
      setFlag('nightstandOpened', true);
      showCaption('Внутри — маленькая старая батарейка.');
      addItem('battery1', 'Батарейка', 'Может пригодиться для фонарика.', '▮');
    } else showCaption('Пусто.');
  }
  else if (t === 'panel') {
    if (getFlag('powerRestored')) {
      showCaption('Щиток работает. Все предохранители на месте.');
      return;
    }
    if (!hasItem('fuse')) {
      showCaption('Щиток открыт. Не хватает одного предохранителя — третьего слева.');
      return;
    }
    // Install fuse
    removeItem('fuse');
    Audio.powerOn();
    setFlag('powerRestored', true);
    // Turn on basement ambient light
    if (Rooms.basement) {
      Rooms.basement.group.traverse((o) => {
        if (o.isPointLight) o.intensity = Math.max(o.intensity, 0.9);
      });
    }
    // Turn on hall sconces
    if (window.__hallSconceLights) {
      window.__hallSconceLights.forEach((l) => { l.intensity = 1.6; });
    }
    // Turn on upstairs hall lights
    if (window.__upstairsLight2) window.__upstairsLight2.intensity = 1.2;
    // Turn on storage light
    if (window.__storageLight) window.__storageLight.intensity = 0.9;
    // Swap bulb materials — turn sconce bulbs bright
    MAT.bulb.emissiveIntensity = 1.6;

    // Insert visual fuse in slot
    if (window.__panelSlot) {
      const fv = new THREE.Mesh(
        new THREE.CylinderGeometry(0.014, 0.014, 0.05, 10),
        MAT.fuseBright
      );
      fv.rotation.z = Math.PI / 2;
      fv.position.set(0, 0, 0.01);
      window.__panelSlot.add(fv);
    }

    Toast.show('Электричество восстановлено');
    showCaption('Свет мигает. Где-то наверху включается вторая половина дома.', 6500);
    setObjective('Подняться на второй этаж');

    // Hint to return upstairs
    setTimeout(() => {
      showCaption('Дверь на лестницу — раньше не поддавалась. Теперь замок работает.', 6500);
    }, 4500);
  }
  else if (t === 'finalShoes') {
    showCaption('Маленькие ботинки. Кожа потрескалась. Внутри — земля.');
    if (hasItem('anyaDoll')) {
      triggerEnding('memory');
    }
  }
}

const PLAYER_R = 0.30;

function resolveCollisions(p) {
  const r = Rooms[GameState.currentRoom];
  if (!r) return;
  const b = r.bounds;
  p.x = clamp(p.x, -b.HXr + PLAYER_R + 0.02, b.HXr - PLAYER_R - 0.02);
  p.z = clamp(p.z, -b.HZr + PLAYER_R + 0.02, b.HZr - PLAYER_R - 0.02);
  const cols = r.colliders;
  for (let i = 0; i < cols.length; i++) {
    const c = cols[i];
    const cx = clamp(p.x, c.minX, c.maxX);
    const cz = clamp(p.z, c.minZ, c.maxZ);
    const dx = p.x - cx, dz = p.z - cz;
    const d2 = dx * dx + dz * dz;
    if (d2 < PLAYER_R * PLAYER_R) {
      if (d2 > 1e-8) {
        const d = Math.sqrt(d2);
        const push = (PLAYER_R - d) / d;
        p.x += dx * push; p.z += dz * push;
      } else {
        const left = Math.abs(p.x - c.minX);
        const right = Math.abs(c.maxX - p.x);
        const front = Math.abs(p.z - c.minZ);
        const back = Math.abs(c.maxZ - p.z);
        const m = Math.min(left, right, front, back);
        if (m === left) p.x = c.minX - PLAYER_R;
        else if (m === right) p.x = c.maxX + PLAYER_R;
        else if (m === front) p.z = c.minZ - PLAYER_R;
        else p.z = c.maxZ + PLAYER_R;
      }
    }
  }
}

const tmpFwd = new THREE.Vector3();
const tmpRight = new THREE.Vector3();
const wish = new THREE.Vector3();
const prevPos = new THREE.Vector3();

function updatePlayer(dt) {
  if (player.paused) {
    camera.position.set(player.pos.x, player.eyeHeight + player.breathe, player.pos.z);
    camera.rotation.set(player.pitch, player.yaw, player.roll, 'YXZ');
    return;
  }
  const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? 2.45 : 1.32;
  tmpFwd.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  tmpRight.set(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
  let ix = 0, iz = 0;
  if (keys['KeyW'] || keys['ArrowUp']) iz += 1;
  if (keys['KeyS'] || keys['ArrowDown']) iz -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) ix += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) ix -= 1;
  wish.set(0, 0, 0);
  if (ix !== 0 || iz !== 0) {
    wish.addScaledVector(tmpFwd, iz);
    wish.addScaledVector(tmpRight, ix);
    wish.normalize().multiplyScalar(speed);
  }
  const accel = wish.lengthSq() > 0 ? 9.0 : 11.0;
  const t = 1 - Math.exp(-accel * dt);
  player.vel.x = lerp(player.vel.x, wish.x, t);
  player.vel.z = lerp(player.vel.z, wish.z, t);
  prevPos.copy(player.pos);
  player.pos.x += player.vel.x * dt;
  player.pos.z += player.vel.z * dt;
  resolveCollisions(player.pos);
  const dx = player.pos.x - prevPos.x;
  const dz = player.pos.z - prevPos.z;
  const moved = Math.sqrt(dx * dx + dz * dz);
  const speedFrac = clamp(moved / (speed * dt + 1e-5), 0, 1);
  player.bobT += moved * 12.5;
  const bobTarget = Math.sin(player.bobT * 2.0) * 0.016 * speedFrac;
  const bobXTarget = Math.cos(player.bobT) * 0.011 * speedFrac;
  player.bobY = lerp(player.bobY, bobTarget, 1 - Math.exp(-dt * 14));
  player.bobX = lerp(player.bobX, bobXTarget, 1 - Math.exp(-dt * 14));
  player.roll = lerp(player.roll, Math.cos(player.bobT) * 0.006 * speedFrac, 1 - Math.exp(-dt * 8));
  player.breathe = Math.sin(performance.now() * 0.00105) * 0.0072;
  camera.position.set(
    player.pos.x + player.bobX * 0.4,
    player.eyeHeight + player.bobY + player.breathe,
    player.pos.z
  );
  camera.rotation.set(player.pitch, player.yaw, player.roll, 'YXZ');
}

function toggleFullscreen() {
  try {
    const el = document.documentElement;
    const isFs = document.fullscreenElement || document.webkitFullscreenElement ||
                 document.mozFullScreenElement || document.msFullscreenElement;
    if (isFs) {
      const ex = document.exitFullscreen || document.webkitExitFullscreen ||
                 document.mozCancelFullScreen || document.msExitFullscreen;
      if (ex) { const p = ex.call(document); if (p && p.catch) p.catch(() => {}); }
    } else {
      const req = el.requestFullscreen || el.webkitRequestFullscreen ||
                  el.mozRequestFullScreen || el.msRequestFullscreen;
      if (req) { const p = req.call(el); if (p && p.catch) p.catch(() => {}); }
    }
  } catch (e) {}
}
if (fsBtn) {
  fsBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFullscreen(); });
  fsBtn.addEventListener('touchend', (e) => {
    e.preventDefault(); e.stopPropagation(); toggleFullscreen();
  }, { passive: false });
}

let joystickTouchId = null, joystickOriginX = 0, joystickOriginY = 0;
const JOYSTICK_MAX_R = 46;
function joystickApply(clientX, clientY) {
  let dx = clientX - joystickOriginX;
  let dy = clientY - joystickOriginY;
  const dist = Math.hypot(dx, dy);
  if (dist > JOYSTICK_MAX_R) { const k = JOYSTICK_MAX_R / dist; dx *= k; dy *= k; }
  if (joystickKnob) joystickKnob.style.transform = 'translate(' + dx.toFixed(1) + 'px, ' + dy.toFixed(1) + 'px)';
  const nx = dx / JOYSTICK_MAX_R, ny = dy / JOYSTICK_MAX_R;
  keys['KeyW'] = ny < -0.26;
  keys['KeyS'] = ny >  0.26;
  keys['KeyA'] = nx < -0.26;
  keys['KeyD'] = nx >  0.26;
}
function joystickReset() {
  if (joystickKnob) joystickKnob.style.transform = 'translate(0px, 0px)';
  keys['KeyW'] = keys['KeyS'] = keys['KeyA'] = keys['KeyD'] = false;
}
if (IS_MOBILE && joystickBase) {
  joystickBase.addEventListener('touchstart', (e) => {
    if (!gameStarted || player.paused) return;
    if (joystickTouchId !== null) return;
    const t = e.changedTouches[0];
    joystickTouchId = t.identifier;
    const rect = joystickBase.getBoundingClientRect();
    joystickOriginX = rect.left + rect.width / 2;
    joystickOriginY = rect.top + rect.height / 2;
    joystickApply(t.clientX, t.clientY);
    e.preventDefault(); e.stopPropagation();
  }, { passive: false });
  joystickBase.addEventListener('touchmove', (e) => {
    if (joystickTouchId === null) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === joystickTouchId) joystickApply(t.clientX, t.clientY);
    }
    e.preventDefault(); e.stopPropagation();
  }, { passive: false });
  const endJoystick = (e) => {
    if (joystickTouchId === null) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joystickTouchId) {
        joystickTouchId = null; joystickReset();
      }
    }
  };
  joystickBase.addEventListener('touchend', endJoystick, { passive: false });
  joystickBase.addEventListener('touchcancel', endJoystick, { passive: false });
}

const lookTouches = new Map();
const LOOK_SENS = IS_MOBILE ? 0.0055 : 0.0021;
canvas.addEventListener('touchstart', (e) => {
  if (!gameStarted || !IS_MOBILE || player.paused) return;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    lookTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
  }
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  if (!gameStarted || !IS_MOBILE || player.paused) return;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const p = lookTouches.get(t.identifier);
    if (!p) continue;
    const dx = t.clientX - p.x, dy = t.clientY - p.y;
    player.yaw -= dx * LOOK_SENS;
    player.pitch -= dy * LOOK_SENS;
    player.pitch = clamp(player.pitch, -1.30, 1.30);
    p.x = t.clientX; p.y = t.clientY;
  }
  e.preventDefault();
}, { passive: false });
const endLook = (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) lookTouches.delete(e.changedTouches[i].identifier);
};
canvas.addEventListener('touchend', endLook);
canvas.addEventListener('touchcancel', endLook);

if (interactBtn) {

}

onGameStart = function (loadSave) {
  try { Audio.init(); Audio.resume(); } catch (e) {}

  if (IS_MOBILE) { try { toggleFullscreen(); } catch (e) {} }
  else {
    try {
      if (canvas.requestPointerLock) {
        const p = canvas.requestPointerLock();
        if (p && p.catch) p.catch(() => {});
      }
    } catch (e) {}
  }

  let loaded = false;
  if (loadSave) loaded = Save.load();

  if (loaded) {
    for (const id in Rooms) Rooms[id].group.visible = false;
    if (Rooms[GameState.currentRoom]) Rooms[GameState.currentRoom].group.visible = true;
    if (GameState.objective) Objective.set(GameState.objective);
    Toast.show('Игра загружена');
    updateFlashlightBtn();
    flashlight.setOn(GameState.flashlightOn);
    // Apply persisted world state
    applyWorldState();
  } else {
    GameState.chapter = 1;
    GameState.currentRoom = 'bedroom';
    for (const id in Rooms) Rooms[id].group.visible = false;
    Rooms.bedroom.group.visible = true;
    player.pos.set(0.35, 0, 1.75);
    player.yaw = -0.62;
    player.pitch = -0.06;
    setObjective('Осмотреться');
    updateFlashlightBtn();

    setTimeout(() => showChapter('I', 'Пробуждение'), 800);
    setTimeout(() => {
      showCaption('Ты не помнишь, как оказался здесь. Комната кажется знакомой — но ты не уверен.', 8000);
    }, 2600);
    setTimeout(() => Audio.woodCreak(0.045, -0.5, 1.1), 4000);
    setTimeout(() => {
      showCaption('Дверь в спальню заперта снаружи. Ты не помнишь, чтобы закрывал её.', 7000);
      setObjective('Найти выход');
      Audio.doorRattle();
    }, 12000);
  }

  clock.getDelta();
};

  if (getFlag('powerRestored')) {

    if (window.__upstairsLight2) window.__upstairsLight2.intensity = 1.2;
    if (window.__storageLight) window.__storageLight.intensity = 0.9;
    if (Rooms.basement) Rooms.basement.group.traverse(o => { if (o.isPointLight) o.intensity = Math.max(o.intensity, 0.9); });
    if (window.__panelSlot) {
      const fv = new THREE.Mesh(
        new THREE.CylinderGeometry(0.014, 0.014, 0.05, 10),

      );
      fv.rotation.z = Math.PI / 2;

/* ============================================================
   POST-PROCESSING
   ============================================================ */
const POST = (function () {
  const rtScene = new THREE.WebGLRenderTarget(1, 1, {
    type: THREE.HalfFloatType,
    samples: IS_MOBILE ? 0 : 4
  });
  rtScene.texture.minFilter = THREE.LinearFilter;
  rtScene.texture.magFilter = THREE.LinearFilter;
  rtScene.texture.generateMipmaps = false;
  const rtBright = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
  rtBright.texture.minFilter = rtBright.texture.magFilter = THREE.LinearFilter;
  rtBright.texture.generateMipmaps = false;
  const rtBlurA = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
  const rtBlurB = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
  rtBlurA.texture.minFilter = rtBlurA.texture.magFilter = THREE.LinearFilter;
  rtBlurB.texture.minFilter = rtBlurB.texture.magFilter = THREE.LinearFilter;
  rtBlurA.texture.generateMipmaps = false;
  rtBlurB.texture.generateMipmaps = false;
  const fsScene = new THREE.Scene();
  const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const fsQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null);
  fsQuad.frustumCulled = false;
  fsScene.add(fsQuad);
  const VERT = `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4( position.xy, 0.0, 1.0 );
    }
  `;
  const brightMat = new THREE.ShaderMaterial({
    uniforms: { tDiffuse: { value: null }, uThreshold: { value: 0.42 } },
    vertexShader: VERT,
    fragmentShader: `
      uniform sampler2D tDiffuse;
      uniform float uThreshold;
      varying vec2 vUv;
      void main() {
        vec3 c = texture2D( tDiffuse, vUv ).rgb;
        float l = dot( c, vec3( 0.2126, 0.7152, 0.0722 ) );
        float k = smoothstep( uThreshold, uThreshold + 0.85, l );
        gl_FragColor = vec4( c * k, 1.0 );
      }
    `,
    depthTest: false, depthWrite: false
  });
  const blurMat = new THREE.ShaderMaterial({
    uniforms: { tDiffuse: { value: null }, uDir: { value: new THREE.Vector2() } },
    vertexShader: VERT,
    fragmentShader: `
      uniform sampler2D tDiffuse;
      uniform vec2 uDir;
      varying vec2 vUv;
      void main() {
        vec3 s = texture2D( tDiffuse, vUv ).rgb * 0.227027;
        s += texture2D( tDiffuse, vUv + uDir * 1.3846 ).rgb * 0.316216;
        s += texture2D( tDiffuse, vUv - uDir * 1.3846 ).rgb * 0.316216;
        s += texture2D( tDiffuse, vUv + uDir * 3.2308 ).rgb * 0.070270;
        s += texture2D( tDiffuse, vUv - uDir * 3.2308 ).rgb * 0.070270;
        gl_FragColor = vec4( s, 1.0 );
      }
    `,
    depthTest: false, depthWrite: false
  });
  const compositeMat = new THREE.ShaderMaterial({
    uniforms: {
      tScene: { value: rtScene.texture },
      tBloom: { value: rtBlurB.texture },
      uTime: { value: 0 },
      uRes: { value: new THREE.Vector2(1, 1) },
      uExposure: { value: 1.18 },
      uVignette: { value: 1.0 },
      uFade: { value: 1.0 }
    },
    vertexShader: VERT,
    fragmentShader: `
      uniform sampler2D tScene;
      uniform sampler2D tBloom;
      uniform float uTime;
      uniform vec2 uRes;
      uniform float uExposure;
      uniform float uVignette;
      uniform float uFade;
      varying vec2 vUv;
      vec3 aces( vec3 x ) {
        return clamp( ( x * ( 2.51 * x + 0.03 ) ) / ( x * ( 2.43 * x + 0.59 ) + 0.14 ), 0.0, 1.0 );
      }
      float hash( vec2 p ) {
        return fract( sin( dot( p, vec2( 127.1, 311.7 ) ) ) * 43758.5453123 );
      }
      void main() {
        vec2 uv = vUv;
        vec2 c = uv - 0.5;
        float r2 = dot( c, c );
        float ca = 0.0013 * r2 + 0.00035;
        vec3 col;
        col.r = texture2D( tScene, uv + c * ca ).r;
        col.g = texture2D( tScene, uv ).g;
        col.b = texture2D( tScene, uv - c * ca ).b;
        vec3 bloom = texture2D( tBloom, uv ).rgb;
        col += bloom * 0.62;
        col *= uExposure;
        float lum = dot( col, vec3( 0.2126, 0.7152, 0.0722 ) );
        vec3 cool = col * vec3( 0.84, 0.91, 1.10 );
        vec3 warm = col * vec3( 1.07, 0.98, 0.86 );
        col = mix( cool, warm, clamp( lum * 1.6, 0.0, 1.0 ) );
        float l2 = dot( col, vec3( 0.2126, 0.7152, 0.0722 ) );
        col = mix( vec3( l2 ), col, 0.86 );
        col = aces( col );
        float vig = smoothstep( 1.05, 0.18, r2 * 2.05 );
        col *= mix( mix( 0.38, 1.0, vig ), 1.0, 1.0 - uVignette );
        float g = hash( uv * uRes + vec2( uTime * 37.13, uTime * 21.71 ) ) - 0.5;
        float g2 = hash( uv * uRes * 2.13 + vec2( uTime * 71.3, uTime * 43.7 ) ) - 0.5;
        col += ( g * 0.030 + g2 * 0.014 ) * ( 1.0 - l2 * 0.7 );
        col += vec3( 0.004, 0.005, 0.007 );
        col *= uFade;
        col = pow( clamp( col, 0.0, 1.0 ), vec3( 1.0 / 2.2 ) );
        gl_FragColor = vec4( col, 1.0 );
      }
    `,
    depthTest: false, depthWrite: false
  });
  function blit(mat, target) {
    fsQuad.material = mat;
    renderer.setRenderTarget(target);
    renderer.render(fsScene, fsCam);
  }
  function resize(w, h) {
    const dpr = Math.min(window.devicePixelRatio || 1, IS_MOBILE ? 1.0 : 1.5);
    const W = Math.max(2, Math.floor(w * dpr));
    const H = Math.max(2, Math.floor(h * dpr));
    rtScene.setSize(W, H);
    const div = IS_MOBILE ? 5 : 4;
    const bw = Math.max(2, Math.floor(W / div));
    const bh = Math.max(2, Math.floor(H / div));
    rtBright.setSize(bw, bh);
    rtBlurA.setSize(bw, bh);
    rtBlurB.setSize(bw, bh);
    compositeMat.uniforms.uRes.value.set(W, H);
  }
  function render(sceneRef, camRef, time) {
    renderer.setRenderTarget(rtScene);
    renderer.clear();
    renderer.render(sceneRef, camRef);
    const bw = rtBright.width, bh = rtBright.height;
    blit(brightMat, rtBright);
    blurMat.uniforms.tDiffuse.value = rtBright.texture;
    blurMat.uniforms.uDir.value.set(1.0 / bw, 0);
    blit(blurMat, rtBlurA);
    blurMat.uniforms.tDiffuse.value = rtBlurA.texture;
    blurMat.uniforms.uDir.value.set(0, 1.0 / bh);
    blit(blurMat, rtBlurB);
    blurMat.uniforms.tDiffuse.value = rtBlurB.texture;
    blurMat.uniforms.uDir.value.set(2.4 / bw, 0);
    blit(blurMat, rtBlurA);
    blurMat.uniforms.tDiffuse.value = rtBlurA.texture;
    blurMat.uniforms.uDir.value.set(0, 2.4 / bh);
    blit(blurMat, rtBlurB);
    compositeMat.uniforms.uTime.value = time;
    compositeMat.uniforms.tScene.value = rtScene.texture;
    compositeMat.uniforms.tBloom.value = rtBlurB.texture;
    blit(compositeMat, null);
  }
  return { resize, render, compositeMat, rtScene };
})();
POST.resize(window.innerWidth, window.innerHeight);
onResize();

/* ============================================================
   GLOBAL LIGHTS
   ============================================================ */
const amb = new THREE.AmbientLight(0x1c2434, 0.30);
scene.add(amb);
const moon = new THREE.DirectionalLight(0x9fb6dc, 1.20);
moon.position.set(2.6, 4.4, -9.0);
moon.target.position.set(0.2, 0.55, 0.7);
scene.add(moon); scene.add(moon.target);
moon.castShadow = true;
moon.shadow.mapSize.set(IS_MOBILE ? 1024 : 2048, IS_MOBILE ? 1024 : 2048);
moon.shadow.camera.left = -8; moon.shadow.camera.right = 8;
moon.shadow.camera.top = 8; moon.shadow.camera.bottom = -8;
moon.shadow.camera.near = 0.5; moon.shadow.camera.far = 30;
moon.shadow.bias = -0.0008;
moon.shadow.normalBias = 0.022;
window.__moon = moon; window.__moonBase = 1.20;

/* ============================================================
   DYNAMIC EVENTS
   ============================================================ */
const Events = (function () {
  let nextEvent = 50 + Math.random() * 70;
  let timer = 0;
  const cooldowns = Object.create(null);
  function available(name, cd) {
    const now = performance.now() / 1000;
    if (cooldowns[name] && now < cooldowns[name]) return false;
    cooldowns[name] = now + cd;
    return true;
  }
  function triggerCooldown(name, cd) { cooldowns[name] = performance.now() / 1000 + cd; }
  function pick() {
    const roll = Math.random();
    if (roll < 0.16) return 'creak';
    if (roll < 0.28) return 'distantRumble';
    if (roll < 0.38) return 'wind';
    if (roll < 0.48) return 'behindSound';
    if (roll < 0.56) return 'silence';
    if (roll < 0.64) return 'moonShift';
    if (roll < 0.74) return 'knock';
    if (roll < 0.82) return 'whisper';
    if (roll < 0.90) return 'doorCreak';
    return 'shadowPass';
  }
  function run(name) {
    switch (name) {
      case 'creak': {
        if (!available('creak', 35)) return;
        Audio.woodCreak(0.05 + Math.random() * 0.05, (Math.random() - 0.5) * 1.6, 0.6 + Math.random() * 0.9);
        break;
      }
      case 'distantRumble': {
        if (!available('rumble', 70)) return;
        Audio.distantRumble(0.030 + Math.random() * 0.030);
        break;
      }
      case 'wind': {
        if (!available('wind', 55)) return;
        Audio.windGust(0.045 + Math.random() * 0.05, 5 + Math.random() * 7);
        break;
      }
      case 'behindSound': {
        if (!available('behind', 65)) return;
        const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        const bx = camera.position.x - fwd.x * 2.6 + (Math.random() - 0.5) * 1.2;
        const bz = camera.position.z - fwd.z * 2.6 + (Math.random() - 0.5) * 1.2;
        Audio.knock(0.022 + Math.random() * 0.02, bx, 0.7 + Math.random() * 0.9, bz);
        break;
      }
      case 'silence': {
        if (!available('silence', 110)) return;
        Audio.setSilence(true);
        const dur = 6000 + Math.random() * 9000;
        setTimeout(() => Audio.setSilence(false, 4.5), dur);
        break;
      }
      case 'moonShift': {
        if (!available('moon', 65)) return;
        const m = window.__moon;
        const base = window.__moonBase;
        const t0 = performance.now();
        const dur = 2600;
        const target = base * (0.55 + Math.random() * 0.9);
        const tick = () => {
          const k = clamp((performance.now() - t0) / dur, 0, 1);
          const e = k * k * (3 - 2 * k);
          m.intensity = lerp(base, target, e);
          if (k < 1) requestAnimationFrame(tick);
          else setTimeout(() => { m.intensity = base; }, 800 + Math.random() * 2600);
        };
        tick();
        break;
      }
      case 'knock': {
        if (!available('knock', 80)) return;
        const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        Audio.knock(0.028, camera.position.x + fwd.x * 4, 1.0, camera.position.z + fwd.z * 4);
        break;
      }
      case 'whisper': {
        if (!available('whisper', 75)) return;
        Audio.whisper();
        break;
      }
      case 'doorCreak': {
        if (!available('doorCreak', 100)) return;
        Audio.woodCreak(0.06, (Math.random() - 0.5) * 2, 1.6);
        break;
      }
      case 'shadowPass': {
        if (!available('shadowPass', 140)) return;
        Audio.whisper();
        Toast.show('Что-то прошло мимо', 2000);
        break;
      }
    }
  }
  function update(dt) {
    timer += dt;
    if (timer >= nextEvent) {
      timer = 0;
      nextEvent = 55 + Math.random() * 100;
      run(pick());
    }
  }
  return { update, triggerCooldown };
})();

/* ============================================================
   MAIN LOOP
   ============================================================ */
const clock = new THREE.Clock();
let elapsed = 0;
let interactTick = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  if (gameStarted) {
    updatePlayer(dt);
    Audio.listenerFromCamera();
    Events.update(dt);
    flashlight.update(dt);
    interactTick += dt;
    if (interactTick > 0.08) {
      interactTick = 0;
      updateInteraction();
    }
    if (!animate._lastSave || elapsed - animate._lastSave > 20) {
      animate._lastSave = elapsed;
      Save.schedule();
    }
  } else {
    camera.position.set(0.35, 1.63, 1.75);
    camera.rotation.set(-0.06, -0.62 + Math.sin(elapsed * 0.08) * 0.02, 0, 'YXZ');
  }

  POST.render(scene, camera, elapsed);
}
animate();
</script>
