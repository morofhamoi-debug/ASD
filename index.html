<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Биометрия лица в реальном времени</title>
    <style>
        body {
            margin: 0;
            background-color: #0d0d0d;
            color: #fff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h2 {
            margin-bottom: 10px;
            font-size: 1.2rem;
            color: #ff8c00;
        }
        .container {
            position: relative;
            width: 640px;
            height: 480px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.3);
            border: 1px solid #333;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* Зеркалируем для удобства */
        }
    </style>

    <!-- Подключаем скрипты MediaPipe Face Mesh -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

    <h2>БИОМЕТРИЧЕСКАЯ СЕТКА ЛИЦА (468 ТОЧЕК)</h2>
    <div class="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');

        function onResults(results) {
            // Подготавливаем холст под размер видео
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // Рисуем видеопоток
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            // Если лицо найдено, рисуем точки
            if (results.multiFaceLandmarks) {
                for (const landmarks of results.multiFaceLandmarks) {
                    // Рисуем каждую точку биометрии
                    for (const point of landmarks) {
                        const x = point.x * canvasElement.width;
                        const y = point.y * canvasElement.height;
                        
                        canvasCtx.fillStyle = '#ff8c00'; // Оранжевые точки
                        canvasCtx.fillRect(x, y, 1.5, 1.5); // Маленькие пиксели точек
                    }
                }
            }
            canvasCtx.restore();
        }

        const faceMesh = new FaceMesh({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
            }
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true, // Включает детальные точки вокруг глаз и губ (увеличивает до 478 точек)
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        faceMesh.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        
        camera.start();
    </script>
</body>
</html>
